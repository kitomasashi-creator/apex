th=\"48\" height=\"77\" class=\"oilf\"/><text x=\"188\" y=\"127\" class=\"sm ac\" text-anchor=\"middle\">140</text><text x=\"161\" y=\"228\" class=\"sm\" text-anchor=\"middle\">DOT3</text><rect x=\"260\" y=\"83.5\" width=\"48\" height=\"126.5\" class=\"bx\"/><text x=\"284\" y=\"77.5\" class=\"sm\" text-anchor=\"middle\">230</text><rect x=\"314\" y=\"124.8\" width=\"48\" height=\"85.3\" class=\"oilf\"/><text x=\"338\" y=\"118.8\" class=\"sm ac\" text-anchor=\"middle\">155</text><text x=\"311\" y=\"228\" class=\"sm\" text-anchor=\"middle\">DOT4</text><rect x=\"410\" y=\"67\" width=\"48\" height=\"143\" class=\"bx\"/><text x=\"434\" y=\"61\" class=\"sm\" text-anchor=\"middle\">260</text><rect x=\"464\" y=\"111\" width=\"48\" height=\"99\" class=\"oilf\"/><text x=\"488\" y=\"105\" class=\"sm ac\" text-anchor=\"middle\">180</text><text x=\"461\" y=\"228\" class=\"sm\" text-anchor=\"middle\">DOT5.1</text><rect x=\"300\" y=\"30\" width=\"14\" height=\"12\" class=\"bx\"/><text x=\"320\" y=\"41\" class=\"sm\">ドライ（新品）</text><rect x=\"420\" y=\"30\" width=\"14\" height=\"12\" class=\"oilf\"/><text x=\"440\" y=\"41\" class=\"sm\">ウェット（吸湿後）</text><text x=\"20\" y=\"252\" class=\"sm\">グリコール系は空気中の水分を吸い、吸湿すると沸点が大きく下がる → 定期交換が必要</text><text x=\"20\" y=\"272\" class=\"sm dim\">ウェット沸点＝約3.7％の水分を含んだ状態での値</text></svg>"}, "q-cbrake-5": {"c": "小さいピストンを押した圧力が、大きいピストンでは面積倍の力になる。面積比20倍なら力も20倍", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Hydraulic_press.svg/500px-Hydraulic_press.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Hydraulic_press.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Hydraulic_press.svg"}, "q-csus-1": {"c": "ダンパーの内部。ピストンが動くとオイルが細い穴（弁）を通り、その抵抗で揺れを素早く収める", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Twin_Tube_Damper.gif/500px-Twin_Tube_Damper.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Twin_Tube_Damper.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Twin_Tube_Damper.gif"}, "q-csus-2": {"c": "スプリングより路面側（ホイール・タイヤ・ブレーキなど）の重さがバネ下重量", "svg": "<svg viewBox=\"0 0 600 306\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">バネ上とバネ下（模式図）</text><rect x=\"150\" y=\"40\" width=\"300\" height=\"60\" rx=\"6\" class=\"bx\"/><text x=\"300\" y=\"76\" class=\"sm\" text-anchor=\"middle\">車体・エンジン・ライダー</text><path d=\"M250 100 L264 104.4 L236 113.1 L264 121.9 L236 130.6 L264 139.4 L236 148.1 L264 156.9 L236 165.6 L250 170\" class=\"ln thick\" fill=\"none\"/><rect x=\"330\" y=\"108\" width=\"22\" height=\"40\" class=\"pst\"/><line x1=\"341\" y1=\"100\" x2=\"341\" y2=\"108\" class=\"ln\"/><line x1=\"341\" y1=\"148\" x2=\"341\" y2=\"170\" class=\"ln thick\"/><text x=\"232\" y=\"140\" class=\"sm\" text-anchor=\"end\">スプリング</text><text x=\"360\" y=\"132\" class=\"sm\">ダンパー</text><circle cx=\"300\" cy=\"222\" r=\"50\" class=\"pst\"/><circle cx=\"300\" cy=\"222\" r=\"22\" class=\"bx\"/><rect x=\"240\" y=\"170\" width=\"120\" height=\"10\" class=\"pst\"/><line x1=\"20\" y1=\"272\" x2=\"580\" y2=\"272\" class=\"ln\"/><path d=\"M400 272 q20 -14 40 0\" class=\"ln\" fill=\"none\"/><line x1=\"470\" y1=\"40\" x2=\"470\" y2=\"100\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"480\" y=\"76\" class=\"tt ac\">バネ上重量</text><line x1=\"470\" y1=\"172\" x2=\"470\" y2=\"272\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"480\" y=\"214\" class=\"tt ac\">バネ下重量</text><text x=\"480\" y=\"234\" class=\"sm\">ホイール・タイヤ</text><text x=\"480\" y=\"252\" class=\"sm\">ブレーキなど</text><text x=\"20\" y=\"296\" class=\"sm\">バネ下が軽いほど、車輪が凸凹に素早く追従し、タイヤが路面から離れにくい</text></svg>"}, "q-csus-3": {"c": "プリロードを増やすと線が上に平行移動するだけで、傾き（ばね定数）は変わらない", "svg": "<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\"><defs> lass=\"sm\">アンダーブラケット</text><rect x=\"101\" y=\"30\" width=\"18\" height=\"170\" class=\"bx\"/><rect x=\"95\" y=\"160\" width=\"30\" height=\"110\" rx=\"4\" class=\"pst\"/><text x=\"90\" y=\"150\" class=\"sm\" text-anchor=\"end\">細いインナー</text><text x=\"90\" y=\"230\" class=\"sm\" text-anchor=\"end\">太いアウター</text><circle cx=\"110\" cy=\"276\" r=\"8\" class=\"dot\"/><text x=\"124\" y=\"280\" class=\"sm\">車軸</text><text x=\"400\" y=\"20\" class=\"tt\" text-anchor=\"middle\">倒立フォーク</text><rect x=\"340\" y=\"40\" width=\"120\" height=\"14\" rx=\"3\" class=\"bx\"/><rect x=\"340\" y=\"92\" width=\"120\" height=\"14\" rx=\"3\" class=\"bx\"/><rect x=\"385\" y=\"30\" width=\"30\" height=\"160\" rx=\"4\" class=\"pst\"/><rect x=\"391\" y=\"180\" width=\"18\" height=\"90\" class=\"bx\"/><text x=\"380\" y=\"150\" class=\"sm\" text-anchor=\"end\">太いアウター</text><text x=\"380\" y=\"230\" class=\"sm\" text-anchor=\"end\">細いインナー</text><circle cx=\"400\" cy=\"276\" r=\"8\" class=\"dot\"/><text x=\"414\" y=\"280\" class=\"sm\">車軸</text><text x=\"20\" y=\"310\" class=\"sm\">倒立は太いアウターを上でブラケットに固定 → 曲げ剛性を高めやすく、車軸側（バネ下）は軽くしやすい</text></svg>"}, "q-csus-5": {"c": "リンクを介すとストロークが進むほど硬くなる特性を作れる。小さな凸凹はしなやか、大きな衝撃では踏ん張る", "svg": "<svg viewBox=\"0 0 600 312\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">リンク式（ユニトラック）の狙い：プログレッシブ特性</text><rect x=\"20\" y=\"40\" width=\"150\" height=\"40\" rx=\"6\" class=\"bx\"/><text x=\"95\" y=\"65\" class=\"sm\" text-anchor=\"middle\">スイングアーム</text><rect x=\"225\" y=\"40\" width=\"150\" height=\"40\" rx=\"6\" class=\"bx\"/><text x=\"300\" y=\"65\" class=\"sm\" text-anchor=\"middle\">リンク（ロッカー）</text><rect x=\"430\" y=\"40\" width=\"150\" height=\"40\" rx=\"6\" class=\"bx\"/><text x=\"505\" y=\"65\" class=\"sm\" text-anchor=\"middle\">ショック（モノショック）</text><line x1=\"172\" y1=\"60\" x2=\"222\" y2=\"60\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"377\" y1=\"60\" x2=\"427\" y2=\"60\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"90\" y1=\"270\" x2=\"560\" y2=\"270\" class=\"ln\" marker-end=\"url(#ah)\"/><line x1=\"90\" y1=\"270\" x2=\"90\" y2=\"100\" class=\"ln\" marker-end=\"url(#ah)\"/><text x=\"560\" y=\"288\" class=\"sm\" text-anchor=\"end\">後輪のストローク</text><text x=\"96\" y=\"110\" class=\"sm\">支える力</text><line x1=\"90\" y1=\"270\" x2=\"500\" y2=\"150\" class=\"ln dash\"/><text x=\"500\" y=\"172\" class=\"sm dim\" text-anchor=\"end\">リンクなし</text><path d=\"M90 270 Q350 255 470 112\" class=\"ln acs thick\" fill=\"none\"/><text x=\"400\" y=\"108\" class=\"sm ac\" text-anchor=\"end\">リンクあり</text><text x=\"150\" y=\"250\" class=\"sm\">小さな凸凹：しなやか</text><text x=\"330\" y=\"168\" class=\"sm ac\" text-anchor=\"end\">大きな衝撃：踏ん張る</text><text x=\"20\" y=\"300\" class=\"sm\">動きが大きくなるほどリンクのレバー比が変わり、だんだん硬くなる特性を作れる</text></svg>"}, "q-cframe-1": {"c": "ステアリング軸の延長が地面と交わる点と、前輪の接地点との前後の距離がトレール", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Trail.svg/500px-Trail.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Trail.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Trail.svg"}, "q-cframe-2": {"c": "ステアリングヘッドとピボットを、エンジンの左右を通る2本の太い梁で結ぶのがツインスパー", "svg": "<svg viewBox=\"0 0 600 292\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">ツインスパーフレーム（上から見た模式図）</text><circle cx=\"110\" cy=\"150\" r=\"14\" class=\"pst\"/><text x=\"110\" y=\"186\" class=\"sm\" text-anchor=\"middle\">ステアリング</text><text x=\"110\" y=\"202\" class=\"sm\" text-anchor=\"middle\">ヘッド</text><path d=\"M122 142 C200 70 360 70 440 120\" class=\"ln thick\" fill=\"none\"/><path d=\"M122 158 C200 230 360 230 440 180\" class=\"ln thick\" fill=\"none\"/><path d=\"M122 142 C200 78 360 78 440 128\" class=\"ln thick\" fill=\"none\"/><path d=\"M122 158 C200 222 360 222 440 172\" class=\"ln thick\" fill=\"none\"/><rect x=\"220\" y=\"112\" width=\"160\" height=\"76\" rx=\"6\" class=\"bx\"/><text x=\"300\" y=\"155\" class=\"sm\" text-anchor=\"middle\">エンジン</text><rect x=\"436\" y=\"112\" width=\"14\" height=\"76\" class=\"pst\"/><text x=\"458\" y=\"140\" class=\"sm\">スイングアーム</text><text x=\"458\" y=\"158\" class=\"sm\">ピボット</text><text x=\"300\" y=\"66\" class=\"sm ac\" text-anchor=\"middle\">太い梁（スパー）</text><text x=\"300\" y=\"246\" class=\"sm ac\" text-anchor=\"middle\">太い梁（スパー）</text><line x1=\"560\" y1=\"150\" x2=\"590\" y2=\"150\" class=\"ln\" marker-end=\"url(#ah)\"/><text x=\"560\" y=\"140\" class=\"sm dim\">後ろ</text><text x=\"20\" y=\"280\" class=\"sm\">ヘッドとピボットを、エンジンの左右を通る2本の太い梁で直線的に結ぶ。アルミ製が多い</text></svg>"}, "q-cframe-3": {"c": "キャスター角は、ステアリング軸（太線）が垂直（点線）からどれだけ傾いているかの角度", "svg": "<svg viewBox=\"0 0 600 312\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"200\" y=\"20\" class=\"tt\" text-anchor=\"middle\">キャスター角＝ステアリング軸の垂直からの傾き</text><circle cx=\"200\" cy=\"170\" r=\"80\" class=\"ln thick\"/><circle cx=\"200\" cy=\"170\" r=\"4\" class=\"dot\"/><line x1=\"128.3\" y1=\"40\" x2=\"234.1\" y2=\"266.8\" class=\"ln acs thick\"/><line x1=\"226.3\" y1=\"250\" x2=\"226.3\" y2=\"130\" class=\"ln dash\"/><path d=\"M226.3 180 A70 70 0 0 0 196.7 186.6\" class=\"ln acs\" fill=\"none\"/><text x=\"232.3\" y=\"170\" class=\"sm ac\">25°</text><line x1=\"80\" y1=\"250\" x2=\"330\" y2=\"250\" class=\"ln\"/><circle cx=\"200\" cy=\"250\" r=\"4\" class=\"dot\"/><line x1=\"200\" y1=\"268\" x2=\"226.3\" y2=\"268\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"213.1\" y=\"288\" class=\"sm ac\" text-anchor=\"middle\">トレール</text><text x=\"370\" y=\"110\" class=\"sm dim\">点線：垂直</text><text x=\"370\" y=\"132\" class=\"sm ac\">太線：ステアリング軸</text><text x=\"370\" y=\"154\" class=\"sm\">その間の角度がキャスター角</text><text x=\"370\" y=\"190\" class=\"sm\">大きい → 直進安定性が高い</text><text x=\"370\" y=\"210\" class=\"sm\">小さい → ハンドリングが軽快</text><text x=\"20\" y=\"300\" class=\"sm dim\">前輪の接地点は、軸の延長が地面と交わる点より後ろ。その距離がトレール</text></svg>"}, "q-cframe-4": {"c": "ホイールベースが長いと直進安定性が高く、短いと小回りが利いて向きを変えやすい", "svg": "<svg viewBox=\"0 0 600 316\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">ホイールベース（前後の車軸間の距離）</text><circle cx=\"60\" cy=\"100\" r=\"32\" class=\"ln thick\"/><circle cx=\"380\" cy=\"100\" r=\"32\" class=\"ln thick\"/><path d=\"M60 100 L120 50 L340 50 L380 100\" class=\"ln\" fill=\"none\"/><line x1=\"60\" y1=\"144\" x2=\"380\" y2=\"144\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"220\" y=\"162\" class=\"sm ac\" text-anchor=\"middle\">ホイールベース 長い：直進安定性が高い・向きは変えにくい</text><line x1=\"20\" y1=\"132\" x2=\"420\" y2=\"132\" class=\"ln\"/><circle cx=\"60\" cy=\"220\" r=\"32\" class=\"ln thick\"/><circle cx=\"300\" cy=\"220\" r=\"32\" class=\"ln thick\"/><path d=\"M60 220 L120 170 L260 170 L300 220\" class=\"ln\" fill=\"none\"/><line x1=\"60\" y1=\"264\" x2=\"300\" y2=\"264\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"180\" y=\"282\" class=\"sm ac\" text-anchor=\"middle\">ホイールベース 短い：小回りが利き、向きを変えやすい</text><line x1=\"20\" y1=\"252\" x2=\"340\" y2=\"252\" class=\"ln\"/><text x=\"20\" y=\"304\" class=\"sm dim\">クルーザーなどは長め、スーパースポーツやオフロード車は短めの傾向</text></svg>"}, "q-cframe-5": {"c": "他を変えずに軸を立てる（キャスター角を小さくする）と、トレールが短くなり軽快になる", "svg": "<svg viewBox=\"0 0 600 332\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"150\" y=\"20\" class=\"tt\" text-anchor=\"middle\">キャスター角 大</text><circle cx=\"150\" cy=\"170\" r=\"80\" class=\"ln thick\"/><circle cx=\"150\" cy=\"170\" r=\"4\" class=\"dot\"/><line x1=\"72.5\" y1=\"40\" x2=\"188.1\" y2=\"266.8\" class=\"ln acs thick\"/><line x1=\"179.5\" y1=\"250\" x2=\"179.5\" y2=\"130\" class=\"ln dash\"/><path d=\"M179.5 180 A70 70 0 0 0 147.8 187.6\" class=\"ln acs\" fill=\"none\"/><text x=\"185.5\" y=\"170\" class=\"sm ac\">27°</text><line x1=\"30\" y1=\"250\" x2=\"280\" y2=\"250\" class=\"ln\"/><circle cx=\"150\" cy=\"250\" r=\"4\" class=\"dot\"/><line x1=\"150\" y1=\"268\" x2=\"179.5\" y2=\"268\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"164.8\" y=\"288\" class=\"sm ac\" text-anchor=\"middle\">トレール 長い</text><text x=\"450\" y=\"20\" class=\"tt\" text-anchor=\"middle\">キャスター角 小（軸を立てる）</text><circle cx=\"450\" cy=\"170\" r=\"80\" class=\"ln thick\"/><circle cx=\"450\" cy=\"170\" r=\"4\" class=\"dot\"/><line x1=\"389.4\" y1=\"40\" x2=\"476.4\" y2=\"266.8\" class=\"ln acs thick\"/><line x1=\"470\" y1=\"250\" x2=\"470\" y2=\"130\" class=\"ln dash\"/><path d=\"M470 180 A70 70 0 0 0 444.9 184.6\" class=\"ln acs\" fill=\"none\"/><text x=\"476\" y=\"170\" class=\"sm ac\">21°</text><line x1=\"330\" y1=\"250\" x2=\"580\" y2=\"250\" class=\"ln\"/><circle cx=\"450\" cy=\"250\" r=\"4\" class=\"dot\"/><line x1=\"450\" y1=\"268\" x2=\"470\" y2=\"268\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"460\" y=\"288\" class=\"sm ac\" text-anchor=\"middle\">トレール 短い</text><text x=\"20\" y=\"322\" class=\"sm\">他の条件が同じなら、軸を立てるとトレールが短くなる → 軽快になるが直進安定性は下がる</text></svg>"}, "q-ctire-1": {"c": "タイヤサイズ表記の読み方。末尾の数字が適合するリム径（インチ）を表す（図は四輪の例）", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Size_nomenclature_--_NHTSA_The_Pneumatic_Tire.png/500px-Size_nomenclature_--_NHTSA_The_Pneumatic_Tire.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Size_nomenclature_--_NHTSA_The_Pneumatic_Tire.png?width=500", "p": "https://commons.wikimedia.org/wiki/File:Size_nomenclature_--_NHTSA_The_Pneumatic_Tire.png"}, "q-ctire-2": {"c": "タイヤ側面のDOT刻印。末尾の4桁のうち前2桁が製造週、後2桁が製造年を表す", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/DoT_Nummer.jpg/500px-DoT_Nummer.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/DoT_Nummer.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:DoT_Nummer.jpg"}, "q-ctire-3": {"c": "温度が上がるほど空気圧も上がる関係に注目。指定値は冷間時の値なので、冷えた状態で測って合わせる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Cold_Tire_Pressures_versus_Temperature.png/500px-Cold_Tire_Pressures_versus_Temperature.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Cold_Tire_Pressures_versus_Temperature.png?width=500", "p": "https://commons.wikimedia.org/wiki/File:Cold_Tire_Pressures_versus_Temperature.png"}, "q-ctire-4": {"c": "ラジアルタイヤの内部構造。コードが回転方向に直角に入り、外周をベルトが締めている", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Radial_Tire_Construction.png/500px-Radial_Tire_Construction.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Radial_Tire_Construction.png?width=500", "p": "https://commons.wikimedia.org/wiki/File:Radial_Tire_Construction.png"}, "q-ctire-5": {"c": "幅120mm×偏平率70％＝断面の高さ約84mm。58や70そのものが高さ（mm）ではない", "svg": "<svg viewBox=\"0 0 600 324\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">120/70ZR17 の断面（模式図）</text><path d=\"M210 250 C180 250 180 120 220 90 Q300 50 380 90 C420 120 420 250 390 250\" class=\"ln thick\" fill=\"none\"/><rect x=\"200\" y=\"250\" width=\"200\" height=\"14\" class=\"pst\"/><text x=\"300\" y=\"284\" class=\"sm\" text-anchor=\"middle\">リム（17インチ）</text><line x1=\"180\" y1=\"40\" x2=\"420\" y2=\"40\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"300\" y=\"34\" class=\"sm ac\" text-anchor=\"middle\">幅 120mm</text><line x1=\"450\" y1=\"82\" x2=\"450\" y2=\"250\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><line x1=\"300\" y1=\"82\" x2=\"456\" y2=\"82\" class=\"ln dash\"/><text x=\"460\" y=\"160\" class=\"sm ac\">高さ</text><text x=\"460\" y=\"180\" class=\"sm ac\">120×70％</text><text x=\"460\" y=\"200\" class=\"tt ac\">＝約84mm</text><text x=\"20\" y=\"110\" class=\"sm\">70＝偏平率</text><text x=\"20\" y=\"130\" class=\"sm\">（高さ÷幅×100）</text><text x=\"20\" y=\"312\" class=\"sm dim\">58はロードインデックス、Wは速度記号。高さ（mm）を直接表す数字ではない</text></svg>"}, "q-cride-1": {"c": "右へ曲がるときは右グリップを一瞬前へ押す。前輪が一瞬左を向き、車体が右へ傾いて旋回に入る", "svg": "<svg viewBox=\"0 0 600 274\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">逆操舵（右へ曲がるとき・上から見た図）</text><text x=\"100\" y=\"52\" class=\"tt ac\" text-anchor=\"middle\">①</text><text x=\"100\" y=\"210\" class=\"sm\" text-anchor=\"middle\">右グリップを</text><text x=\"100\" y=\"228\" class=\"sm\" text-anchor=\"middle\">一瞬前へ押す</text><line x1=\"40\" y1=\"120\" x2=\"160\" y2=\"120\" class=\"ln thick\"/><circle cx=\"100\" cy=\"120\" r=\"5\" class=\"dot\"/><rect x=\"150\" y=\"112\" width=\"20\" height=\"16\" rx=\"3\" class=\"pst\"/><line x1=\"160\" y1=\"108\" x2=\"160\" y2=\"74\" class=\"ln acs thick\" marker-end=\"url(#ah)\"/><text x=\"295\" y=\"52\" class=\"tt ac\" text-anchor=\"middle\">②</text><text x=\"295\" y=\"210\" class=\"sm\" text-anchor=\"middle\">前輪が一瞬左を向く</text><text x=\"295\" y=\"228\" class=\"sm\" text-anchor=\"middle\">→ 車体が右へ傾く</text><g transform=\"rotate(-18 295 130)\"><rect x=\"287\" y=\"80\" width=\"16\" height=\"100\" rx=\"6\" class=\"bx\"/></g><line x1=\"295\" y1=\"186\" x2=\"295\" y2=\"70\" class=\"ln dash\"/><path d=\"M325 150 q30 -10 40 -40\" class=\"ln acs\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"490\" y=\"52\" class=\"tt ac\" text-anchor=\"middle\">③</text><text x=\"490\" y=\"210\" class=\"sm\" text-anchor=\"middle\">車体が右に傾き</text><text x=\"490\" y=\"228\" class=\"sm\" text-anchor=\"middle\">右へ旋回する</text><path d=\"M450 190 C450 120 490 90 560 80\" class=\"ln acs thick\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"20\" y=\"262\" class=\"sm dim\">ある程度の速度があるときの操作。曲がりたい側のグリップを押す＝前輪は一瞬だけ逆を向く</text></svg>"}, "q-cride-2": {"c": "ブレーキをかけると重心が前へ移ろうとし、前輪の荷重が増えて後輪は軽くなる", "svg": "<svg viewBox=\"0 0 600 352\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">ブレーキ時の荷重移動（模式図）</text><circle cx=\"120\" cy=\"210\" r=\"50\" class=\"ln thick\"/><circle cx=\"440\" cy=\"210\" r=\"50\" class=\"ln thick\"/><path d=\"M120 210 L190 120 L380 110 L440 210\" class=\"ln\" fill=\"none\"/><line x1=\"170\" y1=\"90\" x2=\"140\" y2=\"150\" class=\"ln\"/><rect x=\"220\" y=\"120\" width=\"140\" height=\"60\" rx=\"6\" class=\"bx\"/><circle cx=\"290\" cy=\"130\" r=\"7\" class=\"dot\"/><text x=\"302\" y=\"116\" class=\"sm\">重心</text><line x1=\"280\" y1=\"140\" x2=\"200\" y2=\"140\" class=\"ln acs thick\" marker-end=\"url(#ah)\"/><text x=\"204\" y=\"104\" class=\"sm ac\">慣性で前へ</text><line x1=\"440\" y1=\"290\" x2=\"440\" y2=\"266\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"452\" y=\"286\" class=\"sm\">後輪：軽くなる</text><line x1=\"120\" y1=\"316\" x2=\"120\" y2=\"266\" class=\"ln acs thick\" marker-end=\"url(#ah)\"/><text x=\"136\" y=\"300\" class=\"sm ac\">前輪：荷重が増える</text><line x1=\"40\" y1=\"260\" x2=\"560\" y2=\"260\" class=\"ln\"/><line x1=\"560\" y1=\"60\" x2=\"520\" y2=\"60\" class=\"ln\" marker-end=\"url(#ah)\"/><text x=\"560\" y=\"50\" class=\"sm dim\" text-anchor=\"end\">← 進行方向</text><text x=\"20\" y=\"340\" class=\"sm\">前輪はグリップが増えて制動力の主役に。後輪は軽くなってロックしやすくなる</text></svg>"}, "q-cride-3": {"c": "重力と遠心力の合力が接地点を通る点と、右の①〜③に注目。安定はジャイロ効果だけでは決まらない", "svg": "<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">後ろから見た左旋回：傾きで力を釣り合わせる</text><line x1=\"20\" y1=\"250\" x2=\"290\" y2=\"250\" class=\"ln\"/><line x1=\"60\" y1=\"46\" x2=\"20\" y2=\"46\" class=\"ln\" marker-end=\"url(#ah)\"/><text x=\"66\" y=\"50\" class=\"sm dim\">旋回の中心の方向</text><polygon points=\"157,247 82,97 68,103 143,253\" class=\"bx\"/><text x=\"60\" y=\"96\" class=\"sm dim\" text-anchor=\"end\">車体</text><circle cx=\"95\" cy=\"140\" r=\"5\" class=\"dot\"/><text x=\"84\" y=\"144\" class=\"sm\" text-anchor=\"end\">重心</text><line x1=\"95\" y1=\"140\" x2=\"95\" y2=\"218\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"88\" y=\"214\" class=\"sm\" text-anchor=\"end\">重力</text><line x1=\"95\" y1=\"140\" x2=\"133\" y2=\"140\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"140\" y=\"144\" class=\"sm\">遠心力（外向き）</text><line x1=\"95\" y1=\"140\" x2=\"134\" y2=\"218\" class=\"ln acs thick dash\" marker-end=\"url(#ah)\"/><text x=\"158\" y=\"200\" class=\"sm\">合力が接地点を通る</text><text x=\"158\" y=\"215\" class=\"sm\">→ 倒れずに曲がれる</text><circle cx=\"150\" cy=\"250\" r=\"3.5\" class=\"dot\"/><text x=\"150\" y=\"268\" class=\"sm\" text-anchor=\"middle\">接地点</text><text x=\"20\" y=\"290\" class=\"sm dim\">速度が高いほど遠心力が大きく、より深く傾ける</text><line x1=\"312\" y1=\"36\" x2=\"312\" y2=\"284\" class=\"ln dash\"/><text x=\"330\" y=\"22\" class=\"tt\">安定を支えるのは一つではない</text><rect x=\"3 Box=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"18\" class=\"tt\">リターンポートがふさがった状態（レバーは放している）</text><rect x=\"40\" y=\"48\" width=\"380\" height=\"60\" class=\"bx\"/><rect x=\"40\" y=\"58\" width=\"288\" height=\"40\" class=\"oilf\"/><rect x=\"150\" y=\"24\" width=\"160\" height=\"18\" class=\"oilf\"/><rect x=\"150\" y=\"24\" width=\"160\" height=\"18\" class=\"ln\"/><line x1=\"182\" y1=\"42\" x2=\"182\" y2=\"58\" class=\"ln\"/><line x1=\"262\" y1=\"42\" x2=\"262\" y2=\"58\" class=\"ln\"/><line x1=\"175\" y1=\"42\" x2=\"189\" y2=\"54\" class=\"ln acs thick\"/><line x1=\"189\" y1=\"42\" x2=\"175\" y2=\"54\" class=\"ln acs thick\"/><rect x=\"196\" y=\"60\" width=\"140\" height=\"36\" rx=\"3\" class=\"pst\"/><rect x=\"188\" y=\"58\" width=\"8\" height=\"40\" class=\"ln thick\"/><rect x=\"328\" y=\"58\" width=\"8\" height=\"40\" class=\"ln thick\"/><rect x=\"336\" y=\"70\" width=\"90\" height=\"16\" class=\"pst\"/><text x=\"192\" y=\"114\" class=\"sm\" text-anchor=\"middle\">1次カップ</text><text x=\"332\" y=\"114\" class=\"sm\" text-anchor=\"middle\">2次カップ</text><text x=\"146\" y=\"38\" class=\"sm ac\" text-anchor=\"end\">リターンポート</text><text x=\"314\" y=\"38\" class=\"sm\">サプライポート</text><line x1=\"40\" y1=\"78\" x2=\"10\" y2=\"78\" class=\"ln thick\"/><text x=\"70\" y=\"84\" class=\"sm\" text-anchor=\"middle\">圧力室</text><line x1=\"60\" y1=\"134\" x2=\"60\" y2=\"120\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"110\" y1=\"134\" x2=\"110\" y2=\"120\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"20\" y=\"160\" class=\"sm\">熱でふくらんだフルードや残った圧力がリザーバーへ戻れない</text><text x=\"20\" y=\"180\" class=\"sm ac\">→ 圧力室に圧が残り、パッドがディスクに押し付けられたまま（引きずり）</text><text x=\"20\" y=\"204\" class=\"sm dim\">ゴミ・固着・レバーの遊び不足などでカップがポートをふさぐと起こる</text></svg>"}, "x-cbrake-2": {"c": "DOT3・4・5.1はグリコール系、DOT5だけはシリコーン系。成分が別物なので混ぜてはいけない", "svg": "<svg viewBox=\"0 0 60 .4\" r=\"1.5\" class=\"dot\"/><text x=\"450\" y=\"20\" class=\"tt\" text-anchor=\"middle\">ラジアルマウント</text><circle cx=\"450\" cy=\"150\" r=\"95\" class=\"pst\"/><circle cx=\"450\" cy=\"150\" r=\"40\" class=\"bx\"/><circle cx=\"450\" cy=\"150\" r=\"6\" class=\"dot\"/><rect x=\"438\" y=\"30\" width=\"24\" height=\"120\" class=\"bx\"/><g transform=\"rotate(-235 382 102.4)\"><rect x=\"348\" y=\"86.4\" width=\"68\" height=\"32\" rx=\"6\" class=\"bx\"/></g><line x1=\"356.5\" y1=\"55.2\" x2=\"385.9\" y2=\"75.9\" class=\"ln acs thick\"/><line x1=\"328.9\" y1=\"94.5\" x2=\"358.4\" y2=\"115.2\" class=\"ln acs thick\"/><text x=\"20\" y=\"272\" class=\"sm\">○：ボルトは車軸と平行（手前から奥へ）</text><text x=\"320\" y=\"272\" class=\"sm ac\">線：ボルトが車輪の中心（半径方向）を向く</text><text x=\"20\" y=\"294\" class=\"sm dim\">ラジアルはブレーキ時のキャリパーのたわみが小さく、タッチがしっかりする</text></svg>"}, "x-cbrake-4": {"c": "対向式は両側にピストン。片押し式はピストンが片側だけで、本体のスライドで反対側も当たる", "svg": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"140\" y=\"20\" class=\"tt\" text-anchor=\"middle\">対向ピストン式</text><rect x=\"135\" y=\"40\" width=\"10\" height=\"150\" class=\"pst\"/><text x=\"140\" y=\"206\" class=\"sm\" text-anchor=\"middle\">ディスク</text><rect x=\"121\" y=\"80\" width=\"12\" height=\"70\" class=\"bx\"/><rect x=\"147\" y=\"80\" width=\"12\" height=\"70\" class=\"bx\"/><rect x=\"30\" y=\"60\" width=\"220\" height=\"110\" rx=\"8\" class=\"ln\"/><rect x=\"80\" y=\"95\" width=\"40\" height=\"40\" class=\"pst\"/><rect x=\"160\" y=\"95\" width=\"40\" height=\"40\" class=\"pst\"/><line x1=\"50\" y1=\"115\" x2=\"76\" y2=\"115\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"230\" y1=\"115\" x2=\"204\" y2=\"115\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"140\" y=\"228\" class=\"sm ac\" text-anchor=\"middle\">両側のピストンが同時に押す</text> にもなる（補充だけで済ませず点検を）</text></svg>"}, "x-cbrake-6": {"c": "ABSはロックしそうになると油圧を下げ、回転が戻ると上げる。これを細かくくり返してロックを防ぐ", "svg": "<svg viewBox=\"0 0 600 290\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">ABSの働き：ロックしそうになると油圧を弱める</text><rect x=\"20\" y=\"40\" width=\"170\" height=\"50\" rx=\"6\" class=\"bx\"/><text x=\"105\" y=\"61\" class=\"sm\" text-anchor=\"middle\">車輪速センサーが</text><text x=\"105\" y=\"79\" class=\"sm\" text-anchor=\"middle\">ロックの兆候を検知</text><rect x=\"215\" y=\"40\" width=\"170\" height=\"50\" rx=\"6\" class=\"bx\"/><text x=\"300\" y=\"61\" class=\"sm\" text-anchor=\"middle\">ABSユニットが</text><text x=\"300\" y=\"79\" class=\"sm\" text-anchor=\"middle\">油圧を下げる（減圧）</text><rect x=\"410\" y=\"40\" width=\"170\" height=\"50\" rx=\"6\" class=\"bx\"/><text x=\"495\" y=\"61\" class=\"sm\" text-anchor=\"middle\">タイヤの回転が戻ったら</text><text x=\"495\" y=\"79\" class=\"sm\" text-anchor=\"middle\">再び油圧を上げる</text><line x1=\"192\" y1=\"65\" x2=\"212\" y2=\"65\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"387\" y1=\"65\" x2=\"407\" y2=\"65\" class=\"ln acs\" marker-end=\"url(#ah)\"/><path d=\"M495 92 V108 H105 V96\" class=\"ln acs\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"300\" y=\"124\" class=\"sm\" text-anchor=\"middle\">これを1秒間に何回もくり返す</text><line x1=\"60\" y1=\"250\" x2=\"560\" y2=\"250\" class=\"ln\"/><line x1=\"60\" y1=\"250\" x2=\"60\" y2=\"140\" class=\"ln\"/><text x=\"54\" y=\"150\" class=\"sm\" text-anchor=\"end\">油圧</text><text x=\"560\" y=\"268\" class=\"sm\" text-anchor=\"end\">時間</text><path d=\"M60 250 L120 160 L150 200 L180 172 L210 205 L240 175 L270 208 L300 178 L330 210 L360 182\" class=\"ln acs thick\" fill=\"none\"/><line x1=\"60\" y1=\"160\" x2=\"560\" y2=\"160\" class=\"ln dash\"/><text x=\"380\" y=\"156\" class=\"sm dim\">ライダーの操作に svg>"}, "x-csus-3": {"c": "縮むときに働くのが圧側減衰、伸びるときに働くのが伸側減衰。オイルの通り道が別になっている", "svg": "<svg viewBox=\"0 0 600 266\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"140\" y=\"20\" class=\"tt ac\" text-anchor=\"middle\">圧側減衰</text><rect x=\"60\" y=\"80\" width=\"60\" height=\"140\" rx=\"4\" class=\"bx\"/><rect x=\"62\" y=\"82\" width=\"56\" height=\"136\" class=\"oilf\"/><rect x=\"62\" y=\"120\" width=\"56\" height=\"14\" class=\"pst\"/><line x1=\"90\" y1=\"40\" x2=\"90\" y2=\"120\" class=\"ln thick\"/><rect x=\"86\" y=\"122\" width=\"8\" height=\"10\" class=\"bx\"/><line x1=\"90\" y1=\"40\" x2=\"90\" y2=\"74\" class=\"ln acs thick\" marker-end=\"url(#ah)\"/><path d=\"M98 150 q10 -14 0 -26\" class=\"ln acs\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"140\" y=\"120\" class=\"sm\">縮む方向に動くとき</text><text x=\"140\" y=\"140\" class=\"sm\">オイルが弁（細い穴）を通る</text><text x=\"140\" y=\"160\" class=\"sm ac\">＝圧側（コンプレッション）</text><text x=\"440\" y=\"20\" class=\"tt ac\" text-anchor=\"middle\">伸側減衰</text><rect x=\"360\" y=\"80\" width=\"60\" height=\"140\" rx=\"4\" class=\"bx\"/><rect x=\"362\" y=\"82\" width=\"56\" height=\"136\" class=\"oilf\"/><rect x=\"362\" y=\"160\" width=\"56\" height=\"14\" class=\"pst\"/><line x1=\"390\" y1=\"40\" x2=\"390\" y2=\"160\" class=\"ln thick\"/><rect x=\"386\" y=\"162\" width=\"8\" height=\"10\" class=\"bx\"/><line x1=\"390\" y1=\"110\" x2=\"390\" y2=\"44\" class=\"ln acs thick\" marker-end=\"url(#ah)\"/><path d=\"M398 144 q10 14 0 26\" class=\"ln acs\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"440\" y=\"120\" class=\"sm\">伸びる方向に動くとき</text><text x=\"440\" y=\"140\" class=\"sm\">オイルが弁（細い穴）を通る</text><text x=\"440\" y=\"160\" class=\"sm ac\">＝伸側（リバウンド）</text><text x=\"20\" y=\"254\" class=\"sm dim\">縮み側と伸び側で別の弁を通るため、多くのサスペンションでは別々に調整できる</text></svg>"}, "x- </text><rect x=\"150\" y=\"40\" width=\"300\" height=\"60\" rx=\"6\" class=\"bx\"/><text x=\"300\" y=\"76\" class=\"sm\" text-anchor=\"middle\">車体・エンジン・ライダー</text><path d=\"M250 100 L264 104.4 L236 113.1 L264 121.9 L236 130.6 L264 139.4 L236 148.1 L264 156.9 L236 165.6 L250 170\" class=\"ln thick\" fill=\"none\"/><rect x=\"330\" y=\"108\" width=\"22\" height=\"40\" class=\"pst\"/><line x1=\"341\" y1=\"100\" x2=\"341\" y2=\"108\" class=\"ln\"/><line x1=\"341\" y1=\"148\" x2=\"341\" y2=\"170\" class=\"ln thick\"/><text x=\"232\" y=\"140\" class=\"sm\" text-anchor=\"end\">スプリング</text><text x=\"360\" y=\"132\" class=\"sm\">ダンパー</text><circle cx=\"300\" cy=\"222\" r=\"50\" class=\"pst\"/><circle cx=\"300\" cy=\"222\" r=\"22\" class=\"bx\"/><rect x=\"240\" y=\"170\" width=\"120\" height=\"10\" class=\"pst\"/><line x1=\"20\" y1=\"272\" x2=\"580\" y2=\"272\" class=\"ln\"/><path d=\"M400 272 q20 -14 40 0\" class=\"ln\" fill=\"none\"/><line x1=\"470\" y1=\"40\" x2=\"470\" y2=\"100\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"480\" y=\"76\" class=\"tt ac\">バネ上重量</text><line x1=\"470\" y1=\"172\" x2=\"470\" y2=\"272\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"480\" y=\"214\" class=\"tt ac\">バネ下重量</text><text x=\"480\" y=\"234\" class=\"sm\">ホイール・タイヤ</text><text x=\"480\" y=\"252\" class=\"sm\">ブレーキなど</text><text x=\"20\" y=\"296\" class=\"sm\">バネ下が軽いほど、車輪が凸凹に素早く追従し、タイヤが路面から離れにくい</text></svg>"}, "x-cframe-1": {"c": "点線（垂直）と太線（ステアリング軸）の間の角度がキャスター角。大きいほど直進安定性が高い", "svg": "<svg viewBox=\"0 0 600 312\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"200\" y=\"20\" class=\"tt\" text-anchor=\"middle\">キャスター角＝ステアリング軸の垂直からの傾き</text><circle cx=\"200\" cy=\"170\" r=\"80\" class=\"ln thick\"/><circle cx=\"200\" cy=\"170\" r=\"4\" class=\"dot\"/><line x1=\"128.3\" y1=\"40\" x2=\"234.1\" y2=\"266.8\" class=\"ln acs thick\"/><line x1=\"226.3\" y1=\"250\" x2=\"226.3\" y2=\"130\" class=\"ln dash\"/><path d=\"M226.3 180 A70 70 0 0 0 196.7 186.6\" class=\"ln acs\" fill=\"none\"/><text x=\"232.3\" y=\"170\" class=\"sm ac\">25°</text><line x1=\"80\" y1=\"250\" x2=\"330\" y2=\"250\" class=\"ln\"/><circle cx=\"200\" cy=\"250\" r=\"4\" class=\"dot\"/><line x1=\"200\" y1=\"268\" x2=\"226.3\" y2=\"268\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"213.1\" y=\"288\" class=\"sm ac\" text-anchor=\"middle\">トレール</text><text x=\"370\" y=\"110\" class=\"sm dim\">点線：垂直</text><text x=\"370\" y=\"132\" class=\"sm ac\">太線：ステアリング軸</text><text x=\"370\" y=\"154\" class=\"sm\">その間の角度がキャスター角</text><text x=\"370\" y=\"190\" class=\"sm\">大きい → 直進安定性が高い</text><text x=\"370\" y=\"210\" class=\"sm\">小さい → ハンドリングが軽快</text><text x=\"20\" y=\"300\" class=\"sm dim\">前輪の接地点は、軸の延長が地面と交わる点より後ろ。その距離がトレール</text></svg>"}, "x-cframe-2": {"c": "前輪の接地点は、ステアリング軸の延長が地面と交わる点より後ろにある。その差がトレール", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Trail.svg/500px-Trail.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Trail.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Trail.svg"}, "x-cframe-3": {"c": "ダウンチューブ（強調線）がエンジンの下を通り、ゆりかごのようにエンジンを下から支える", "svg": "<svg viewBox=\"0 0 600 296\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">ダブルクレードルフレーム（横から見た模式図）</text><rect x=\"120\" y=\"40\" width=\"18\" height=\"40\" class=\"pst\"/><text x=\"110\" y=\"54\" class=\"sm\" text-anchor=\"end\">ヘッド</text><path d=\"M138 50 L430 70 L470 150\" class=\"ln thick\" fill=\"none\"/><path d=\"M128 80 L170 230 L430 230 L470 150\" class=\"ln thick acs\" fill=\"none\"/><rect x=\"200\" y=\"120\" width=\"200\" height=\"100\" rx=\"6\" class=\"bx\"/><text x=\"300\" y=\"175\" class=\"sm\" text-anchor=\"middle\">エンジン</text><circle cx=\"470\" cy=\"150\" r=\"6\" class=\"dot\"/><text x=\"480\" y=\"154\" class=\"sm\">ピボット</text><text x=\"300\" y=\"252\" class=\"sm ac\" text-anchor=\"middle\">ダウンチューブがエンジンの下を通る（左右2本）</text><text x=\"20\" y=\"284\" class=\"sm\">ゆりかご（クレードル）のように、エンジンを下から2本のパイプで抱える古くからの形式</text></svg>"}, "x-cframe-4": {"c": "小回りが利いて向きを変えやすいのは、ホイールベースが短いほう。長いと直進安定性が高い", "svg": "<svg viewBox=\"0 0 600 316\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">ホイールベース（前後の車軸間の距離）</text><circle cx=\"60\" cy=\"100\" r=\"32\" class=\"ln thick\"/><circle cx=\"380\" cy=\"100\" r=\"32\" class=\"ln thick\"/><path d=\"M60 100 L120 50 L340 50 L380 100\" class=\"ln\" fill=\"none\"/><line x1=\"60\" y1=\"144\" x2=\"380\" y2=\"144\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"220\" y=\"162\" class=\"sm ac\" text-anchor=\"middle\">ホイールベース 長い：直進安定性が高い・向きは変えにくい</text><line x1=\"20\" y1=\"132\" x2=\"420\" y2=\"132\" class=\"ln\"/><circle cx=\"60\" cy=\"220\" r=\"32\" class=\"ln thick\"/><circle cx=\"300\" cy=\"220\" r=\"32\" class=\"ln thick\"/><path d=\"M60 220 L120 170 L260 170 L300 220\" class=\"ln\" fill=\"none\"/><line x1=\"60\" y1=\"264\" x2=\"300\" y2=\"264\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"180\" y=\"282\" class=\"sm ac\" text-anchor=\"middle\">ホイールベース 短い：小回りが利き、向きを変えやすい</text><line x1=\"20\" y1=\"252\" x2=\"340\" y2=\"252\" class=\"ln\"/><text x=\"20\" y=\"304\" class=\"sm dim\">クルーザーなどは長め、スーパースポーツやオフロード車は短めの傾向</text></svg>"}, "x-cframe-5": {"c": "細い鋼管が三角形をつないで組まれている点に注目。三角形は形が崩れにくく、軽さと剛性を両立できる", "svg": "<svg viewBox=\"0 0 600 320\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">トレリスフレーム（横から見た骨組み・左が前）</text><rect x=\"190\" y=\"178\" width=\"200\" height=\"58\" class=\"ln dash\"/><text x=\"290\" y=\"212\" class=\"sm dim\" text-anchor=\"middle\">エンジン（破線）</text><line x1=\"140\" y1=\"60\" x2=\"125\" y2=\"115\" class=\"ln thick\"/><polygon points=\"140,60 125,115 240,70\" class=\"gmix\"/><line x1=\"140\" y1=\"60\" x2=\"240\" y2=\"70\" class=\"ln acs thick\"/><line x1=\"125\" y1=\"115\" x2=\"240\" y2=\"70\" class=\"ln acs thick\"/><line x1=\"240\" y1=\"70\" x2=\"340\" y2=\"85\" class=\"ln\"/><line x1=\"340\" y1=\"85\" x2=\"430\" y2=\"170\" class=\"ln\"/><line x1=\"125\" y1=\"115\" x2=\"220\" y2=\"150\" class=\"ln\"/><line x1=\"220\" y1=\"150\" x2=\"330\" y2=\"160\" class=\"ln\"/><line x1=\"330\" y1=\"160\" x2=\"430\" y2=\"170\" class=\"ln\"/><line x1=\"240\" y1=\"70\" x2=\"220\" y2=\"150\" class=\"ln\"/><line x1=\"220\" y1=\"150\" x2=\"340\" y2=\"85\" class=\"ln\"/><line x1=\"340\" y1=\"85\" x2=\"330\" y2=\"160\" class=\"ln\"/><circle cx=\"140\" cy=\"60\" r=\"3\" class=\"dot\"/><circle cx=\"125\" cy=\"115\" r=\"3\" class=\"dot\"/><circle cx=\"240\" cy=\"70\" r=\"3\" class=\"dot\"/><circle cx=\"340\" cy=\"85\" r=\"3\" class=\"dot\"/><circle cx=\"220\" cy=\"150\" r=\"3\" class=\"dot\"/><circle cx=\"330\" cy=\"160\" r=\"3\" class=\"dot\"/><circle cx=\"430\" cy=\"170\" r=\"7\" class=\"pst\"/><text x=\"118\" y=\"80\" class=\"sm\" text-anchor=\"end\">ステアリング</text><text x=\"118\" y=\"95\" class=\"sm\" text-anchor=\"end\">ヘッド</text><text x=\"290\" y=\"58\" class=\"sm\">細い鋼管</text><text x=\"444\" y=\"166\" class=\"sm\">スイングアーム</text><text x=\"444\" y=\"181\" class=\"sm\">ピボット</text><text x=\"160\" y=\"140\" class=\"sm ac\" text-anchor=\"middle\">三角形</text><line x1=\"20\" y1=\"252\" x2=\"580\" y2=\"252\" class=\"ln dash\"/><text x=\"20\" y=\"272\" class=\"sm\">四角形は押すとつぶれる</text><polygon points=\"40,285 80,285 92,310 52,310\" class=\"ln\"/><text x=\"104\" y=\"304\" class=\"sm dim\">→ 形が崩れる</text><text x=\"300\" y=\"272\" class=\"sm ac\">三角形は辺の長さが変わらない限り形が変わらない</text><polygon points=\"320,310 370,310 345,283\" class=\"ln acs\"/><text x=\"384\" y=\"304\" class=\"sm\">→ 細い管でも軽くて剛性が高い</text></svg>"}, "x-cframe-6": {"c": "フレーム剛性は高すぎても低すぎても乗りにくい。適度なしなりとのバランスが大切", "svg": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">フレーム剛性と乗りやすさ（考え方の模式図）</text><line x1=\"70\" y1=\"230\" x2=\"560\" y2=\"230\" class=\"ln\" marker-end=\"url(#ah)\"/><line x1=\"70\" y1=\"230\" x2=\"70\" y2=\"50\" class=\"ln\" marker-end=\"url(#ah)\"/><text x=\"560\" y=\"248\" class=\"sm\" text-anchor=\"end\">剛性</text><text x=\"76\" y=\"60\" class=\"sm\">操縦性</text><path d=\"M70 210 C200 60 360 60 540 190\" class=\"ln acs thick\" fill=\"none\"/><text x=\"110\" y=\"248\" class=\"sm\">低すぎ</text><text x=\"470\" y=\"248\" class=\"sm\">高すぎ</text><text x=\"300\" y=\"76\" class=\"sm ac\" text-anchor=\"middle\">適度なバランス</text><text x=\"110\" y=\"200\" class=\"sm dim\">よれて不安定</text><text x=\"400\" y=\"210\" class=\"sm dim\">しなりがなく</text><text x=\"400\" y=\"226\" class=\"sm dim\">路面をいなしにくい</text><text x=\"20\" y=\"268\" class=\"sm\">剛性は高ければ高いほど良いわけではなく、適度なしなりも必要（車種や用途で最適値が違う）</text></svg>"}, "x-ctire-1": {"c": "偏平率70は、断面の高さが幅の70％という意味。120mm×70％で高さは約84mm", "svg": "<svg viewBox=\"0 0 600 324\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">120/70ZR17 の断面（模式図）</text><path d=\"M210 250 C180 250 180 120 220 90 Q300 50 380 90 C420 120 420 250 390 250\" class=\"ln thick\" fill=\"none\"/><rect x=\"200\" y=\"250\" width=\"200\" height=\"14\" class=\"pst\"/><text x=\"300\" y=\"284\" class=\"sm\" text-anchor=\"middle\">リム（17インチ）</text><line x1=\"180\" y1=\"40\" x2=\"420\" y2=\"40\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"300\" y=\"34\" class=\"sm ac\" text-anchor=\"middle\">幅 120mm</text><line x1=\"450\" y1=\"82\" x2=\"450\" y2=\"250\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><line x1=\"300\" y1=\"82\" x2=\"456\" y2=\"82\" class=\"ln dash\"/><text x=\"460\" y=\"160\" class=\"sm ac\">高さ</text><text x=\"460\" y=\"180\" class=\"sm ac\">120×70％</text><text x=\"460\" y=\"200\" class=\"tt ac\">＝約84mm</text><text x=\"20\" y=\"110\" class=\"sm\">70＝偏平率</text><text x=\"20\" y=\"130\" class=\"sm\">（高さ÷幅×100）</text><text x=\"20\" y=\"312\" class=\"sm dim\">58はロードインデックス、Wは速度記号。高さ（mm）を直接表す数字ではない</text></svg>"}, "x-ctire-2": {"c": "DOT刻印の末尾4桁は「週・週・年・年」の順。0524なら2024年の第5週製造", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/DoT_Nummer.jpg/500px-DoT_Nummer.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/DoT_Nummer.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:DoT_Nummer.jpg"}, "x-ctire-3": {"c": "温度で空気圧が変わる関係のグラフ。温まると上がるので、冷間時の指定値は冷えた状態で合わせる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Cold_Tire_Pressures_versus_Temperature.png/500px-Cold_Tire_Pressures_versus_Temperature.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Cold_Tire_Pressures_versus_Temperature.png?width=500", "p": "https://commons.wikimedia.org/wiki/File:Cold_Tire_Pressures_versus_Temperature.png"}, "x-ctire-4": {"c": "サイズ表記の「R」がラジアル構造、「-（ハイフン）」がバイアス構造。逆ではない", "svg": "<svg viewBox=\"0 0 600 218\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">構造はサイズ表記の記号で見分ける</text><rect x=\"20\" y=\"40\" width=\"560\" height=\"60\" rx=\"6\" class=\"bx\"/><text x=\"40\" y=\"78\" class=\"tt\">120/70 Z<tspan class=\"ac\">R</tspan> 17</text><text x=\"300\" y=\"66\" class=\"sm ac\">「R」＝ラジアル構造</text><text x=\"300\" y=\"86\" class=\"sm\">コードが回転方向に直角＋外周をベルトで締める</text><rect x=\"20\" y=\"116\" width=\"560\" height=\"60\" rx=\"6\" class=\"bx\"/><text x=\"40\" y=\"154\" class=\"tt\">120/70 <tspan class=\"ac\">-</tspan> 17</text><text x=\"300\" y=\"142\" class=\"sm\">「-（ハイフン）」＝バイアス構造</text><text x=\"300\" y=\"162\" class=\"sm\">コードを斜めに交差させて重ねる</text><text x=\"20\" y=\"206\" class=\"sm dim\">「Z」は速度区分を示す記号で、構造を表すのは「R」</text></svg>"}, "x-ctire-5": {"c": "チューブレスはゴムが釘に密着して少しずつしか抜けない。チューブ式は穴から一気に抜けやすい", "svg": "<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"150\" y=\"22\" class=\"tt\" text-anchor=\"middle\">チューブタイヤ</text><text x=\"450\" y=\"22\" class=\"tt\" text-anchor=\"middle\">チューブレスタイヤ</text><path d=\"M60 200 C40 100 260 100 240 200\" class=\"ln thick\" fill=\"none\"/><circle cx=\"150\" cy=\"160\" r=\"42\" class=\"gmix\"/><circle cx=\"150\" cy=\"160\" r=\"42\" class=\"ln\"/><rect x=\"70\" y=\"200\" width=\"160\" height=\"12\" class=\"pst\"/><line x1=\"150\" y1=\"92\" x2=\"150\" y2=\"132\" class=\"ln acs thick\"/><text x=\"160\" y=\"100\" class=\"sm ac\">釘</text><line x1=\"120\" y1=\"150\" x2=\"90\" y2=\"130\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"180\" y1=\"150\" x2=\"210\" y2=\"130\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"150\" y1=\"175\" x2=\"150\" y2=\"196\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"150\" y=\"236\" class=\"sm\" text-anchor=\"middle\">チューブに穴 → 一気に空気が抜けやすい</text><path d=\"M360 200 C340 100 560 100 540 200\" class=\"ln thick\" fill=\"none\"/><path d=\"M368 200 C350 112 550 112 532 200\" class=\"ln dash\" fill=\"none\"/><path d=\"M368 200 C350 112 550 112 532 200 Z\" class=\"gmix\" fill=\"none\"/><rect x=\"370\" y=\"200\" width=\"160\" height=\"12\" class=\"pst\"/><line x1=\"450\" y1=\"92\" x2=\"450\" y2=\"132\" class=\"ln acs thick\"/><text x=\"442\" y=\"100\" class=\"sm ac\" text-anchor=\"end\">釘</text><line x1=\"455\" y1=\"112\" x2=\"480\" y2=\"84\" class=\"ln dash\" marker-end=\"url(#ah)\"/><text x=\"486\" y=\"84\" class=\"sm\">少しずつ</text><text x=\"450\" y=\"236\" class=\"sm ac\" text-anchor=\"middle\">ゴムが釘に密着 → 急に抜けにくい</text><text x=\"20\" y=\"268\" class=\"sm dim\">チューブレスは、タイヤ内面のゴムとリムの密着で空気を保持している（点線：インナーライナー）</text><text x=\"20\" y=\"288\" class=\"sm dim\">急に抜けにくいだけで、刺さったまま走り続けてよいわけではない</text></svg>"}, "x-ctire-6": {"c": "バイクのタイヤに出たひび割れ。ゴムは使わなくても経年で硬化するので、溝だけでなく年数も見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Motorcycle_Tire_crack.png/500px-Motorcycle_Tire_crack.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Motorcycle_Tire_crack.png?width=500", "p": "https://commons.wikimedia.org/wiki/File:Motorcycle_Tire_crack.png"}, "x-cride-1": {"c": "左へ曲がるときは左グリップを一瞬前へ押す。前輪が一瞬右を向き、車体が左へ傾く", "svg": "<svg viewBox=\"0 0 600 274\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">逆操舵（左へ曲がるとき・上から見た図）</text><text x=\"100\" y=\"52\" class=\"tt ac\" text-anchor=\"middle\">①</text><text x=\"100\" y=\"210\" class=\"sm\" text-anchor=\"middle\">左グリップを</text><text x=\"100\" y=\"228\" class=\"sm\" text-anchor=\"middle\">一瞬前へ押す</text><line x1=\"40\" y1=\"120\" x2=\"160\" y2=\"120\" class=\"ln thick\"/><circle cx=\"100\" cy=\"120\" r=\"5\" class=\"dot\"/><rect x=\"30\" y=\"112\" width=\"20\" height=\"16\" rx=\"3\" class=\"pst\"/><line x1=\"40\" y1=\"108\" x2=\"40\" y2=\"74\" class=\"ln acs thick\" marker-end=\"url(#ah)\"/><text x=\"295\" y=\"52\" class=\"tt ac\" text-anchor=\"middle\">②</text><text x=\"295\" y=\"210\" class=\"sm\" text-anchor=\"middle\">前輪が一瞬右を向く</text><text x=\"295\" y=\"228\" class=\"sm\" text-anchor=\"middle\">→ 車体が左へ傾く</text><g transform=\"rotate(18 295 130)\"><rect x=\"287\" y=\"80\" width=\"16\" height=\"100\" rx=\"6\" class=\"bx\"/></g><line x1=\"295\" y1=\"186\" x2=\"295\" y2=\"70\" class=\"ln dash\"/><path d=\"M265 150 q-30 -10 -40 -40\" class=\"ln acs\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"490\" y=\"52\" class=\"tt ac\" text-anchor=\"middle\">③</text><text x=\"490\" y=\"210\" class=\"sm\" text-anchor=\"middle\">車体が左に傾き</text><text x=\"490\" y=\"228\" class=\"sm\" text-anchor=\"middle\">左へ旋回する</text><path d=\"M530 190 C530 120 490 90 420 80\" class=\"ln acs thick\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"20\" y=\"262\" class=\"sm dim\">ある程度の速度があるときの操作。曲がりたい側のグリップを押す＝前輪は一瞬だけ逆を向く</text></svg>"}, "x-cride-2": {"c": "横軸の速度が上がるほど必要な傾き角が大きくなる曲線に注目。速度が低いほど傾きは小さくて済む", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/Bike_lean_angle_vs_forward_speed.PNG/500px-Bike_lean_angle_vs_forward_speed.PNG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Bike_lean_angle_vs_forward_speed.PNG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Bike_lean_angle_vs_forward_speed.PNG"}, "x-cride-3": {"c": "減速時は荷重が前へ移り、後輪が軽くなる。後輪はグリップが減ってロックしやすい", "svg": "<svg viewBox=\"0 0 600 352\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">ブレーキ時の荷重移動（模式図）</text><circle cx=\"120\" cy=\"210\" r=\"50\" class=\"ln thick\"/><circle cx=\"440\" cy=\"210\" r=\"50\" class=\"ln thick\"/><path d=\"M120 210 L190 120 L380 110 L440 210\" class=\"ln\" fill=\"none\"/><line x1=\"170\" y1=\"90\" x2=\"140\" y2=\"150\" class=\"ln\"/><rect x=\"220\" y=\"120\" width=\"140\" height=\"60\" rx=\"6\" class=\"bx\"/><circle cx=\"290\" cy=\"130\" r=\"7\" class=\"dot\"/><text x=\"302\" y=\"116\" class=\"sm\">重心</text><line x1=\"280\" y1=\"140\" x2=\"200\" y2=\"140\" class=\"ln acs thick\" marker-end=\"url(#ah)\"/><text x=\"204\" y=\"104\" class=\"sm ac\">慣性で前へ</text><line x1=\"440\" y1=\"290\" x2=\"440\" y2=\"266\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"452\" y=\"286\" class=\"sm\">後輪：軽くなる</text><line x1=\"120\" y1=\"316\" x2=\"120\" y2=\"266\" class=\"ln acs thick\" marker-end=\"url(#ah)\"/><text x=\"136\" y=\"300\" class=\"sm ac\">前輪：荷重が増える</text><line x1=\"40\" y1=\"260\" x2=\"560\" y2=\"260\" class=\"ln\"/><line x1=\"560\" y1=\"60\" x2=\"520\" y2=\"60\" class=\"ln\" marker-end=\"url(#ah)\"/><text x=\"560\" y=\"50\" class=\"sm dim\" text-anchor=\"end\">← 進行方向</text><text x=\"20\" y=\"340\" class=\"sm\">前輪はグリップが増えて制動力の主役に。後輪は軽くなってロックしやすくなる</text></svg>"}, "x-cride-4": {"c": "前輪は傾いた側へ自然に向こうとする。ハンドルを強く握って押さえるとこの働きを妨げる", "svg": "<svg viewBox=\"0 0 600 318\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">セルフステア（後ろから見た図と上から見た図）</text><line x1=\"20\" y1=\"230\" x2=\"260\" y2=\"230\" class=\"ln\"/><g transform=\"rotate(25 140 230)\"><rect x=\"130\" y=\"80\" width=\"20\" height=\"150\" rx=\"8\" class=\"bx\"/><circle cx=\"140\" cy=\"64\" r=\"14\" class=\"ln\"/></g><text x=\"140\" y=\"256\" class=\"sm\" text-anchor=\"middle\">車体が右に傾く（後ろから）</text><rect x=\"400\" y=\"150\" width=\"16\" height=\"90\" rx=\"6\" class=\"bx\"/><text x=\"408\" y=\"256\" class=\"sm\" text-anchor=\"middle\">車体</text><g transform=\"rotate(16 408 120)\"><rect x=\"400\" y=\"70\" width=\"16\" height=\"80\" rx=\"6\" class=\"pst\"/></g><line x1=\"408\" y1=\"120\" x2=\"408\" y2=\"50\" class=\"ln dash\"/><path d=\"M430 70 q20 0 30 22\" class=\"ln acs\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"460\" y=\"70\" class=\"sm ac\">前輪が自然に</text><text x=\"460\" y=\"88\" class=\"sm ac\">右を向く</text><line x1=\"270\" y1=\"150\" x2=\"340\" y2=\"150\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"20\" y=\"286\" class=\"sm\">キャスター角とトレールの働きで、操作しなくても前輪は傾いた側へ向く</text><text x=\"20\" y=\"306\" class=\"sm dim\">ハンドルを強く握って押さえ込むと、この働きを妨げてしまう</text></svg>"}, "x-cride-5": {"c": "回転するコマ（ジャイロ）が軸の向きを保とうとする様子。回る車輪にも同じ性質が働く", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Gyroscope_precession.gif/500px-Gyroscope_precession.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Gyroscope_precession.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Gyroscope_precession.gif"}, "x-cride-6": {"c": "傾いたまま前ブレーキを強くかけると車体が起き上がり、ねらったラインより外へふくらむ", "svg": "<svg viewBox=\"0 0 600 342\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">傾けたまま前輪ブレーキを強くかけると（上から見た図）</text><path d=\"M60 300 C60 160 160 70 330 60\" class=\"ln thick\" fill=\"none\"/><path d=\"M110 300 C110 190 200 110 330 100\" class=\"ln dash\" fill=\"none\"/><path d=\"M60 300 C60 220 100 170 160 140\" class=\"ln acs thick\" fill=\"none\"/><path d=\"M160 140 C220 110 260 108 320 120\" class=\"ln acs thick\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"330\" y=\"124\" class=\"sm ac\">実際のライン：外へふくらむ</text><text x=\"330\" y=\"96\" class=\"sm\">ねらったライン</text><text x=\"340\" y=\"60\" class=\"sm dim\">コーナーの外側</text><circle cx=\"160\" cy=\"140\" r=\"6\" class=\"dot\"/><text x=\"170\" y=\"160\" class=\"sm\">ここで前ブレーキ</text><text x=\"170\" y=\"178\" class=\"sm\">→ 車体が起き上がる</text><text x=\"20\" y=\"330\" class=\"sm\">減速はコーナーの手前、車体を起こした状態で終えるのが基本</text></svg>"}, "q-e4st-1": {"c": "ピストンが下・上・下・上と4回動く間に、下のクランクがちょうど2回転するのを見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/4-Stroke-Engine.gif/500px-4-Stroke-Engine.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/4-Stroke-Engine.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:4-Stroke-Engine.gif"}, "q-e4st-2": {"c": "番号の順に吸入→圧縮→燃焼（膨張）→排気と進み、また吸入に戻る流れを追う", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/4-Stroke-Engine-with-airflows_numbers.gif/500px-4-Stroke-Engine-with-airflows_numbers.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/4-Stroke-Engine-with-airflows_numbers.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:4-Stroke-Engine-with-airflows_numbers.gif"}, "q-e4st-3": {"c": "ピストン1往復（クランク1回転）の間に、毎回1度燃焼が起きているのを見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Two-Stroke_Engine.gif/500px-Two-Stroke_Engine.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Two-Stroke_Engine.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Two-Stroke_Engine.gif"}, "q-e4st-4": {"c": "排気バルブから燃えたガスが出たあと、次は吸気バルブが開いて吸入に戻る順番を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/4-Stroke-Engine-with-airflows.gif/500px-4-Stroke-Engine-with-airflows.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/4-Stroke-Engine-with-airflows.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:4-Stroke-Engine-with-airflows.gif"}, "q-e4st-5": {"c": "吹き抜けた混合気と燃えたオイルで排ガス中のHCが多くなり、規制強化に追いつけなかった流れ", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"24\" text-anchor=\"middle\" class=\"tt\">2ストロークが排ガス規制に対応しにくい理由</text><rect x=\"20\" y=\"50\" width=\"170\" height=\"44\" rx=\"6\" class=\"bx\"/><text x=\"105.0\" y=\"68.0\" text-anchor=\"middle\" class=\"sm\">未燃の混合気</text><text x=\"105.0\" y=\"84.0\" text-anchor=\"middle\" class=\"sm dim\">吹き抜けで排気へ</text><rect x=\"20\" y=\"110\" width=\"170\" height=\"44\" rx=\"6\" class=\"bx\"/><text x=\"105.0\" y=\"128.0\" text-anchor=\"middle\" class=\"sm\">燃えた潤滑オイル</text><text x=\"105.0\" y=\"144.0\" text-anchor=\"middle\" class=\"sm dim\">白煙・HCの原因</text><line x1=\"195\" y1=\"72\" x2=\"255\" y2=\"95\" class=\"ln\" marker-end=\"url(#ah)\"/><line x1=\"195\" y1=\"132\" x2=\"255\" y2=\"110\" class=\"ln\" marker-end=\"url(#ah)\"/><rect x=\"260\" y=\"78\" width=\"140\" height=\"50\" rx=\"6\" class=\"bx\"/><text x=\"330.0\" y=\"107.0\" text-anchor=\"middle\" class=\"sm\">排ガス中のHCが多い</text><line x1=\"405\" y1=\"103\" x2=\"445\" y2=\"103\" class=\"ln\" marker-end=\"url(#ah)\"/><rect x=\"450\" y=\"62\" width=\"130\" height=\"82\" rx=\"6\" class=\"bx\"/><text x=\"515.0\" y=\"99.0\" text-anchor=\"middle\" class=\"tt ac\">規制強化に</text><text x=\"515.0\" y=\"115.0\" text-anchor=\"middle\" class=\"sm dim\">対応が難しい</text><text x=\"300\" y=\"186\" text-anchor=\"middle\" class=\"sm dim\">→ 公道向け新車は4ストローク＋FIが主流に</text></svg>"}, "x-e4st-1": {"c": "1サイクルで点火（燃焼）は1回、その間にクランクが2回転していることを確かめる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/4StrokeEngine_Ortho_3D_Small.gif/500px-4StrokeEngine_Ortho_3D_Small.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/4StrokeEngine_Ortho_3D_Small.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:4StrokeEngine_Ortho_3D_Small.gif"}, "x-e4st-2": {"c": "バルブはなく、ピストンがシリンダー壁の穴（ポート）を開け閉めして吸排気しているのを見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Two_stroke_Valveless_engine_Animation.gif/500px-Two_stroke_Valveless_engine_Animation.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Two_stroke_Valveless_engine_Animation.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Two_stroke_Valveless_engine_Animation.gif"}, "x-e4st-3": {"c": "掃気ポートから入った新気の一部が、開いたままの排気ポートへそのまま抜けていく様子", "svg": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"22\" text-anchor=\"middle\" class=\"tt\">2ストロークの掃気と「吹き抜け」</text><rect x=\"232\" y=\"52\" width=\"136\" height=\"118\" class=\"gmix\"/><path d=\"M230 40 V140 M230 168 V230\" class=\"ln thick\"/><path d=\"M370 40 V120 M370 168 V230\" class=\"ln thick\"/><line x1=\"230\" y1=\"40\" x2=\"370\" y2=\"40\" class=\"ln thick\"/><rect x=\"232\" y=\"170\" width=\"136\" height=\"50\" class=\"pst\"/><path d=\"M150 158 H230\" class=\"ln\"/><path d=\"M150 168 H230\" class=\"ln\"/><path d=\"M370 120 H460\" class=\"ln\"/><path d=\"M370 168 H460\" class=\"ln\"/><text x=\"145\" y=\"167\" text-anchor=\"end\" class=\"sm\">掃気ポート（新気）</text><text x=\"420\" y=\"192\" text-anchor=\"middle\" class=\"sm\">排気ポート</text><path d=\"M240 160 C240 70 300 50 350 70\" class=\"ln\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"310\" y=\"110\" text-anchor=\"middle\" class=\"sm dim\">燃えたガスを押し出す</text><path d=\"M242 150 C300 140 340 140 455 144\" class=\"ln acs\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"470\" y=\"110\" text-anchor=\"start\" class=\"tt ac\">新気の一部が</text><text x=\"470\" y=\"126\" text-anchor=\"start\" class=\"tt ac\">そのまま排気へ</text><text x=\"470\" y=\"142\" text-anchor=\"start\" class=\"tt ac\">＝吹き抜け</text><text x=\"300\" y=\"248\" text-anchor=\"middle\" class=\"sm dim\">ピストンが下にある間は両ポートが同時に開いているため起こる</text></svg>"}, "x-e4st-4": {"c": "上死点から下死点まで、ピストンが片道1回動く距離と動きが「1ストローク（行程）」", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><path d=\"M100 40 V200 M200 40 V200\" class=\"ln thick\"/><line x1=\"100\" y1=\"40\" x2=\"200\" y2=\"40\" class=\"ln thick\"/><rect x=\"102\" y=\"52\" width=\"96\" height=\"36\" class=\"pst\"/><text x=\"150\" y=\"228\" text-anchor=\"middle\" class=\"tt\">上死点（一番上）</text><path d=\"M280 40 V200 M380 40 V200\" class=\"ln thick\"/><line x1=\"280\" y1=\"40\" x2=\"380\" y2=\"40\" class=\"ln thick\"/><rect x=\"282\" y=\"150\" width=\"96\" height=\"36\" class=\"pst\"/><text x=\"330\" y=\"228\" text-anchor=\"middle\" class=\"tt\">下死点（一番下）</text><line x1=\"100\" y1=\"52\" x2=\"520\" y2=\"52\" class=\"ln dash\"/><line x1=\"100\" y1=\"150\" x2=\"520\" y2=\"150\" class=\"ln dash\"/><line x1=\"470\" y1=\"56\" x2=\"470\" y2=\"146\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"470\" y1=\"146\" x2=\"470\" y2=\"56\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"486\" y=\"96\" text-anchor=\"start\" class=\"tt ac\">ストローク</text><text x=\"486\" y=\"114\" text-anchor=\"start\" class=\"sm\">＝1行程</text><text x=\"300\" y=\"20\" text-anchor=\"middle\" class=\"tt\">ピストンの片道1回の動き＝1ストローク（行程）</text></svg>"}, "x-e4st-5": {"c": "2ストオイルはクランク室を潤滑したあと燃焼室で燃料と一緒に燃え、排気に煙が出る", "svg": "<svg viewBox=\"0 0 600 190\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"22\" text-anchor=\"middle\" class=\"tt\">2ストロークはオイルも燃やす（分離給油・混合給油とも）</text><rect x=\"15\" y=\"60\" width=\"130\" height=\"56\" rx=\"6\" class=\"bx\"/><text x=\"80.0\" y=\"84.0\" text-anchor=\"middle\" class=\"sm\">ガソリン</text><text x=\"80.0\" y=\"100.0\" text-anchor=\"middle\" class=\"sm dim\">＋2ストオイル</text><line x1=\"150\" y1=\"88\" x2=\"180\" y2=\"88\" class=\"ln\" marker-end=\"url(#ah)\"/><rect x=\"185\" y=\"60\" width=\"130\" height=\"56\" rx=\"6\" class=\"bx\"/><text x=\"250.0\" y=\"84.0\" text-anchor=\"middle\" class=\"sm\">クランク室</text><text x=\"250.0\" y=\"100.0\" text-anchor=\"middle\" class=\"sm dim\">軸受などを潤滑</text><line x1=\"320\" y1=\"88\" x2=\"350\" y2=\"88\" class=\"ln\" marker-end=\"url(#ah)\"/><rect x=\"355\" y=\"60\" width=\"110\" height=\"56\" rx=\"6\" class=\"bx\"/><text x=\"410.0\" y=\"84.0\" text-anchor=\"middle\" class=\"sm\">燃焼室</text><text x=\"410.0\" y=\"100.0\" text-anchor=\"middle\" class=\"sm dim\">燃料と一緒に燃焼</text><line x1=\"470\" y1=\"88\" x2=\"495\" y2=\"88\" class=\"ln\" marker-end=\"url(#ah)\"/><rect x=\"500\" y=\"60\" width=\"90\" height=\"56\" rx=\"6\" class=\"bx\"/><text x=\"545.0\" y=\"84.0\" text-anchor=\"middle\" class=\"tt ac\">排気</text><text x=\"545.0\" y=\"100.0\" text-anchor=\"middle\" class=\"sm dim\">煙が出やすい</text><text x=\"300\" y=\"160\" text-anchor=\"middle\" class=\"sm dim\">4ストのようにオイルを循環させて使い続ける仕組みではない</text></svg>"}, "x-e4st-6": {"c": "圧縮の場面では吸気・排気どちらのバルブも閉じ、混合気を閉じ込めているのを見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/4-Stroke-Engine-with-airflows_numbers.gif/500px-4-Stroke-Engine-with-airflows_numbers.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/4-Stroke-Engine-with-airflows_numbers.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:4-Stroke-Engine-with-airflows_numbers.gif"}, "q-elayout-1": {"c": "2本のシリンダーとピストンが横一列に並び、1本のクランクシャフトを回しているのを見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Straight-twin_engine_with_different_crank_shaft_angles.gif/500px-Straight-twin_engine_with_different_crank_shaft_angles.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Straight-twin_engine_with_different_crank_shaft_angles.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Straight-twin_engine_with_different_crank_shaft_angles.gif"}, "q-elayout-2": {"c": "向かい合うピストンが水平に左右へ動き、互いの揺れを打ち消し合う水平対向の動きを見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Motor_boxer_Boxer_engine.gif/500px-Motor_boxer_Boxer_engine.gif", "u2": "https:/ ss=\"tt\">出力の計算</text><rect x=\"30\" y=\"50\" width=\"150\" height=\"50\" rx=\"6\" class=\"bx\"/><text x=\"105.0\" y=\"79.0\" text-anchor=\"middle\" class=\"sm\">トルク 100 N·m</text><text x=\"205\" y=\"80\" text-anchor=\"middle\" class=\"tt\">×</text><rect x=\"230\" y=\"50\" width=\"150\" height=\"50\" rx=\"6\" class=\"bx\"/><text x=\"305.0\" y=\"79.0\" text-anchor=\"middle\" class=\"sm\">6000 rpm</text><text x=\"405\" y=\"80\" text-anchor=\"middle\" class=\"tt\">÷ 9549</text><line x1=\"300\" y1=\"108\" x2=\"300\" y2=\"128\" class=\"ln\" marker-end=\"url(#ah)\"/><rect x=\"180\" y=\"132\" width=\"240\" height=\"46\" rx=\"6\" class=\"bx\"/><text x=\"300.0\" y=\"159.0\" text-anchor=\"middle\" class=\"tt ac\">≒ 62.8 kW → 約63 kW</text><text x=\"470\" y=\"160\" text-anchor=\"start\" class=\"sm dim\">（約85PS）</text></svg>"}, "q-eperf-4": {"c": "ピストンが一番下と一番上のときの容積の比が圧縮比。高すぎるとノッキングが起きやすい", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Compression_ratio.svg/500px-Compression_ratio.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Compression_ratio.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Compression_ratio.svg"}, "q-eperf-5": {"c": "実車の出力・トルク曲線。出力はトルク×回転数なので、高回転で出せるほど大きくなる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Dyno_Chart_Kawa_KR-1S.png/500px-Dyno_Chart_Kawa_KR-1S.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Dyno_Chart_Kawa_KR-1S.png?width=500", "p": "https://commons.wikimedia.org/wiki/File:Dyno_Chart_Kawa_KR-1S.png"}, "x-eperf-1": {"c": "排気量はボアの2乗とストロークの積で決まり、ボアだけでもストロークだけでも決まらない", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"22\" text-anchor=\"middle\" class=\"tt\">排気量はボアとストロークの両方で決まる</text><path d=\"M110 40 V210 M230 40 V210\" class=\"ln thick\"/><line x1=\"110\" y1=\"40\" x2=\"230\" y2=\"40\" class=\"ln thick\"/><rect x=\"112\" y=\"60\" width=\"116\" height=\"80\" class=\"gmix\"/><rect x=\"112\" y=\"140\" width=\"116\" height=\"34\" class=\"pst\"/><line x1=\"112\" y1=\"52\" x2=\"228\" y2=\"52\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"228\" y1=\"52\" x2=\"112\" y2=\"52\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"170\" y=\"48\" text-anchor=\"middle\" class=\"sm ac\">ボア</text><line x1=\"232\" y1=\"60\" x2=\"268\" y2=\"60\" class=\"ln dash\"/><line x1=\"232\" y1=\"140\" x2=\"268\" y2=\"140\" class=\"ln dash\"/><line x1=\"258\" y1=\"64\" x2=\"258\" y2=\"136\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"258\" y1=\"136\" x2=\"258\" y2=\"64\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"266\" y=\"104\" text-anchor=\"start\" class=\"sm ac\">ストローク</text><text x=\"170\" y=\"232\" text-anchor=\"middle\" class=\"sm dim\">色の部分の体積＝1気筒の排気量</text><text x=\"460\" y=\"110\" text-anchor=\"middle\" class=\"tt\">排気量 ＝</text><text x=\"460\" y=\"134\" text-anchor=\"middle\" class=\"tt ac\">π/4 × ボア² × ストローク</text><text x=\"460\" y=\"156\" text-anchor=\"middle\" class=\"tt\">× 気筒数</text></svg>"}, "x-eperf-2": {"c": "1PSは約0.7355kW、逆に1kWは約1.36PSという換算の大きさの関係", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"24\" text-anchor=\"middle\" class=\"tt\">PS と kW の換算</text><rect x=\"60\" y=\"50\" width=\"440\" height=\"30\" class=\"bx\"/><text x=\"280\" y=\"70\" text-anchor=\"middle\" class=\"sm\">1 PS</text><rect x=\"60\" y=\"95\" width=\"324\" height=\"30\" class=\"pst\"/><text x=\"222\" y=\"115\" text-anchor=\"middle\" class=\"sm\">0.7355 kW</text><text x=\"510\" y=\"70\" text-anchor=\"middle\" class=\"sm\"></text><text x=\"300\" y=\"158\" text-anchor=\"middle\" class=\"tt ac\">1 PS ≒ 0.7355 kW　　1 kW ≒ 1.36 PS</text><text x=\"300\" y=\"182\" text-anchor=\"middle\" class=\"sm dim\">例：100 PS ≒ 73.5 kW</text></svg>"}, "x-eperf-3": {"c": "OHVはカムが下にありプッシュロッドとロッカーアームでバルブを押す。ヘッド上にカムを置くのはOHC", "svg": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"150\" y=\"22\" text-anchor=\"middle\" class=\"tt\">OHV（カムは下）</text><text x=\"450\" y=\"22\" text-anchor=\"middle\" class=\"tt\">OHC（カムはヘッドの上）</text><path d=\"M100 60 V200 M180 60 V200\" class=\"ln thick\"/><line x1=\"100\" y1=\"60\" x2=\"180\" y2=\"60\" class=\"ln thick\"/><rect x=\"102\" y=\"150\" width=\"76\" height=\"30\" class=\"pst\"/><line x1=\"125\" y1=\"62\" x2=\"125\" y2=\"38\" class=\"ln thick\"/><line x1=\"112\" y1=\"62\" x2=\"138\" y2=\"62\" class=\"ln thick\"/><line x1=\"120\" y1=\"36\" x2=\"220\" y2=\"28\" class=\"ln thick\"/><text x=\"170\" y=\"48\" text-anchor=\"middle\" class=\"sm dim\">ロッカーアーム</text><line x1=\"225\" y1=\"32\" x2=\"225\" y2=\"220\" class=\"ln acs\"/><text x=\"232\" y=\"130\" text-anchor=\"start\" class=\"sm ac\">プッシュロッド</text><circle cx=\"225\" cy=\"236\" r=\"14\" class=\"pst\"/><text x=\"245\" y=\"254\" text-anchor=\"start\" class=\"sm\">カム（シリンダーの横・下側）</text><text x=\"118\" y=\"50\" text-anchor=\"end\" class=\"sm dim\">バルブ</text><path d=\"M410 90 V230 M490 90 V230\" class=\"ln thick\"/><line x1=\"410\" y1=\"90\" x2=\"490\" y2=\"90\" class=\"ln thick\"/><rect x=\"412\" y=\"180\" width=\"76\" height=\"30\" class=\"pst\"/><line x1=\"440\" y1=\"92\" x2=\"440\" y2=\"60\" class=\"ln thick\"/><line x1=\"427\" y1=\"92\" x2=\"453\" y2=\"92\" class=\"ln thick\"/><circle cx=\"440\" cy=\"46\" r=\"14\" class=\"pst\"/><text x=\"462\" y=\"50\" text-anchor=\"start\" class=\"sm ac\">カム（ヘッドの上）</text><text x=\"450\" y=\"272\" text-anchor=\"middle\" class=\"sm dim\">プッシュロッドがいらない</text></svg>"}, "x-eperf-4": {"c": "ストロークが短いほど同じ回転数でもピストンの移動速度が低く、高回転まで回しやすい", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Bore_Stroke_Ratio_Animation.gif/500px-Bore_Stroke_Ratio_Animation.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Bore_Stroke_Ratio_Animation.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Bore_Stroke_Ratio_Animation.gif"}, "x-eperf-5": {"c": "トルクの山より高い回転数で出力の山が来る。最大トルクと最高出力の回転数は一般に違う", "svg": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"22\" text-anchor=\"middle\" class=\"tt\">最大トルクと最高出力は別の回転数で出る</text><line x1=\"80\" y1=\"225\" x2=\"540\" y2=\"225\" class=\"ln\"/><line x1=\"80\" y1=\"225\" x2=\"80\" y2=\"50\" class=\"ln\"/><text x=\"310\" y=\"250\" text-anchor=\"middle\" class=\"sm\">エンジン回転数 →</text><polyline points=\"80,115.0 124,103.0 168,91.0 212,80.5 256,73.0 300,70.0 344,73.0 388,80.5 432,92.5 476,109.0 520,130.0\" fill=\"none\" class=\"ln\"/><polyline points=\"80,206.27450980392157 124,189.41176470588235 168,169.41176470588235 212,147.05882352941177 256,123.92156862745097 300,102.35294117647058 344,85.49019607843138 388,74.11764705882351 432,70.0 476,74.9019607843137 520,90.58823529411765\" fill=\"none\" class=\"ln acs\"/><line x1=\"300\" y1=\"70.0\" x2=\"300\" y2=\"225\" class=\"ln dash\"/><line x1=\"432\" y1=\"70.0\" x2=\"432\" y2=\"225\" class=\"ln dash\"/><text x=\"300\" y=\"60.0\" text-anchor=\"middle\" class=\"sm\">最大トルク</text><text x=\"432\" y=\"60.0\" text-anchor=\"middle\" class=\"sm ac\">最高出力</text><text x=\"300\" y=\"42\" text-anchor=\"middle\" class=\"sm dim\">通常線：トルク　強調線：出力（トルク×回転数）</text></svg>"}, "x-eperf-6": {"c": "下死点の容積÷上死点の容積が圧縮比。圧縮比10なら混合気は10分の1の容積まで押し縮められる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Compression_ratio.svg/500px-Compression_ratio.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Compression_ratio.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Compression_ratio.svg"}, "q-efuel-1": {"c": "細くしぼったベンチュリー部で空気が速くなり負圧が生まれ、燃料が吸い出されて霧状になる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Carburator_venturi.png/500px-Carburator_venturi.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Carburator_venturi.png?width=500", "p": "https://commons.wikimedia.org/wiki/File:Carburator_venturi.png"}, "q-efuel-2": {"c": "排ガスがタービンを回し、同じ軸のコンプレッサーが空気を圧縮してエンジンに押し込む流れを追う", "svg": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"24\" text-anchor=\"middle\" class=\"tt\">ターボチャージャーの仕組み（模式図）</text><text x=\"170\" y=\"46\" text-anchor=\"middle\" class=\"tt\">コンプレッサー</text><text x=\"170\" y=\"62\" text-anchor=\"middle\" class=\"sm dim\">吸気を圧縮して押し込む</text><text x=\"430\" y=\"46\" text-anchor=\"middle\" class=\"tt\">タービン</text><text x=\"430\" y=\"62\" text-anchor=\"middle\" class=\"sm dim\">排ガスの勢いで回る</text><rect x=\"210\" y=\"115\" width=\"180\" height=\"10\" class=\"pst\"/><text x=\"300\" y=\"106\" text-anchor=\"middle\" class=\"sm ac\">同じ軸で一緒に回る</text><circle cx=\"170\" cy=\"120\" r=\"45\" class=\"bx\"/><line x1=\"179.0\" y1=\"120.0\" x2=\"200.0\" y2=\"120.0\" class=\"ln thick\"/><line x1=\"174.5\" y1=\"127.8\" x2=\"185.0\" y2=\"146.0\" class=\"ln thick\"/><line x1=\"165.5\" y1=\"127.8\" x2=\"155.0\" y2=\"146.0\" class=\"ln thick\"/><line x1=\"161.0\" y1=\"120.0\" x2=\"140.0\" y2=\"120.0\" class=\"ln thick\"/><line x1=\"165.5\" y1=\"112.2\" x2=\"155.0\" y2=\"94.0\" class=\"ln thick\"/><line x1=\"174.5\" y1=\"112.2\" x2=\"185.0\" y2=\"94.0\" class=\"ln thick\"/><circle cx=\" r=\"middle\" class=\"sm dim\">（スイングアームの動きに追従）</text><rect x=\"420\" y=\"95\" width=\"80\" height=\"70\" rx=\"6\" class=\"bx\"/><polygon points=\"430,121 452,114 452,146 430,139\" class=\"pst\"/><polygon points=\"455,102 468,108 468,152 455,158\" class=\"pst\"/><text x=\"460\" y=\"86\" text-anchor=\"middle\" class=\"tt\">ベベルギア</text><text x=\"460\" y=\"186\" text-anchor=\"middle\" class=\"sm dim\">回転の向きを90°変える</text><line x1=\"500\" y1=\"130\" x2=\"558\" y2=\"130\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"564\" y=\"134\" text-anchor=\"start\" class=\"sm\">後輪</text><text x=\"300\" y=\"240\" text-anchor=\"middle\" class=\"sm ac\">チェーンのような注油・たるみ調整は不要（ギアオイル交換は必要）</text></svg>"}, "x-edrive-6": {"c": "アップ専用と双方向の違い。シフトダウンもクラッチなしでできるのは双方向タイプだけ", "svg": "<svg viewBox=\"0 0 600 230\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"22\" text-anchor=\"middle\" class=\"tt\">クイックシフターの種類</text><rect x=\"20\" y=\"50\" width=\"260\" height=\"110\" rx=\"6\" class=\"bx\"/><text x=\"150.0\" y=\"109.0\" text-anchor=\"middle\" class=\"sm\"></text><text x=\"150\" y=\"74\" text-anchor=\"middle\" class=\"tt\">シフトアップ専用</text><text x=\"150\" y=\"100\" text-anchor=\"middle\" class=\"sm\">ペダルのセンサーが操作を検知</text><text x=\"150\" y=\"120\" text-anchor=\"middle\" class=\"sm\">点火・燃料を一瞬カット</text><text x=\"150\" y=\"140\" text-anchor=\"middle\" class=\"sm\">クラッチ操作なしで上げる</text><rect x=\"320\" y=\"50\" width=\"260\" height=\"110\" rx=\"6\" class=\"bx\"/><text x=\"450.0\" y=\"109.0\" text-anchor=\"middle\" class=\"sm\"></text><text x=\"450\" y=\"74\" text-anchor=\"middle\" class=\"tt ac\">双方向（アップ／ダウン）</text><text x=\"450\" y=\"100\" text-anchor=\"middle\" class=\"sm\">アップは同じ仕組み</text><text x=\"450\" y=\"120\" text-anchor=\"middle\" class=\"sm\">ダウン時はスロットルを一瞬開き</text><text x=\"450\" y=\"140\" text-anchor=\"middle\" class=\"sm\">回転を合わせる（ブリッピング）</text><text x=\"300\" y=\"196\" text-anchor=\"middle\" class=\"sm dim\">アップ専用の車種ではシフトダウンにクラッチ操作が必要</text></svg>"}, "q-horigin-1": {"c": "1885年のライトワーゲン（複製）。木製の車体の下に積まれた単気筒ガソリンエンジンに注目", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Daimler_Reitwagen_at_the_Mercedes_Benz_museum_2009.jpg/500px-Daimler_Reitwagen_at_the_Mercedes_Benz_museum_2009.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Daimler_Reitwagen_at_the_Mercedes_Benz_museum_2009.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Daimler_Reitwagen_at_the_Mercedes_Benz_museum_2009.jpg"}, "q-horigin-2": {"c": "ハーレーダビッドソン最古の現存車「シリアルナンバー・ワン」。自転車に近い車体に単気筒を積む", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Harley-Davidson_Museum_Serial_Number_One.JPG/500px-Harley-Davidson_Museum_Serial_Number_One.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Harley-Davidson_Museum_Serial_Number_One.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Harley-Davidson_Museum_Serial_Number_One.JPG"}, "q-horigin-3": {"c": "1894年のヒルデブラント&ヴォルフミュラー。量産・市販された最初のオートバイとされる車両", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/ZweiRadMuseumNSU_Hildebrand_Wolfmueller.JPG/500px-ZweiRadMuseumNSU_Hildebrand_Wolfmueller.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/ZweiRadMuseumNSU_Hildebrand_Wolfmueller.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:ZweiRadMuseumNSU_Hildebrand_Wolfmueller.JPG"}, "q-horigin-4": {"c": "「モトラッド」と呼ばれた1894年の量産車。フレーム下に横たわる2気筒エンジンが見える", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/1894_Hildebrand_and_Wolfm%C3%BCller_%281%29_-_The_Art_of_the_Motorcycle_-_Memphis.jpg/500px-1894_Hildebrand_and_Wolfm%C3%BCller_%281%29_-_The_Art_of_the_Motorcycle_-_Memphis.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/1894_Hildebrand_and_Wolfm%C3%BCller_%281%29_-_The_Art_of_the_Motorcycle_-_Memphis.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:1894_Hildebrand_and_Wolfm%C3%BCller_%281%29_-_The_Art_of_the_Motorcycle_-_Memphis.jpg"}, "q-horigin-5": {"c": "ライトワーゲンの特許図面。木製の車体、左右の補助輪、ガソリンエンジンの位置を確認", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Daimler_Reitwagen_color_drawing_1885_DE_patent_36423.jpg/500px-Daimler_Reitwagen_color_drawing_1885_DE_patent_36423.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Daimler_Reitwagen_color_drawing_1885_DE_patent_36423.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Daimler_Reitwagen_color_drawing_1885_DE_patent_36423.jpg"}, "q-hworld-1": {"c": "水平対向エンジンの作動。向かい合うピストンが同時に外へ、同時に内へ動き、振動を打ち消す様子を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Boxerengineanimation.gif/500px-Boxerengineanimation.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Boxerengineanimation.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Boxerengineanimation.gif"}, "q-hworld-2": {"c": "初期のベスパ98。エンジンを覆う丸みのある車体と、足を置く床（フロア）がスクーターの特徴", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/1947_Vespa_98_100cc.jpg/500px-1947_Vespa_98_100cc.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/1947_Vespa_98_100cc.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:1947_Vespa_98_100cc.jpg"}, "q-hworld-3": {"c": "デスモドロミックの仕組み。開く動きも閉じる動きもカムとロッカーアームが機械的に行う", "svg": "<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"24\" class=\"tt\">デスモドロミック：開くのも閉じるのもカムとロッカーアーム</text>\n<circle cx=\"150\" cy=\"110\" r=\"34\" class=\"pst\"/><path d=\"M150 60 Q178 70 184 110\" class=\"ln thick\"/>\n<text x=\"70\" y=\"62\" class=\"sm\">開き用カム</text>\n<circle cx=\"450\" cy=\"110\" r=\"34\" class=\"pst\"/><path d=\"M420 92 Q410 130 450 146\" class=\"ln thick\"/>\n<text x=\"470\" y=\"62\" class=\"sm\">閉じ用カム</text>\n<line x1=\"300\" y1=\"70\" x2=\"300\" y2=\"270\" class=\"ln thick\"/>\n<rect x=\"280\" y=\"265\" width=\"40\" height=\"10\" class=\"pst\"/>\n<text x=\"330\" y=\"280\" class=\"sm\">バルブ</text>\n<path d=\"M184 128 L300 74\" class=\"ln thick\"/><text x=\"170\" y=\"170\" class=\"sm\">開き用ロッカー</text>\n<line x1=\"300\" y1=\"80\" x2=\"300\" y2=\"120\" class=\"ln acs\" marker-end=\"url(#ah)\"/>\n<text x=\"312\" y=\"112\" class=\"tt ac\">押し下げて開く</text>\n<rect x=\"282\" y=\"185\" width=\"36\" height=\"8\" class=\"pst\"/><text x=\"226\" y=\"192\" class=\"sm\">カラー</text>\n<path d=\"M436 148 L318 196\" class=\"ln thick\"/><text x=\"400\" y=\"200\" class=\"sm\">閉じ用ロッカー</text>\n<line x1=\"330\" y1=\"230\" x2=\"330\" y2=\"200\" class=\"ln acs\" marker-end=\"url(#ah)\"/>\n<text x=\"340\" y=\"232\" class=\"tt ac\">引き上げて閉じる</text>\n<text x=\"20\" y=\"295\" class=\"sm dim\">一般的なエンジンは閉じる動きをバルブスプリングに任せる（ドゥカティの伝統技術）</text>\n</svg>"}, "q-hworld-4": {"c": "ユタ州ボンネビル・ソルトフラッツ。真っ白な塩の平原が速度記録挑戦の舞台になった", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Bonneville_Speedway%2C_Bonneville_Salt_Flats%2C_Utah_%2868883193%29.jpg/500px-Bonneville_Speedway%2C_Bonneville_Salt_Flats%2C_Utah_%2868883193%29.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Bonneville_Speedway%2C_Bonneville_Salt_Flats%2C_Utah_%2868883193%29.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Bonneville_Speedway%2C_Bonneville_Salt_Flats%2C_Utah_%2868883193%29.jpg"}, "q-hworld-5": {"c": "ドゥカティ916。ドゥカティはスクーター専門ではなく、スーパーバイクで名を上げたメーカー", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Ducati_916.JPG/500px-Ducati_916.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Ducati_916.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Ducati_916.JPG"}, "q-hjapan-1": {"c": "1958年発売の初代スーパーカブC100。足元を覆うレッグシールドと低い乗り口に注目", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Honda_super_cub%2
