 Z\" class=\"gfire\"/><circle cx=\"140\" cy=\"122\" r=\"7\" class=\"bx\"/><circle cx=\"172\" cy=\"136\" r=\"5\" class=\"bx\"/><circle cx=\"192\" cy=\"114\" r=\"4\" class=\"bx\"/><circle cx=\"155\" cy=\"146\" r=\"4\" class=\"bx\"/><line x1=\"160\" y1=\"178\" x2=\"168\" y2=\"140\" class=\"ln\"/><text x=\"160\" y=\"194\" text-anchor=\"middle\" class=\"sm\">溶接金属の中に残った気孔</text><text x=\"330\" y=\"40\" text-anchor=\"start\" class=\"tt\">主な原因</text><text x=\"330\" y=\"66\" text-anchor=\"start\" class=\"sm\">・シールドガスの不足、風で吹き飛ぶ</text><text x=\"330\" y=\"90\" text-anchor=\"start\" class=\"sm\">・母材の油・水分・さび（ガスの元）</text><text x=\"330\" y=\"114\" text-anchor=\"start\" class=\"sm\">・アルミでは水素（湿気）</text><text x=\"330\" y=\"150\" text-anchor=\"start\" class=\"tt ac\">対策</text><text x=\"330\" y=\"176\" text-anchor=\"start\" class=\"sm\">・ガス流量の管理と風よけ</text><text x=\"330\" y=\"200\" text-anchor=\"start\" class=\"sm\">・母材の脱脂・清掃・乾燥</text></svg>"}, "q-mweld-3": {"c": "アンダーカット（きわがえぐれる）とオーバーラップ（溶け合わずかぶさる）の違いを断面で見比べる", "svg": "<svg viewBox=\"0 0 600 220\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"75\" y=\"28\" text-anchor=\"middle\" class=\"tt\">アンダーカット</text><rect x=\"15\" y=\"110\" width=\"120\" height=\"40\" class=\"pst\"/><path d=\"M50 110 Q75 84 100 110 L95 128 Q75 136 55 128 Z\" class=\"gfire\"/><path d=\"M50 110 L41 110 L46 119 Z M100 110 L109 110 L104 119 Z\" class=\"bx\"/><line x1=\"30\" y1=\"76\" x2=\"44\" y2=\"108\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"75\" y=\"176\" text-anchor=\"middle\" class=\"sm\">ビードのきわの</text><text x=\"75\" y=\"192\" text-anchor=\"middle\" class=\"sm\">母材がえぐれて残る</text><text x=\"225\" y=\"28\" text-anchor=\"middle\" class=\"tt\">オーバーラップ</text><rect x=\"165\" y=\"110\" width=\"120\" height=\"40\" class=\"pst\"/><path d=\"M205 110 Q225 120 245 110 Z\" class=\"gfire\"/><path d=\"M205 110 C170 110 175 86 225 84 C275 86 280 110 245 110 Z\" class=\"gfire\"/><line x1=\"178\" y1=\"109\" x2=\"205\" y2=\"109\" class=\"ln thick\"/><line x1=\"245\" y1=\"109\" x2=\"272\" y2=\"109\" class=\"ln thick\"/><line x1=\"182\" y1=\"76\" x2=\"186\" y2=\"104\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"225\" y=\"176\" text-anchor=\"middle\" class=\"sm\">溶けた金属が母材に</text><text x=\"225\" y=\"192\" text-anchor=\"middle\" class=\"sm\">溶け合わずにかぶさる</text><text x=\"375\" y=\"28\" text-anchor=\"middle\" class=\"tt\">ブローホール</text><rect x=\"315\" y=\"110\" width=\"120\" height=\"40\" class=\"pst\"/><path d=\"M345 110 Q375 82 405 110 L398 136 Q375 146 352 136 Z\" class=\"gfire\"/><circle cx=\"364\" cy=\"112\" r=\"5\" class=\"bx\"/><circle cx=\"384\" cy=\"122\" r=\"4\" class=\"bx\"/><circle cx=\"378\" cy=\"104\" r=\"3\" class=\"bx\"/><line x1=\"410\" y1=\"76\" x2=\"388\" y2=\"118\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"375\" y=\"176\" text-anchor=\"middle\" class=\"sm\">ガスが抜けきれず</text><text x=\"375\" y=\"192\" text-anchor=\"middle\" class=\"sm\">内部に丸い空洞が残る</text><text x=\"525\" y=\"28\" text-anchor=\"middle\" class=\"tt\">溶け込み不足</text><rect x=\"465\" y=\"110\" width=\"57\" height=\"40\" class=\"pst\"/><rect x=\"528\" y=\"110\" width=\"57\" height=\"40\" class=\"pst\"/><path d=\"M505 110 Q525 88 545 110 L532 126 L518 126 Z\" class=\"gfire\"/><line x1=\"525\" y1=\"128\" x2=\"525\" y2=\"150\" class=\"ln thick\"/><line x1=\"560\" y1=\"170\" x2=\"527\" y2=\"142\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"525\" y=\"186\" text-anchor=\"middle\" class=\"sm\">裏側まで溶けず</text><text x=\"525\" y=\"202\" text-anchor=\"middle\" class=\"sm\">すき間（未溶着）が残る</text></svg>"}, "q-mweld-4": {"c": "溶接は母材も溶かすが、ろう付けは母材を溶かさず、ろう材だけをすき間に流し込む", "svg": "<svg viewBox=\"0 0 600 220\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><line x1=\"300\" y1=\"20\" x2=\"300\" y2=\"200\" class=\"ln dash\"/><text x=\"145\" y=\"36\" text-anchor=\"middle\" class=\"tt\">溶接</text><rect x=\"30\" y=\"100\" width=\"112\" height=\"40\" class=\"pst\"/><rect x=\"148\" y=\"100\" width=\"112\" height=\"40\" class=\"pst\"/><path d=\"M118 100 Q145 78 172 100 L160 140 L130 140 Z\" class=\"gfire\"/><text x=\"145\" y=\"172\" text-anchor=\"middle\" class=\"sm\">母材の一部も溶けて一体になる</text><text x=\"145\" y=\"190\" text-anchor=\"middle\" class=\"sm dim\">（母材の融点以上に加熱）</text><text x=\"450\" y=\"36\" text-anchor=\"middle\" class=\"tt\">ろう付け</text><rect x=\"330\" y=\"96\" width=\"170\" height=\"20\" class=\"pst\"/><rect x=\"400\" y=\"120\" width=\"170\" height=\"20\" class=\"pst\"/><rect x=\"400\" y=\"116\" width=\"100\" height=\"4\" class=\"gfire\"/><polygon points=\"500,116 500,120 512,120\" class=\"gfire\"/><polygon points=\"400,116 390,116 400,120\" class=\"gfire\"/><line x1=\"450\" y1=\"66\" x2=\"450\" y2=\"114\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"450\" y=\"58\" text-anchor=\"middle\" class=\"sm\">ろう材（母材より融点が低い）</text><text x=\"450\" y=\"172\" text-anchor=\"middle\" class=\"sm\">母材は溶かさず、ろう材だけを溶かす</text><text x=\"450\" y=\"190\" text-anchor=\"middle\" class=\"sm dim\">すき間に吸い込まれて広がる</text></svg>"}, "q-mweld-5": {"c": "溶接線に沿った方向の収縮で部品が反る様子。冷えて縮む金属を母材が引き止めて生じる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Welding_shrinkage_longitudinal.svg/500px-Welding_shrinkage_longitudinal.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Welding_shrinkage_longitudinal.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Welding_shrinkage_longitudinal.svg"}, "x-mweld-1": {"c": "ワイヤを送りながらシールドガスでアークを守るガスシールドアーク溶接の溶接部", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/GMAW_weld_area.svg/500px-GMAW_weld_area.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/GMAW_weld_area.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:GMAW_weld_area.svg"}, "x-mweld-2": {"c": "アンダーカットの実例。ビードのきわに沿って母材がえぐれた溝が残っている所を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Weld_Undercut.jpg/500px-Weld_Undercut.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Weld_Undercut.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Weld_Undercut.jpg"}, "x-mweld-3": {"c": "溶接割れが出る位置の図。溶接金属の中だけでなく、熱影響部やビードのきわにも割れが出る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Welding_cracks.svg/500px-Welding_cracks.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Welding_cracks.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Welding_cracks.svg"}, "x-mweld-4": {"c": "スポット溶接の動き。電極で板を挟んで電流を流し、点状のナゲットができる様子を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Spot_welding_1anim.gif/500px-Spot_welding_1anim.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Spot_welding_1anim.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Spot_welding_1anim.gif"}, "x-mweld-5": {"c": "溶接部が横方向に縮んで板が折れ曲がる様子。逆ひずみはこの曲がりを見込んで逆に曲げておく", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Welding_shrinkage_transverse.svg/500px-Welding_shrinkage_transverse.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Welding_shrinkage_transverse.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Welding_shrinkage_transverse.svg"}, "x-mweld-6": {"c": "外観は良品に見えても、切断した断面で初めて裏側の溶け込み不足がわかる例", "svg": "<svg viewBox=\"0 0 600 220\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"120\" y=\"36\" text-anchor=\"middle\" class=\"tt\">外観</text><rect x=\"30\" y=\"64\" width=\"180\" height=\"86\" class=\"pst\"/><rect x=\"100\" y=\"64\" width=\"40\" height=\"86\" rx=\"10\" class=\"gfire\"/><path d=\"M104 80 Q120 72 136 80 M104 96 Q120 88 136 96 M104 112 Q120 104 136 112 M104 128 Q120 120 136 128\" class=\"ln\"/><text x=\"120\" y=\"176\" text-anchor=\"middle\" class=\"sm\">外観は良品に見える</text><line x1=\"222\" y1=\"110\" x2=\"300\" y2=\"110\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"261\" y=\"98\" text-anchor=\"middle\" class=\"sm\">切って断面を見る</text><text x=\"450\" y=\"36\" text-anchor=\"middle\" class=\"tt\">断面（マクロ試験）</text><rect x=\"320\" y=\"90\" width=\"125\" height=\"50\" class=\"pst\"/><rect x=\"455\" y=\"90\" width=\"125\" height=\"50\" class=\"pst\"/><path d=\"M420 90 Q450 66 480 90 L462 112 L438 112 Z\" class=\"gfire\"/><line x1=\"450\" y1=\"114\" x2=\"450\" y2=\"140\" class=\"ln thick\"/><line x1=\"520\" y1=\"160\" x2=\"453\" y2=\"130\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"450\" y=\"176\" text-anchor=\"middle\" class=\"sm\">裏側まで溶けておらず、すき間が残る</text><text x=\"450\" y=\"194\" text-anchor=\"middle\" class=\"sm ac\">＝溶け込み不足</text></svg>"}, "q-mheat-1": {"c": "焼戻しの再加熱温度によって鋼の表面の酸化色が変わる様子。色が温度の目安になる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Tempering_colors_in_steel.jpg/500px-Tempering_colors_in_steel.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Tempering_colors_in_steel.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Tempering_colors_in_steel.jpg"}, "q-mheat-2": {"c": "アルマイトは酸化膜が素地から育つ処理。孔に染料を入れ、封孔処理で孔をふさぐ", "svg": "<svg viewBox=\"0 0 600 220\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"105\" y=\"30\" text-anchor=\"middle\" class=\"tt\">① 陽極酸化</text><rect x=\"20\" y=\"124\" width=\"170\" height=\"46\" class=\"pst\"/><rect x=\"20\" y=\"86\" width=\"170\" height=\"44\" class=\"gmix\"/><rect x=\"20\" y=\"86\" width=\"170\" height=\"44\" class=\"ln\"/><rect x=\"34\" y=\"86\" width=\"8\" height=\"36\" class=\"bx\"/><rect x=\"56\" y=\"86\" width=\"8\" height=\"36\" class=\"bx\"/><rect x=\"78\" y=\"86\" width=\"8\" height=\"36\" class=\"bx\"/><rect x=\"100\" y=\"86\" width=\"8\" height=\"36\" class=\"bx\"/><rect x=\"122\" y=\"86\" width=\"8\" height=\"36\" class=\"bx\"/><rect x=\"144\" y=\"86\" width=\"8\" height=\"36\" class=\"bx\"/><rect x=\"166\" y=\"86\" width=\"8\" height=\"36\" class=\"bx\"/><line x1=\"20\" y1=\"108\" x2=\"190\" y2=\"108\" class=\"ln dash\"/><text x=\"105\" y=\"74\" text-anchor=\"middle\" class=\"sm\">酸化膜（細かい孔）</text><text x=\"105\" y=\"154\" text-anchor=\"middle\" class=\"sm\">アルミ素地</text><text x=\"105\" y=\"192\" text-anchor=\"middle\" class=\"sm\">電解で酸化膜が素地から育つ</text><text x=\"105\" y=\"208\" text-anchor=\"middle\" class=\"sm dim\">点線＝元の表面</text><text x=\"300\" y=\"30\" text-anchor=\"middle\" class=\"tt\">② 染色</text><rect x=\"215\" y=\"124\" width=\"170\" height=\"46\" class=\"pst\"/><rect x=\"215\" y=\"86\" width=\"170\" height=\"44\" class=\"gmix\"/><rect x=\"215\" y=\"86\" width=\"170\" height=\"44\" class=\"ln\"/><rect x=\"229\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"251\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"273\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"295\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"317\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"339\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"361\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><text x=\"300\" y=\"74\" text-anchor=\"middle\" class=\"sm\">孔に染料が入る</text><text x=\"300\" y=\"192\" text-anchor=\"middle\" class=\"sm\">孔に色がしみ込む</text><text x=\"495\" y=\"30\" text-anchor=\"middle\" class=\"tt\">③ 封孔処理</text><rect x=\"410\" y=\"124\" width=\"170\" height=\"46\" class=\"pst\"/><rect x=\"410\" y=\"86\" width=\"170\" height=\"44\" class=\"gmix\"/><rect x=\"410\" y=\"86\" width=\"170\" height=\"44\" class=\"ln\"/><rect x=\"424\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"424\" y=\"86\" width=\"8\" height=\"7\" class=\"gmix\"/><rect x=\"446\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"446\" y=\"86\" width=\"8\" height=\"7\" class=\"gmix\"/><rect x=\"468\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"468\" y=\"86\" width=\"8\" height=\"7\" class=\"gmix\"/><rect x=\"490\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"490\" y=\"86\" width=\"8\" height=\"7\" class=\"gmix\"/><rect x=\"512\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"512\" y=\"86\" width=\"8\" height=\"7\" class=\"gmix\"/><rect x=\"534\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"534\" y=\"86\" width=\"8\" height=\"7\" class=\"gmix\"/><rect x=\"556\" y=\"86\" width=\"8\" height=\"36\" class=\"gfire\"/><rect x=\"556\" y=\"86\" width=\"8\" height=\"7\" class=\"gmix\"/><text x=\"495\" y=\"74\" text-anchor=\"middle\" class=\"sm\">孔の口をふさぐ</text><text x=\"495\" y=\"192\" text-anchor=\"middle\" class=\"sm\">色落ちを防ぎ</text><text x=\"495\" y=\"208\" text-anchor=\"middle\" class=\"sm\">耐食性を高める</text></svg>"}, "q-mheat-3": {"c": "表面硬化した鋼の断面に、表面から内部へ順に打ったビッカース硬さの圧痕。硬さ分布の測り方", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Case_hardened_steel-vickers_hardness_test.png/500px-Case_hardened_steel-vickers_hardness_test.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Case_hardened_steel-vickers_hardness_test.png?width=500", "p": "https://commons.wikimedia.org/wiki/File:Case_hardened_steel-vickers_hardness_test.png"}, "q-mheat-4": {"c": "塗装不良のタレ・ブツ・ハジキの断面イメージ。原因は膜厚・ごみ・汚れのそれぞれ", "svg": "<svg viewBox=\"0 0 600 220\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"100\" y=\"28\" text-anchor=\"middle\" class=\"tt\">タレ</text><rect x=\"60\" y=\"44\" width=\"20\" height=\"130\" class=\"pst\"/><path d=\"M80 44 L86 44 L86 100 Q100 118 90 128 L86 150 Q100 166 88 174 L80 174 Z\" class=\"oilf\"/><path d=\"M80 44 L86 44 L86 100 Q100 118 90 128 L86 150 Q100 166 88 174 L80 174\" class=\"ln\"/><line x1=\"120\" y1=\"90\" x2=\"120\" y2=\"150\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"140\" y=\"124\" text-anchor=\"start\" class=\"sm\">流れ</text><text x=\"100\" y=\"196\" text-anchor=\"middle\" class=\"sm\">厚塗り・粘度が低い</text><text x=\"100\" y=\"212\" text-anchor=\"middle\" class=\"sm dim\">→ 塗料が垂れる</text><text x=\"300\" y=\"28\" text-anchor=\"middle\" class=\"tt\">ブツ</text><rect x=\"220\" y=\"120\" width=\"160\" height=\"22\" class=\"pst\"/><rect x=\"220\" y=\"112\" width=\"160\" height=\"8\" class=\"oilf\"/><path d=\"M282 112 Q300 92 318 112 Z\" class=\"oilf\"/><circle cx=\"300\" cy=\"111\" r=\"6\" class=\"dot\"/><line x1=\"330\" y1=\"70\" x2=\"306\" y2=\"102\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"340\" y=\"66\" text-anchor=\"start\" class=\"sm\">ごみ</text><text x=\"300\" y=\"196\" text-anchor=\"middle\" class=\"sm\">ごみ・ほこりが入り</text><text x=\"300\" y=\"212\" text-anchor=\"middle\" class=\"sm dim\">→ 粒状に盛り上がる</text><text x=\"500\" y=\"28\" text-anchor=\"middle\" class=\"tt\">ハジキ</text><rect x=\"420\" y=\"120\" width=\"160\" height=\"22\" class=\"pst\"/><path d=\"M420 112 L478 112 Q486 106 488 120 L420 120 Z\" class=\"oilf\"/><path d=\"M582 112 L522 112 Q514 106 512 120 L582 120 Z\" class=\"oilf\"/><line x1=\"490\" y1=\"119\" x2=\"510\" y2=\"119\" class=\"ln thick\"/><line x1=\"500\" y1=\"70\" x2=\"500\" y2=\"114\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"500\" y=\"62\" text-anchor=\"middle\" class=\"sm\">油・シリコーン</text><text x=\"500\" y=\"196\" text-anchor=\"middle\" class=\"sm\">汚れで塗料がはじかれ</text><text x=\"500\" y=\"212\" text-anchor=\"middle\" class=\"sm dim\">→ 穴・へこみになる</text></svg>"}, "q-mheat-5": {"c": "焼割れは鋭い角などに応力が集中して起こる。急冷しすぎ・焼戻しの遅れも原因", "svg": "<svg viewBox=\"0 0 600 220\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><rect x=\"30\" y=\"50\" width=\"120\" height=\"120\" class=\"pst\"/><rect x=\"150\" y=\"80\" width=\"90\" height=\"60\" class=\"pst\"/><polyline points=\"150,80 141,92 147,101 137,113\" class=\"ln thick acs\"/><polyline points=\"150,140 141,128 147,119\" class=\"ln thick acs\"/><line x1=\"166\" y1=\"34\" x2=\"152\" y2=\"76\" class=\"ln\"/><text x=\"160\" y=\"26\" text-anchor=\"start\" class=\"sm\">鋭い角から割れる</text><line x1=\"60\" y1=\"200\" x2=\"60\" y2=\"176\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"110\" y1=\"200\" x2=\"110\" y2=\"176\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"195\" y1=\"200\" x2=\"195\" y2=\"146\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"205\" y=\"206\" text-anchor=\"start\" class=\"sm dim\">水・油で急冷</text><text x=\"290\" y=\"44\" text-anchor=\"start\" class=\"tt\">焼割れの原因</text><text x=\"290\" y=\"70\" text-anchor=\"start\" class=\"sm\">・急冷による表面と内部の温度差（熱応力）</text><text x=\"290\" y=\"92\" text-anchor=\"start\" class=\"sm\">・組織が変わるときの膨張（変態応力）</text><text x=\"290\" y=\"114\" text-anchor=\"start\" class=\"sm\">・鋭い角、急な肉厚変化に応力が集中</text><text x=\"290\" y=\"146\" text-anchor=\"start\" class=\"tt ac\">対策</text><text x=\"290\" y=\"172\" text-anchor=\"start\" class=\"sm\">・角に丸みをつける　・冷却剤を適正に</text><text x=\"290\" y=\"194\" text-anchor=\"start\" class=\"sm\">・焼入れ後すぐに焼戻す</text></svg>"}, "x-mheat-1": {"c": "冷やす速さで鋼の組織が変わる図（CCT曲線）。速く冷やすと硬いマルテンサイトになる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/CCT_curve_steel.svg/500px-CCT_curve_steel.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/CCT_curve_steel.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:CCT_curve_steel.svg"}, "x-mheat-2": {"c": "焼入れは急冷、焼なましは炉の中でゆっくり冷やす。冷やす速さの違いを線の傾きで見る", "sv 良率 →</text></svg>"}, "x-minsp-6": {"c": "超音波が裏面で反射して戻るまでの時間から厚さを求める。探触子との間に接触媒質を使う", "svg": "<svg viewBox=\"0 0 600 220\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><rect x=\"40\" y=\"80\" width=\"220\" height=\"90\" class=\"pst\"/><rect x=\"110\" y=\"50\" width=\"40\" height=\"26\" class=\"bx\"/><rect x=\"110\" y=\"76\" width=\"40\" height=\"4\" class=\"oilf\"/><line x1=\"124\" y1=\"82\" x2=\"124\" y2=\"166\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"136\" y1=\"166\" x2=\"136\" y2=\"84\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"156\" y=\"62\" text-anchor=\"start\" class=\"sm\">探触子</text><text x=\"160\" y=\"76\" text-anchor=\"start\" class=\"sm dim\">接触媒質</text><text x=\"130\" y=\"192\" text-anchor=\"middle\" class=\"sm\">裏面で反射して戻る</text><line x1=\"275\" y1=\"82\" x2=\"275\" y2=\"168\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"282\" y=\"130\" text-anchor=\"start\" class=\"sm\">厚さ</text><text x=\"455\" y=\"40\" text-anchor=\"middle\" class=\"tt\">画面の波形</text><rect x=\"330\" y=\"50\" width=\"250\" height=\"120\" class=\"bx\"/><line x1=\"340\" y1=\"150\" x2=\"570\" y2=\"150\" class=\"ln\"/><line x1=\"352\" y1=\"150\" x2=\"352\" y2=\"66\" class=\"ln thick\"/><line x1=\"500\" y1=\"150\" x2=\"500\" y2=\"88\" class=\"ln thick acs\"/><line x1=\"356\" y1=\"136\" x2=\"496\" y2=\"136\" class=\"ln\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><text x=\"426\" y=\"128\" text-anchor=\"middle\" class=\"sm\">往復時間</text><text x=\"352\" y=\"164\" text-anchor=\"middle\" class=\"sm\">送信</text><text x=\"500\" y=\"164\" text-anchor=\"middle\" class=\"sm\">裏面エコー</text><text x=\"455\" y=\"196\" text-anchor=\"middle\" class=\"tt\">厚さ＝音速×往復時間÷2</text></svg>"}};
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   APEX — バイク知識クイズ エンジン
   ・コンテンツ：window.APEX_DATA = { units, q, ox, gl }
   ・記録：localStorage（この端末のみ）
   ═══════════════════════════════════════════════════════════ */
const VERSION='2026-10-25g';
const LS={ get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } },
           set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ toast('保存できませんでした',true); return false; } } };
const K={ hist:'ap_hist', ox:'ap_ox', keep:'ap_keep', exams:'ap_exams', imports:'ap_imports', set:'ap_set', last:'ap_last' };

const FIELDS={
  engine: { name:'エンジン・駆動系', icon:'🔧', color:'var(--f-engine)' },
  chassis:{ name:'車体・足まわり',   icon:'🛞', color:'var(--f-chassis)' },
  maint:  { name:'電装・整備・法規', icon:'🛠', color:'var(--f-maint)' },
  mfg:    { name:'製造・加工',       icon:'🏭', color:'var(--f-mfg)' },
  kawa:   { name:'Kawasaki',         icon:'🟢', color:'var(--f-kawa)' },
  history:{ name:'歴史・レース・文化', icon:'📜', color:'var(--f-history)' }
};
const FORDER=['engine','chassis','maint','mfg','kawa','history'];
const MARK=['1','2','3','4'];
const LV=['','★','★★','★★★'];
const RANKS=[
  { n:0,   ic:'🔰', name:'ビギナー',         d:'まずは1問から' },
  { n:10,  ic:'🛵', name:'見習いライダー',   d:'基本のことばに慣れてきた' },
  { n:30,  ic:'🏍️', name:'ツーリングライダー', d:'仕組みが話せるようになってきた' },
  { n:60,  ic:'🔧', name:'メカニック',       d:'部品の役割と理由が説明できる' },
  { n:90,  ic:'🏁', name:'エキスパート',     d:'歴史もメカも語れる' },
  { n:120, ic:'🏆', name:'バイク博士',       d:'職場のバイク博士' }
];

const D=window.APEX_DATA||{units:[],q:[],ox:[],gl:{}};
const UNITS_=D.units; const UMAP={}; UNITS_.forEach(u=>UMAP[u.id]=u);
let ALLQ=[], QMAP={};

function settings(){ return Object.assign({ shuffle:true, testN:30, testMin:30 }, LS.get(K.set,{})); }

function normQ(q,src){
  const o=Object.assign({},q); o.src=src;
  o.ans=(typeof q.answer==='number')? q.answer-1 : 0;
  if(!o.field && o.unit && UMAP[o.unit]) o.field=UMAP[o.unit].field;
  if(!FIELDS[o.field]) o.field='engine';
  o.why=o.why||[]; o.lv=o.lv||1;
  return o;
}
function rebuild(){
  ALLQ=(D.q||[]).map(q=>normQ(q,'orig'));
  LS.get(K.imports,[]).forEach(q=>ALLQ.push(normQ(q,'imp')));
  QMAP={}; ALLQ.forEach(q=>QMAP[q.id]=q);
}

/* ── 用語集：本文の用語をタップで説明 ── */
let GL_RE=null;
function glInit(){ const t=Object.keys(D.gl||{}).filter(x=>x.length>=2).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); GL_RE=t.length?new RegExp(t.join('|'),'g'):null; }
function gl(html){ if(!GL_RE||!html) return html; const seen=new Set();
  let inSvg=0;
  return String(html).split(/(<[^>]+>)/).map(p=>{ if(p.charAt(0)==='<'){ if(/^<svg[\s>]/i.test(p)) inSvg++; else if(/^<\/svg>/i.test(p)) inSvg=Math.max(0,inSvg-1); return p; }
    return inSvg? p : p.replace(GL_RE,m=>{ if(seen.has(m)) return m; seen.add(m); return '<span class="gl" data-g="'+m+'">'+m+'</span>'; }); }).join(''); }
function glo(term){ const e=(D.gl||{})[term]; if(!e) return;
  document.getElementById('glo-t').innerHTML=esc(term)+' '+(FIELDS[e.f]?fchip(e.f):'');
  document.getElementById('glo-b').innerHTML='<p>'+esc(e.d)+'</p>'+(e.p?plainBox(esc(e.p),'わかりやすく言うと'):'')+(e.t?tatoeBox(esc(e.t),false):'')+(MECH[e.f]? qiHTML(qiForTerm(term)) : phHTML(IMG.kw[term]||kwKey([term]),'one'))+((e.rel&&e.rel.length)?'<div class="glo-rel">関連：'+e.rel.filter(r=>D.gl[r]).map(r=>'<span class="gl" data-g="'+esc(r)+'">'+esc(r)+'</span>').join('　')+'</div>':'');
  document.getElementById('glo').classList.add('show'); }
document.addEventListener('click',ev=>{ const s=ev.target.closest&&ev.target.closest('.gl'); if(s){ ev.preventDefault(); ev.stopPropagation(); glo(s.dataset.g); } },true);

/* ── ○×：問題の各肢（polarity付き）＋オリジナル一問一答 ── */
function stmtsOf(q){
  if(q.polarity!=='correct'&&q.polarity!=='wrong') return [];
  return q.choices.map((c,i)=>({ key:q.id+'#c'+i, qid:q.id, t:c, ok:q.polarity==='correct'? i===q.ans : i!==q.ans, why:q.why[i]||'', field:q.field, unit:q.unit, tatoe:q.tatoe||'' }));
}
function extraOX(){ return (D.ox||[]).map(e=>({ key:'x#'+e.id, qid:null, x:1, field:(UMAP[e.unit]||{}).field||'engine', unit:e.unit, t:e.t, ok:!!e.ok, why:e.why||'', plain:e.p||'', tatoe:e.tt||'' })); }
function allOX(){ return [].concat(...ALLQ.map(stmtsOf)).concat(extraOX()); }

/* ── 記録 ── */
function hist(){ return LS.get(K.hist,{}); }
function recQ(qid,ok){ const h=hist(); const r=h[qid]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok?1:0; r.t=Date.now(); h[qid]=r; LS.set(K.hist,h); }
function oxh(){ return LS.get(K.ox,{}); }
function recOX(key,ok){ const h=oxh(); const r=h[key]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok?1:0; r.t=Date.now(); h[key]=r; LS.set(K.ox,h); }
function keeps(){ return LS.get(K.keep,{}); }
function isKept(id){ return !!keeps()[id]; }
function toggleKeep(id,btn){ const k=keeps(); if(k[id]) delete k[id]; else k[id]=Date.now(); LS.set(K.keep,k); if(btn){ btn.classList.toggle('on',!!k[id]); btn.textContent=k[id]?'★ キープ中':'☆ キープ'; } }
function fieldStats(field){ const h=hist(); let c=0,tried=0,total=0; ALLQ.forEach(q=>{ if(field&&q.field!==field) return; total++; const r=h[q.id]; if(r){ tried++; c+=r.last; } }); return {tried,total,rate:tried?c/tried:null}; }
function unitStats(uid){ const h=hist(); let tried=0,ok=0; const qs=ALLQ.filter(q=>q.unit===uid); qs.forEach(q=>{ const r=h[q.id]; if(r){ tried++; ok+=r.last; } }); return {total:qs.length,tried,ok}; }
/* 称号：「一度でも正解した問題」＋「○×で正解した肢÷4」でポイント化 */
function mastery(){ const h=hist(), o=oxh(); const q=ALLQ.filter(x=>h[x.id]&&h[x.id].c>0).length; const x=Object.keys(o).filter(k=>o[k].c>0).length; return q+Math.floor(x/4); }
function rankOf(p){ let r=RANKS[0]; RANKS.forEach(x=>{ if(p>=x.n) r=x; }); return r; }
function nextRank(p){ return RANKS.find(x=>x.n>p)||null; }

/* ── 汎用 ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rich(s){ return String(s==null?'':s).replace(/\n/g,'<br>'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pct(x){ return x==null?'—':Math.round(x*100)+'%'; }
function fchip(f){ return '<span class="chip '+f+'">'+FIELDS[f].icon+' '+FIELDS[f].name+'</span>'; }
function srcLabel(q){ return q.src==='imp'? '取り込み' : 'オリジナル'; }
function toast(m,err){ const t=document.getElementById('toast'); t.textContent=m; t.className='show'+(err?' err':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='',2400); }
function $c(){ return document.getElementById('content'); }
function openModal(title,html){ document.getElementById('modal-title').textContent=title; document.getElementById('modal-body').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
let ASK_CB=null;
function ask(msg,cb){ ASK_CB=cb; openModal('確認','<p style="font-size:14px;margin-bottom:16px">'+esc(msg)+'</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn p" onclick="closeModal();const f=ASK_CB;ASK_CB=null;f&&f()">OK</button></div>'); }
function fmtTime(s){ s=Math.max(0,s); const m=Math.floor(s/60), ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
function fmtDate(t){ const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
function jsq(v){ return esc(JSON.stringify(v)); }

/* 選択肢の並び替え（表示順→元の番号） */
let PERM={};
function permOf(q){ if(!settings().shuffle) return [0,1,2,3].slice(0,q.choices.length); if(!PERM[q.id]) PERM[q.id]=shuffle(q.choices.map((_,i)=>i)); return PERM[q.id]; }


/* ═══════════ 写真（Wikipediaから自動取得）・図解 ═══════════ */
const IMG=window.APEX_IMG||{map:{},units:{},kw:{}};
const FIGS=window.APEX_FIGS||{};
let KW_RE=null;
(function(){ const k=Object.keys(IMG.kw||{}).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); KW_RE=k.length?new RegExp(k.join('|')):null; })();
function photosOn(){ return settings().photos!==false; }
function kwKey(texts){ if(!KW_RE) return null; for(const t of texts){ const m=String(t||'').replace(/<[^>]+>/g,'').match(KW_RE); if(m) return IMG.kw[m[0]]; } return null; }
function phHTML(key,cls){ if(!photosOn()||!key||!IMG.map[key]) return ''; return '<figure class="ph wait '+(cls||'')+'" data-k="'+esc(key)+'"></figure>'; }
function figsHTML(uid){ return (FIGS[uid]||[]).map(f=>'<div class="figbox"><div class="ft">📐 '+esc(f.t)+'</div>'+(f.svg?'<div class="fsv">'+f.svg+'</div><div class="zoomhint">🔍 タップで拡大</div>':f.html)+'</div>').join(''); }
const IMC={}; const IMG_TTL=30*864e5;
function imCache(){ return LS.get('ap_imgc',{}); }
async function fetchSpec(spec){
  const i=spec.indexOf(':'); const lang=spec.slice(0,i), title=spec.slice(i+1);
  const url='https://'+lang+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|info&inprop=url&piprop=thumbnail|name&pithumbsize=640&pilicense=free&titles='+encodeURIComponent(title);
  const r=await fetch(url); if(!r.ok) throw new Error('http');
  const j=await r.json(); const pg=Object.values((j.query||{}).pages||{})[0];
  if(!pg||pg.missing!==undefined||!pg.thumbnail) return null;
  return { src:pg.thumbnail.source, page:pg.fullurl, file:pg.pageimage||'', lang };
}
function resolveKey(key){
  if(IMC[key]) return IMC[key];
  const c=imCache()[key]; if(c && Date.now()-c.t<IMG_TTL) return (IMC[key]=Promise.resolve(c.v));
  IMC[key]=(async()=>{ let net=true;
    for(const spec of String(IMG.map[key]||'').split('|').filter(Boolean)){
      try{ const v=await fetchSpec(spec); if(v){ const m=imCache(); m[key]={v,t:Date.now()}; LS.set('ap_imgc',m); return v; } }catch(e){ net=false; }
    }
    if(net){ const m=imCache(); m[key]={v:null,t:Date.now()-IMG_TTL+3*864e5}; LS.set('ap_imgc',m); } else delete IMC[key];
    return null; })();
  return IMC[key];
}
function hydratePhotos(){
  document.querySelectorAll('figure.ph.wait:not([data-busy])').forEach(fg=>{
    fg.dataset.busy='1'; const key=fg.dataset.k;
    resolveKey(key).then(v=>{
      if(!v){ fg.remove(); return; }
      const commons=v.file? 'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(v.file) : v.page;
      fg.classList.remove('wait');
      fg.innerHTML='<img loading="lazy" decoding="async" alt="'+esc(key)+'" src="'+esc(v.src)+'"><figcaption><b>'+esc(key)+'</b>　出典：<a href="'+esc(v.page)+'" target="_blank" rel="noopener">Wikipedia</a> ／ <a href="'+esc(commons)+'" target="_blank" rel="noopener">画像の情報</a></figcaption>';
      const im=fg.querySelector('img'); im.onerror=()=>fg.remove();
    }).catch(()=>fg.remove());
  });
}
let _hyT=null;
new MutationObserver(()=>{ clearTimeout(_hyT); _hyT=setTimeout(hydratePhotos,0); }).observe(document.body,{childList:true,subtree:true});

/* ── 問題ごとの画像（Commons）：解く前に裏で先読み ── */
const QI=window.APEX_QIMG||{};
function qiOf(it){ if(!it) return null; if(it.id&&QI[it.id]) return QI[it.id]; if(it.x&&it.key){ const id=String(it.key).replace(/^x#/,''); if(QI[id]) return QI[id]; } if(it.qid&&QI[it.qid]) return QI[it.qid]; return null; }
const PRE=new Map();
function preloadQI(e){ if(!e||!e.u||!photosOn()||PRE.has(e.u)) return; const im=new Image(); im.decoding='async'; im.onerror=()=>{ if(e.u2&&im.src!==e.u2) im.src=e.u2; }; im.src=e.u; PRE.set(e.u,im); if(PRE.size>80){ PRE.delete(PRE.keys().next().value); } }
function preloadIds(ids){ ids.forEach(id=>{ const q=QMAP[id]; if(q) preloadQI(qiOf(q)); }); }
function qiHTML(e){ if(!e||!photosOn()) return '';
  if(e.svg) return '<div class="figbox" style="margin-top:12px"><div class="ft">📐 '+esc(e.c)+'</div><div class="fsv">'+e.svg+'</div><div class="zoomhint">🔍 タップで拡大</div></div>';
  const im=PRE.get(e.u); const src=(im&&im.complete&&im.naturalWidth&&im.currentSrc)||e.u;
  return '<figure class="ph one"><img alt="'+esc(e.c)+'" src="'+esc(src)+'" onerror="if(this.dataset.f){this.closest(\'figure\').remove()}else{this.dataset.f=1;this.src=\''+esc(e.u2)+'\'}"><figcaption><b>'+esc(e.c)+'</b>　出典：<a href="'+esc(e.p)+'" target="_blank" rel="noopener">Wikimedia Commons</a></figcaption></figure>'; }
/* 単元の写真・用語の写真：起動直後に記事情報をまとめて取得（50件ずつ） */
async function batchResolve(){
  if(!photosOn()) return; const cache=imCache(); const todo=Object.keys(IMG.map).filter(k=>!(cache[k]&&Date.now()-cache[k].t<IMG_TTL));
  for(let level=0; level<3 && todo.length; level++){
    const byLang={};
    todo.forEach(k=>{ const sp=String(IMG.map[k]).split('|')[level]; if(!sp) return; const i=sp.indexOf(':'); const L=sp.slice(0,i), T=sp.slice(i+1); (byLang[L]=byLang[L]||[]).push([k,T]); });
    const done=new Set();
    for(const L in byLang){ const arr=byLang[L];
      for(let i=0;i<arr.length;i+=50){ const chunk=arr.slice(i,i+50);
        try{
          const url='https://'+L+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|info&inprop=url&piprop=thumbnail|name&pithumbsize=640&pilicense=free&titles='+encodeURIComponent(chunk.map(c=>c[1]).join('|'));
          const j=await (await fetch(url)).json(); const Q=j.query||{}; const nm={};
          (Q.normalized||[]).forEach(n=>nm[n.from]=n.to); (Q.redirects||[]).forEach(n=>nm[n.from]=n.to);
          const byTitle={}; Object.values(Q.pages||{}).forEach(pg=>byTitle[pg.title]=pg);
          const m=imCache();
          chunk.forEach(([k,T])=>{ let t=T; for(let z=0;z<3&&nm[t];z++) t=nm[t]; const pg=byTitle[t];
            if(pg&&pg.thumbnail){ const v={src:pg.thumbnail.source,page:pg.fullurl,file:pg.pageimage||'',lang:L}; m[k]={v,t:Date.now()}; IMC[k]=Promise.resolve(v); done.add(k); } });
          LS.set('ap_imgc',m);
        }catch(e){ return; }
      } }
    for(let i=todo.length-1;i>=0;i--) if(done.has(todo[i])) todo.splice(i,1);
  }
}
const MECH={engine:1,chassis:1,maint:1,mfg:1};
function unitQI(uid){ const out=[]; const seen=new Set(); const add=e=>{ if(e&&!seen.has(e.u||e.svg)){ seen.add(e.u||e.svg); out.push(e); } };
  ALLQ.filter(q=>q.unit===uid).forEach(q=>add(qiOf(q))); (D.ox||[]).filter(x=>x.unit===uid).forEach(x=>add(QI[x.id])); return out; }
function qiStrip(uid){ if(!photosOn()) return ''; return unitQI(uid).filter(e=>e.u).slice(0,8).map(e=>'<figure class="ph"><img alt="'+esc(e.c)+'" src="'+esc(e.u)+'" onerror="if(this.dataset.f){this.closest(\'figure\').remove()}else{this.dataset.f=1;this.src=\''+esc(e.u2)+'\'}"><figcaption>'+esc(e.c)+'　<a href="'+esc(e.p)+'" target="_blank" rel="noopener">出典</a></figcaption></figure>').join(''); }
function qiForTerm(term){ for(const q of ALLQ){ if(q.src!=='orig') continue; if((q.stem+q.choices[q.ans]).includes(term)&&qiOf(q)) return qiOf(q); }
  for(const x of (D.ox||[])) if(x.t.includes(term)&&QI[x.id]) return QI[x.id];
  for(const q of ALLQ) if((q.exp||'').includes(term)&&qiOf(q)) return qiOf(q); return null; }
function unitPreload(uid){ if(!photosOn()) return; ALLQ.filter(q=>q.unit===uid).forEach(q=>preloadQI(qiOf(q))); (D.ox||[]).filter(x=>x.unit===uid).forEach(x=>preloadQI(QI[x.id])); }

/* state: {sel(元の番号), reveal, mode:'practice'|'exam'|'view'} */
function qBody(q,state){
  const perm=permOf(q);
  let h='<div class="qcard"><div class="qmeta">'+fchip(q.field)+(q.unit&&UMAP[q.unit]?'<span class="chip gray">'+esc(UMAP[q.unit].title)+'</span>':'')+'<span class="chip lv">'+LV[q.lv]+'</span>'+(q.src==='imp'?'<span class="chip imp">取り込み</span>':'')+'</div>';
  h+='<div class="qq">'+gl(rich(q.stem))+'</div>';
  if(q.plain && state.mode!=='exam') h+=plainBox(q.plain,'わかりやすく言うと（何を聞いている？）');
  h+='<div class="choices">';
  perm.forEach((oi,di)=>{
    let cls='choice';
    if(state.reveal){ if(oi===q.ans) cls+=' ok'; else if(oi===state.sel) cls+=' ng'; }
    else if(oi===state.sel) cls+=' sel';
    const on = state.mode==='practice'? 'answerP('+oi+')' : state.mode==='exam'? 'exPick('+oi+')' : '';
    h+='<button class="'+cls+'" '+(state.reveal||state.mode==='view'?'disabled':'')+' onclick="'+on+'"><span class="ck">'+MARK[di]+'</span><span>'+gl(rich(q.choices[oi]))+'</span></button>';
    if(state.reveal && q.why[oi]){ const tf=stmtTruth(q,oi); h+='<div class="cwhy">'+(tf==null?(oi===q.ans?'<b class="o">✓ 正解</b>　':''):'<b class="'+(tf?'o':'x')+'">'+(tf?'○ 正しい':'× 誤り')+'</b>　')+gl(rich(q.why[oi]))+'</div>'; }
  });
  h+='</div></div>';
  if(state.reveal){ const ok=state.sel===q.ans; const dpos=perm.indexOf(q.ans);
    h+='<div class="fb '+(state.sel==null?'ng':ok?'ok':'ng')+'"><div class="fb-h">'+(state.sel==null?'わからない':ok?'正解！':'不正解')+'　正解は <b>'+MARK[dpos]+'</b></div><div class="fb-body">'+gl(rich(q.exp||''))+(q.tatoe?tatoeBox(q.tatoe,false):'')+qiHTML(qiOf(q))+'</div></div>'; }
  return h;
}

function testGo(kind){
  const h=hist(); const pick=(arr,n)=>{ const p=shuffle(arr); p.sort((a,b)=>(h[a.id]?1:0)-(h[b.id]?1:0)); return p.slice(0,n); };
  let qs=[], min, title;
  if(kind==='full'){ FORDER.forEach(f=>qs=qs.concat(pick(ALLQ.filter(q=>q.field===f),5))); min=30; title='検定チャレンジ（本番）'; }
  else if(kind==='mini'){ FORDER.forEach(f=>qs=qs.concat(pick(ALLQ.filter(q=>q.field===f),2))); min=12; title='検定チャレンジ（ミニ）'; }
  else if(kind==='kawa'){ qs=pick(ALLQ.filter(q=>q.field==='kawa'),20); min=20; title='Kawasaki検定'; }
  else { qs=pick(ALLQ.filter(q=>q.lv===3),15); min=20; title='上級チャレンジ'; }
  if(!qs.length){ toast('問題がありません',true); return; }
  qs=shuffle(qs); min=Math.max(3,Math.round(min*Math.min(1,qs.length/({full:30,mini:12,kawa:20,hard:15}[kind]))));
  startExam(qs.map(q=>q.id),title,min);
}

  let html='<div class="wrap"><h2 class="pg">📖 用語集</h2><div class="pg-sub">'+all.length+'語。タップで「わかりやすく言うと」「例えるなら」も表示。解説文中の点線の語も同じように開けます。</div>';
  html+='<input class="gsearch" id="gsearch" placeholder="🔍 用語を検索（例：トルク、ABS、Z1）" value="'+esc(glQ)+'" oninput="glQ=this.value;drawGlList()">';
  html+='<div class="seg" style="margin:12px 0 16px">'+[['all','すべて']].concat(FORDER.map(f=>[f,FIELDS[f].icon+' '+FIELDS[f].name])).map(s=>'<button class="'+(glF===s[0]?'on':'')+'" onclick="glF=\''+s[0]+'\';renderGlossary()">'+s[1]+'</button>').join('')+'</div><div id="gl-list"></div></div>';
  $c().innerHTML=html; drawGlList();
}
function drawGlList(){
  const q=glQ.trim().toLowerCase();
  const items=Object.keys(D.gl||{}).filter(t=>{ const e=D.gl[t]; if(glF!=='all'&&e.f!==glF) return false; if(!q) return true; return (t+e.d+(e.p||'')).toLowerCase().includes(q); }).sort((a,b)=>a.localeCompare(b,'ja'));
  document.getElementById('gl-list').innerHTML=items.length? '<div class="gl-list">'+items.map(t=>'<button class="gl-item" onclick="glo('+jsq(t)+')"><b>'+esc(t)+'</b><div class="gd">'+esc(D.gl[t].d)+'</div></button>').join('')+'</div>' : '<div class="empty">見つかりませんでした。</div>';
}

/* ═══════════ 設定・取り込み・バックアップ ═══════════ */
function renderSettings(){
  const st=settings(); const imp=LS.get(K.imports,[]);
  let html='<div class="wrap"><h2 class="pg">⚙︎ 設定</h2><div class="pg-sub">記録はこの端末のブラウザにだけ保存されます。機種変更の前にバックアップを。</div>';
  html+='<div class="sec-h">表示</div><label class="ck"><input type="checkbox" '+(st.shuffle?'checked':'')+' onchange="saveSet({shuffle:this.checked})"> 選択肢の順番を毎回シャッフルする（答えの位置を覚えてしまうのを防ぐ）</label><br><label class="ck" style="margin-top:8px"><input type="checkbox" '+(st.photos!==false?'checked':'')+' onchange="saveSet({photos:this.checked})"> 写真を表示する（Wikipediaから取得。通信量を抑えたいときはオフ）</label><div class="row" style="margin-top:8px"><button class="btn sm" onclick="try{localStorage.removeItem(\'ap_imgc\')}catch(e){};toast(\'写真の記録を消しました\')">写真を取り直す</button></div>';
  html+='<div class="sec-h">問題の取り込み（自作・Claudeで追加作成した問題）</div><div class="pg-sub" style="margin-bottom:10px">JSON配列を貼り付けて「取り込む」。形式：<code>[{"id":"my-1","unit":"kninja","lv":2,"stem":"…","choices":["…","…","…","…"],"answer":1,"why":["…","…","…","…"],"exp":"…","plain":"…","tatoe":"…"}]</code>　unit は既存単元のID。現在 '+imp.length+'問 取り込み済み。</div>';
  html+='<textarea class="imp" id="imp-in" placeholder="[ { … }, { … } ]"></textarea><div class="row" style="margin-top:10px"><button class="btn p" onclick="doImport()">取り込む</button>'+(imp.length?'<button class="btn danger" onclick="clearImport()">取り込んだ問題を全削除</button>':'')+'<button class="btn" onclick="showUnitIds()">単元IDの一覧</button></div><div class="imp-msg" id="imp-msg"></div>';
  html+='<div class="sec-h">バックアップ</div><div class="row"><button class="btn" onclick="backup()">⬇ 記録を書き出す（JSON）</button><label class="btn">⬆ 読み込む<input type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></label></div>';
  html+='<div class="sec-h">リセット</div><div class="row"><button class="btn danger" onclick="resetRec()">解答記録をすべて消す</button></div>';
  html+='<div class="pg-sub" style="margin-top:28px">APEX '+VERSION+'　収録：単元 '+UNITS_.length+'・4択 '+(D.q||[]).length+'・○× '+allOX().length+'・用語 '+Object.keys(D.gl||{}).length+'</div></div>';
  $c().innerHTML=html;
}
function saveSet(o){ LS.set(K.set,Object.assign(settings(),o)); toast('保存しました'); }
function showUnitIds(){ openModal('単元IDの一覧','<table class="hist">'+UNITS_.map(u=>'<tr><td><code>'+u.id+'</code></td><td>'+fchip(u.field)+'</td><td>'+esc(u.title)+'</td></tr>').join('')+'</table>'); }
function doImport(){
  const m=document.getElementById('imp-msg'); let arr;
  try{ arr=JSON.parse(document.getElementById('imp-in').value); if(!Array.isArray(arr)) arr=[arr]; }catch(e){ m.className='imp-msg err'; m.textContent='JSONとして読めません：'+e.message; return; }
  const errs=[]; const ok=[];
  arr.forEach((q,i)=>{ const e=[]; if(!q.id) e.push('id'); if(!q.stem) e.push('stem'); if(!Array.isArray(q.choices)||q.choices.length<2) e.push('choices'); if(!(q.answer>=1&&q.answer<=(q.choices||[]).length)) e.push('answer'); if(q.unit&&!UMAP[q.unit]) e.push('unit「'+q.unit+'」が存在しない'); if(!q.unit&&!FIELDS[q.field]) e.push('unit か field'); if(e.length) errs.push((i+1)+'問目：'+e.join('・')); else ok.push(q); });
  if(errs.length){ m.className='imp-msg err'; m.textContent='取り込めない問題があります\n'+errs.join('\n'); return; }
  const cur=LS.get(K.imports,[]).filter(x=>!ok.some(y=>y.id===x.id)); const base=new Set((D.q||[]).map(q=>q.id));
  ok.forEach(q=>{ if(base.has(q.id)) q.id='imp-'+q.id; });
  LS.set(K.imports,cur.concat(ok)); rebuild(); m.className='imp-msg ok'; m.textContent=ok.length+'問を取り込みました。'; renderSidebar();
}
function clearImport(){ ask('取り込んだ問題をすべて削除しますか？',()=>{ LS.set(K.imports,[]); rebuild(); renderSettings(); renderSidebar(); }); }
function backup(){ const data={ app:'APEX', v:VERSION, t:Date.now() }; Object.values(K).forEach(k=>data[k]=LS.get(k,null)); const b=new Blob([JSON.stringify(data)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='apex-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); }
function restore(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!=='APEX') throw new Error('APEXのバックアップではありません'); Object.values(K).forEach(k=>{ if(d[k]!=null) LS.set(k,d[k]); }); rebuild(); toast('読み込みました'); go('home'); }catch(e){ toast('読み込めません：'+e.message,true); } }; r.readAsText(f); }
function resetRec(){ ask('解答記録・○×記録・検定履歴・キープをすべて消します。よろしいですか？',()=>{ [K.hist,K.ox,K.exams,K.keep].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); toast('消去しました'); go('home'); }); }

/* ═══════════ 起動 ═══════════ */
rebuild(); glInit(); LAST_RANK=rankOf(mastery());
(window.requestIdleCallback||setTimeout)(()=>batchResolve());
renderSidebar();
try{ history.replaceState({},''); }catch(e){}
go('home');
</script>
</body>
</html>
