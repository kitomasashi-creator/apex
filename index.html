ile:BMW_K_100_RS-1.JPG"}, "x-hculture-5": {"c": "手を挙げてあいさつするライダー。ヤエーは義務ではなく、安全に余裕があるときだけ返す", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Waving_from_motorcycle_on_open_road.jpg/500px-Waving_from_motorcycle_on_open_road.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Waving_from_motorcycle_on_open_road.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Waving_from_motorcycle_on_open_road.jpg"}, "x-hculture-6": {"c": "YZF-R1。高いシートと後ろ寄りのステップで前傾して乗るのがSS。足を前に出すのはクルーザー", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Yamaha_YZF-R1_SP.jpg/500px-Yamaha_YZF-R1_SP.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Yamaha_YZF-R1_SP.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Yamaha_YZF-R1_SP.jpg"}, "q-kroots-1": {"c": "1878年に東京・築地で川崎築地造船所を開いた創業者・川崎正蔵の肖像", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/KAWASAKI_Shozo.jpg/500px-KAWASAKI_Shozo.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/KAWASAKI_Shozo.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:KAWASAKI_Shozo.jpg"}, "q-kroots-2": {"c": "株式会社川崎造船所の初代社長・松方幸次郎。創業者の川崎正蔵とは別人である", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Kojiro_Matsukata.jpg/500px-Kojiro_Matsukata.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kojiro_Matsukata.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kojiro_Matsukata.jpg"}, "q-kroots-3": {"c": "明石工場の入口。2021年10月発足のカワサキモータースはこの明石に本社を置く", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Kawasaki_Heavy_Industries_Akashi_Factory_Entrance.jpg/500px-Kawasaki_Heavy_Industries_Akashi_Factory_Entrance.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Heavy_Industries_Akashi_Factory_Entrance.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Heavy_Industries_Akashi_Factory_Entrance.jpg"}, "q-kroots-4": {"c": "神戸工場で建造された液化水素運搬船。グループの主力は船舶・鉄道・航空などで、乗用車ではない", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/SUISO_FRONTIER_left_rear_view_at_Kawasaki_Heavy_Industries_Kobe_Shipyard_October_18%2C_2020_02.jpg/500px-SUISO_FRONTIER_left_rear_view_at_Kawasaki_Heavy_Industries_Kobe_Shipyard_October_18%2C_2020_02.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/SUISO_FRONTIER_left_rear_view_at_Kawasaki_Heavy_Industries_Kobe_Shipyard_October_18%2C_2020_02.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:SUISO_FRONTIER_left_rear_view_at_Kawasaki_Heavy_Industries_Kobe_Shipyard_October_18%2C_2020_02.jpg"}, "q-kroots-5": {"c": "Ninja H2の正面。カウル上部に付く「川」の形のリバーマークに注目", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Kawasaki_Ninja_H2_CARBON_%282BL-ZXT02J%29_front.jpg/500px-Kawasaki_Ninja_H2_CARBON_%282BL-ZXT02J%29_front.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ninja_H2_CARBON_%282BL-ZXT02J%29_front.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ninja_H2_CARBON_%282BL-ZXT02J%29_front.jpg"}, "q-kclassic-1": {"c": "通称Z1、正式名900 Super Four。ティアドロップ形タンクと4本マフラーが特徴", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Kawasaki_900_Z1.jpg/500px-Kawasaki_900_Z1.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_900_Z1.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_900_Z1.jpg"}, "q-kclassic-2": {"c": "2ストの作動。ピストンが下がると掃気ポートが開き、クランクケースの混合気が燃焼室へ入る瞬間を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Two-Stroke_Engine.gif/500px-Two-Stroke_Engine.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Two-Stroke_Engine.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Two-Stroke_Engine.gif"}, "q-kclassic-3": {"c": "Z1は903ccの輸出向け、Z2は国内の750cc上限の自主規制に合わせた746cc版", "svg": "<svg viewBox=\"0 0 600 230\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<rect class=\"bx\" x=\"20\" y=\"20\" width=\"270\" height=\"190\" rx=\"10\"/>\n<rect class=\"bx\" x=\"310\" y=\"20\" width=\"270\" height=\"190\" rx=\"10\"/>\n<text class=\"tt\" x=\"155\" y=\"50\" text-anchor=\"middle\">Z1（900 Super Four）</text>\n<text class=\"tt ac\" x=\"445\" y=\"50\" text-anchor=\"middle\">Z2（750RS）</text>\n<text class=\"sm\" x=\"40\" y=\"90\">排気量：903cc</text>\n<text class=\"sm\" x=\"40\" y=\"118\">主な市場：北米など輸出向け</text>\n<text class=\"sm\" x=\"40\" y=\"146\">エンジン：空冷DOHC並列4気筒</text>\n<text class=\"sm\" x=\"330\" y=\"90\">排気量：746cc</text>\n<text class=\"sm\" x=\"330\" y=\"118\">主な市場：日本国内向け</text>\n<text class=\"sm\" x=\"330\" y=\"146\">エンジン：空冷DOHC並列4気筒</text>\n<text class=\"sm dim\" x=\"330\" y=\"180\">国内は750cc上限の自主規制</text>\n<text class=\"sm dim\" x=\"330\" y=\"198\">→ Z1を750ccにして国内販売</text>\n<text class=\"sm dim\" x=\"40\" y=\"180\">1972年登場</text></svg>"}, "q-kclassic-4": {"c": "1960年代のW1系。4ストロークOHVの空冷並列2気筒で、英国車風のスタイル", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/1967_Kawasaki_W1SS.jpg/500px-1967_Kawasaki_W1SS.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/1967_Kawasaki_W1SS.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:1967_Kawasaki_W1SS.jpg"}, "q-kclassic-5": {"c": "直列6気筒の作動。1本のクランクに6つのピストンが一列に並び、決まった順番で上下する様子を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Inline_6_Cylinder_with_firing_order_1-5-3-6-2-4.gif/500px-Inline_6_Cylinder_with_firing_order_1-5-3-6-2-4.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Inline_6_Cylinder_with_firing_order_1-5-3-6-2-4.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Inline_6_Cylinder_with_firing_order_1-5-3-6-2-4.gif"}, "q-kninja-1": {"c": "1984年のGPZ900R。北米で初めて「Ninja」の名で売られたモデル", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/1984_Kawasaki_GPz900R.jpg/500px-1984_Kawasaki_GPz900R.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/1984_Kawasaki_GPz900R.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:1984_Kawasaki_GPz900R.jpg"}, "q-kninja-2": {"c": "H2Rエンジンのカットモデル。エンジン後方のスーパーチャージャー（羽根車）が見える", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Kawasaki_Ninja_H2R_engine_cutaway_supercharger.JPG/500px-Kawasaki_Ninja_H2R_engine_cutaway_supercharger.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ninja_H2R_engine_cutaway_supercharger.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ninja_H2R_engine_cutaway_supercharger.JPG"}, "q-kninja-3": {"c": "ZX-25Rエンジンのカットモデル。250ccなのにピストンが4つ並ぶ並列4気筒", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Kawasaki_Ninja_ZX-25R_engine_cutmodel.jpg/500px-Kawasaki_Ninja_ZX-25R_engine_cutmodel.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ninja_ZX-25R_engine_cutmodel.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ninja_ZX-25R_engine_cutmodel.jpg"}, "q-kninja-4": {"c": "ZZR1100。電動ではなく、1990年当時世界最速クラスとされたガソリンの並列4気筒車", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Kawasaki_ZZR1100.jpg/500px-Kawasaki_ZZR1100.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_ZZR1100.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_ZZR1100.jpg"}, "q-kninja-5": {"c": "Ninja H2。グループの技術を結集した証として、車体前部にリバーマークが付く", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Kawasaki_Ninja_H2_at_the_Tokyo_Motor_Show_2015-1.jpg/500px-Kawasaki_Ninja_H2_at_the_Tokyo_Motor_Show_2015-1.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ninja_H2_at_the_Tokyo_Motor_Show_2015-1.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ninja_H2_at_the_Tokyo_Motor_Show_2015-1.jpg"}, "q-krace-1": {"c": "ライムグリーンのレーサーH1R。米国で縁起が悪いとされた緑をあえて採用した色", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Kawasaki_H1R.jpg/500px-Kawasaki_H1R.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_H1R.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_H1R.jpg"}, "q-krace-2": {"c": "2016年アッセンのジョナサン・レイ。ZX-10RでWSBKを2015〜2020年に6連覇した", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Jonathan_Rea_in_Assen_2016.jpg/500px-Jonathan_Rea_in_Assen_2016.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Jonathan_Rea_in_Assen_2016.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Jonathan_Rea_in_Assen_2016.jpg"}, "q-krace-3": {"c": "タンデムツインの構造。2つのシリンダーが前後に並び、それぞれのクランクをギアでつなぐ点と、車体幅の細さを見る", "svg": "<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text class=\"tt\" x=\"20\" y=\"24\">横から見たタンデムツイン（KR250）</text>\n<line class=\"ln acs\" x1=\"120\" y1=\"44\" x2=\"40\" y2=\"44\" marker-end=\"url(#ah)\"/>\n<text class=\"sm\" x=\"128\" y=\"48\">進行方向（前）</text>\n<rect class=\"bx\" x=\"70\" y=\"62\" width=\"80\" height=\"120\" rx=\"4\"/>\n<rect class=\"gmix\" x=\"74\" y=\"66\" width=\"72\" height=\"30\"/>\n<line class=\"ln thick\" x1=\"110\" y1=\"113\" x2=\"92\" y2=\"209\"/>\n<line class=\"ln thick\" x1=\"250\" y1=\"133\" x2=\"268\" y2=\"232\"/>\n<rect class=\"pst\" x=\"76\" y=\"96\" width=\"68\" height=\"34\" rx=\"3\"/>\n<rect class=\"bx\" x=\"210\" y=\"62\" width=\"80\" height=\"120\" rx=\"4\"/>\n<rect class=\"gmix\" x=\"214\" y=\"66\" width=\"72\" height=\"50\"/>\n<rect class=\"pst\" x=\"216\" y=\"116\" width=\"68\" height=\"34\" rx=\"3\"/>\n<text class=\"sm\" x=\"110\" y=\"80\" text-anchor=\"middle\">前シリンダー</text>\n<text class=\"sm\" x=\"250\" y=\"80\" text-anchor=\"middle\">後シリンダー</text>\n<circle class=\"ln\" cx=\"110\" cy=\"222\" r=\"30\"/>\n<circle class=\"ln\" cx=\"250\" cy=\"222\" r=\"30\"/>\n<circle class=\"ln dash\" cx=\"180\" cy=\"222\" r=\"40\"/>\n<circle class=\"dot\" cx=\"92\" cy=\"209\" r=\"4\"/>\n<circle class=\"dot\" cx=\"268\" cy=\"232\" r=\"4\"/>\n<circle class=\"dot\" cx=\"110\" cy=\"222\" r=\"3\"/>\n<circle class=\"dot\" cx=\"250\" cy=\"222\" r=\"3\"/>\n<text class=\"sm\" x=\"110\" y=\"272\" text-anchor=\"middle\">前クランク</text>\n<text class=\"sm\" x=\"250\" y=\"272\" text-anchor=\"middle\">後クランク</text>\n<text class=\"sm ac\" x=\"180\" y=\"290\" text-anchor=\"middle\">2本のクランクをギアでつなぐ</text>\n<text class=\"sm dim\" x=\"180\" y=\"226\" text-anchor=\"middle\">連結ギア</text>\n<rect class=\"bx\" x=\"380\" y=\"40\" width=\"200\" height=\"245\" rx=\"10\"/>\n<text class=\"tt\" x=\"480\" y=\"64\" text-anchor=\"middle\">上から見ると</text>\n<text class=\"sm dim\" x=\"480\" y=\"82\" text-anchor=\"middle\">（左が前・上下が車体の幅）</text>\n<text class=\"sm\" x=\"396\" y=\"108\">並列2気筒</text>\n<circle class=\"pst\" cx=\"450\" cy=\"128\" r=\"14\"/>\n<circle class=\"pst\" cx=\"450\" cy=\"160\" r=\"14\"/>\n<line class=\"ln acs\" x1=\"478\" y1=\"114\" x2=\"478\" y2=\"174\" marker-end=\"url(#ah)\" marker-start=\"url(#ah)\"/>\n<text class=\"sm dim\" x=\"488\" y=\"148\">幅が広い</text>\n<text class=\"sm ac\" x=\"396\" y=\"204\">タンデムツイン</text>\n<circle class=\"pst\" cx=\"440\" cy=\"232\" r=\"14\"/>\n<circle class=\"pst\" cx=\"472\" cy=\"232\" r=\"14\"/>\n<text class=\"sm dim\" x=\"498\" y=\"236\">幅は1気筒分</text>\n<text class=\"sm dim\" x=\"480\" y=\"270\" text-anchor=\"middle\">前後に並ぶので幅が細い</text>\n</svg>\n"}, "q-krace-4": {"c": "1982年のKR350。アントン・マングはロードレースのWGPでKRに乗りタイトルを獲得した", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Kawasaki_KR350_1982_FIM.JPG/500px-Kawasaki_KR350_1982_FIM.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_KR350_1982_FIM.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_KR350_1982_FIM.JPG"}, "q-krace-5": {"c": "WSBKは市販車ベース、WGP（現MotoGP）は競技専用の試作車で争うという違い", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<rect class=\"bx\" x=\"20\" y=\"20\" width=\"270\" height=\"200\" rx=\"10\"/>\n<rect class=\"bx\" x=\"310\" y=\"20\" width=\"270\" height=\"200\" rx=\"10\"/>\n<text class=\"tt ac\" x=\"155\" y=\"52\" text-anchor=\"middle\">スーパーバイク世界選手権</text>\n<text class=\"tt\" x=\"155\" y=\"72\" text-anchor=\"middle\">（WSBK）</text>\n<text class=\"tt ac\" x=\"445\" y=\"52\" text-anchor=\"middle\">WGP（現MotoGP）</text>\n<text class=\"sm\" x=\"40\" y=\"110\">マシン：市販車がベース</text>\n<text class=\"sm\" x=\"40\" y=\"138\">例：ZX-10R（店で買える車種）</text>\n<text class=\"sm\" x=\"40\" y=\"166\">を改造して走る</text>\n<text class=\"sm\" x=\"330\" y=\"110\">マシン：競技専用の試作車</text>\n<text class=\"sm\" x=\"330\" y=\"138\">（プロトタイプ）</text>\n<text class=\"sm\" x=\"330\" y=\"166\">市販されないレース専用設計</text>\n<text class=\"sm dim\" x=\"40\" y=\"200\">「売っているバイク」の頂点争い</text>\n<text class=\"sm dim\" x=\"330\" y=\"200\">「専用マシン」の頂点争い</text></svg>"}, "q-know-1": {"c": "Z900RS。ティアドロップ形タンクや尾端の形がZ1へのオマージュになっている", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Kawasaki_Z900RS.jpg/500px-Kawasaki_Z900RS.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Z900RS.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Z900RS.jpg"}, "q-know-2": {"c": "1985年の立ち乗り式JS550。「ジェットスキー」はカワサキ水上オートバイの登録商標", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/1985_Kawasaki_550_Jet_Ski%C2%AE.jpg/500px-1985_Kawasaki_550_Jet_Ski%C2%AE.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/1985_Kawasaki_550_Jet_Ski%C2%AE.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:1985_Kawasaki_550_Jet_Ski%C2%AE.jpg"}, "q-know-3": {"c": "Ninja 7 Hybridはエンジン＋モーター、e-1はバッテリー＋モーターだけで走る", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<rect class=\"bx\" x=\"20\" y=\"20\" width=\"270\" height=\"210\" rx=\"10\"/>\n<rect class=\"bx\" x=\"310\" y=\"20\" width=\"270\" height=\"210\" rx=\"10\"/>\n<text class=\"tt ac\" x=\"155\" y=\"48\" text-anchor=\"middle\">Ninja 7 Hybrid（ハイブリッド）</text>\n<text class=\"tt ac\" x=\"445\" y=\"48\" text-anchor=\"middle\">Ninja e-1 / Z e-1（電動）</text>\n<rect class=\"pst\" x=\"40\" y=\"70\" width=\"100\" height=\"44\" rx=\"6\"/><text class=\"sm\" x=\"90\" y=\"97\" text-anchor=\"middle\">エンジン</text>\n<rect class=\"pst\" x=\"170\" y=\"70\" width=\"100\" height=\"44\" rx=\"6\"/><text class=\"sm\" x=\"220\" y=\"97\" text-anchor=\"middle\">モーター</text>\n<line class=\"ln\" x1=\"90\" y1=\"114\" x2=\"140\" y2=\"160\" marker-end=\"url(#ah)\"/>\n<line class=\"ln\" x1=\"220\" y1=\"114\" x2=\"170\" y2=\"160\" marker-end=\"url(#ah)\"/>\n<rect class=\"bx\" x=\"105\" y=\"162\" width=\"100\" height=\"34\" rx=\"6\"/><text class=\"sm\" x=\"155\" y=\"184\" text-anchor=\"middle\">後輪</text>\n<text class=\"sm dim\" x=\"155\" y=\"218\" text-anchor=\"middle\">2つの動力を組み合わせる</text>\n<rect class=\"pst\" x=\"330\" y=\"70\" width=\"100\" height=\"44\" rx=\"6\"/><text class=\"sm\" x=\"380\" y=\"97\" text-anchor=\"middle\">バッテリー</text>\n<rect class=\"pst\" x=\"460\" y=\"70\" width=\"100\" height=\"44\" rx=\"6\"/><text class=\"sm\" x=\"510\" y=\"97\" text-anchor=\"middle\">モーター</text>\n<line class=\"ln\" x1=\"430\" y1=\"92\" x2=\"458\" y2=\"92\" marker-end=\"url(#ah)\"/>\n<line class=\"ln\" x1=\"510\" y1=\"114\" x2=\"460\" y2=\"160\" marker-end=\"url(#ah)\"/>\n<rect class=\"bx\" x=\"395\" y=\"162\" width=\"100\" height=\"34\" rx=\"6\"/><text class=\"sm\" x=\"445\" y=\"184\" text-anchor=\"middle\">後輪</text>\n<text class=\"sm dim\" x=\"445\" y=\"218\" text-anchor=\"middle\">エンジンなし。電気だけで走る</text></svg>"}, "q-know-4": {"c": "エリミネーター400。エリミネーターはエンジンを積んだクルーザー型の車名である", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/%E3%82%A8%E3%83%AA%E3%83%9F%E3%83%8D%E3%83%BC%E3%82%BF%E3%83%BC400%EF%BC%A11.jpg/500px-%E3%82%A8%E3%83%AA%E3%83%9F%E3%83%8D%E3%83%BC%E3%82%BF%E3%83%BC400%EF%BC%A11.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/%E3%82%A8%E3%83%AA%E3%83%9F%E3%83%8D%E3%83%BC%E3%82%BF%E3%83%BC400%EF%BC%A11.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:%E3%82%A8%E3%83%AA%E3%83%9F%E3%83%8D%E3%83%BC%E3%82%BF%E3%83%BC400%EF%BC%A11.jpg"}, "q-know-5": {"c": "水素を燃料として燃やすエンジンのイメージ。HySEは小型モビリティ向けを研究する", "svg": "<svg viewBox=\"0 0 600 230\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text class=\"tt\" x=\"300\" y=\"26\" text-anchor=\"middle\">水素エンジンのしくみ（イメージ）</text>\n<rect class=\"bx\" x=\"20\" y=\"70\" width=\"130\" height=\"60\" rx=\"8\"/><text class=\"sm\" x=\"85\" y=\"98\" text-anchor=\"middle\">水素タンク</text><text class=\"sm dim\" x=\"85\" y=\"116\" text-anchor=\"middle\">（燃料：H₂）</text>\n<line class=\"ln\" x1=\"150\" y1=\"100\" x2=\"218\" y2=\"100\" marker-end=\"url(#ah)\"/>\n<rect class=\"gmix\" x=\"220\" y=\"55\" width=\"160\" height=\"90\" rx=\"8\"/>\n<rect class=\"gfire\" x=\"250\" y=\"80\" width=\"100\" height=\"40\" rx=\"6\"/>\n<text class=\"sm\" x=\"300\" y=\"105\" text-anchor=\"middle\">シリンダー内で燃焼</text>\n<text class=\"sm dim\" x=\"250\" y=\"172\">空気（酸素）と混ぜて燃やす</text>\n<line class=\"ln\" x1=\"232\" y1=\"205\" x2=\"232\" y2=\"148\" marker-end=\"url(#ah)\"/>\n<text class=\"sm dim\" x=\"232\" y=\"222\" text-anchor=\"middle\">吸気</text>\n<line class=\"ln\" x1=\"380\" y1=\"100\" x2=\"448\" y2=\"100\" marker-end=\"url(#ah)\"/>\n<rect class=\"bx\" x=\"450\" y=\"70\" width=\"130\" height=\"60\" rx=\"8\"/><text class=\"sm\" x=\"515\" y=\"98\" text-anchor=\"middle\">排気：主に水</text><text class=\"sm dim\" x=\"515\" y=\"116\" text-anchor=\"middle\">CO₂を出さない</text>\n<text class=\"sm ac\" x=\"300\" y=\"46\" text-anchor=\"middle\">ガソリンの代わりに水素を燃やす「エンジン」</text></svg>"}, "x-kroots-1": {"c": "川崎正蔵。1878年に東京・築地で川崎築地造船所を開いたカワサキの創業者", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/KAWASAKI_Shozo.jpg/500px-KAWASAKI_Shozo.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/KAWASAKI_Shozo.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:KAWASAKI_Shozo.jpg"}, "x-kroots-2": {"c": "初代社長の松方幸次郎。1896年設立の株式会社川崎造船所の社長に就いた", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Kojiro_Matsukata.jpg/500px-Kojiro_Matsukata.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kojiro_Matsukata.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kojiro_Matsukata.jpg"}, "x-kroots-3": {"c": "神戸で展示された飛燕。機首が細長いのは液冷V型12気筒エンジンを積むため", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Kawasaki_Ki-61IIkai_Hien_at_Kobe_port-terminal.jpg/500px-Kawasaki_Ki-61IIkai_Hien_at_Kobe_port-terminal.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ki-61IIkai_Hien_at_Kobe_port-terminal.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ki-61IIkai_Hien_at_Kobe_port-terminal.jpg"}, "x-kroots-4": {"c": "明石工場の入口。2021年10月に分社化したカワサキモータースの本拠地", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Kawasaki_Heavy_Industries_Akashi_Factory_Entrance.jpg/500px-Kawasaki_Heavy_Industries_Akashi_Factory_Entrance.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Heavy_Industries_Akashi_Factory_Entrance.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Heavy_Industries_Akashi_Factory_Entrance.jpg"}, "x-kroots-5": {"c": "川崎重工グループは船とオートバイ以外に、鉄道車両・航空宇宙なども手がける", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text class=\"tt\" x=\"300\" y=\"26\" text-anchor=\"middle\">川崎重工グループの主な事業</text>\n<rect class=\"bx\" x=\"20\" y=\"50\" width=\"180\" height=\"80\" rx=\"8\"/><text class=\"tt\" x=\"110\" y=\"84\" text-anchor=\"middle\">船舶海洋</text><text class=\"sm dim\" x=\"110\" y=\"108\" text-anchor=\"middle\">液化水素運搬船など</text><rect class=\"bx\" x=\"213\" y=\"50\" width=\"180\" height=\"80\" rx=\"8\"/><text class=\"tt\" x=\"303\" y=\"84\" text-anchor=\"middle\">車両</text><text class=\"sm dim\" x=\"303\" y=\"108\" text-anchor=\"middle\">新幹線・鉄道車両</text><rect class=\"bx\" x=\"406\" y=\"50\" width=\"180\" height=\"80\" rx=\"8\"/><text class=\"tt\" x=\"496\" y=\"84\" text-anchor=\"middle\">航空宇宙</text><text class=\"sm dim\" x=\"496\" y=\"108\" text-anchor=\"middle\">航空機・ロケット部品</text><rect class=\"bx\" x=\"20\" y=\"145\" width=\"180\" height=\"80\" rx=\"8\"/><text class=\"tt\" x=\"110\" y=\"179\" text-anchor=\"middle\">エネルギー</text><text class=\"sm dim\" x=\"110\" y=\"203\" text-anchor=\"middle\">ガスタービンなど</text><rect class=\"bx\" x=\"213\" y=\"145\" width=\"180\" height=\"80\" rx=\"8\"/><text class=\"tt\" x=\"303\" y=\"179\" text-anchor=\"middle\">精密機械・ロボット</text><text class=\"sm dim\" x=\"303\" y=\"203\" text-anchor=\"middle\">産業用ロボット</text><rect class=\"bx\" x=\"406\" y=\"145\" width=\"180\" height=\"80\" rx=\"8\"/><text class=\"tt ac\" x=\"496\" y=\"179\" text-anchor=\"middle\">パワースポーツ&amp;エンジン</text><text class=\"sm dim\" x=\"496\" y=\"203\" text-anchor=\"middle\">オートバイ・汎用エンジン</text>\n<text class=\"sm dim\" x=\"300\" y=\"245\" text-anchor=\"middle\">船とオートバイだけではない総合重工業</text></svg>"}, "x-kroots-6": {"c": "H2正面のリバーマーク。全車ではなく、グループ技術を結集した特別なモデルに限る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Kawasaki_Ninja_H2_CARBON_%282BL-ZXT02J%29_front.jpg/500px-Kawasaki_Ninja_H2_CARBON_%282BL-ZXT02J%29_front.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ninja_H2_CARBON_%282BL-ZXT02J%29_front.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ninja_H2_CARBON_%282BL-ZXT02J%29_front.jpg"}, "x-kclassic-1": {"c": "1973年型のZ1（Z900）。開発中は「ニューヨークステーキ」と呼ばれた", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Kawasaki_Z900_%281973%29.jpg/500px-Kawasaki_Z900_%281973%29.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Z900_%281973%29.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Z900_%281973%29.jpg"}, "x-kclassic-2": {"c": "DOHCヘッドの断面。吸気側と排気側に1本ずつ、計2本のカムシャフトがバルブを直接押す位置を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/DOHC-Zylinderkopf-Schnitt.jpg/500px-DOHC-Zylinderkopf-Schnitt.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/DOHC-Zylinderkopf-Schnitt.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:DOHC-Zylinderkopf-Schnitt.jpg"}, "x-kclassic-3": {"c": "2ストの作動。吸気・圧縮・燃焼・排気をクランク1回転で終え、毎回転ごとに爆発する点に注目", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Two-Stroke_Engine.gif/500px-Two-Stroke_Engine.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Two-Stroke_Engine.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Two-Stroke_Engine.gif"}, "x-kclassic-4": {"c": "Z2（750RS）は国内の750cc上限の自主規制に合わせ、Z1を746ccにした国内向け", "svg": "<svg viewBox=\"0 0 600 230\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<rect class=\"bx\" x=\"20\" y=\"20\" width=\"270\" height=\"190\" rx=\"10\"/>\n<rect class=\"bx\" x=\"310\" y=\"20\" width=\"270\" height=\"190\" rx=\"10\"/>\n<text class=\"tt\" x=\"155\" y=\"50\" text-anchor=\"middle\">Z1（900 Super Four）</text>\n<text class=\"tt ac\" x=\"445\" y=\"50\" text-anchor=\"middle\">Z2（750RS）</text>\n<text class=\"sm\" x=\"40\" y=\"90\">排気量：903cc</text>\n<text class=\"sm\" x=\"40\" y=\"118\">主な市場：北米など輸出向け</text>\n<text class=\"sm\" x=\"40\" y=\"146\">エンジン：空冷DOHC並列4気筒</text>\n<text class=\"sm\" x=\"330\" y=\"90\">排気量：746cc</text>\n<text class=\"sm\" x=\"330\" y=\"118\">主な市場：日本国内向け</text>\n<text class=\"sm\" x=\"330\" y=\"146\">エンジン：空冷DOHC並列4気筒</text>\n<text class=\"sm dim\" x=\"330\" y=\"180\">国内は750cc上限の自主規制</text>\n<text class=\"sm dim\" x=\"330\" y=\"198\">→ Z1を750ccにして国内販売</text>\n<text class=\"sm dim\" x=\"40\" y=\"180\">1972年登場</text></svg>"}, "x-kclassic-5": {"c": "目黒製作所のオートバイ。カワサキは目黒と提携・吸収し、W1はその技術の流れをくむ", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Meguro_Motorcycle.jpg/500px-Meguro_Motorcycle.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Meguro_Motorcycle.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Meguro_Motorcycle.jpg"}, "x-kclassic-6": {"c": "直列6気筒の作動。一列に並んだ6つのピストンが点火順序どおりに燃焼していく流れに注目", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Inline_6_Cylinder_with_firing_order_1-5-3-6-2-4.gif/500px-Inline_6_Cylinder_with_firing_order_1-5-3-6-2-4.gif", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Inline_6_Cylinder_with_firing_order_1-5-3-6-2-4.gif?width=500", "p": "https://commons.wikimedia.org/wiki/File:Inline_6_Cylinder_with_firing_order_1-5-3-6-2-4.gif"}, "x-kninja-1": {"c": "1984年型GPz900R「Ninja」の正面。この年に登場した初代Ninja", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/The_frontview_of_Kawasaki_GPz900R%22Ninja%22_mid-year_1984.jpg/500px-The_frontview_of_Kawasaki_GPz900R%22Ninja%22_mid-year_1984.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/The_frontview_of_Kawasaki_GPz900R%22Ninja%22_mid-year_1984.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:The_frontview_of_Kawasaki_GPz900R%22Ninja%22_mid-year_1984.jpg"}, "x-kninja-2": {"c": "サーキット専用のH2R。保安部品やナンバー取付部がなく公道は走れない", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Kawasaki_Ninja_H2R_right.JPG/500px-Kawasaki_Ninja_H2R_right.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ninja_H2R_right.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ninja_H2R_right.JPG"}, "x-kninja-3": {"c": "ZX-25Rのエンジン断面。単気筒ではなく4つのピストンが並ぶ並列4気筒", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Kawasaki_Ninja_ZX-25R_engine_cutmodel.jpg/500px-Kawasaki_Ninja_ZX-25R_engine_cutmodel.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ninja_ZX-25R_engine_cutmodel.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ninja_ZX-25R_engine_cutmodel.jpg"}, "x-kninja-4": {"c": "1990年型ZX-11（ZZR1100の北米名）。当時世界最速クラスの市販車だった", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Kawasaki_Ninja_ZX-11_1990.jpg/500px-Kawasaki_Ninja_ZX-11_1990.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ninja_ZX-11_1990.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ninja_ZX-11_1990.jpg"}, "x-kninja-5": {"c": "続編『マーヴェリック』で使われたGPz900R。1986年の初作で主人公が乗ったのと同じ車種", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Kawasaki_GPz900R_Ninja_A2_used_in_Top_Gun%EF%BC%9AMaverick.jpg/500px-Kawasaki_GPz900R_Ninja_A2_used_in_Top_Gun%EF%BC%9AMaverick.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_GPz900R_Ninja_A2_used_in_Top_Gun%EF%BC%9AMaverick.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_GPz900R_Ninja_A2_used_in_Top_Gun%EF%BC%9AMaverick.jpg"}, "x-kninja-6": {"c": "H2Rエンジンのカットモデル。エンジン後方に組み込まれた自社製スーパーチャージャーの羽根車に注目", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Kawasaki_Ninja_H2R_engine_cutaway_supercharger.JPG/500px-Kawasaki_Ninja_H2R_engine_cutaway_supercharger.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Ninja_H2R_engine_cutaway_supercharger.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Ninja_H2R_engine_cutaway_supercharger.JPG"}, "x-krace-1": {"c": "ライムグリーンのKR350。縁起が悪いとされた緑をあえて採用し、カワサキの象徴色になった", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/1975_Kawasaki_KR350_01.jpg/500px-1975_Kawasaki_KR350_01.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/1975_Kawasaki_KR350_01.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:1975_Kawasaki_KR350_01.jpg"}, "x-krace-2": {"c": "ZX-10Rで走るジョナサン・レイ（2016年）。WSBKで2015〜2020年に6連覇した", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Jonathan_Rea_in_Assen_2016.jpg/500px-Jonathan_Rea_in_Assen_2016.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Jonathan_Rea_in_Assen_2016.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Jonathan_Rea_in_Assen_2016.jpg"}, "x-krace-3": {"c": "KRは2スト2気筒を前後に並べ、2本のクランクをギアでつなぐタンデムツイン", "svg": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text class=\"tt\" x=\"300\" y=\"26\" text-anchor=\"middle\">KR250/350のタンデムツイン（横から見た図）</text>\n<text class=\"sm dim\" x=\"560\" y=\"46\" text-anchor=\"end\">← 進行方向（前）</text>\n<rect class=\"pst\" x=\"160\" y=\"60\" width=\"90\" height=\"90\" rx=\"6\"/>\n<rect class=\"pst\" x=\"330\" y=\"60\" width=\"90\" height=\"90\" rx=\"6\"/>\n<text class=\"sm\" x=\"205\" y=\"110\" text-anchor=\"middle\">前側の</text>\n<text class=\"sm\" x=\"205\" y=\"128\" text-anchor=\"middle\">シリンダー</text>\n<text class=\"sm\" x=\"375\" y=\"110\" text-anchor=\"middle\">後ろ側の</text>\n<text class=\"sm\" x=\"375\" y=\"128\" text-anchor=\"middle\">シリンダー</text>\n<circle class=\"ln thick\" cx=\"205\" cy=\"178\" r=\"22\" fill=\"none\"/>\n<circle class=\"ln thick\" cx=\"375\" cy=\"178\" r=\"22\" fill=\"none\"/>\n<circle class=\"dot\" cx=\"205\" cy=\"178\" r=\"4\"/>\n<circle class=\"dot\" cx=\"375\" cy=\"178\" r=\"4\"/>\n<line class=\"ln acs\" x1=\"229\" y1=\"178\" x2=\"351\" y2=\"178\" marker-end=\"url(#ah)\" marker-start=\"url(#ah)\"/>\n<text class=\"sm\" x=\"290\" y=\"234\" text-anchor=\"middle\">2本のクランクをギアで連結</text>\n<text class=\"sm ac\" x=\"40\" y=\"60\">2スト2気筒を</text>\n<text class=\"sm ac\" x=\"40\" y=\"78\">前後に並べる</text>\n<text class=\"sm dim\" x=\"440\" y=\"182\">V型4気筒ではない</text></svg>"}, "x-krace-4": {"c": "コーク・バリントン。KRで1978・79年にWGP250cc・350ccの両クラスを制した", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Kork_002.JPG/500px-Kork_002.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kork_002.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kork_002.JPG"}, "x-krace-5": {"c": "WSBKは市販車ベース。完全な試作車で争うのはWGP（現MotoGP）のほう", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<rect class=\"bx\" x=\"20\" y=\"20\" width=\"270\" height=\"200\" rx=\"10\"/>\n<rect class=\"bx\" x=\"310\" y=\"20\" width=\"270\" height=\"200\" rx=\"10\"/>\n<text class=\"tt ac\" x=\"155\" y=\"52\" text-anchor=\"middle\">スーパーバイク世界選手権</text>\n<text class=\"tt\" x=\"155\" y=\"72\" text-anchor=\"middle\">（WSBK）</text>\n<text class=\"tt ac\" x=\"445\" y=\"52\" text-anchor=\"middle\">WGP（現MotoGP）</text>\n<text class=\"sm\" x=\"40\" y=\"110\">マシン：市販車がベース</text>\n<text class=\"sm\" x=\"40\" y=\"138\">例：ZX-10R（店で買える車種）</text>\n<text class=\"sm\" x=\"40\" y=\"166\">を改造して走る</text>\n<text class=\"sm\" x=\"330\" y=\"110\">マシン：競技専用の試作車</text>\n<text class=\"sm\" x=\"330\" y=\"138\">（プロトタイプ）</text>\n<text class=\"sm\" x=\"330\" y=\"166\">市販されないレース専用設計</text>\n<text class=\"sm dim\" x=\"40\" y=\"200\">「売っているバイク」の頂点争い</text>\n<text class=\"sm dim\" x=\"330\" y=\"200\">「専用マシン」の頂点争い</text></svg>"}, "x-krace-6": {"c": "2009年の鈴鹿8耐。1台のマシンを複数のライダーが交代しながら8時間走らせる", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Suzuka_8H_2009.jpg/500px-Suzuka_8H_2009.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Suzuka_8H_2009.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Suzuka_8H_2009.jpg"}, "x-know-1": {"c": "2017年発表のZ900RS。タンク形状などにZ1へのオマージュが込められている", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Kawasaki_Z900_RS.jpg/500px-Kawasaki_Z900_RS.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Z900_RS.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Z900_RS.jpg"}, "x-know-2": {"c": "カワサキのブランドメッセージ。乗る人に心から楽しんでほしいという意味が込められている", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<rect class=\"bx\" x=\"30\" y=\"30\" width=\"540\" height=\"140\" rx=\"12\"/>\n<text class=\"tt ac\" x=\"300\" y=\"80\" text-anchor=\"middle\" style=\"font-size:22px\">Let the good times roll.</text>\n<line class=\"ln\" x1=\"300\" y1=\"96\" x2=\"300\" y2=\"122\" marker-end=\"url(#ah)\"/>\n<text class=\"tt\" x=\"300\" y=\"146\" text-anchor=\"middle\">「楽しい時間を思いきり楽しもう」</text>\n<text class=\"sm dim\" x=\"300\" y=\"190\" text-anchor=\"middle\">乗る人に心から楽しんでほしいというカワサキのブランドメッセージ</text></svg>"}, "x-know-3": {"c": "カワサキの水上オートバイ。「ジェットスキー」は一般名詞ではなく同社の登録商標", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Kawasaki_Jet_Ski.jpg/500px-Kawasaki_Jet_Ski.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_Jet_Ski.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Kawasaki_Jet_Ski.jpg"}, "x-know-4": {"c": "前後輪の回転差で後輪の空転を検知し、出力を絞って抑えるKTRCの流れ", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text class=\"tt\" x=\"300\" y=\"26\" text-anchor=\"middle\">KTRC（カワサキのトラクションコントロール）</text>\n<rect class=\"bx\" x=\"20\" y=\"60\" width=\"150\" height=\"56\" rx=\"8\"/><text class=\"sm\" x=\"95\" y=\"84\" text-anchor=\"middle\">前輪の回転速度</text><text class=\"sm dim\" x=\"95\" y=\"102\" text-anchor=\"middle\">センサー</text>\n<rect class=\"bx\" x=\"20\" y=\"140\" width=\"150\" height=\"56\" rx=\"8\"/><text class=\"sm\" x=\"95\" y=\"164\" text-anchor=\"middle\">後輪の回転速度</text><text class=\"sm dim\" x=\"95\" y=\"182\" text-anchor=\"middle\">センサー</text>\n<line class=\"ln\" x1=\"170\" y1=\"88\" x2=\"238\" y2=\"120\" marker-end=\"url(#ah)\"/>\n<line class=\"ln\" x1=\"170\" y1=\"168\" x2=\"238\" y2=\"136\" marker-end=\"url(#ah)\"/>\n<rect class=\"pst\" x=\"240\" y=\"96\" width=\"130\" height=\"64\" rx=\"8\"/><text class=\"sm\" x=\"305\" y=\"122\" text-anchor=\"middle\">ECUが比べる</text><text class=\"sm\" x=\"305\" y=\"142\" text-anchor=\"middle\">後輪が速すぎ＝空転</text>\n<line class=\"ln acs\" x1=\"370\" y1=\"128\" x2=\"428\" y2=\"128\" marker-end=\"url(#ah)\"/>\n<rect class=\"bx\" x=\"430\" y=\"96\" width=\"150\" height=\"64\" rx=\"8\"/><text class=\"sm ac\" x=\"505\" y=\"122\" text-anchor=\"middle\">エンジン出力を</text><text class=\"sm ac\" x=\"505\" y=\"142\" text-anchor=\"middle\">一時的に絞る</text>\n<text class=\"sm dim\" x=\"300\" y=\"228\" text-anchor=\"middle\">後輪の空転（スリップ）を抑え、加速時の安定を保つ</text></svg>"}, "x-know-5": {"c": "e-1はバッテリー＋モーターだけの電動車。エンジン併用のハイブリッドは7 Hybrid", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<rect class=\"bx\" x=\"20\" y=\"20\" width=\"270\" height=\"210\" rx=\"10\"/>\n<rect class=\"bx\" x=\"310\" y=\"20\" width=\"270\" height=\"210\" rx=\"10\"/>\n<text class=\"tt ac\" x=\"155\" y=\"48\" text-anchor=\"middle\">Ninja 7 Hybrid（ハイブリッド）</text>\n<text class=\"tt ac\" x=\"445\" y=\"48\" text-anchor=\"midd ー</text><line x1=\"120\" y1=\"196\" x2=\"220\" y2=\"196\" class=\"ln thick\" marker-end=\"url(#ah)\"/><text x=\"170\" y=\"188\" text-anchor=\"middle\" class=\"sm\">過大電流</text><rect x=\"220\" y=\"180\" width=\"90\" height=\"32\" rx=\"4\" class=\"bx\"/><path d=\"M228 196 h12 l6 -8 l8 11\" class=\"ln acs\"/><path d=\"M276 189 l8 -1 l6 8 h14\" class=\"ln acs\"/><circle cx=\"265\" cy=\"194\" r=\"8\" class=\"gfire\"/><text x=\"265\" y=\"234\" text-anchor=\"middle\" class=\"sm\">エレメントが溶けて切れる</text><line x1=\"310\" y1=\"196\" x2=\"380\" y2=\"196\" class=\"ln\"/><line x1=\"380\" y1=\"196\" x2=\"380\" y2=\"214\" class=\"ln\"/><line x1=\"368\" y1=\"214\" x2=\"392\" y2=\"214\" class=\"ln thick\"/><line x1=\"372\" y1=\"219\" x2=\"388\" y2=\"219\" class=\"ln\"/><line x1=\"376\" y1=\"224\" x2=\"384\" y2=\"224\" class=\"ln\"/><text x=\"404\" y=\"192\" text-anchor=\"start\" class=\"sm\">配線の被覆が破れて</text><text x=\"404\" y=\"208\" text-anchor=\"start\" class=\"sm\">車体（アース）に接触</text><text x=\"20\" y=\"258\" text-anchor=\"start\" class=\"sm dim\">すぐまた切れるなら、ショートの原因が残っている。容量を上げると配線が先に焼ける</text></svg>"}, "x-xelec-1": {"c": "三相交流を整流して直流にする波形図。ACGが発電する交流は、このように直流へ整えて使う", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/3_phase_rectification_2.svg/500px-3_phase_rectification_2.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/3_phase_rectification_2.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:3_phase_rectification_2.svg"}, "x-xelec-2": {"c": "プラグの熱の逃げ道の図。NGKは番号が大きいほど熱を逃がしやすい冷え型（高熱価）", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Spark_plug_heat.svg/500px-Spark_plug_heat.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Spark_plug_heat.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Spark_plug_heat.svg"}, "x-xelec-3": {"c": "ブレード型ヒューズは容量（A）ごとに色分けされる。交換は必ず同じ容量の色・数字のものを", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Electrical_fuses%2C_blade_type.svg/500px-Electrical_fuses%2C \" y=\"160\" width=\"170\" height=\"56\" rx=\"6\" class=\"bx\"/><text x=\"300\" y=\"184\" text-anchor=\"middle\" class=\"tt\">イグニッションコイル</text><text x=\"300\" y=\"205\" text-anchor=\"middle\" class=\"sm\">点火用の高電圧をつくる</text>\n<rect x=\"450\" y=\"160\" width=\"130\" height=\"56\" rx=\"6\" class=\"bx\"/><text x=\"515\" y=\"194\" text-anchor=\"middle\" class=\"tt\">点火プラグ</text>\n<line x1=\"385\" y1=\"188\" x2=\"448\" y2=\"188\" class=\"ln\" marker-end=\"url(#ah)\"/>\n<text x=\"20\" y=\"184\" class=\"sm\">高電圧をつくるのは</text><text x=\"20\" y=\"202\" class=\"sm\">こちら（別部品）</text>\n<text x=\"20\" y=\"240\" class=\"sm dim\">レギュレートレクチファイアは整流と電圧調整を担当し、高電圧はつくらない</text></svg>"}, "q-xoil-1": {"c": "容器の「10W40」表示。Wの前の10が低温側（Winter）、後ろの40が高温側の粘度を示す", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Olio_motore_con_gradazione_10W40.jpg/500px-Olio_motore_con_gradazione_10W40.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Olio_motore_con_gradazione_10W40.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Olio_motore_con_gradazione_10W40.jpg"}, "q-xoil-2": {"c": "摩擦板と鋼板がオイルに浸かって押し付けられている所。オイルの摩擦特性が滑りやすさを左右する", "svg": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" text-anchor=\"start\" class=\"tt\">湿式多板クラッチ：板どうしの摩擦で動力を伝え、オイルに浸かっている</text><rect x=\"30\" y=\"44\" width=\"320\" height=\"196\" rx=\"8\" class=\"bx\"/><rect x=\"31\" y=\"150\" width=\"318\" height=\"89\" class=\"oilf\"/><rect x=\"100\" y=\"62\" width=\"12\" height=\"160\" rx=\"2\" class=\"gmix\"/><rect x=\"100\" y=\"62\" width=\"12\" height=\"160\" rx=\"2\" class=\"ln\"/><rect x=\"122\" y=\"62\" width=\"12\" height=\"160\" rx=\"2\" class=\"pst\"/><rect x=\"144\" y=\"62\" width=\"12\" height=\"160\" rx=\"2\" class=\"gmix\"/><rect x=\"144\" y=\"62\" width=\" n<text x=\"300\" y=\"132\" class=\"tt\">JASO MB</text><text x=\"300\" y=\"154\" class=\"sm\">摩擦特性が低め → クラッチをオイルで</text><text x=\"300\" y=\"172\" class=\"sm\">潤滑しない構造の車種向け</text>\n<text x=\"300\" y=\"208\" class=\"sm dim\">湿式クラッチ車にMBを使うと滑りの原因に</text></svg>"}, "x-xoil-3": {"c": "酸素による酸化と、結露による水分混入。走行しなくても時間とともにオイルが劣化する理由を見る", "svg": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" text-anchor=\"start\" class=\"tt\">オイルは走らなくても、空気と湿気で少しずつ劣化する</text><rect x=\"200\" y=\"60\" width=\"200\" height=\"130\" rx=\"8\" class=\"bx\"/><text x=\"300\" y=\"82\" text-anchor=\"middle\" class=\"sm dim\">エンジン内部</text><rect x=\"201\" y=\"120\" width=\"198\" height=\"69\" class=\"oilf\"/><text x=\"300\" y=\"160\" text-anchor=\"middle\" class=\"sm\">エンジンオイル</text><rect x=\"20\" y=\"70\" width=\"140\" height=\"44\" rx=\"6\" class=\"bx\"/><text x=\"90\" y=\"90\" text-anchor=\"middle\" class=\"sm\">空気中の酸素</text><text x=\"90\" y=\"106\" text-anchor=\"middle\" class=\"sm dim\">＋熱</text><line x1=\"160\" y1=\"92\" x2=\"240\" y2=\"132\" class=\"ln\" marker-end=\"url(#ah)\"/><rect x=\"440\" y=\"70\" width=\"140\" height=\"44\" rx=\"6\" class=\"bx\"/><text x=\"510\" y=\"90\" text-anchor=\"middle\" class=\"sm\">空気中の湿気</text><text x=\"510\" y=\"106\" text-anchor=\"middle\" class=\"sm dim\">温度差で結露</text><line x1=\"440\" y1=\"92\" x2=\"360\" y2=\"132\" class=\"ln\" marker-end=\"url(#ah)\"/><text x=\"90\" y=\"150\" text-anchor=\"middle\" class=\"tt ac\">酸化</text><text x=\"90\" y=\"170\" text-anchor=\"middle\" class=\"sm\">性能が落ちる</text><text x=\"510\" y=\"150\" text-anchor=\"middle\" class=\"tt ac\">水分混入</text><text x=\"510\" y=\"170\" text-anchor=\"middle\" class=\"sm\">潤滑・防錆が低下</text><line x1=\"40\" y1=\"222\" x2=\"560\" y2=\"222\" class=\"ln\" marker-end=\"url(#ah)\"/><te "104.5\" text-anchor=\"middle\" class=\"tt ac\">3</text><circle cx=\"80.7\" cy=\"180.0\" r=\"15\" class=\"pst\"/><text x=\"80.7\" y=\"184.5\" text-anchor=\"middle\" class=\"tt ac\">4</text><circle cx=\"219.3\" cy=\"180.0\" r=\"15\" class=\"pst\"/><text x=\"219.3\" y=\"184.5\" text-anchor=\"middle\" class=\"tt ac\">5</text><circle cx=\"80.7\" cy=\"100.0\" r=\"15\" class=\"pst\"/><text x=\"80.7\" y=\"104.5\" text-anchor=\"middle\" class=\"tt ac\">6</text>\n<text x=\"290\" y=\"70\" class=\"sm\">順番：1 → 2（対角）→ 3 → 4 → 5 → 6</text>\n<text x=\"290\" y=\"100\" class=\"sm\">① 全部を手で軽く仮締め</text>\n<text x=\"290\" y=\"124\" class=\"sm\">② 対角順に少しずつ締める（数回）</text>\n<text x=\"290\" y=\"148\" class=\"sm\">③ 最後に規定トルクで本締め</text>\n<text x=\"290\" y=\"180\" class=\"sm ac\">1本ずつ順に回る締め方は×</text>\n<text x=\"290\" y=\"200\" class=\"sm dim\">片締めは部品のゆがみ・密着不良の原因</text></svg>"}, "q-xmaint-3": {"c": "チェーン下側の中央で上下の振れ幅を測る。車輪を回し、最も張っている位置で規定値と比べる", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"22\" class=\"tt\">チェーンのたるみは、下側の中央付近で上下の振れ幅を測る</text>\n<circle cx=\"110\" cy=\"110\" r=\"32\" class=\"pst\"/><text x=\"110\" y=\"114\" text-anchor=\"middle\" class=\"sm\">前</text>\n<circle cx=\"470\" cy=\"110\" r=\"62\" class=\"pst\"/><text x=\"470\" y=\"114\" text-anchor=\"middle\" class=\"sm\">後輪側</text>\n<line x1=\"110\" y1=\"78\" x2=\"470\" y2=\"48\" class=\"ln thick\"/>\n<path d=\"M110 142 Q290 200 470 172\" class=\"ln thick\"/>\n<path d=\"M110 142 Q290 160 470 172\" class=\"ln dash\"/>\n<line x1=\"290\" y1=\"160\" x2=\"290\" y2=\"177\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/>\n<text x=\"300\" y=\"200\" class=\"sm ac\">たるみ量</text>\n<text x=\"20\" y=\"220\" class=\"sm\">・車輪を回し、最も張っている位置で測る（伸びは均一でない）</text>\n<text x=\"20\" y=\"240\" class=\"sm\">・規定値と測定条件（サイドスタンド等）は車種ごと：取扱説明書で確認</text></svg>"}, "q-xmaint-4": {"c": "ボルトはばねのように伸びた反発力で部品を締め付ける。締めすぎると伸びが限界を超え破断に至る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Bolted_joint_spring_analogy.svg/500px-Bolted_joint_spring_analogy.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Bolted_joint_spring_analogy.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Bolted_joint_spring_analogy.svg"}, "q-xmaint-5": {"c": "左は線がつながった正常状態、右はボルトが回って線がずれた状態。ゆるみを目で発見できる", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"22\" class=\"tt\">合いマーク：ボルトと部品にまたがって1本の線を引く</text>\n<rect x=\"30\" y=\"45\" width=\"250\" height=\"140\" rx=\"8\" class=\"bx\"/><rect x=\"320\" y=\"45\" width=\"250\" height=\"140\" rx=\"8\" class=\"bx\"/>\n<path d=\"M189.0 115.0L172.0 144.4L138.0 144.4L121.0 115.0L138.0 85.6L172.0 85.6Z\" class=\"pst\"/><line x1=\"155\" y1=\"115\" x2=\"270\" y2=\"115\" class=\"ln thick acs\"/>\n<path d=\"M475.8 129.4L448.0 148.9L417.1 134.5L414.2 100.6L442.0 81.1L472.9 95.5Z\" class=\"pst\"/><line x1=\"445\" y1=\"115\" x2=\"476\" y2=\"100.5\" class=\"ln thick acs\"/><line x1=\"482\" y1=\"115\" x2=\"560\" y2=\"115\" class=\"ln thick acs\"/>\n<text x=\"155\" y=\"208\" text-anchor=\"middle\" class=\"tt\">正常：線がつながっている</text>\n<text x=\"445\" y=\"208\" text-anchor=\"middle\" class=\"tt ac\">ゆるみ：線がずれる</text>\n<text x=\"20\" y=\"232\" class=\"sm dim\">締め付け済みの見える化と、ゆるみの目視発見に役立つ</text></svg>"}, "x-xmaint-1": {"c": "点灯したウインカー。「トウ」は灯火で、ライト・ウインカー・ブレーキランプの点灯を確認する", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Turnsignals_On.jpg/500px-Turnsignals_On.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Turnsignals_On.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Turnsignals_On.jpg"}, "x-xmaint-2": {"c": "たるみの規定値や測定条件は車種ごとに異なる。図の振れ幅を取扱説明書の値と比べる", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"22\" class=\"tt\">チェーンのたるみは、下側の中央付近で上下の振れ幅を測る</text>\n<circle cx=\"110\" cy=\"110\" r=\"32\" class=\"pst\"/><text x=\"110\" y=\"114\" text-anchor=\"middle\" class=\"sm\">前</text>\n<circle cx=\"470\" cy=\"110\" r=\"62\" class=\"pst\"/><text x=\"470\" y=\"114\" text-anchor=\"middle\" class=\"sm\">後輪側</text>\n<line x1=\"110\" y1=\"78\" x2=\"470\" y2=\"48\" class=\"ln thick\"/>\n<path d=\"M110 142 Q290 200 470 172\" class=\"ln thick\"/>\n<path d=\"M110 142 Q290 160 470 172\" class=\"ln dash\"/>\n<line x1=\"290\" y1=\"160\" x2=\"290\" y2=\"177\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/>\n<text x=\"300\" y=\"200\" class=\"sm ac\">たるみ量</text>\n<text x=\"20\" y=\"220\" class=\"sm\">・車輪を回し、最も張っている位置で測る（伸びは均一でない）</text>\n<text x=\"20\" y=\"240\" class=\"sm\">・規定値と測定条件（サイドスタンド等）は車種ごと：取扱説明書で確認</text></svg>"}, "x-xmaint-3": {"c": "対角の順に数回に分けて締めると、部品が均一に座面へ密着し、ゆがみや片締めを防げる", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"22\" class=\"tt\">6本締めの例：対角の順に、数回に分けて締める</text>\n<circle cx=\"150\" cy=\"140\" r=\"100\" class=\"bx\"/><circle cx=\"150\" cy=\"140\" r=\"40\" class=\"bx\"/>\n<path d=\"M150.0 60.0L150.0 220.0L219.3 100.0L80.7 180.0L219.3 180.0L80.7 100.0\" class=\"ln dash\"/><circle cx=\"150.0\" cy=\"60.0\" r=\"15\" class=\"pst\"/><text x=\"150.0\" y=\"64.5\" text-anchor=\"middle\" class=\"tt ac\">1</text><circle cx=\"150.0\" cy=\"220.0\" r=\"15\" class=\ \" class=\"ln dash\"/><circle cx=\"250\" cy=\"113\" r=\"5\" class=\"dot\"/>\n<text x=\"200\" y=\"104\" text-anchor=\"end\" class=\"sm\">規定トルク</text><text x=\"200\" y=\"120\" text-anchor=\"end\" class=\"sm\">（適正な固定力）</text>\n<text x=\"310\" y=\"112\" class=\"sm\">締めすぎ：ボルトが伸び</text><text x=\"310\" y=\"128\" class=\"sm\">軸力は増えずネジ山も傷む</text>\n<text x=\"20\" y=\"242\" class=\"sm dim\">強く締めるほど安全ではない。部位ごとの規定トルクで締める</text></svg>"}, "x-xmaint-5": {"c": "線がずれていればゆるみのサイン。締め付け済みの見える化と、ゆるみの早期発見に役立つ", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"22\" class=\"tt\">合いマーク：ボルトと部品にまたがって1本の線を引く</text>\n<rect x=\"30\" y=\"45\" width=\"250\" height=\"140\" rx=\"8\" class=\"bx\"/><rect x=\"320\" y=\"45\" width=\"250\" height=\"140\" rx=\"8\" class=\"bx\"/>\n<path d=\"M189.0 115.0L172.0 144.4L138.0 144.4L121.0 115.0L138.0 85.6L172.0 85.6Z\" class=\"pst\"/><line x1=\"155\" y1=\"115\" x2=\"270\" y2=\"115\" class=\"ln thick acs\"/>\n<path d=\"M475.8 129.4L448.0 148.9L417.1 134.5L414.2 100.6L442.0 81.1L472.9 95.5Z\" class=\"pst\"/><line x1=\"445\" y1=\"115\" x2=\"476\" y2=\"100.5\" class=\"ln thick acs\"/><line x1=\"482\" y1=\"115\" x2=\"560\" y2=\"115\" class=\"ln thick acs\"/>\n<text x=\"155\" y=\"208\" text-anchor=\"middle\" class=\"tt\">正常：線がつながっている</text>\n<text x=\"445\" y=\"208\" text-anchor=\"middle\" class=\"tt ac\">ゆるみ：線がずれる</text>\n<text x=\"20\" y=\"232\" class=\"sm dim\">締め付け済みの見える化と、ゆるみの目視発見に役立つ</text></svg>"}, "x-xmaint-6": {"c": "伸びは均一でないため、車輪を回して最も張っている位置でたるみを測る。最もたるんだ位置ではない", "svg": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"22\" class=\"tt\">チェーンのたるみは、下側の中央付近で上下の振れ幅を測る</text>\n<circle cx=\"110\" cy=\"110\" r=\"32\" class=\"pst\"/><text x=\"110\" y=\"114\" text-anchor=\"middle\" class=\"sm\">前</text>\n<circle cx=\"470\" cy=\"110\" r=\"62\" class=\"pst\"/><text x=\"470\" y=\"114\" text-anchor=\"middle\" class=\"sm\">後輪側</text>\n<line x1=\"110\" y1=\"78\" x2=\"470\" y2=\"48\" class=\"ln thick\"/>\n<path d=\"M110 142 Q290 200 470 172\" class=\"ln thick\"/>\n<path d=\"M110 142 Q290 160 470 172\" class=\"ln dash\"/>\n<line x1=\"290\" y1=\"160\" x2=\"290\" y2=\"177\" class=\"ln acs\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/>\n<text x=\"300\" y=\"200\" class=\"sm ac\">たるみ量</text>\n<text x=\"20\" y=\"220\" class=\"sm\">・車輪を回し、最も張っている位置で測る（伸びは均一でない）</text>\n<text x=\"20\" y=\"240\" class=\"sm\">・規定値と測定条件（サイドスタンド等）は車種ごと：取扱説明書で確認</text></svg>"}, "q-xlaw-1": {"c": "原付一種の白いナンバープレート。この区分の法定最高速度は30km/hで、新基準原付も同じ", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/JAPAN_Gentuki_class1_Motorcycle_Licence_Plate_3636.jpg/500px-JAPAN_Gentuki_class1_Motorcycle_Licence_Plate_3636.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/JAPAN_Gentuki_class1_Motorcycle_Licence_Plate_3636.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:JAPAN_Gentuki_class1_Motorcycle_Licence_Plate_3636.jpg"}, "q-xlaw-2": {"c": "新基準原付の条件は「125cc以下」かつ「最高出力4.0kW以下に制御」。出力制限が必須", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"22\" class=\"tt\">2025年4月〜「原付一種」として扱われる二輪車</text>\n<rect x=\"20\" y=\"40\" width=\"270\" height=\"80\" rx=\"8\" class=\"bx\"/><text x=\"155\" y=\"68\" text-anchor=\"middle\" class=\"tt\">従来の原付一種</text><text x=\"155\" y=\"94\" text-anchor=\"middle\" class=\"sm\">総排気量 50cc以下</text>\n<rect x=\"310\" y=\"40\" width=\"270\" height=\"80\" rx=\"8\" class=\"bx\"/><text x=\"445\" y=\"64\" text-anchor=\"middle\" class=\"tt ac\">新基準原付</text><text x=\"445\" y=\"86\" text-anchor=\"middle\" class=\"sm\">総排気量125cc以下 かつ</text><text x=\"445\" y=\"106\" text-anchor=\"middle\" class=\"sm\">最高出力4.0kW以下に制御</text>\n<line x1=\"155\" y1=\"120\" x2=\"270\" y2=\"150\" class=\"ln\" marker-end=\"url(#ah)\"/><line x1=\"445\" y1=\"120\" x2=\"330\" y2=\"150\" class=\"ln\" marker-end=\"url(#ah)\"/>\n<rect x=\"150\" y=\"152\" width=\"300\" height=\"78\" rx=\"8\" class=\"bx\"/>\n<text x=\"300\" y=\"174\" text-anchor=\"middle\" class=\"tt\">原付一種のルールを適用</text>\n<text x=\"300\" y=\"196\" text-anchor=\"middle\" class=\"sm\">法定最高速度30km/h・二段階右折</text>\n<text x=\"300\" y=\"216\" text-anchor=\"middle\" class=\"sm\">原付免許（普通免許）で運転できる</text></svg>"}, "q-xlaw-3": {"c": "車検があるのは250cc超の小型二輪だけ。自賠責保険はどの区分でも加入が必要", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">二輪の区分と車検・自賠責保険</text><text x=\"30\" y=\"58\" class=\"tt\">区分</text><text x=\"140\" y=\"58\" class=\"tt\">排気量</text><text x=\"390\" y=\"58\" class=\"tt\">車検</text><text x=\"490\" y=\"58\" class=\"tt\">自賠責</text><line x1=\"20\" y1=\"68\" x2=\"580\" y2=\"68\" class=\"ln\"/><text x=\"30\" y=\"90\" class=\"sm\">原付一種</text><text x=\"140\" y=\"90\" class=\"sm\">50cc以下（新基準原付含む）</text><text x=\"390\" y=\"90\" class=\"sm\">なし</text><text x=\"490\" y=\"90\" class=\"sm ac\">必要</text><line x1=\"20\" y1=\"102\" x2=\"580\" y2=\"102\" class=\"ln\"/><text x=\"30\" y=\"124\" class=\"sm\">原付二種</text><text x=\"140\" y=\"124\" class=\"sm\">50cc超〜125cc</text><text x=\"390\" y=\"124\" class=\"sm\">なし</text><text x=\"490\" y=\"124\" class=\"sm ac\">必要</text><line x1=\"20\" y1=\"136\" x2=\"580\" y2=\"136\" class=\"ln\"/><text x=\"30\" y=\"158\" class=\"sm\">軽二輪</text><text x=\"140\" y=\"158\" class=\"sm\">125cc超〜250cc</text><text x=\"390\" y=\"158\" class=\"sm\">なし</text><text x=\"490\" y=\"158\" class=\"sm ac\">必要</text><line x1=\"20\" y1=\"170\" x2=\"580\" y2=\"170\" class=\"ln\"/><text x=\"30\" y=\"192\" class=\"sm\">小型二輪</text><text x=\"140\" y=\"192\" class=\"sm\">250cc超</text><text x=\"390\" y=\"192\" class=\"sm ac\">あり</text><text x=\"490\" y=\"192\" class=\"sm ac\">必要</text><line x1=\"20\" y1=\"204\" x2=\"580\" y2=\"204\" class=\"ln\"/>\n<text x=\"20\" y=\"228\" class=\"sm dim\">車検は250cc超だけ。自賠責保険は車検の有無に関係なく全区分で必要</text></svg>"}, "q-xlaw-4": {"c": "運転免許証の「種類」欄。普通免許で乗れる二輪は原付一種までで、二輪免許は別に区分される", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Japan_Drivers_Licence_Ver2019.JPG/500px-Japan_Drivers_Licence_Ver2019.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Japan_Drivers_Licence_Ver2019.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Japan_Drivers_Licence_Ver2019.JPG"}, "q-xlaw-5": {"c": "原付の二段階右折を指定する標識。3車線以上の信号交差点や、この標識がある所で二段階右折する", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Japan_road_sign_327-8.svg/500px-Japan_road_sign_327-8.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Japan_road_sign_327-8.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Japan_road_sign_327-8.svg"}, "x-xlaw-1": {"c": "免許証の「種類」欄に普通二輪・大型二輪などが並ぶ。普通二輪は400cc以下、超えると大型二輪", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Japan_Drivers_Licence_Ver2019.JPG/500px-Japan_Drivers_Licence_Ver2019.JPG", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Japan_Drivers_Licence_Ver2019.JPG?width=500", "p": "https://commons.wikimedia.org/wiki/File:Japan_Drivers_Licence_Ver2019.JPG"}, "x-xlaw-2": {"c": "126〜250ccの軽二輪に車検はなく、車検は250cc超の小型二輪から。自賠責は全区分で必要", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">二輪の区分と車検・自賠責保険</text><text x=\"30\" y=\"58\" class=\"tt\">区分</text><text x=\"140\" y=\"58\" class=\"tt\">排気量</text><text x=\"390\" y=\"58\" class=\"tt\">車検</text><text x=\"490\" y=\"58\" class=\"tt\">自賠責</text><line x1=\"20\" y1=\"68\" x2=\"580\" y2=\"68\" class=\"ln\"/><text x=\"30\" y=\"90\" class=\"sm\">原付一種</text><text x=\"140\" y=\"90\" class=\"sm\">50cc以下（新基準原付含む）</text><text x=\"390\" y=\"90\" class=\"sm\">なし</text><text x=\"490\" y=\"90\" class=\"sm ac\">必要</text><line x1=\"20\" y1=\"102\" x2=\"580\" y2=\"102\" class=\"ln\"/><text x=\"30\" y=\"124\" class=\"sm\">原付二種</text><text x=\"140\" y=\"124\" class=\"sm\">50cc超〜125cc</text><text x=\"390\" y=\"124\" class=\"sm\">なし</text><text x=\"490\" y=\"124\" class=\"sm ac\">必要</text><line x1=\"20\" y1=\"136\" x2=\"580\" y2=\"136\" class=\"ln\"/><text x=\"30\" y=\"158\" class=\"sm\">軽二輪</text><text x=\"140\" y=\"158\" class=\"sm\">125cc超〜250cc</text><text x=\"390\" y=\"158\" class=\"sm\">なし</text><text x=\"490\" y=\"158\" class=\"sm ac\">必要</text><line x1=\"20\" y1=\"170\" x2=\"580\" y2=\"170\" class=\"ln\"/><text x=\"30\" y=\"192\" class=\"sm\">小型二輪</text><text x=\"140\" y=\"192\" class=\"sm\">250cc超</text><text x=\"390\" y=\"192\" class=\"sm ac\">あり</text><text x=\"490\" y=\"192\" class=\"sm ac\">必要</text><line x1=\"20\" y1=\"204\" x2=\"580\" y2=\"204\" class=\"ln\"/>\n<text x=\"20\" y=\"228\" class=\"sm dim\">車検は250cc超だけ。自賠責保険は車検の有無に関係なく全区分で必要</text></svg>"}, "x-xlaw-3": {"c": "125cc以下で最高出力4.0kW以下に制御した車両が、2025年4月から原付一種として扱われる", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"22\" class=\"tt\">2025年4月〜「原付一種」として扱われる二輪車</text>\n<rect x=\"20\" y=\"40\" width=\"270\" height=\"80\" rx=\"8\" class=\"bx\"/><text x=\"155\" y=\"68\" text-anchor=\"middle\" class=\"tt\">従来の原付一種</text><text x=\"155\" y=\"94\" text-anchor=\"middle\" class=\"sm\">総排気量 50cc以下</text>\n<rect x=\"310\" y=\"40\" width=\"270\" height=\"80\" rx=\"8\" class=\"bx\"/><text x=\"445\" y=\"64\" text-anchor=\"middle\" class=\"tt ac\">新基準原付</text><text x=\"445\" y=\"86\" text-anchor=\"middle\" class=\"sm\">総排気量125cc以下 かつ</text><text x=\"445\" y=\"106\" text-anchor=\"middle\" class=\"sm\">最高出力4.0kW以下に制御</text>\n<line x1=\"155\" y1=\"120\" x2=\"270\" y2=\"150\" class=\"ln\" marker-end=\"url(#ah)\"/><line x1=\"445\" y1=\"120\" x2=\"330\" y2=\"150\" class=\"ln\" marker-end=\"url(#ah)\"/>\n<rect x=\"150\" y=\"152\" width=\"300\" height=\"78\" rx=\"8\" class=\"bx\"/>\n<text x=\"300\" y=\"174\" text-anchor=\"middle\" class=\"tt\">原付一種のルールを適用</text>\n<text x=\"300\" y=\"196\" text-anchor=\"middle\" class=\"sm\">法定最高速度30km/h・二段階右折</text>\n<text x=\"300\" y=\"216\" text-anchor=\"middle\" class=\"sm\">原付免許（普通免許）で運転できる</text></svg>"}, "x-xlaw-4": {"c": "新基準原付は原付一種扱い。法定最高速度は60km/hではなく30km/hで、二段階右折も必要", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs>\n<text x=\"20\" y=\"22\" class=\"tt\">2025年4月〜「原付一種」として扱われる二輪車</text>\n<rect x=\"20\" y=\"40\" width=\"270\" height=\"80\" rx=\"8\" class=\"bx\"/><text x=\"155\" y=\"68\" text-anchor=\"middle\" class=\"tt\">従来の原付一種</text><text x=\"155\" y=\"94\" text-anchor=\"middle\" class=\"sm\">総排気量 50cc以下</text>\n<rect x=\"310\" y=\"40\" width=\"270\" height=\"80\" rx=\"8\" class=\"bx\"/><text x=\"445\" y=\"64\" text-anchor=\"middle\" class=\"tt ac\">新基準原付</text><text x=\"445\" y=\"86\" text-anchor=\"middle\" class=\"sm\">総排気量125cc以下 かつ</text><text x=\"445\" y=\"106\" text-anchor=\"middle\" class=\"sm\">最高出力4.0kW以下に制御</text>\n<line x1=\"155\" y1=\"120\" x2=\"270\" y2=\"150\" class=\"ln\" marker-end=\"url(#ah)\"/><line x1=\"445\" y1=\"120\" x2=\"330\" y2=\"150\" class=\"ln\" marker-end=\"url(#ah)\"/>\n<rect x=\"150\" y=\"152\" width=\"300\" height=\"78\" rx=\"8\" class=\"bx\"/>\n<text x=\"300\" y=\"174\" text-anchor=\"middle\" class=\"tt\">原付一種のルールを適用</text>\n<text x=\"300\" y=\"196\" text-anchor=\"middle\" class=\"sm\">法定最高速度30km/h・二段階右折</text>\n<text x=\"300\" y=\"216\" text-anchor=\"middle\" class=\"sm\">原付免許（普通免許）で運転できる</text></svg>"}, "x-xlaw-5": {"c": "普通自動車免許は原付一種まで。原付二種（125ccクラス）には小型限定普通二輪免許以上が必要", "svg": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"22\" class=\"tt\">運転免許と運転できる二輪の範囲</text><text x=\"20\" y=\"66\" class=\"sm\">普通自動車免許</text><rect x=\"160\" y=\"50\" width=\"40\" height=\"24\" rx=\"4\" class=\"bx\"/><text x=\"210\" y=\"66\" class=\"sm\">原付一種まで（原付二種は不可）</text><text x=\"20\" y=\"110\" class=\"sm\">小型限定普通二輪</text><rect x=\"160\" y=\"94\" width=\"120\" height=\"24\" rx=\"4\" class=\"oilf\"/><text x=\"170\" y=\"110\" class=\"sm\">125cc以下</text><text x=\"20\" y=\"154\" class=\"sm\">普通二輪</text><rect x=\"160\" y=\"138\" width=\"240\" height=\"24\" rx=\"4\" class=\"oilf\"/><text x=\"170\" y=\"154\" class=\"sm\">400cc以下</text><text x=\"20\" y=\"198\" class=\"sm\">大型二輪</text><rect x=\"160\" y=\"182\" width=\"380\" height=\"24\" rx=\"4\" class=\"oilf\"/><text x=\"170\" y=\"198\" class=\"sm\">排気量の上限なし</text>\n<text x=\"20\" y=\"228\" class=\"sm dim\">原付二種（125ccクラス）には小型限定普通二輪免許以上が必要</text></svg>"}, "x-xlaw-6": {"c": "乗車用ヘルメット。原付を含むすべての二輪で着用は義務（努力義務ではない）", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/BlackFullCoverageMotorcycleHelmet.jpg/500px-BlackFullCoverageMotorcycleHelmet.jpg", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/BlackFullCoverageMotorcycleHelmet.jpg?width=500", "p": "https://commons.wikimedia.org/wiki/File:BlackFullCoverageMotorcycleHelmet.jpg"}, "q-mcast-1": {"c": "押湯（ライザー）が製品部につながり、固まる間に縮む分の湯を送り込む位置関係を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/RiserDiagram.svg/500px-RiserDiagram.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/RiserDiagram.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:RiserDiagram.svg"}, "q-mcast-2": {"c": "プランジャーが溶湯を高速・高圧で金型の中へ押し込む、ダイカストの射出のしくみを見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Cold-chamber_die_casting_machine_schematic.svg/500px-Cold-chamber_die_casting_machine_schematic.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Cold-chamber_die_casting_machine_schematic.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Cold-chamber_die_casting_machine_schematic.svg"}, "q-mcast-3": {"c": "丸くなめらかなガス巣と、ぎざぎざで不規則な引け巣の形の違いと、それぞれの原因を見比べる", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"150\" y=\"26\" text-anchor=\"middle\" class=\"tt\">ガス巣（ブローホール）</text><rect x=\"30\" y=\"40\" width=\"240\" height=\"120\" class=\"pst\"/><circle cx=\"90\" cy=\"85\" r=\"14\" class=\"bx\"/><circle cx=\"150\" cy=\"122\" r=\"9\" class=\"bx\"/><circle cx=\"205\" cy=\"78\" r=\"11\" class=\"bx\"/><circle cx=\"110\" cy=\"135\" r=\"6\" class=\"bx\"/><circle cx=\"225\" cy=\"130\" r=\"7\" class=\"bx\"/><circle cx=\"170\" cy=\"70\" r=\"5\" class=\"bx\"/><text x=\"150\" y=\"180\" text-anchor=\"middle\" class=\"sm\">丸く、内面がなめらか</text><text x=\"150\" y=\"196\" text-anchor=\"middle\" class=\"sm dim\">原因：巻き込んだ空気・水素などの気体</text><text x=\"450\" y=\"26\" text-anchor=\"middle\" class=\"tt\">引け巣</text><rect x=\"330\" y=\"40\" width=\"240\" height=\"120\" class=\"pst\"/><path d=\"M420 80L440 92L452 74L462 96L482 84L478 104L500 110L478 120L488 140L462 128L450 146L440 124L416 134L428 114L404 104L428 98Z\" class=\"bx\"/><text x=\"450\" y=\"180\" text-anchor=\"middle\" class=\"sm\">不規則で、内面がざらざら（樹枝状）</text><text x=\"450\" y=\"196\" text-anchor=\"middle\" class=\"sm dim\">原因：凝固収縮の補給不足（厚肉部）</text></svg>"}, "q-mcast-4": {"c": "左右から入った湯が真ん中で合流し、融け合わずに線（湯境）が残る場所を見る", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"26\" text-anchor=\"middle\" class=\"tt\">2か所の堰から入った湯が合流する</text><rect x=\"40\" y=\"70\" width=\"520\" height=\"60\" class=\"bx\"/><rect x=\"70\" y=\"50\" width=\"24\" height=\"20\" class=\"gfire\"/><rect x=\"506\" y=\"50\" width=\"24\" height=\"20\" class=\"gfire\"/><rect x=\"40\" y=\"70\" width=\"258\" height=\"60\" class=\"gfire\"/><rect x=\"302\" y=\"70\" width=\"258\" height=\"60\" class=\"gfire\"/><line x1=\"90\" y1=\"100\" x2=\"250\" y2=\"100\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"510\" y1=\"100\" x2=\"350\" y2=\"100\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"300\" y1=\"66\" x2=\"300\" y2=\"134\" class=\"ln acs thick\"/><text x=\"300\" y=\"158\" text-anchor=\"middle\" class=\"sm ac\">湯境：合流した湯の表面が冷えていて、融け合わずに線が残る</text><text x=\"300\" y=\"182\" text-anchor=\"middle\" class=\"sm dim\">対策：湯温・型温を上げる、合流位置を変える</text></svg>"}, "q-mcast-5": {"c": "加工面近くの丸い巣が鎖のようにつながり、オイル側から外側への漏れ道になる様子を見る", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"22\" text-anchor=\"middle\" class=\"tt\">鋳巣がつながると、オイルが外へにじむ</text><text x=\"70\" y=\"58\" text-anchor=\"start\" class=\"sm dim\">オイル側（加工面）</text><rect x=\"60\" y=\"66\" width=\"480\" height=\"74\" class=\"pst\"/><circle cx=\"300\" cy=\"78\" r=\"7\" class=\"bx\"/><circle cx=\"312\" cy=\"92\" r=\"8\" class=\"bx\"/><circle cx=\"304\" cy=\"108\" r=\"7\" class=\"bx\"/><circle cx=\"316\" cy=\"122\" r=\"8\" class=\"bx\"/><circle cx=\"308\" cy=\"134\" r=\"6\" class=\"bx\"/><circle cx=\"140\" cy=\"100\" r=\"6\" class=\"bx\"/><circle cx=\"460\" cy=\"112\" r=\"5\" class=\"bx\"/><circle cx=\"200\" cy=\"120\" r=\"4\" class=\"bx\"/><line x1=\"296\" y1=\"40\" x2=\"320\" y2=\"160\" class=\"ln acs dash\" marker-end=\"url(#ah)\"/><text x=\"70\" y=\"160\" text-anchor=\"start\" class=\"sm dim\">外側</text><text x=\"330\" y=\"186\" text-anchor=\"middle\" class=\"sm\">加工で表面を削ると中の巣が現れ、内外をつなぐと気密テストで漏れになる</text></svg>"}, "x-mcast-1": {"c": "金型・射出スリーブ・プランジャーの配置を見て、高速・高圧で大量に鋳込める理由をつかむ", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Cold-chamber_die_casting_machine_schematic.svg/500px-Cold-chamber_die_casting_machine_schematic.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Cold-chamber_die_casting_machine_schematic.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Cold-chamber_die_casting_machine_schematic.svg"}, "x-mcast-2": {"c": "押湯が製品部より太く大きく設けられ、最後まで溶けたまま湯を補給する形になっている点を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/Casting_riser_types.svg/500px-Casting_riser_types.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Casting_riser_types.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Casting_riser_types.svg"}, "x-mcast-3": {"c": "湯が先端まで届く前に冷えて固まり、型の端の部分が欠けてしまう湯回り不良を見る", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"300\" y=\"26\" text-anchor=\"middle\" class=\"tt\">湯が冷えて、先端まで届く前に固まる</text><rect x=\"40\" y=\"70\" width=\"520\" height=\"60\" class=\"bx\"/><path d=\"M40 70L380 70Q414 76 402 100Q414 124 380 130L40 130Z\" class=\"gfire\"/><line x1=\"70\" y1=\"100\" x2=\"320\" y2=\"100\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"485\" y=\"105\" text-anchor=\"middle\" class=\"sm ac\">届かず欠ける</text><text x=\"300\" y=\"165\" text-anchor=\"middle\" class=\"sm\">原因：湯温・型温が低い、流れが遅い、肉が薄すぎる</text><text x=\"300\" y=\"185\" text-anchor=\"middle\" class=\"sm dim\">対策：湯温・型温の管理、方案の変更</text></svg>"}, "x-mcast-4": {"c": "表面直下の小さな巣のガスが加熱で膨らみ、表面を押し上げてふくれる様子を見る", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"150\" y=\"30\" text-anchor=\"middle\" class=\"tt\">鋳造したまま</text><rect x=\"30\" y=\"70\" width=\"240\" height=\"80\" class=\"pst\"/><circle cx=\"150\" cy=\"86\" r=\"6\" class=\"bx\"/><circle cx=\"100\" cy=\"120\" r=\"4\" class=\"bx\"/><text x=\"150\" y=\"175\" text-anchor=\"middle\" class=\"sm\">表面のすぐ下に小さな空気の巣</text><line x1=\"278\" y1=\"110\" x2=\"320\" y2=\"110\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"299\" y=\"98\" text-anchor=\"middle\" class=\"sm ac\">加熱</text><text x=\"450\" y=\"30\" text-anchor=\"middle\" class=\"tt\">高温で熱処理・溶接</text><path d=\"M330 70L425 70Q450 38 475 70L570 70L570 150L330 150Z\" class=\"pst\"/><path d=\"M436 70Q450 50 464 70Q450 80 436 70Z\" class=\"bx\"/><circle cx=\"400\" cy=\"120\" r=\"4\" class=\"bx\"/><text x=\"450\" y=\"175\" text-anchor=\"middle\" class=\"sm\">中のガスが膨らみ、表面がふくれる（ブリスター）</text></svg>"}, "x-mcast-5": {"c": "右側の引け巣は、凝固収縮で生じる不規則な空洞。線状に残る湯境とは別の欠陥だと確かめる", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"150\" y=\"26\" text-anchor=\"middle\" class=\"tt\">ガス巣（ブローホール）</text><rect x=\"30\" y=\"40\" width=\"240\" height=\"120\" class=\"pst\"/><circle cx=\"90\" cy=\"85\" r=\"14\" class=\"bx\"/><circle cx=\"150\" cy=\"122\" r=\"9\" class=\"bx\"/><circle cx=\"205\" cy=\"78\" r=\"11\" class=\"bx\"/><circle cx=\"110\" cy=\"135\" r=\"6\" class=\"bx\"/><circle cx=\"225\" cy=\"130\" r=\"7\" class=\"bx\"/><circle cx=\"170\" cy=\"70\" r=\"5\" class=\"bx\"/><text x=\"150\" y=\"180\" text-anchor=\"middle\" class=\"sm\">丸く、内面がなめらか</text><text x=\"150\" y=\"196\" text-anchor=\"middle\" class=\"sm dim\">原因：巻き込んだ空気・水素などの気体</text><text x=\"450\" y=\"26\" text-anchor=\"middle\" class=\"tt\">引け巣</text><rect x=\"330\" y=\"40\" width=\"240\" height=\"120\" class=\"pst\"/><path d=\"M420 80L440 92L452 74L462 96L482 84L478 104L500 110L478 120L488 140L462 128L450 146L440 124L416 134L428 114L404 104L428 98Z\" class=\"bx\"/><text x=\"450\" y=\"180\" text-anchor=\"middle\" class=\"sm\">不規則で、内面がざらざら（樹枝状）</text><text x=\"450\" y=\"196\" text-anchor=\"middle\" class=\"sm dim\">原因：凝固収縮の補給不足（厚肉部）</text></svg>"}, "x-mcast-6": {"c": "密閉した炉の湯が空気圧で管を通り、下から金型へ押し上げられる流れの向きを見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Low_pressure_permanent_mold_casting_schematic.svg/500px-Low_pressure_permanent_mold_casting_schematic.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Low_pressure_permanent_mold_casting_schematic.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Low_pressure_permanent_mold_casting_schematic.svg"}, "q-mforge-1": {"c": "上下の型の合わせ目の狭いすき間から、材料が薄くはみ出してバリになる位置を見る", "svg": "<svg viewBox=\"0 0 600 205\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><path d=\"M80 20L520 20L520 92L380 92L380 70L220 70L220 92L80 92Z\" class=\"pst\"/><path d=\"M80 180L520 180L520 98L380 98L380 120L220 120L220 98L80 98Z\" class=\"pst\"/><path d=\"M220 70L380 70L380 92L440 92L440 98L380 98L380 120L220 120L220 98L160 98L160 92L220 92Z\" class=\"gfire\"/><path d=\"M220 70L380 70L380 92L440 92L440 98L380 98L380 120L220 120L220 98L160 98L160 92L220 92Z\" class=\"ln\"/><text x=\"120\" y=\"50\" text-anchor=\"middle\" class=\"sm\">上型</text><text x=\"120\" y=\"150\" text-anchor=\"middle\" class=\"sm\">下型</text><text x=\"300\" y=\"100\" text-anchor=\"middle\" class=\"sm\">製品部</text><line x1=\"60\" y1=\"24\" x2=\"60\" y2=\"84\" class=\"ln acs thick\" marker-end=\"url(#ah)\"/><line x1=\"442\" y1=\"95\" x2=\"524\" y2=\"95\" class=\"ln\"/><text x=\"528\" y=\"99\" text-anchor=\"start\" class=\"sm ac\">バリ</text><text x=\"300\" y=\"198\" text-anchor=\"middle\" class=\"sm\">すき間が狭く材料が逃げにくい→型内の圧力が上がり、隅まで充満する</text></svg>"}, "q-mforge-2": {"c": "鍛造した鋼の断面で、金属の流れ（鍛流線）が形に沿って曲がっている様子を見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Cross_section_of_forged_mild_steel.png/500px-Cross_section_of_forged_mild_steel.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Cross_section_of_forged_mild_steel.png?width=500", "p": "https://commons.wikimedia.org/wiki/File:Cross_section_of_forged_mild_steel.png"}, "q-mforge-3": {"c": "室温の線材を何段階かに分けて押しつぶし、ボルトの頭を成形していく冷間圧造の流れを見る", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Bolt_Forming.svg/500px-Bolt_Forming.svg.png", "u2": "https://commons.wikimedia.org/wiki/Special:FilePath/Bolt_Forming.svg?width=500", "p": "https://commons.wikimedia.org/wiki/File:Bolt_Forming.svg"}, "q-mforge-4": {"c": "はみ出した材料が倒れ込んで押しつぶされ、表面から内部へ重なり目（かぶり）が残る過程を見る", "svg": "<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/>
