 { id:'mcast', field:'mfg', icon:'🫗', title:'鋳造', sub:'砂型・金型重力・低圧・ダイカスト、湯口・押湯、凝固収縮、鋳巣（ガス・引け巣）・湯回り不良・湯境・割れ。例：クランクケース、シリンダー、キャストホイール', gram:`<h3>まず、これは何？</h3>
<p>鋳造（ちゅうぞう）は、金属を溶かして型に流し込み、冷やし固めて形をつくる加工法です。溶けた金属を工場では<strong>溶湯（ようとう）</strong>、略して「湯」と呼びます。複雑な形や、中が空洞の形を一度につくれるのが強みです。バイクでは<strong>クランクケース</strong>、シリンダー、シリンダーヘッド、キャストホイール、各種カバーなど、アルミ合金部品の多くが鋳造でつくられています。</p>
<h3>主な鋳造法</h3>
<div class="tblwrap"><table><thead><tr><th>工法</th><th>型と湯の入れ方</th><th>特徴</th><th>部品の例（一般に）</th></tr></thead><tbody>
<tr><td>砂型鋳造</td><td>砂を固めた型に重力で注ぐ。型は毎回壊す</td><td>大物・複雑形状・少量に向く。表面は粗め</td><td>試作品、大型部品</td></tr>
<tr><td>重力金型鋳造</td><td>金属の型に重力で注ぐ</td><td>冷えが速く組織が緻密。熱処理しやすい</td><td>シリンダーヘッド、ホイールなど</td></tr>
<tr><td>低圧鋳造</td><td>密閉した炉の湯を、わずかな空気圧で下から押し上げる</td><td>静かに満たすので空気を巻き込みにくい</td><td>アルミホイール（四輪で多い）</td></tr>
<tr><td>ダイカスト</td><td>湯を高速・高圧で金型に射出する</td><td>薄肉・高精度・大量生産向き。空気を巻き込みやすい</td><td>クランクケース、カバー類</td></tr>
</tbody></table></div>
<h3>湯の通り道と押湯</h3>
<p>湯は<strong>湯口</strong>から入り、湯道・堰（せき）を通って、製品の形をした空間（キャビティ）を満たします。この通り道の設計を「鋳造方案」といいます。金属は液体から固体になるとき体積が縮みます（<strong>凝固収縮</strong>）。縮んだ分を補うのが<strong>押湯</strong>で、製品部より遅く固まるよう太く設け、最後まで湯を送り込みます。「製品の先端から押湯へ向かって順に固める」のが理想で、これを指向性凝固と呼びます。</p>
<div class="figbox"><div class="ft">📐 鋳型の断面（湯の通り道）</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs><rect x="30" y="30" width="420" height="170" rx="4" class="bx"/><path d="M68 30L132 30L110 58L110 160L240 160L240 166L260 166L260 100L350 100L350 30L405 30L405 100L420 100L420 180L260 180L260 174L240 174L240 178L90 178L90 58Z" class="gfire"/><path d="M68 30L132 30L110 58L110 160L240 160L240 166L260 166L260 100L350 100L350 30L405 30L405 100L420 100L420 180L260 180L260 174L240 174L240 178L90 178L90 58Z" class="ln"/><line x1="100" y1="4" x2="100" y2="26" class="ln acs thick" marker-end="url(#ah)"/><line x1="100" y1="64" x2="100" y2="150" class="ln acs" marker-end="url(#ah)"/><line x1="118" y1="169" x2="232" y2="169" class="ln acs" marker-end="url(#ah)"/><line x1="268" y1="172" x2="300" y2="146" class="ln acs" marker-end="url(#ah)"/><line x1="377" y1="44" x2="377" y2="132" class="ln acs dash" marker-end="url(#ah)"/><text x="118" y="92" class="tt ac">①</text><text x="160" y="195" class="tt ac">②</text><text x="242" y="155" class="tt ac">③</text><text x="282" y="126" class="tt ac">④</text><text x="411" y="62" class="tt ac">⑤</text><text x="38" y="194" class="sm dim">鋳型</text><text x="462" y="52" class="sm">① 湯口：注ぎ入れる口</text><text x="462" y="80" class="sm">② 湯道：湯を運ぶ道</text><text x="462" y="108" class="sm">③ 堰：製品部への入口</text><text x="462" y="136" class="sm">④ キャビティ：製品形状</text><text x="462" y="164" class="sm">⑤ 押湯：縮み分を補給</text><text x="30" y="216" class="sm dim">押湯は製品部より遅く固まるよう太くし、凝固で縮む分の湯を送り込む（点線矢印）</text></svg></div></div>
<h3>代表的な鋳造欠陥</h3>
<div class="tblwrap"><table><thead><tr><th>欠陥</th><th>見た目</th><th>主な原因</th><th>主な対策</th></tr></thead><tbody>
<tr><td>ガス巣（ブローホール）</td><td>内面がなめらかな丸い穴</td><td>巻き込んだ空気、湯に溶けた水素、型から出るガス</td><td>脱ガス処理、ガス抜き、射出条件の見直し、真空ダイカスト</td></tr>
<tr><td>引け巣</td><td>内面がざらざらした不規則な空洞</td><td>凝固収縮の補給不足。厚肉部や最後に固まる所に出やすい</td><td>押湯・冷し金の追加、肉厚の均一化</td></tr>
<tr><td>湯回り不良</td><td>先端が欠けて形が出ない</td><td>湯温・型温が低い、流れが遅い、肉が薄すぎる</td><td>湯温・型温の管理、方案の変更</td></tr>
<tr><td>湯境</td><td>湯どうしが合流した所に残る線状のすじ</td><td>合流時に表面が冷えていて融け合わない</td><td>湯温・型温を上げる、合流位置を変える</td></tr>
<tr><td>割れ</td><td>線状のき裂</td><td>凝固・冷却中の収縮を型が拘束する</td><td>角に丸みをつける、冷え方をそろえる</td></tr>
</tbody></table></div>
<p>ガス巣と引け巣は、まとめて<strong>鋳巣</strong>（いす）と呼ばれます。見分ける目安は空洞の内面です。ガス巣は泡のように丸くなめらか、引け巣は樹の枝のような結晶（デンドライト）が見えてざらざらしています。</p>
<h3>品質の視点</h3>
<p>鋳巣は外から見えないことが多く、X線透過検査や断面観察で確かめます。クランクケースのようにオイルを溜める部品では、鋳巣が内側と外側につながると<strong>にじみ・漏れ</strong>になります。そのため気密（リーク）テストを行い、必要に応じて樹脂を染み込ませて微細な穴をふさぐ<strong>含浸処理</strong>をします。機械加工で表面を削ったら中の巣が現れた、というのもよくある不良です。</p>
<div class="pbox">鋳造は「型に流し込んで固める」工法です。不良の多くは「空気やガスが入った」「縮む分の湯が足りなかった」「冷えて流れきらなかった」の3つのどれかで説明できます。</div>
<div class="tbox">例えるなら、チョコレートを型に流して固めるのと同じです。勢いよく注ぐと泡を巻き込み（ガス巣）、途中で冷えると型の隅まで行き渡りません（湯回り不良）。2方向から流したチョコが合流部で筋になって残るのが湯境です。</div>
<div class="wbox">⚠️ ダイカスト品は内部に空気を含みやすいため、高温の熱処理や溶接をすると中のガスが膨らみ、表面がふくれる（ブリスター）ことがあります。熱処理や溶接をしたい部品には、真空ダイカストや重力金型鋳造などが選ばれます。</div>
<h3>覚えどころ</h3>
<ul><li>湯口→湯道→堰→キャビティ。押湯は縮み分の補給役</li><li>ガス巣は丸くなめらか、引け巣はざらざら</li><li>湯回り不良は「届かない」、湯境は「融け合わない」</li><li>オイルを溜める鋳物は気密テストと含浸処理</li></ul>` },
 { id:'mforge', field:'mfg', icon:'🔨', title:'鍛造', sub:'熱間・温間・冷間、型鍛造（バリ出し）、鍛流線（ファイバーフロー）と強度、欠陥（かぶり・欠肉・割れ）。例：クランクシャフト、コンロッド、鍛造ホイール', gram:`<h3>まず、これは何？</h3>
<p>鍛造（たんぞう）は、金属をハンマーやプレスで叩いたり押しつぶしたりして形をつくる加工法です。刀鍛冶が赤めた鉄を打つのと同じ原理で、形をつくると同時に、内部のすき間をつぶし、金属の組織を締めて強くします。バイクでは<strong>クランクシャフト</strong>やコンロッド、変速ギアの素材など、大きな力を繰り返し受ける部品の多くが鍛造でつくられます。軽さと強さを求める一部の高性能車には、アルミやマグネシウムの鍛造ホイールも使われます。</p>
<h3>温度による分類</h3>
<div class="tblwrap"><table><thead><tr><th>種類</th><th>温度</th><th>長所</th><th>短所</th></tr></thead><tbody>
<tr><td><strong>熱間鍛造</strong></td><td>再結晶温度より高い（鋼でおよそ1,000℃以上）</td><td>柔らかく、大きく変形できる</td><td>表面に酸化皮膜（スケール）ができ、寸法精度は低め</td></tr>
<tr><td>温間鍛造</td><td>熱間と冷間の中間（数百℃）</td><td>変形のしやすさと精度のバランスが良い</td><td>温度管理が難しい</td></tr>
<tr><td><strong>冷間鍛造</strong></td><td>室温</td><td>寸法精度が高く表面がきれい。加工硬化で強くなる</td><td>大きな力が要る。一度に大きく変形させると割れやすい</td></tr>
</tbody></table></div>
<p>クランクシャフトやコンロッドのような大物・複雑形状は熱間、ボルトなどの小物は冷間でつくるのが一般的です。</p>
<h3>型鍛造とバリ</h3>
<p>上下一対の金型で素材を挟んで押しつぶすのが<strong>型鍛造</strong>です。素材は少し多めに入れ、余った分は型の合わせ目（パーティングライン）のすき間から薄く押し出されます。これが<strong>バリ</strong>です。バリのすき間は狭く材料が逃げにくいので、型の中の圧力が上がり、材料が型の隅まで充満します。つまりバリは「失敗」ではなく、形を出すために<strong>わざと出すもの</strong>で、後工程の「バリ抜き（トリミング）」で切り取ります。</p>
<h3>鍛流線（ファイバーフロー）</h3>
<p>金属素材には、圧延などでできた繊維のような流れ（<strong>鍛流線</strong>）があります。鍛造では、この流れが製品の形に沿って曲がり、途切れずにつながります。一方、丸棒から削り出すと、肩や角で流れが切断されます。切れた端は疲労き裂の起点になりやすいため、繰り返し荷重を受けるクランクシャフトやコンロッドでは、鍛造が有利です。</p>
<div class="figbox"><div class="ft">📐 鍛流線：鍛造品と削り出し品の違い</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs><text x="155" y="36" text-anchor="middle" class="tt">型鍛造品</text><path d="M60 50L250 50L250 90L185 90L185 190L125 190L125 90L60 90Z" class="pst"/><path d="M62 56L248 56M155 188L155 72Q155 64 147 64L62 64M155 72Q155 64 163 64L248 64M143 188L143 84Q143 72 131 72L62 72M167 188L167 84Q167 72 179 72L248 72M133 188L133 92Q133 81 121 81L62 81M177 188L177 92Q177 81 189 81L248 81" class="ln acs"/><text x="155" y="210" text-anchor="middle" class="sm">鍛流線が形に沿って曲がり、途切れない</text><text x="455" y="36" text-anchor="middle" class="tt">丸棒からの削り出し</text><path d="M360 50L550 50L550 90L485 90L485 190L425 190L425 90L360 90Z" class="pst"/><path d="M370 52L370 88M387 52L387 88M404 52L404 88M421 52L421 88M438 52L438 188M455 52L455 188M472 52L472 188M489 52L489 88M506 52L506 88M523 52L523 88M540 52L540 88" class="ln acs"/><circle cx="425" cy="90" r="8" class="ln acs thick"/><circle cx="485" cy="90" r="8" class="ln acs thick"/><text x="414" y="116" text-anchor="end" class="sm ac">肩で繊維が切れる</text><text x="455" y="210" text-anchor="middle" class="sm">素材の繊維はまっすぐのまま、角で切断</text></svg></div></div>
<h3>代表的な鍛造欠陥</h3>
<div class="tblwrap"><table><thead><tr><th>欠陥</th><th>見た目</th><th>主な原因</th><th>主な対策</th></tr></thead><tbody>
<tr><td><strong>かぶり</strong>（ラップ）</td><td>材料が折れ重なってできた、しわ・すじ状の重なり</td><td>素材形状や型設計が悪く、材料が折り込まれる</td><td>予備成形の形状や型の見直し</td></tr>
<tr><td><strong>欠肉</strong></td><td>型の隅に材料が届かず形が欠ける</td><td>素材の重量不足、加熱温度不足、潤滑不良</td><td>素材重量・加熱温度の管理</td></tr>
<tr><td>割れ</td><td>表面や内部のき裂</td><td>温度が低すぎる、一度の変形量が大きすぎる</td><td>適正温度、工程を分けて少しずつ成形</td></tr>
<tr><td>型ずれ</td><td>上下の型の位置ずれによる段差</td><td>型の取付・ガイドの不良</td><td>型の芯合わせ、ガイドの点検</td></tr>
</tbody></table></div>
<h3>品質の視点</h3>
<p>かぶりや割れは、外観ではわかりにくい小さなものでも、使ううちに疲労き裂へ成長するおそれがあります。鋼の鍛造品では、表面のき裂を<strong>磁粉探傷検査</strong>で、内部を超音波探傷で調べます。断面を腐食液で処理すると鍛流線が浮かび上がるので、型の設計確認にも使われます。</p>
<div class="pbox">鍛造は「叩いて形をつくりながら、中身を締めて強くする」工法です。金属の繊維の流れを途切れさせないことが、強さの秘密です。</div>
<div class="tbox">例えるなら、木材の木目です。木目に沿った細い棒は折れにくいのに、木目を斜めに横切って切り出した棒は簡単に折れます。鍛造は、部品の形に合わせて木目そのものを曲げてつくるようなものです。</div>
<div class="wbox">⚠️ 「鍛造なら必ず強い」わけではありません。かぶりや割れが残っていれば、そこが弱点になり、かえって早く壊れます。工法の長所は、欠陥のない状態で初めて発揮されます。</div>
<h3>覚えどころ</h3>
<ul><li>熱間は大変形、冷間は高精度・加工硬化</li><li>型鍛造のバリは、型を満たすためにわざと出す</li><li>鍛流線が途切れない＝疲労に強い</li><li>かぶり＝折れ重なり、欠肉＝届かない</li></ul>` },
 { id:'mpress', field:'mfg', icon:'🗜️', title:'プレス加工', sub:'せん断（打抜き・穴あけ）とクリアランス・せん断面と破断面・バリ、曲げとスプリングバック、絞り（深絞り・しわ押さえ）としわ・割れ、順送型・トランスファー。例：燃料タンク、ブラケット、マフラー', gram:`<h3>まず、これは何？</h3>
<p>プレス加工は、金型を取り付けたプレス機で板材に大きな力をかけ、<strong>切る（せん断）・曲げる・絞る</strong>ことで形をつくる加工法です。同じ形を速く、ばらつき少なくつくれるため、大量生産に向きます。バイクでは、ブラケットやステー類、マフラーの外筒やカバー、そして多くの<strong>燃料タンク</strong>（鋼板を2つに分けて絞り成形し、溶接で合わせる）がプレスでつくられます。</p>
<h3>せん断：パンチとダイで切る</h3>
<p>上の刃（パンチ）と下の刃（ダイ）で板を挟み切ります。パンチとダイのすき間を<strong>クリアランス</strong>といい、一般に板厚の数％〜10％程度で、材料によって最適値が変わります。切り口を拡大すると、上から「ダレ（丸く引き込まれた縁）」「<strong>せん断面</strong>（刃で削がれた光る面）」「<strong>破断面</strong>（引きちぎれたざらざらの面）」「バリ（縁の突起）」が並びます。</p>
<div class="figbox"><div class="ft">📐 パンチ・ダイ・クリアランスと切り口</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs><rect x="100" y="20" width="80" height="75" class="pst"/><text x="140" y="62" text-anchor="middle" class="sm">パンチ</text><line x1="84" y1="24" x2="84" y2="86" class="ln acs thick" marker-end="url(#ah)"/><rect x="20" y="95" width="270" height="18" class="bx"/><text x="26" y="108" class="sm">板材</text><rect x="20" y="113" width="68" height="60" class="pst"/><rect x="192" y="113" width="98" height="60" class="pst"/><text x="54" y="148" text-anchor="middle" class="sm">ダイ</text><text x="241" y="148" text-anchor="middle" class="sm">ダイ</text><line x1="100" y1="95" x2="100" y2="192" class="ln dash"/><line x1="88" y1="173" x2="88" y2="192" class="ln dash"/><line x1="72" y1="186" x2="87" y2="186" class="ln acs" marker-end="url(#ah)"/><line x1="116" y1="186" x2="101" y2="186" class="ln acs" marker-end="url(#ah)"/><text x="94" y="208" text-anchor="middle" class="sm ac">クリアランス</text><text x="330" y="30" class="tt">穴の側の切り口（拡大）</text><text x="340" y="62" class="sm dim">パンチ側の面</text><path d="M340 70L458 70Q470 70 470 84L470 112L467 118L469 124L465 130L467 136L462 142L463 148L462 150L463 163L456 150L340 150Z" class="bx"/><text x="340" y="176" class="sm dim">ダイ側の面</text><line x1="470" y1="76" x2="488" y2="76" class="ln"/><text x="492" y="80" class="sm">ダレ</text><line x1="474" y1="98" x2="488" y2="98" class="ln"/><text x="492" y="102" class="sm">せん断面（光る）</text><line x1="471" y1="132" x2="488" y2="132" class="ln"/><text x="492" y="136" class="sm">破断面（粗い）</text><line x1="466" y1="160" x2="488" y2="160" class="ln"/><text x="492" y="164" class="sm ac">バリ</text><text x="330" y="204" class="sm dim">抜き落ちた側では、ダレとバリの面が逆になる</text></svg></div></div>
<div class="tblwrap"><table><thead><tr><th>クリアランス</th><th>切り口の状態</th></tr></thead><tbody>
<tr><td>適正</td><td>せん断面と破断面がそろい、バリが小さい</td></tr>
<tr><td>大きすぎ</td><td>ダレとバリが大きく、破断面が広くなる</td></tr>
<tr><td>小さすぎ</td><td>せん断面が2段になる（二次せん断面）。抜く力と工具摩耗が増える</td></tr>
</tbody></table></div>
<p>刃先が摩耗して丸くなっても、バリは大きくなります。そのため、バリの高さは金型を再研磨する時期の目安になります。</p>
<h3>曲げとスプリングバック</h3>
<p>曲げると、外側は引っ張られ、内側は縮められます。力を抜くと、弾性で角度が少し戻ります。これが<strong>スプリングバック</strong>で、強度の高い材料（高張力鋼板など）ほど大きくなります。対策は、戻る分を見込んで曲げすぎる、底まで強く押し当てて曲げ部を落ち着かせる、などです。曲げの割れは引っ張られる<strong>外側</strong>に出やすく、曲げ半径が小さすぎるときや、曲げ線が板の圧延方向と平行なときに起こりやすくなります。</p>
<h3>絞り：平板から容器をつくる</h3>
<p>平らな板（ブランク）をパンチでダイの穴に押し込み、カップ状にするのが絞りで、深いものを<strong>深絞り</strong>といいます。外周部（フランジ）は円周方向に縮められながら中へ流れ込むため、波打って<strong>しわ</strong>になろうとします。これを防ぐのが<strong>しわ押さえ</strong>です。押さえる力が弱いとしわ、強すぎると材料が流れ込めず、引き伸ばされた壁が<strong>パンチ肩の近くで割れ</strong>ます。深いものは一度に絞らず、何回かに分けて絞ります。</p>

<h3>金型の形式</h3>
<div class="tblwrap"><table><thead><tr><th>形式</th><th>しくみ</th><th>向く部品</th></tr></thead><tbody>
<tr><td><strong>順送型</strong></td><td>帯状の材料を送りながら、1つの金型の中で穴あけ・曲げ・切り離しを順に行う</td><td>ブラケットなどの小物の大量生産</td></tr>
<tr><td>トランスファー</td><td>切り離した材料を、搬送装置で工程から工程へ移す</td><td>大きめの部品、深い絞り品</td></tr>
</tbody></table></div>
<h3>品質の視点</h3>
<p>バリは手を切るだけでなく、組付け不良や塗装不良の原因になります。燃料タンクのような絞り品では、割れや板厚の減りすぎが漏れにつながるため、溶接後の気密テストが欠かせません。スプリングバックによる寸法ずれは、検査治具での確認が基本です。</p>
<div class="pbox">プレスは「切る・曲げる・絞る」の3つ。切ればバリ、曲げれば戻り（スプリングバック）、絞ればしわと割れが、それぞれの代表的な不良です。</div>
<div class="tbox">例えるなら、クッキーの型抜きがせん断、プラスチックの下敷きを曲げて手を離すと少し戻るのがスプリングバックです。アルミ箔をコップの底に押し付けてお椀を作ると、縁がしわしわになりますね。それが絞りのしわです。</div>
<div class="wbox">⚠️ バリの出る面は、どちらを製品にするかで逆になります。穴をあけて板を残すなら、バリはダイ側の面に出ます。抜き落ちた側を製品にする場合はパンチ側の面です。図面のバリ方向の指示を確認しましょう。</div>
<h3>覚えどころ</h3>
<ul><li>切り口はダレ→せん断面→破断面→バリ</li><li>クリアランス過大でバリ大、刃先摩耗でもバリ大</li><li>スプリングバックは高強度材ほど大きい。曲げ割れは外側</li><li>しわ押さえ：弱いとしわ、強いと割れ</li></ul>` },
 { id:'mmach', field:'mfg', icon:'⚙️', title:'機械加工', sub:'旋削・フライス・穴あけ・タップ・研削・ホーニング（クロスハッチ）、マシニングセンタ、公差・はめあい（すきま・しまり）、表面粗さRa、幾何公差の考え方、工具摩耗と寸法変化', gram:`<h3>まず、これは何？</h3>
<p>機械加工は、刃物（工具）で余分な部分を削り取り、寸法と面を仕上げる加工です。鋳造品や鍛造品も、そのままでは精度が足りないため、合わせ面・軸受けの穴・ねじ穴など大事な部分は最後に機械加工します。クランクケースの合わせ面、シリンダーの内面、クランクシャフトの軸受け部（ジャーナル）などが代表例です。</p>
<h3>主な加工法</h3>
<div class="tblwrap"><table><thead><tr><th>加工法</th><th>動き</th><th>用途・部品の例（一般に）</th></tr></thead><tbody>
<tr><td>旋削</td><td>工作物が回り、刃物（バイト）を当てる</td><td>丸い部品の外径・内径・端面。アクスルシャフト、カラー</td></tr>
<tr><td>フライス</td><td>刃物が回り、工作物を送る</td><td>平面・溝・段差。ケースの合わせ面</td></tr>
<tr><td>穴あけ・リーマ</td><td>ドリルで穴をあけ、リーマで精度よく仕上げる</td><td>ボルト穴、ピン穴</td></tr>
<tr><td>タップ</td><td>穴の内側にめねじを切る</td><td>ケースのねじ穴</td></tr>
<tr><td>研削</td><td>高速で回る砥石で少しずつ削る</td><td>硬い面の高精度仕上げ。ジャーナル、カム</td></tr>
<tr><td><strong>ホーニング</strong></td><td>砥石を回しながら穴の中を往復させる</td><td>シリンダー内面の仕上げ</td></tr>
</tbody></table></div>
<p>ホーニングでは、回転と往復の組み合わせで、斜めに交差する細かい筋（<strong>クロスハッチ</strong>）が残ります。この溝がオイルを保持し、ピストンリングの潤滑となじみを助けます。<strong>マシニングセンタ</strong>は、工具を自動で交換しながらフライス・穴あけ・タップなどを1台で連続して行えるNC工作機械で、クランクケースのような複雑な部品の加工に使われます。</p>
<h3>公差とはめあい</h3>
<p>図面の寸法には、許される範囲（公差）があります。穴と軸を組み合わせるときの関係を<strong>はめあい</strong>といい、3種類あります。回ったり滑ったりする部分は<strong>すきまばめ</strong>、軸受を圧入して固定する部分などは<strong>しまりばめ</strong>が使われます。</p>
<div class="figbox"><div class="ft">📐 穴と軸の公差域（はめあいの3種類）</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs><line x1="60" y1="110" x2="585" y2="110" class="ln dash"/><text x="6" y="114" class="sm">基準寸法</text><text x="30" y="62" class="sm dim">＋側</text><text x="30" y="160" class="sm dim">−側</text><text x="145" y="28" text-anchor="middle" class="tt">すきまばめ</text><rect x="95" y="80" width="40" height="30" class="bx"/><text x="115" y="99" text-anchor="middle" class="sm">穴</text><rect x="155" y="122" width="40" height="30" class="pst"/><text x="175" y="141" text-anchor="middle" class="sm">軸</text><text x="145" y="182" text-anchor="middle" class="sm">いつもすき間</text><text x="145" y="200" text-anchor="middle" class="sm dim">例：回転・しゅう動部</text><text x="325" y="28" text-anchor="middle" class="tt">中間ばめ</text><rect x="275" y="80" width="40" height="30" class="bx"/><text x="295" y="99" text-anchor="middle" class="sm">穴</text><rect x="335" y="95" width="40" height="30" class="pst"/><text x="355" y="114" text-anchor="middle" class="sm">軸</text><text x="325" y="182" text-anchor="middle" class="sm">すき間にも締まりにも</text><text x="325" y="200" text-anchor="middle" class="sm dim">実寸の組み合わせ次第</text><text x="505" y="28" text-anchor="middle" class="tt">しまりばめ</text><rect x="455" y="80" width="40" height="30" class="bx"/><text x="475" y="99" text-anchor="middle" class="sm">穴</text><rect x="515" y="45" width="40" height="30" class="pst"/><text x="535" y="64" text-anchor="middle" class="sm">軸</text><text x="505" y="182" text-anchor="middle" class="sm">いつも締まる</text><text x="505" y="200" text-anchor="middle" class="sm dim">例：軸受の圧入</text></svg></div></div>
<h3>表面粗さと幾何公差</h3>
<p><strong>表面粗さ</strong>は面の細かい凸凹の大きさで、代表的な指標が算術平均粗さRa（単位μm）です。数値が小さいほどなめらかです。ただし寸法と粗さが合格でも、穴が楕円だったり面が反っていたりすれば組み付けで困ります。そこで、形や位置の狂いの許容範囲を指定するのが<strong>幾何公差</strong>です。真円度・平面度（形）、平行度・直角度（向き）、同軸度・位置度（位置）、振れなどがあり、基準となる面や軸（データム）に対して指定します。</p>
<h3>工具摩耗と寸法変化・加工不良</h3>
<p>刃先は使うほど摩耗して後退し、削る量が減ります。そのため旋削では、<strong>外径はだんだん大きく、内径はだんだん小さく</strong>なる方向にずれます。この変化は一方向にじわじわ進むので、管理図では「連続して上がる（下がる）」傾向として現れます。工具の交換時期の管理や、刃先位置の補正で対応します。また、加工直後の部品は熱で膨らんでいるため、熱いまま測ると冷えた後より大きく出ます。</p>
<div class="tblwrap"><table><thead><tr><th>不良</th><th>主な原因</th><th>対策の例</th></tr></thead><tbody>
<tr><td>寸法のずれ</td><td>工具摩耗、熱変形</td><td>工具寿命管理、補正、測定温度の管理</td></tr>
<tr><td>びびりマーク</td><td>工具・工作物の振動</td><td>突き出しを短く、固定を強化、条件変更</td></tr>
<tr><td>面荒れ（構成刃先）</td><td>柔らかい材料が刃先に溶着する</td><td>切削速度・工具・切削油の見直し</td></tr>
<tr><td>加工面の巣</td><td>鋳物の内部の鋳巣が削って現れる</td><td>鋳造側の対策、検査基準の設定</td></tr>
</tbody></table></div>
<div class="pbox">機械加工は「最後の仕上げ」です。寸法（どのくらいの大きさか）、粗さ（どのくらいなめらかか）、幾何公差（形や位置が正しいか）の3つで品質を表します。</div>
<div class="tbox">例えるなら、はめあいはペンとキャップの関係です。すきまばめはすっと抜き差しできるキャップ、しまりばめは一度押し込むと簡単には抜けないキャップです。工具摩耗は、使うほど丸くなる鉛筆の芯のようなもので、同じ力で書いても線の太さが少しずつ変わっていきます。</div>
<div class="wbox">⚠️ 外径が規格の中でも、少しずつ同じ方向へ動いていれば、それは工具摩耗のサインかもしれません。「規格内だから問題なし」ではなく、傾向を見ることが大切です。</div>
<h3>覚えどころ</h3>
<ul><li>シリンダー内面はホーニング、クロスハッチが油を保持</li><li>すきま・中間・しまりの3つのはめあい</li><li>Raは小さいほどなめらか、幾何公差は形と位置</li><li>工具摩耗で外径は大、内径は小へ</li></ul>` }
);

   why:['引け巣の内面はざらざらしていることが多く、「なめらかな丸い空洞」とは特徴が合いません。','割れは線状のき裂として現れ、丸い空洞にはなりません。','内面がなめらかで丸い空洞はガス巣の特徴です。高速射出のダイカストは空気を巻き込みやすく、ガス抜きや真空ダイカストが有効なので、正解です。','湯回り不良は形の一部が欠ける不良で、内部の丸い空洞にはなりません。'],
   exp:'空洞の内面が「なめらかで丸い」ならガス巣、「ざらざらで不規則」なら引け巣が疑われます。ダイカストは高速射出のため空気を巻き込みやすく、加工面に巣が出ると漏れにつながります。応急的には含浸処理で漏れを止める方法もあります。',
   plain:'空洞の見た目という手がかりから、欠陥の種類を見分け、原因に合った対策を選ぶ問題です。',
   tatoe:'例えるなら、医者が症状から病名を推理するのと同じです。「丸くなめらか」という所見が、ガスが原因だという決め手になります。病名を間違えれば、薬（対策）も効きません。' },

 { id:'q-mforge-1', unit:'mforge', lv:1, stem:'型鍛造で、上下の型の合わせ目からはみ出してできる薄い余肉を何と呼びますか。', choices:['スケール','押湯','バリ','鍛流線'], answer:3,
   why:['スケールは加熱で表面にできる酸化皮膜のことです。','押湯は鋳造で縮み分を補給する湯の貯めで、鍛造の用語ではありません。','型の合わせ目から押し出された薄い余肉がバリで、正解です。後でバリ抜きで取り除きます。','鍛流線は金属内部の繊維状の流れのことです。'],
   exp:'型鍛造では素材を少し多めに入れ、余りをバリとして逃がします。バリのすき間が狭いことで型内の圧力が上がり、材料が型の隅まで充満します。',
   plain:'型で押しつぶしたとき、型の外へはみ出す薄い部分の名前を問う問題です。',
   tatoe:'例えるなら、たい焼きの型からはみ出た生地の「羽根」です。生地を少し多めに入れるから、型の隅まで中身がしっかり詰まります。' },
 { id:'q-mforge-2', unit:'mforge', lv:1, stem:'鍛造品で、鍛流線（ファイバーフロー）が形に沿って途切れずにつながっていることの主な利点はどれですか。', choices:['表面が鏡のようになめらかになる','部品の重さが大幅に軽くなる','磁石につかなくなる','疲労強度や粘り強さが高まる'], answer:4,
   why:['表面のなめらかさは研削や研磨などで決まり、鍛流線の利点ではありません。','重さは材料と形状で決まり、鍛流線がつながっても大幅には変わりません。','鍛流線は磁性とは関係ありません。','繊維の流れが途切れないと、き裂の起点ができにくく、繰り返し荷重に強くなるので、正解です。'],
   exp:'鍛流線が切れた端は、疲労き裂の起点になりやすい場所です。形に沿って流れが続く鍛造品は、繰り返し大きな力を受けるクランクシャフトやコンロッドに向いています。',
   plain:'金属内部の「繊維の流れ」が切れずに続いていると、何が良いのかを問う問題です。',
   tatoe:'例えるなら、木目に沿って割った割り箸は折れにくく、木目が斜めに走る割り箸はすぐ折れます。繊維がつながっていることが強さの源です。' },
 { id:'q-mforge-3', unit:'mforge', lv:2, polarity:'correct', stem:'熱間鍛造と冷間鍛造に関する記述として、正しいものはどれですか。', choices:['熱間鍛造は、再結晶温度より低い温度で行う鍛造である。','冷間鍛造は、熱間鍛造より小さな力で大きく変形させることができる。','冷間鍛造は室温で行い、寸法精度と表面のきれいさに優れる。','熱間鍛造品の表面には酸化皮膜ができないため、後加工は不要である。'], answer:3,
   why:['熱間鍛造は再結晶温度より高い温度で行うので、誤りです。','冷間鍛造は材料が硬いため、大きな力が必要で、大きな変形は苦手です。誤りです。','冷間鍛造は室温で行い、スケールができず寸法精度と表面のきれいさに優れるので、正しい記述です。','高温の熱間鍛造ではスケール（酸化皮膜）ができ、精度も低めなので、多くは後で機械加工します。誤りです。'],
   exp:'熱間鍛造は柔らかい状態で大きく変形でき、冷間鍛造は精度と表面に優れて加工硬化で強くなります。大物・複雑形状は熱間、ボルトなどの小物は冷間が一般的です。',
   plain:'金属を熱してから叩くか、室温のまま押すかで、何が違うのかを問う問題です。',
   tatoe:'例えるなら、熱間は温めて柔らかくした粘土、冷間は冷蔵庫から出したばかりの硬いバターです。柔らかい粘土は大きく形を変えやすく、硬いバターは力が要るぶん、押した形がきっちり残ります。' },
 { id:'q-mforge-4', unit:'mforge', lv:2, polarity:'wrong', stem:'鍛造欠陥に関する記述として、誤っているものはどれですか。', choices:['かぶりは、材料が折れ重なってできる欠陥で、疲労き裂の起点になりやすい。','かぶりは表面にできる薄い余肉なので、外観を整えれば強度には影響しない。','欠肉は、材料が型の隅まで満たされずに形が欠ける欠陥である。','鍛造の割れは、加工温度が低すぎたり、一度の変形量が大きすぎたりすると起こりやすい。'], answer:2,
   why:['かぶりは材料の折れ重なりで、重なり目がき裂の起点になりやすいので、正しい記述です。','かぶりは表面だけの余肉ではなく、内部へ食い込んだ折れ重なりです。外観を整えても重なり目は残り、強度を下げるので、誤りです。','型の隅に材料が届かず形が欠けるのが欠肉なので、正しい記述です。','温度不足や過大な変形は割れの代表的な原因なので、正しい記述です。'],
   exp:'かぶりは「折れ込み」なので、見た目をきれいにしても内部の重なり目は消えません。予備成形の形や型設計を見直し、材料の流れ方そのものを直すのが対策です。',
   plain:'鍛造でできる不良それぞれの正体と、強度への影響を正しく理解しているかを問う問題です。',
   tatoe:'例えるなら、紙を折り込んでしまったまま上から押し固めた紙粘土です。表面をなでて平らにしても、中の折り目から割れが始まります。' },
 { id:'q-mforge-5', unit:'mforge', lv:3, stem:'同じ鋼材・同じ形状のコンロッドを、丸棒からの削り出しと型鍛造でつくりました。繰り返し荷重に対する強さの違いの説明として、最も適切なものはどれですか。', choices:['型鍛造品は鍛流線が形に沿ってつながるため、肩や穴の周りでも流れが切れず、疲労に強くなりやすい','削り出し品は削るときに加工硬化するため、どんな形でも鍛造品より疲労に強い','鍛造品はバリが残るため、削り出し品より必ず疲労に弱い','材料が同じなら内部の流れは関係なく、疲労強度に差は出ない'], answer:1,
   why:['鍛造では繊維状の流れが形に沿って曲がり、き裂の起点となる流れの切れ端が表面に出にくいため、正解です。','削ったときの表面の加工硬化はごく浅く、肩などで鍛流線が切れる不利を一般に打ち消せません。','バリはバリ抜きで取り除くので、鍛造品が必ず弱いということはありません。','同じ材料でも、内部の流れの向きと切れ方で疲労強度は変わります。'],
   exp:'丸棒から削り出すと、素材の繊維はまっすぐのまま、肩や穴の縁で切断されます。その切れ端が表面に並ぶ場所は、疲労き裂が始まりやすくなります。これが、コンロッドやクランクシャフトに鍛造が多い理由です。',
   plain:'同じ材料でもつくり方によって、くり返しの力に対する強さが変わる理由を問う問題です。',
   tatoe:'例えるなら、ロープです。1本のロープを曲げて輪にすれば丈夫ですが、まっすぐなロープの束から輪の形に切り抜くと、切り口の繊維がほつれてそこから切れます。' },

 { id:'q-mpress-1', unit:'mpress', lv:1, stem:'深絞りで、フランジ部（外周部）を押さえてしわの発生を防ぐ部品はどれですか。', choices:['しわ押さえ（ブランクホルダー）','ストリッパー','ノックアウト','パイロット'], answer:1,
   why:['フランジを押さえて、円周方向に縮められる材料が波打つのを防ぐ部品で、正解です。','ストリッパーは、パンチに付いた材料を引きはがす部品です。','ノックアウトは、型の中に残った製品を押し出す部品です。','パイロットは、順送型で材料の穴に入って位置を合わせるピンです。'],
   exp:'絞りでは、フランジの材料が中へ流れ込みながら円周方向に縮められるため、しわになろうとします。しわ押さえで適度な力をかけて押さえることで、しわを防ぎながら材料を流し込みます。',
   plain:'板からカップを絞るとき、外周が波打つのを防ぐために板を上から押さえる部品の名前を問う問題です。',
   tatoe:'例えるなら、テーブルクロスを手で押さえながらゆっくり引くようなものです。押さえないとしわが寄り、強く押さえすぎると布が動かずに破れてしまいます。' },
 { id:'q-mpress-2', unit:'mpress', lv:1, stem:'板を曲げ加工したあと、力を抜くと弾性によって曲げ角度が少し戻る現象を何と呼びますか。', choices:['ダレ','スプリングバック','二次せん断','加工硬化'], answer:2,
   why:['ダレは、せん断した切り口の縁が丸く引き込まれた部分のことです。','曲げた後の弾性回復で角度が戻る現象がスプリングバックで、正解です。','二次せん断は、クリアランスが小さすぎるときにせん断面が2段になる現象です。','加工硬化は、変形させることで金属が硬くなる現象で、角度が戻る現象ではありません。'],
   exp:'スプリングバックは強度の高い材料ほど大きくなります。戻る分を見込んで曲げすぎる、底まで強く押し当てる、などで対策します。',
   plain:'曲げた板が、手を離すとちょっと元に戻ってしまう現象の名前を問う問題です。',
   tatoe:'例えるなら、プラスチックの下敷きを曲げて手を離すと、少し元に戻るのと同じです。狙った角度にするには、少し深めに曲げておく必要があります。' },
 { id:'q-mpress-3', unit:'mpress', lv:2, polarity:'wrong', stem:'せん断加工（打抜き・穴あけ）に関する記述として、誤っているものはどれですか。', choices:['せん断の切り口には、光沢のあるせん断面と、ざらざらした破断面が並ぶ。','クリアランスが大きすぎると、ダレやバリが大きくなりやすい。','パンチやダイの刃先が摩耗すると、バリは大きくなる傾向がある。','クリアランスは小さければ小さいほど、工具が長持ちし、切り口も良くなる。'], answer:4,
   why:['刃で削がれた光る面と、引きちぎれたざらざらの面が並ぶのは、せん断の切り口の特徴で、正しい記述です。','すき間が大きいと材料が引き込まれてから破断するため、ダレとバリが大きくなり、正しい記述です。','刃先が丸くなると材料がきれいに切れず、バリが大きくなるので、正しい記述です。','クリアランスが小さすぎると二次せん断面が出て、抜く力や工具摩耗も増えます。小さいほど良いわけではないので、誤りです。'],
   exp:'クリアランスには材料ごとの適正範囲があり、一般に板厚の数％〜10％程度です。大きすぎるとバリ・ダレが増え、小さすぎると二次せん断面や工具摩耗が増えます。',
   plain:'パンチとダイのすき間（クリアランス）や刃先の状態が、切り口にどう影響するかを問う問題です。',
   tatoe:'例えるなら、ハサミの刃のかみ合わせです。刃の間が開きすぎていると紙がちぎれてギザギザになり、きつすぎると重くて刃が早く傷みます。ほどよいすき間が一番きれいに切れます。' },
 { id:'q-mpress-4', unit:'mpress', lv:2, polarity:'correct', stem:'深絞り加工に関する記述として、正しいものはどれですか。', choices:['しわ押さえ力を弱めるほど、フランジのしわは減る。','深絞りの割れは、主にフランジの外周端で起こる。','深い容器は、1回の工程で一気に絞るのが基本である。','しわ押さえ力が強すぎると材料が流れ込みにくくなり、パンチ肩の近くで割れやすくなる。'], answer:4,
   why:['しわ押さえ力を弱めると、フランジは押さえられずに波打ちやすくなるので、誤りです。','深絞りの割れは、引き伸ばされて薄くなるパンチ肩付近の壁で起こりやすいので、誤りです。','一度に深く絞ると割れるため、何回かに分けて絞るのが基本です。誤りです。','材料が流れ込めないと壁が引き伸ばされて薄くなり、パンチ肩付近でちぎれるので、正しい記述です。'],
   exp:'しわ押さえ力は「弱いとしわ、強いと割れ」というトレードオフです。適正な力と潤滑で、材料をほどよく流し込むことが品質の鍵になります。',
   plain:'カップを絞るとき、板の押さえ方によって、しわと割れのどちらが出るかを問う問題です。',
   tatoe:'例えるなら、靴下をはくときです。足を入れる口を強く握りすぎると生地がつっぱって破れそうになり、緩く持つとたるんでしわが寄ります。' },
 { id:'q-mpress-5', unit:'mpress', lv:3, stem:'順送型でつくっている鋼板ブラケットの打抜き部で、バリの高さが日を追って少しずつ大きくなってきました。材料や設備の条件は変わっていません。最も考えられる原因と対策はどれですか。', choices:['スプリングバックが大きくなった。曲げ角度を見込んで深くする','しわ押さえ力が不足している。しわ押さえ力を上げる','パンチやダイの刃先が摩耗した。刃先を再研磨し、ショット数で研磨時期を管理する','材料の圧延方向が変わった。材料の向きを変える'], answer:3,
   why:['スプリングバックは曲げ角度の戻りで、打抜き部のバリとは関係ありません。','しわ押さえは絞り加工の要素で、打抜きのバリの原因ではありません。','条件が変わらないのにバリが徐々に大きくなるのは、刃先の摩耗の典型的なサインです。再研磨とショット数での管理が有効なので、正解です。','材料の条件は変わっていないとされており、少しずつ進む変化の説明になりません。'],
   exp:'刃先摩耗は使うほど一方向に進むため、バリ高さもじわじわ大きくなります。バリ高さを定期的に測り、金型のショット数と結びつけて再研磨の時期を決めるのが現場の基本です。',
   plain:'ほかの条件は同じなのに、時間とともにバリが少しずつ大きくなるとき、何を疑うべきかを問う問題です。',
   tatoe:'例えるなら、包丁でトマトを切り続けると、だんだん皮がつぶれて切り口が汚くなるのと同じです。食材が同じなら、変わったのは刃の切れ味です。' },

 { id:'q-mmach-1', unit:'mmach', lv:1, stem:'シリンダーの内面を、砥石を回転させながら往復させて仕上げ、斜めに交差する細かい筋（クロスハッチ）を残す加工はどれですか。', choices:['旋削','タップ','フライス','ホーニング'], answer:4,
   why:['旋削は工作物を回してバイトで削る加工で、クロスハッチはできません。','タップは穴にめねじを切る加工です。','フライスは回転する刃物で平面や溝を削る加工です。','砥石の回転と往復でクロスハッチを残すのがホーニングで、正解です。'],
   exp:'ホーニングで残るクロスハッチの細かい溝はオイルを保持し、ピストンリングの潤滑となじみを助けます。真円度や円筒度を整える役目もあります。',
   plain:'エンジンのシリンダーの内側を仕上げる、網目模様が残る加工の名前を問う問題です。',
   tatoe:'例えるなら、スポンジの表面のようなものです。つるつるの面より、細かい溝がある面のほうが水（オイル）をよく保てます。' },
 { id:'q-mmach-2', unit:'mmach', lv:1, stem:'穴の最小寸法より軸の最大寸法が小さく、組み合わせると必ずすき間ができるはめあいはどれですか。', choices:['しまりばめ','すきまばめ','中間ばめ','焼きばめ'], answer:2,
   why:['しまりばめは、軸が穴より必ず大きく、締まって組み合わさるはめあいです。','どの組み合わせでも必ずすき間ができるのがすきまばめで、正解です。','中間ばめは、実際の寸法によって、すき間にも締まりにもなるはめあいです。','焼きばめは、穴側を加熱して膨らませ、しまりばめの部品を組み付ける方法です。'],
   exp:'はめあいは、すきまばめ・中間ばめ・しまりばめの3種類です。回転や摺動する部分にはすきまばめ、軸受を圧入して固定する部分などにはしまりばめが使われます。',
   plain:'穴と軸の寸法の関係から、いつでもすき間ができる組み合わせの名前を問う問題です。',
   tatoe:'例えるなら、すっと抜き差しできるペンのキャップです。どのペンとどのキャップを組み合わせても、ゆるく入ります。' },
 { id:'q-mmach-3', unit:'mmach', lv:2, polarity:'correct', stem:'表面粗さと仕上げ面に関する記述として、正しいものはどれですか。', choices:['Raの単位は、一般にmm（ミリメートル）で表す。','算術平均粗さRaの数値が小さいほど、面はなめらかである。','表面粗さが小さければ、真円度や平面度も必ず良い。','ホーニングのクロスハッチは、オイルを保持させないよう面を鏡のようにする目的で付ける。'], answer:2,
   why:['Raは一般にμm（マイクロメートル）で表すので、誤りです。','Raは凸凹の平均的な大きさを表すので、小さいほどなめらかで、正しい記述です。','粗さは細かい凸凹の指標で、楕円や反りなど形の狂いは別に幾何公差で管理します。誤りです。','クロスハッチはオイルを保持させるための筋なので、誤りです。'],
   exp:'寸法・表面粗さ・幾何公差は、それぞれ別の品質特性です。粗さが良くても、穴が楕円なら真円度で不合格になりえます。',
   plain:'面のなめらかさを表す数値の読み方と、ほかの精度との関係を問う問題です。',
   tatoe:'例えるなら、表面粗さは紙やすりの目の細かさ、幾何公差は板が反っていないかどうかです。きめ細かく磨いた板でも、反っていればテーブルには使えません。' },
 { id:'q-mmach-4', unit:'mmach', lv:2, polarity:'wrong', stem:'機械加工の方法に関する記述として、誤っているものはどれですか。', choices:['旋削は、工作物を回転させ、バイトを当てて削る加工である。','タップは、穴の内面を砥石で鏡のように仕上げる加工である。','フライス加工は、回転する刃物で平面や溝を削る加工である。','マシニングセンタは、工具を自動で交換しながら、穴あけやフライス加工を連続して行える。'], answer:2,

 { id:'mweld', field:'mfg', icon:'🔥', title:'溶接・接合', sub:'アーク溶接・スポット溶接・ろう付け、溶接欠陥とひずみ', gram:`<h3>まず、これは何？</h3>
<p><strong>溶接</strong>は、金属どうしを熱で溶かして一体にする接合法です。ボルト締結と違い、つなぎ目が「母材と同じ金属の連続」になるため、軽くて強い構造をつくれます。オートバイでは、パイプや板を組み合わせたフレーム、スイングアーム、燃料タンク、マフラー、各種ブラケットなど、骨格の多くが溶接でできています。</p>
<p>一方で、溶接は「その場で小さな鋳造をしている」ようなものです。溶けて固まる部分（<strong>溶接金属</strong>）には気泡や割れが入りやすく、周りには熱で性質が変わった部分ができ、冷えるときの縮みで部品がゆがみます。外から見えにくい不良が多いため、品質管理の重点工程になります。</p>
<h3>主な溶接・接合の方法</h3>
<div class="tblwrap"><table><thead><tr><th>方法</th><th>しくみ</th><th>バイク部品での使われ方（一般例）</th></tr></thead><tbody>
<tr><td>MAG溶接</td><td>ワイヤ（電極兼溶加材）を自動で送り、炭酸ガスやアルゴン＋炭酸ガスでアークを守る</td><td>鋼管フレーム、鋼製ブラケット、スタンドなど</td></tr>
<tr><td>MIG溶接</td><td>しくみはMAGと同じで、シールドガスにアルゴンなどの不活性ガスを使う</td><td>アルミフレーム、アルミスイングアームなど</td></tr>
<tr><td>TIG溶接</td><td>溶けないタングステン電極でアークを出し、溶加棒を別に足す。アルゴンでシールド</td><td>ステンレスやチタンのマフラー、外観が重視される継手、薄板</td></tr>
<tr><td>スポット溶接</td><td>重ねた薄板を銅電極で挟み、大電流を流した抵抗発熱で点状に溶かす（抵抗溶接）</td><td>プレス板金のブラケット類など</td></tr>
<tr><td>シーム溶接</td><td>電極を円盤状のローラーにし、抵抗溶接を線状に連続させる</td><td>鋼板燃料タンクのフランジ（合わせ目）など</td></tr>
<tr><td>ろう付け</td><td>母材は溶かさず、母材より融点の低い<strong>ろう材</strong>を溶かしてすき間に流し込む</td><td>アルミラジエーターのコア、配管の継手など</td></tr>
</tbody></table></div>
<p>量産では、同じ動きを正確に繰り返せる<strong>ロボット溶接</strong>が中心です。ただしロボットは「決められた場所」を溶かすだけなので、部品の寸法ばらつきや治具のずれでねらい位置が外れると、そのまま不良になります。部品精度と治具の管理が品質を左右します。</p>
<h3>溶接部の断面</h3>
<div class="figbox"><div class="ft">📐 突合せ溶接の断面（溶接金属・熱影響部・母材）</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs><rect x="60" y="110" width="480" height="40" class="pst"/><path d="M238 110 L362 110 L328 150 L272 150 Z" class="gmix"/><path d="M262 110 Q300 86 338 110 L310 150 Q300 158 290 150 Z" class="gfire"/><path d="M262 110 Q300 86 338 110 L310 150 Q300 158 290 150 Z" class="ln"/><path d="M238 110 L272 150 M362 110 L328 150" class="ln dash"/><text x="120" y="100" text-anchor="middle" class="sm">母材</text><text x="480" y="100" text-anchor="middle" class="sm">母材</text><line x1="300" y1="44" x2="300" y2="104" class="ln acs" marker-end="url(#ah)"/><text x="300" y="36" text-anchor="middle" class="tt">溶接金属（いったん溶けて固まった部分）</text><line x1="338" y1="96" x2="378" y2="74" class="ln"/><text x="384" y="74" class="sm">余盛り（表面の盛り上がり）</text><line x1="250" y1="134" x2="180" y2="176" class="ln"/><text x="150" y="194" text-anchor="middle" class="sm">熱の影響で組織が変わった帯</text><text x="150" y="210" text-anchor="middle" class="sm dim">（溶けてはいない）</text><line x1="306" y1="154" x2="400" y2="180" class="ln"/><text x="406" y="184" class="sm">裏側まで溶けている＝溶け込み十分</text></svg></div></div>
<p>溶接部は3つに分かれます。溶けて固まった<strong>溶接金属</strong>、溶けてはいないが熱で組織が変わった<strong>熱影響部（HAZ）</strong>、そして影響を受けていない<strong>母材</strong>です。鋼では熱影響部が硬く・もろくなることがあり、熱処理で強くしたアルミ合金では逆に熱影響部が軟らかくなって強度が落ちます。設計や検査では「溶接ビードのきわ」が弱点になりやすいと考えます。</p>
<h3>代表的な溶接欠陥と原因・対策</h3>

<div class="tblwrap"><table><thead><tr><th>欠陥</th><th>どんな状態か</th><th>主な原因</th><th>主な対策</th></tr></thead><tbody>
<tr><td>溶け込み不足</td><td>継手の奥（裏側）まで溶けていない</td><td>電流が低い、速度が速い、開先や角度が不適切</td><td>条件の見直し、開先・ルート間隔の管理、ねらい位置の確認</td></tr>
<tr><td>ブローホール</td><td>溶接金属の中の丸い空洞</td><td>シールドガス不足・風、母材の油・水分・さび、アルミでは水素</td><td>ガス流量と風よけの管理、母材の脱脂・清掃</td></tr>
<tr><td>アンダーカット</td><td>ビードのきわが溝状にえぐれる</td><td>電流が高すぎる、速度が速い、トーチ角度・アーク長が不適切</td><td>電流・速度・角度の調整</td></tr>
<tr><td>オーバーラップ</td><td>溶けた金属が母材に溶け合わずにかぶさる</td><td>電流が低い、速度が遅すぎる</td><td>電流を上げる、速度を適正にする</td></tr>
<tr><td>割れ</td><td>溶接金属や熱影響部の亀裂。固まる途中の高温割れと、冷えたあと時間をおいて出る低温割れがある</td><td>拘束が強い、水素（湿気）、急冷、材料成分</td><td>予熱、低水素の材料、溶接順序の工夫</td></tr>
<tr><td>スパッタ</td><td>溶けた粒が飛び散って周囲に付着する</td><td>電流・電圧のバランス不良、炭酸ガス比率が高い</td><td>条件調整、ノズル清掃、付着防止剤</td></tr>
</tbody></table></div>

class="tt">溶け込み不足</text><rect x="465" y="110" width="57" height="40" class="pst"/><rect x="528" y="110" width="57" height="40" class="pst"/><path d="M505 110 Q525 88 545 110 L532 126 L518 126 Z" class="gfire"/><line x1="525" y1="128" x2="525" y2="150" class="ln thick"/><line x1="560" y1="170" x2="527" y2="142" class="ln acs" marker-end="url(#ah)"/><text x="525" y="186" text-anchor="middle" class="sm">裏側まで溶けず</text><text x="525" y="202" text-anchor="middle" class="sm">すき間（未溶着）が残る</text></svg></div></div>

<h3>溶接ひずみ</h3>
<p>溶接金属は冷えると縮みます。周りの母材がそれを引き止めるため、部品が曲がったり、反ったりします。これが<strong>溶接ひずみ</strong>です。フレームではヘッドパイプやピボット（スイングアームの軸）の位置・角度がずれると、ハンドリングに影響します。対策は、治具でしっかり固定する、あらかじめ逆向きに曲げておく（逆ひずみ）、左右対称や飛び石の順番で溶接して熱をかたよらせない、入熱を必要最小限にする、溶接後に矯正や機械加工で仕上げる、などです。</p>
<div class="pbox">溶接は「金属の接着」ではなく、つなぎ目を一度ドロドロに溶かして一体にする方法です。溶かしすぎても足りなくても不良になり、冷えるときの縮みで形もゆがみます。</div>
<div class="tbox">例えるなら、溶接はホットケーキの生地を2枚の間に流して焼き固めるようなものです。火が弱いと中が生焼け（溶け込み不足）、生地に泡が残ると穴（ブローホール）、焼けたあとは縮んで端が反り返ります（溶接ひずみ）。</div>
<h3>覚えどころ</h3>
<ul><li>MAGは鋼、MIGはアルミ、TIGは溶けない電極で薄板・ステンレス・チタン</li><li>ろう付けは母材を溶かさない</li><li>溶接部＝溶接金属＋熱影響部＋母材。熱影響部が弱点になりやすい</li><li>欠陥は「名前・見た目・原因・対策」をセットで覚える</li></ul>` },
 { id:'mheat', field:'mfg', icon:'🌡️', title:'熱処理・表面処理', sub:'焼入れ・焼戻し、浸炭・窒化、硬さ、めっき・アルマイト・塗装', gram:`<h3>まず、これは何？</h3>
<p><strong>熱処理</strong>は、金属を加熱・冷却して、形を変えずに中身（組織）を変え、硬さや粘り強さを調整する技術です。<strong>表面処理</strong>は、めっき・アルマイト・塗装などで表面に膜をつくり、さび・摩耗・見た目を改善する技術です。ギア、クランクシャフト、カムシャフト、フロントフォークのインナーチューブ、シリンダーなど、強さと耐久性が必要な部品の多くに使われています。</p>
<h3>鋼の基本の熱処理（4種類）</h3>

<div class="tblwrap"><table><thead><tr><th>処理</th><th>やり方</th><th>目的・結果</th></tr></thead><tbody>
<tr><td>焼入れ</td><td>高温に加熱して保持し、水や油で急冷</td><td>硬い組織（マルテンサイト）にして硬さ・強さを上げる。そのままではもろい</td></tr>
<tr><td>焼戻し</td><td>焼入れ後に、低めの温度で再加熱して冷やす</td><td>もろさを減らし粘り強さ（靭性）を戻す。焼入れとセットで行う</td></tr>
<tr><td>焼なまし</td><td>加熱後、炉の中でゆっくり冷やす</td><td>軟らかくして加工しやすくする。内部の残留応力を取る</td></tr>
<tr><td>焼ならし</td><td>加熱後、空気中で冷やす</td><td>鍛造などで不ぞろいになった組織を均一・微細に整える</td></tr>
</tbody></table></div>

<h3>表面だけを硬くする（表面硬化）</h3>
<p>ギアやシャフトには「表面は硬くてすり減りにくく、芯は粘り強くて折れにくい」という、相反する性質が求められます。そこで表面だけを硬くします。</p>
<ul>
<li><strong>浸炭焼入れ</strong>：炭素の少ない鋼の表面に炭素をしみ込ませてから焼入れする。トランスミッションのギアなどに広く使われる</li>
<li><strong>高周波焼入れ</strong>：コイルに高周波電流を流し、表面だけを短時間で加熱して焼入れする。シャフト類など必要な部分だけを硬くできる</li>
<li><strong>窒化</strong>：表面に窒素をしみ込ませて硬い層をつくる。処理温度が低く急冷もしないので、ひずみが小さい</li>
</ul>
<div class="figbox"><div class="ft">📐 表面硬化した軸の断面と硬さの分布</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs><circle cx="130" cy="112" r="72" class="gfire"/><circle cx="130" cy="112" r="56" class="pst"/><circle cx="130" cy="112" r="72" class="ln"/><text x="130" y="108" text-anchor="middle" class="tt">芯部</text><text x="130" y="126" text-anchor="middle" class="sm">粘り強い</text><line x1="176" y1="160" x2="208" y2="190" class="ln"/><text x="212" y="196" class="sm">表面の硬化層</text><text x="212" y="212" class="sm dim">硬く摩耗に強い</text><line x1="310" y1="180" x2="310" y2="40" class="ln" marker-end="url(#ah)"/><line x1="310" y1="180" x2="580" y2="180" class="ln" marker-end="url(#ah)"/><text x="316" y="40" class="sm">硬さ</text><text x="580" y="200" text-anchor="end" class="sm dim">表面からの深さ →</text><path d="M310 60 C390 60 400 150 460 150 L575 150" class="ln thick acs"/><line x1="310" y1="110" x2="575" y2="110" class="ln dash"/><text x="575" y="102" text-anchor="end" class="sm">基準の硬さ（例：550 HV）</text><line x1="397" y1="110" x2="397" y2="180" class="ln dash"/><line x1="314" y1="168" x2="393" y2="168" class="ln acs" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="354" y="200" text-anchor="middle" class="sm">有効硬化層深さ</text></svg></div></div>
<h3>硬さの表し方</h3>
<p>硬さは、硬い圧子を押し込んだときのへこみ方で測ります。<strong>ロックウェル硬さ（HRC）</strong>はダイヤモンドの円すい圧子の押し込み深さから求め、焼入れ鋼の検査で手早く使われます。<strong>ビッカース硬さ（HV）</strong>はダイヤモンドの四角すい圧子のくぼみの対角線の長さから求め、薄い硬化層や断面の硬さ分布も測れます。同じ部品でも尺度が違えば数値が違うので、図面の指示と同じ尺度で比べます。</p>
<h3>熱処理の不良</h3>
<ul>
<li><strong>焼割れ</strong>：焼入れ時の急冷による熱の差と、組織が変わるときの膨張で割れる。角が鋭い、肉厚が急に変わる、冷却が激しすぎる、焼戻しまでの放置が長い、などが原因。角に丸みをつける、冷却剤を適正にする、すぐ焼戻す、で防ぐ</li>
<li><strong>焼入れ不足・焼むら</strong>：加熱温度や保持時間の不足、冷却が遅い、表面の炭素が抜ける（脱炭）などで、硬さが規格に届かない・場所によって違う。硬さ試験で見つける</li>
<li><strong>熱処理ひずみ</strong>：寸法や曲がりが変化する。熱処理後に研削で仕上げることが多い</li>
</ul>
<h3>表面処理と塗装</h3>
<div class="tblwrap"><table><thead><tr><th>処理</th><th>しくみ</th><th>一般的な例</th></tr></thead><tbody>
<tr><td>硬質クロムめっき</td><td>電気めっきで硬いクロムの膜をつける</td><td>フロントフォークのインナーチューブ</td></tr>
<tr><td>めっきシリンダー</td><td>アルミのシリンダー内壁に、ニッケルに硬い粒子を混ぜた複合めっきなどを施す</td><td>鉄のスリーブを使わない軽量シリンダー</td></tr>
<tr><td>アルマイト（陽極酸化）</td><td>アルミを陽極にして電解し、表面に酸化アルミの膜を成長させる。染色後に封孔処理</td><td>アルミのレバー、ブラケット、ホイールなどの色付き部品</td></tr>
<tr><td>電着塗装</td><td>部品を塗料槽に沈め、電気の力で塗膜を付ける。袋状の内側まで均一に付きやすい</td><td>フレームなどの下塗り・防錆</td></tr>
<tr><td>粉体塗装</td><td>静電気で粉の塗料を付け、焼き付けて溶かし膜にする。溶剤をほぼ使わず厚膜にできる</td><td>フレーム、ホイール、スタンドなど</td></tr>
</tbody></table></div>
<p>塗装の代表的な不良は、塗料が垂れて流れる<strong>タレ</strong>（厚塗り・粘度が低い）、ごみやほこりが粒になって入る<strong>ブツ</strong>（塗装環境の清浄度不足）、油やシリコーンの汚れで塗料がはじかれ、穴やへこみになる<strong>ハジキ</strong>（脱脂不足・汚染）です。どれも「前処理」と「環境」の管理が対策の中心です。</p>
<div class="pbox">熱処理は「温めて冷やす速さ」で金属の性格を変える技術です。速く冷やせば硬く、ゆっくり冷やせば軟らかくなります。表面処理は、そこに「服」を着せてさびや摩耗から守る技術です。</div>
<div class="tbox">例えるなら、焼入れと焼戻しは、陶器とおもちの間をねらう作業です。焼入れしただけの鋼は陶器のように硬いけれど割れやすく、焼戻しで少し粘りを足すと、硬さと割れにくさのバランスが取れます。</div>
<h3>覚えどころ</h3>
<ul><li>焼入れ＝急冷で硬く、焼戻し＝粘りを戻す（必ずセット）</li><li>浸炭・高周波・窒化は「表面だけ硬く、芯は粘り強く」</li><li>HRCは深さ、HVはくぼみの対角線で測る</li><li>塗装不良：タレ・ブツ・ハジキ。対策は前処理と環境</li></ul>` },
 { id:'mresin', field:'mfg', icon:'🧪', title:'樹脂成形と材料', sub:'射出成形と成形不良、樹脂・CFRP・金属材料の使い分け', gram:`<h3>まず、これは何？</h3>
<p>オートバイのカウル、フェンダー、メーターまわり、ライトのレンズ、各種カバーやクリップなど、樹脂部品の多くは<strong>射出成形</strong>でつくられます。粒状の樹脂（ペレット）を加熱して溶かし、金型の中に高い圧力で押し込み、冷やして固めて取り出す方法です。複雑な形を短い時間で大量につくれるのが強みです。</p>
<h3>射出成形のしくみ</h3>
<div class="figbox"><div class="ft">📐 射出成形機と金型（断面のイメージ）</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs><text x="170" y="30" text-anchor="middle" class="sm">ホッパー（ペレット）</text><path d="M148 40 L192 40 L178 80 L162 80 Z" class="bx"/><rect x="60" y="80" width="270" height="40" class="bx"/><rect x="140" y="73" width="26" height="7" class="gfire"/><rect x="190" y="73" width="26" height="7" class="gfire"/><rect x="240" y="73" width="26" height="7" class="gfire"/><rect x="140" y="120" width="26" height="7" class="gfire"/><rect x="190" y="120" width="26" height="7" class="gfire"/><rect x="240" y="120" width="26" height="7" class="gfire"/><rect x="292" y="84" width="38" height="32" class="oilf"/><rect x="70" y="96" width="222" height="8" class="pst"/><polyline points="90,86 100,114 110,86 120,114 130,86 140,114 150,86 160,114 170,86 180,114 190,86 200,114 210,86 220,114 230,86 240,114 250,86 260,114 270,86 280,114 290,86" class="ln"/><path d="M330 88 L350 96 L350 104 L330 112 Z" class="pst"/><rect x="350" y="40" width="70" height="140" class="bx"/><rect x="420" y="40" width="80" height="140" class="bx"/><rect x="350" y="97" width="70" height="6" class="oilf"/><rect x="417" y="70" width="6" height="60" class="oilf"/><rect x="418" y="65" width="4" height="5" class="oilf"/><rect x="418" y="130" width="4" height="5" class="oilf"/><rect x="405" y="44" width="40" height="21" class="oilf"/><rect x="405" y="135" width="40" height="21" class="oilf"/><circle cx="378" cy="62" r="6" class="gmix"/><circle cx="378" cy="140" r="6" class="gmix"/><circle cx="472" cy="62" r="6" class="gmix"/><circle cx="472" cy="122" r="6" class="gmix"/><line x1="445" y1="150" x2="500" y2="150" class="ln thick"/><line x1="420" y1="22" x2="420" y2="196" class="ln dash"/><text x="420" y="16" text-anchor="middle" class="sm dim">型の合わせ面</text><text x="385" y="92" text-anchor="middle" class="sm">スプルー</text><text x="385" y="206" text-anchor="middle" class="sm">固定側</text><text x="460" y="206" text-anchor="middle" class="sm">可動側</text><text x="215" y="146" text-anchor="middle" class="sm">ヒーター</text><text x="311" y="146" text-anchor="middle" class="sm">溶けた樹脂</text><text x="190" y="172" text-anchor="middle" class="sm">スクリュー：回って溶かし、前進して射出</text><line x1="445" y1="50" x2="506" y2="46" class="ln"/><text x="510" y="50" class="sm">キャビティ</text><line x1="423" y1="67" x2="506" y2="80" class="ln"/><text x="510" y="84" class="sm">ゲート（入口）</text><line x1="424" y1="116" x2="506" y2="110" class="ln"/><text x="510" y="114" class="sm">ランナー</text><line x1="478" y1="124" x2="506" y2="134" class="ln"/><text x="510" y="138" class="sm">冷却水路</text><line x1="496" y1="152" x2="506" y2="170" class="ln"/><text x="510" y="174" class="sm">突き出しピン</text></svg></div></div>
<p>溶けた樹脂は、ノズル→<strong>スプルー</strong>→<strong>ランナー</strong>（流路）→<strong>ゲート</strong>（製品への入口）→<strong>キャビティ</strong>（製品の形の空間）と流れます。充填後も圧力をかけ続けて（保圧）、冷えて縮む分を補います。金型には冷却水路があり、冷却時間がサイクルタイムの大きな部分を占めます。最後に型を開き、突き出しピンで製品を押し出します。</p>
<h3>成形不良と原因・対策</h3>

<div class="tblwrap"><table><thead><tr><th>不良</th><th>状態</th><th>主な原因</th><th>主な対策</th></tr></thead><tbody>
<tr><td>ヒケ</td><td>厚肉部の表面がへこむ</td><td>肉厚が厚い・不均一、保圧不足</td><td>肉厚を均一に、保圧・保圧時間を増やす、ゲートを大きく</td></tr>
<tr><td>ウェルドライン</td><td>樹脂の流れが合流した所に線が出て、強度も下がる</td><td>穴や複数ゲートで流れが分かれる、樹脂・金型温度が低い</td><td>ゲート位置の変更、温度を上げる、ガス抜きを設ける</td></tr>
<tr><td>ショートショット</td><td>形の一部が欠ける（未充填）</td><td>射出量・圧力不足、温度が低い、ガスが逃げられない</td><td>射出条件の見直し、ガス抜きの追加</td></tr>
<tr><td>バリ</td><td>型の合わせ面などに薄い膜がはみ出す</td><td>型締め力不足、射出圧が高すぎる、金型の摩耗</td><td>型締め力・射出条件の調整、金型の補修</td></tr>
<tr><td>反り</td><td>冷えたあとに曲がる・ねじれる</td><td>冷却の不均一、肉厚差、繊維の向き</td><td>金型温度の均一化、設計の見直し</td></tr>
<tr><td>シルバー（銀条）</td><td>流れの方向に銀色の筋が出る</td><td>樹脂の乾燥不足（水分）、熱分解ガス</td><td>成形前の予備乾燥、温度・滞留時間の管理</td></tr>
</tbody></table></div>
<div class="figbox"><div class="ft">📐 代表的な成形不良の見え方</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs><text x="75" y="28" text-anchor="middle" class="tt">ヒケ（断面）</text><path d="M15 80 L55 80 Q75 94 95 80 L135 80 L135 100 L92 100 L92 140 L58 140 L58 100 L15 100 Z" class="bx"/><line x1="75" y1="52" x2="75" y2="82" class="ln acs" marker-end="url(#ah)"/><text x="75" y="166" text-anchor="middle" class="sm">厚い部分が遅れて縮み</text><text x="75" y="182" text-anchor="middle" class="sm">表面がへこむ</text><text x="225" y="28" text-anchor="middle" class="tt">ウェルドライン</text><rect x="165" y="60" width="120" height="80" class="bx"/><circle cx="225" cy="100" r="13" class="pst"/><line x1="170" y1="100" x2="196" y2="100" class="ln acs" marker-end="url(#ah)"/><path d="M200 92 Q212 72 232 78" class="ln acs" marker-end="url(#ah)"/><path d="M200 108 Q212 128 232 122" class="ln acs" marker-end="url(#ah)"/><line x1="238" y1="100" x2="285" y2="100" class="ln thick dash"/><text x="225" y="166" text-anchor="middle" class="sm">流れが分かれて再び合流</text><text x="225" y="182" text-anchor="middle" class="sm">した所に線が残る</text><text x="375" y="28" text-anchor="middle" class="tt">ショートショット</text><rect x="315" y="60" width="120" height="80" class="ln dash"/><path d="M315 60 L400 60 Q410 90 385 100 Q370 125 380 140 L315 140 Z" class="bx"/><line x1="325" y1="100" x2="350" y2="100" class="ln acs" marker-end="url(#ah)"/><text x="412" y="104" text-anchor="middle" class="sm dim">未充填</text><text x="375" y="166" text-anchor="middle" class="sm">樹脂が最後まで届かず</text><text x="375" y="182" text-anchor="middle" class="sm">形が欠ける</text><text x="525" y="28" text-anchor="middle" class="tt">バリ（断面）</text><rect x="465" y="56" width="120" height="34" class="pst"/><rect x="465" y="110" width="120" height="34" class="pst"/><rect x="495" y="90" width="60" height="20" class="bx"/><rect x="555" y="98" width="24" height="4" class="bx"/><line x1="575" y1="70" x2="571" y2="96" class="ln acs" marker-end="url(#ah)"/><text x="525" y="166" text-anchor="middle" class="sm">型のすき間に樹脂が</text><text x="525" y="182" text-anchor="middle" class="sm">はみ出し薄い膜になる</text></svg></div></div>
<div class="wbox">⚠️ ウェルドラインは「見た目の線」だけでなく、そこが弱い場所でもあります。取付部の穴まわりなど力のかかる場所に出ていないかを確認することが大切です。</div>
<h3>主な樹脂と金属材料の使い分け</h3>
<div class="tblwrap"><table><thead><tr><th>材料</th><th>特徴</th><th>一般的な用途例</th></tr></thead><tbody>
<tr><td>PP（ポリプロピレン）</td><td>軽い・安い・薬品に強い。塗装はしにくい</td><td>インナーカバー、フェンダー類、バッテリーケースなど</td></tr>
<tr><td>ABS</td><td>外観がきれいで塗装しやすい</td><td>カウル、外装カバー</td></tr>
<tr><td>PC（ポリカーボネート）</td><td>透明で衝撃に強い</td><td>ヘッドライトのレンズ、メーターカバー、スクリーン</td></tr>
<tr><td>PA（ナイロン）</td><td>耐熱・耐油性が高い。ガラス繊維で強化して使うことが多い。吸水する</td><td>エンジンまわりの樹脂部品、クリップ・ファスナー</td></tr>
<tr><td>CFRP（炭素繊維強化樹脂）</td><td>非常に軽く強いが高価。繊維の向きで強さが変わる</td><td>レース用・上級モデルの外装やパーツ</td></tr>
<tr><td>鋼</td><td>強く安く、溶接しやすい。重い（密度は約7.8）</td><td>鋼管フレーム、クランクシャフト、ギア</td></tr>
<tr><td>アルミ合金</td><td>鋼の約3分の1の重さ（密度約2.7）。鋳造・押出しがしやすい</td><td>クランクケース、ホイール、アルミフレーム</td></tr>
<tr><td>マグネシウム合金</td><td>実用金属で最も軽い（密度約1.8）。腐食しやすく、削りくずは燃えやすい</td><td>エンジンカバー、一部の高級ホイール</td></tr>
<tr><td>チタン合金</td><td>密度約4.5で強く、さびにくく熱にも強い。高価で加工が難しい</td><td>マフラー、ボルト、高性能エンジンのバルブ</td></tr>
</tbody></table></div>
<div class="pbox">射出成形は「溶かした樹脂を型に押し込んで冷やす」たい焼きのような工法です。型の形・温度・圧力・時間のどれかがずれると、へこみや線、欠けやはみ出しになります。材料は「重さ・強さ・値段・つくりやすさ」のバランスで選ばれます。</div>
<div class="tbox">例えるなら、射出成形はたい焼きづくりです。生地が足りないと尾びれが欠け（ショートショット）、入れすぎると型の合わせ目から薄い羽根がはみ出し（バリ）、生地が左右から回り込んで合わさった所には筋が残ります（ウェルドライン）。</div>
<h3>覚えどころ</h3>
<ul><li>流れ：スプルー→ランナー→ゲート→キャビティ</li><li>ヒケ＝厚肉と保圧不足、シルバー＝乾燥不足、バリ＝型締め力不足や高すぎる圧力</li><li>PCは透明、ABSは外装、PAは耐熱で吸水、PPは軽く薬品に強い</li><li>軽い順：マグネシウム→アルミ→チタン→鋼</li></ul>` },
 { id:'minsp', field:'mfg', icon:'📏', title:'計測と検査', sub:'測定器・限界ゲージ・校正、非破壊検査、リークテスト、工程能力', gram:`<h3>まず、これは何？</h3>
<p>品質管理は「測ること」から始まります。正しい測定器で、正しい方法で測り、その測定器自体が正しいことを保証する。そのうえで、部品を壊さずに中身を確かめる<strong>非破壊検査</strong>や、液体・気体が漏れないかを確かめる<strong>リークテスト</strong>、全部を測らずにロットの良否を判断する<strong>抜取検査</strong>、工程がどれだけ安定して規格内のものをつくれるかを表す<strong>工程能力</strong>を使い分けます。</p>
<h3>主な測定器</h3>
<div class="tblwrap"><table><thead><tr><th>測定器</th><th>読み取りの目安</th><th>得意なこと・注意点</th></tr></thead><tbody>
<tr><td>ノギス</td><td>0.05 mm（0.02 mmの品もある）</td><td>外側・内側・深さ・段差を1本で測れる。測る位置が目盛り（本尺）の延長上にないため、強く押すと誤差が出やすい</td></tr>
<tr><td>マイクロメータ</td><td>0.01 mm</td><td>ねじの送りで精密に測る。ラチェットで一定の力をかけて測る</td></tr>
<tr><td>ダイヤルゲージ</td><td>0.01 mmなど</td><td>基準からの「差」や「振れ」を測る。ブレーキディスクや軸の振れ測定</td></tr>
<tr><td>三次元測定機</td><td>機種による（高精度）</td><td>プローブで点の座標を取り、穴位置・平面度・複雑な形状を評価する</td></tr>
</tbody></table></div>
<h3>限界ゲージ（通り・止まり）</h3>
<div class="figbox"><div class="ft">📐 穴を検査する栓ゲージ（通り側・止まり側）</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><rect x="80" y="86" width="120" height="40" class="pst"/><rect x="200" y="96" width="100" height="20" class="bx"/><rect x="300" y="82" width="56" height="48" class="pst"/><line x1="320" y1="82" x2="320" y2="130" class="ln acs"/><text x="140" y="72" text-anchor="middle" class="tt">通り側</text><text x="328" y="72" text-anchor="middle" class="tt ac">止まり側</text><text x="250" y="90" text-anchor="middle" class="sm dim">握り</text><text x="140" y="148" text-anchor="middle" class="sm">穴の最小許容寸法</text><text x="140" y="164" text-anchor="middle" class="sm dim">（長め）</text><text x="328" y="148" text-anchor="middle" class="sm">穴の最大許容寸法</text><text x="328" y="164" text-anchor="middle" class="sm dim">（短め・色で区別）</text><text x="220" y="204" text-anchor="middle" class="sm dim">軸を測るゲージは逆：通り側＝軸の最大許容寸法</text><rect x="412" y="40" width="180" height="150" class="bx"/><text x="502" y="62" text-anchor="middle" class="tt">判定</text><text x="502" y="88" text-anchor="middle" class="sm">通り側が入る</text><text x="502" y="106" text-anchor="middle" class="sm">止まり側が入らない</text><text x="502" y="128" text-anchor="middle" class="tt ac">→ 合格</text><text x="502" y="156" text-anchor="middle" class="sm">通りが入らない＝穴が小さい</text><text x="502" y="176" text-anchor="middle" class="sm">止まりが入る＝穴が大きい</text></svg></div></div>
<p><strong>限界ゲージ</strong>は、寸法の数値を読まずに「規格内かどうか」だけを素早く判定する道具です。穴用の栓ゲージでは、通り側を穴の最小許容寸法、止まり側を最大許容寸法でつくります。通り側が入り、止まり側が入らなければ合格です。熟練が要らず短時間で判定できるため、量産の現場でよく使われます。ゲージ自体も摩耗するので、定期的な点検が必要です。</p>
<h3>校正とトレーサビリティ</h3>
<p><strong>校正</strong>は、測定器の示す値と標準器の値を比べ、ずれを確認することです。その標準器もさらに上位の標準で校正され、最終的に国家標準までつながっている状態を<strong>トレーサビリティ（計量のつながり）</strong>といいます。校正で測定器が許容差から外れていたと分かったら、前回の校正以降にその測定器で合格にした製品が本当に良かったのかを評価し、必要な処置をとります。</p>
<h3>非破壊検査</h3>
<div class="tblwrap"><table><thead><tr><th>方法</th><th>わかるもの</th><th>ポイント</th></tr></thead><tbody>
<tr><td>放射線透過（X線）</td><td>内部の空洞（鋳巣・ブローホール）</td><td>写真のように内部が見える。放射線の安全管理が必要</td></tr>
<tr><td>浸透探傷</td><td>表面に開いた割れ</td><td>赤い浸透液をしみ込ませ、ふき取ってから現像剤で吸い出して見る。アルミでも使える</td></tr>
<tr><td>磁粉探傷</td><td>表面と表面直下の割れ</td><td>磁化して漏れた磁束に磁粉を集める。鉄鋼などの強磁性体だけ</td></tr>
<tr><td>超音波探傷</td><td>内部のきず、板厚</td><td>音の反射（エコー）で調べる。探触子との間に接触媒質が必要</td></tr>
</tbody></table></div>
<h3>リークテスト</h3>
<p>クランクケース、シリンダーヘッド、燃料タンク、ラジエーターなどは、鋳巣や溶接・ろう付けの欠陥があると漏れにつながります。水槽に沈めて泡を見る方法、空気で加圧して圧力の下がり方を見る方法（良品と比べる差圧式など）、ヘリウムを使う高感度な方法があります。空気の圧力は温度で変わるため、部品が洗浄直後で温かいと判定がずれることに注意します。</p>
<h3>抜取検査と工程能力</h3>
<p><strong>抜取検査</strong>は、ロットから決められた数だけ取り出して調べ、ロット全体の合否を決めます。良いロットを不合格にしてしまう危険（生産者危険）と、悪いロットを合格にしてしまう危険（消費者危険）があり、不良ゼロを保証するものではありません。</p>
<p><strong>工程能力指数</strong>は、規格の幅に対して工程のばらつきがどれだけ小さいかを表します。Cp＝（上限－下限）÷6σ。Cpkは平均値のかたよりも考えた値で、平均から近いほうの規格までの距離÷3σで求めます。一般に1.33以上なら工程能力は十分、1.00未満なら不足と判断します。</p>
<div class="figbox"><div class="ft">📐 CpとCpk（中心のずれで何が変わるか）</div><div class="fsv"><svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs><text x="300" y="22" text-anchor="middle" class="sm">Cp＝（上限－下限）÷6σ　　Cpk＝平均から近いほうの規格までの距離÷3σ</text><line x1="40" y1="180" x2="580" y2="180" class="ln"/><line x1="150" y1="78" x2="150" y2="186" class="ln thick"/><line x1="450" y1="78" x2="450" y2="186" class="ln thick"/><text x="150" y="202" text-anchor="middle" class="sm">下限規格</text><text x="450" y="202" text-anchor="middle" class="sm">上限規格</text><path d="M450 180 L450 165.1 L460 171.2 L470 175.2 L480 177.5 L490 178.8 L500 179.4 L510 179.8 L520 179.9 L520 180 Z" class="gfire"/><path d="M150 179.9 L160 179.8 L170 179.4 L180 178.8 L190 177.5 L200 175.2 L210 171.2 L220 165.1 L230 156.2 L240 144.3 L250 129.6 L260 113.3 L270 97.0 L280 82.9 L290 73.4 L300 70.0 L310 73.4 L320 82.9 L330 97.0 L340 113.3 L350 129.6 L360 144.3 L370 156.2 L380 165.1 L390 171.2 L400 175.2 L410 177.5 L420 178.8 L430 179.4 L440 179.8 L450 179.9" class="ln thick"/><path d="M220 179.9 L230 179.8 L240 179.4 L250 178.8 L260 177.5 L270 175.2 L280 171.2 L290 165.1 L300 156.2 L310 144.3 L320 129.6 L330 113.3 L340 97.0 L350 82.9 L360 73.4 L370 70.0 L380 73.4 L390 82.9 L400 97.0 L410 113.3 L420 129.6 L430 144.3 L440 156.2 L450 165.1 L460 171.2 L470 175.2 L480 177.5 L490 178.8 L500 179.4 L510 179.8 L520 179.9" class="ln thick dash acs"/><text x="250" y="56" text-anchor="end" class="sm">A：中心が合う（Cp＝Cpk）</text><text x="400" y="56" class="sm ac">B：中心がずれる（Cpk＜Cp）</text><line x1="530" y1="150" x2="490" y2="174" class="ln" marker-end="url(#ah)"/><text x="534" y="148" class="sm">規格外</text></svg></div></div>
<div class="pbox">測定は「ものさしが正しいこと」が前提です。そのうえで、壊さずに中を見る検査、漏れを見る検査、一部を見て全体を判断する検査、工程の実力を数字で表す指標を、目的に合わせて使い分けます。</div>
<div class="tbox">例えるなら、工程能力は車庫入れの腕前です。車幅（ばらつき）が車庫の幅（規格）より十分狭ければCpは高い。でも車の位置が片側に寄っていれば、こすりやすくなります。それを表すのがCpkです。</div>
<h3>覚えどころ</h3>
<ul><li>ノギス0.05 mm、マイクロメータ0.01 mm</li><li>穴用栓ゲージ：通り＝最小、止まり＝最大</li><li>浸透＝表面開口のみ、磁粉＝強磁性体のみ、X線・超音波＝内部</li><li>Cpkは中心のずれも含む。Cpk≦Cp</li></ul>` }
);

  choices:['ハジキは、油やシリコーンなどの汚れで塗料がはじかれ、穴やへこみになる不良である。','タレは、厚塗りや塗料の粘度が低すぎることで、塗料が流れて垂れる不良である。','ブツは、ごみやほこりが塗膜に入り込み、粒状に盛り上がる不良である。','電着塗装は、袋状の部分の内側には塗膜がほとんど付かないことが最大の特長である。'],
  answer:4,
  why:['汚染による塗料のはじきで、脱脂・清浄管理が対策です。正しい記述です。','膜厚と粘度の管理不良による典型的な不良です。正しい記述です。','塗装環境の清浄度不足などが原因です。正しい記述です。','電着塗装は電気の力で塗膜を付けるため、袋状の内側まで均一に付きやすい（つきまわりがよい）のが特長です。この記述が誤りです。'],
  exp:'塗装不良の多くは、前処理（脱脂・清浄）と塗装環境（ほこり・温湿度）の管理で防ぎます。電着塗装は防錆の下塗りとしてフレームなどに使われ、内側まで塗れる点が強みです。',
  plain:'塗装の不良の名前と原因、塗装方法の特長のうち、まちがっているものを探す問題です。',
  tatoe:'例えるなら、ハジキは油の付いたお皿に水をかけたときに、水が玉になってはじかれる様子と同じです。きれいに洗ったお皿なら、水は全体に広がります。' },
 { id:'q-mheat-5', unit:'mheat', lv:3, polarity:'wrong',
  stem:'焼入れの不良（焼割れ・焼入れ不足）について、誤っているものはどれですか。',
  choices:['鋭い角や肉厚が急に変わる部分は、焼割れの起点になりやすい。','焼入れ後、焼戻しまで長く放置すると、焼割れが起こりやすくなる。','表面の炭素が抜ける（脱炭）と、表面の硬さが不足する原因になる。','冷却が激しいほど焼割れの危険は小さくなるため、冷却は常にできるだけ速くするのがよい。'],
  answer:4,
  why:['角や急な肉厚変化には応力が集中するため、角に丸みをつけるのが対策です。正しい記述です。','焼入れ直後は内部応力が高く、すぐに焼戻すことが割れの予防になります。正しい記述です。','炭素が抜けた表面は焼入れしても硬くなりにくく、焼入れ不足の原因になります。正しい記述です。','冷却が激しすぎると内外の温度差による応力が大きくなり、焼割れの危険が高まります。この記述が誤りです。'],
  exp:'焼割れは、急冷時の温度差による熱応力と、組織が変わるときの膨張による変態応力が重なって起こります。冷却剤を材料に合ったものにし、形状に丸みをつけ、すぐ焼戻すのが基本の対策です。',
  plain:'焼入れでよく起こる「割れ」と「硬さ不足」の原因について、まちがった説明を探す問題です。',
  tatoe:'例えるなら、熱いグラスに急に冷水を注ぐと割れるのと同じです。冷やすのが速ければよいわけではなく、表と中の温度差が大きいほど割れやすくなります。' },
 { id:'q-mresin-1', unit:'mresin', lv:1,
  stem:'射出成形で、肉厚の厚い部分の表面が冷えて縮むときにへこむ不良はどれですか。',
  choices:['バリ','ヒケ','ショートショット','ウェルドライン'],
  answer:2,
  why:['バリは、型の合わせ面などから樹脂がはみ出して薄い膜になる不良です。','厚肉部が遅れて縮み、表面が引き込まれてへこむ不良で、正解です。','ショートショットは、樹脂が型の隅まで届かず形が欠ける不良です。','ウェルドラインは、樹脂の流れが合流した所に線が残る不良です。'],
  exp:'ヒケは、厚肉部の体積収縮を保圧で補いきれないときに起こります。肉厚を均一にする設計、保圧や保圧時間を増やす、ゲートを大きくするなどが対策です。',
  plain:'樹脂部品の「厚いところの表面がへこむ」不良の名前を聞いています。',
  tatoe:'例えるなら、厚く焼いたプリンが冷めると、真ん中が少しへこむようなものです。厚い所ほど冷めるのが遅く、最後まで縮み続けます。' },
 { id:'q-mresin-2', unit:'mresin', lv:1,
  stem:'透明で衝撃に強く、ヘッドライトのレンズやメーターカバーによく使われる樹脂はどれですか。',
  choices:['PP（ポリプロピレン）','PA（ナイロン）','PC（ポリカーボネート）','ABS'],
  answer:3,
  why:['PPは軽く薬品に強い樹脂ですが、通常は不透明でレンズには向きません。','PAは耐熱・耐油性が高く、エンジンまわりの部品などに使われますが、透明部品向きではありません。','透明性と耐衝撃性をあわせ持つため、レンズ類に使われます。正解です。','ABSは外観がきれいで塗装しやすく、カウルなどに使われますが、通常は不透明です。'],
  exp:'PCは透明で割れにくいのが強みです。一方で傷が付きやすいため、レンズには表面のハードコートが施されることが一般的です。',
  plain:'透明で、ぶつかっても割れにくい樹脂を選ぶ問題です。',
  tatoe:'例えるなら、PCは子ども用の割れにくいコップの素材のようなものです。ガラスのように透明なのに、落としても割れにくいのが特長です。' },
 { id:'q-mresin-3', unit:'mresin', lv:2, polarity:'correct',
  stem:'射出成形の不良の原因と対策について、正しいものはどれですか。',
  choices:['シルバー（銀条）は、成形前の樹脂の乾燥不足による水分が主な原因の一つである。','バリは、型締め力が強すぎることが主な原因である。','ショートショットの対策として、金型のガス抜きをふさぐのが効果的である。','ウェルドラインは、ゲートが1つで穴のない単純な形状ほど出やすい。'],
  answer:1,
  why:['水分が成形時に気化して流れ方向の銀色の筋になります。予備乾燥が対策です。正しい記述です。','バリは型締め力が「不足」している、または射出圧が高すぎるときに起こります。','ガスが逃げられないと樹脂が入りきらないため、ガス抜きを設けるのが対策です。','ウェルドラインは、穴や複数ゲートで流れが分かれて合流する所に出ます。'],
  exp:'PAやPCのように吸水する樹脂は、成形前の予備乾燥が欠かせません。成形不良は「材料・金型・成形条件」のどこに原因があるかを切り分けて考えます。',
  plain:'樹脂部品の不良について、原因と対策の組み合わせが正しいものを選ぶ問題です。',
  tatoe:'例えるなら、シルバーは湿った天ぷら粉で揚げ物をすると油がはねて衣が荒れるのと似ています。水分が熱で一気に気化し、表面に跡を残します。' },
 { id:'q-mresin-4', unit:'mresin', lv:2, polarity:'wrong',
  stem:'オートバイに使われる材料の特徴について、誤っているものはどれですか。',
  choices:['アルミ合金の密度は、鋼の約3分の1である。','マグネシウム合金は実用金属の中で最も軽いが、腐食しやすく、削りくずが燃えやすい。','チタン合金はさびにくく熱にも強く、マフラーやボルトに使われることがある。','CFRPは、繊維の向きに関係なく、どの方向にも同じ強さを持つ材料である。'],
  answer:4,
  why:['アルミの密度は約2.7、鋼は約7.8で、約3分の1です。正しい記述です。','マグネシウムの密度は約1.8で最も軽い一方、腐食や切りくずの発火に注意が必要です。正しい記述です。','チタンは耐食性・耐熱性に優れ、軽量化パーツに使われます。正しい記述です。','CFRPは繊維の方向に強く、方向によって強さが変わる（異方性がある）材料です。この記述が誤りです。'],
  exp:'材料は「重さ・強さ・耐食性・値段・加工しやすさ」のバランスで選ばれます。CFRPは非常に軽く強い反面、繊維の向きを考えた設計と成形が必要で、高価です。',
  plain:'鋼・アルミ・マグネシウム・チタン・炭素繊維の特徴について、まちがった説明を探す問題です。',
  tatoe:'例えるなら、CFRPは木材に似ています。木目に沿った方向には割れにくく強いのに、木目に直角な方向には割れやすいのと同じで、繊維の向きで強さが変わります。' },
 { id:'q-mresin-5', unit:'mresin', lv:3, polarity:'correct',
  stem:'射出成形のしくみと品質管理について、正しいものはどれですか。',
  choices:['ゲートは、成形品を金型から押し出すためのピンのことである。','保圧は、充填後も圧力をかけ続けて、冷えて縮む分の樹脂を補う工程である。','ウェルドラインは見た目だけの問題で、その部分の強度は他の部分と変わらない。','金型の冷却時間は、成形のサイクルタイムにほとんど影響しない。'],
  answer:2,
  why:['製品を押し出すのは突き出しピンです。ゲートはキャビティへの樹脂の入口です。','保圧は収縮を補ってヒケや寸法不良を防ぐ重要な工程です。正しい記述です。','ウェルドラインの部分は樹脂が十分に混ざり合わず、強度が下がることがあります。','冷却時間はサイクルタイムの大きな割合を占めるため、生産性に大きく影響します。'],
  exp:'射出成形は、射出（充填）→保圧→冷却→型開き・突き出しの順に進みます。保圧の条件はヒケや寸法に、ゲート位置はウェルドラインの出る場所に関係するため、どちらも品質管理の重要項目です。',
  plain:'射出成形の工程の名前と役割、不良が強度に与える影響について、正しい説明を選ぶ問題です。',
  tatoe:'例えるなら、保圧はパンケーキを型で焼くときに、生地が縮んでへこまないよう、ふたを上から押さえ続けるようなものです。手を離すのが早いと、表面がへこんでしまいます。' },
 { id:'q-minsp-1', unit:'minsp', lv:1,
  stem:'穴用の限界ゲージ（栓ゲージ）で、合格と判定されるのはどの場合ですか。',
  choices:['通り側も止まり側も入る','通り側が入り、止まり側が入らない','通り側が入らず、止まり側が入る','通り側も止まり側も入らない'],
  answer:2,
  why:['止まり側まで入るのは、穴が最大許容寸法より大きいことを示し、不合格です。','穴が最小許容寸法以上で、最大許容寸法以下であることを示すので、正解です。','通常は起こらない組み合わせで、ゲートや測定方法の異常を疑います。','通り側が入らないのは、穴が最小許容寸法より小さいことを示し、不合格です。'],
  exp:'穴用栓ゲージは、通り側を最小許容寸法、止まり側を最大許容寸法でつくっています。「通りが通って、止まりが止まる」のが合格です。',
  plain:'穴の大きさが規格内かを、2つの端のゲージで調べるときの「合格の条件」を聞いています。',
  tatoe:'例えるなら、遊園地の身長制限の板が2枚あるようなものです。「この板より高い」と「この板より低い」の両方を満たした人だけが乗れます。' },
 { id:'q-minsp-2', unit:'minsp', lv:1,
  stem:'表面に開いた割れを、赤い液をしみ込ませてから現像剤で吸い出して見つける非破壊検査はどれですか。',
  choices:['浸透探傷試験','磁粉探傷試験','超音波探傷試験','放射線透過試験'],
  answer:1,
  why:['浸透液を割れにしみ込ませ、余分をふき取って現像剤で吸い出し、模様として見る方法です。正解です。','磁粉探傷は、磁化した部品の漏れ磁束に磁粉を集めて割れを見つける方法です。','超音波探傷は、音の反射で内部のきずを調べる方法です。','放射線透過は、X線などで内部の空洞などを写す方法です。'],
  exp:'浸透探傷は、材料が磁性体かどうかに関係なく使え、アルミの鋳物や溶接部の表面割れの検査に向きます。ただし、表面に開いていない内部のきずは見つけられません。',
  plain:'色の付いた液を使って、表面の細い割れを目に見えるようにする検査の名前を聞いています。',
  tatoe:'例えるなら、ひびの入った茶わんに色の濃いお茶がしみ込み、ふいたあとも、ひびに沿って茶色い線が浮かんでくるのと同じしくみです。' },
 { id:'q-minsp-3', unit:'minsp', lv:2, polarity:'wrong',
  stem:'非破壊検査とリークテストについて、誤っているものはどれですか。',
  choices:['磁粉探傷試験は、アルミ合金の部品の割れ検査にも、そのまま使える。','超音波探傷試験では、探触子と部品の間に接触媒質を使う。','放射線透過試験は、鋳物内部の鋳巣や溶接部のブローホールの検出に向く。','空気で加圧するリークテストでは、部品の温度が変わると判定がずれることがある。'],
  answer:1,
  why:['磁粉探傷は磁化できる強磁性体（鉄鋼など）にしか使えません。アルミには浸透探傷などを使います。この記述が誤りです。','音が空気でさえぎられないよう、油やジェルなどの接触媒質を使います。正しい記述です。','内部の空洞は放射線の透過量の差として写ります。正しい記述です。','空気の圧力は温度で変わるため、洗浄直後の温かい部品などでは誤判定の原因になります。正しい記述です。'],
  exp:'非破壊検査は「何が（材料）」「どこの（表面か内部か）」きずを見たいかで選びます。磁粉は強磁性体の表面・表面直下、浸透は表面開口、X線と超音波は内部が得意です。',
  plain:'壊さずに中のきずや漏れを調べる検査について、使える条件や注意点のまちがいを探す問題です。',
  tatoe:'例えるなら、磁粉探傷は砂場で磁石を使って砂鉄を集める遊びと同じで、鉄でできていないものには何も集まりません。' },
 { id:'q-minsp-4', unit:'minsp', lv:2, polarity:'correct',
  stem:'測定器と校正について、正しいものはどれですか。',
  choices:['ノギスの読み取りの目安は、一般に0.001 mmである。','マイクロメータは、ラチェットを使って一定の測定力で測る。','校正で測定器が許容差を外れていても、前回の校正以降に測定した製品を見直す必要はない。','トレーサビリティとは、測定器を毎日使う前に目で見て点検することである。'],
  answer:2,
  why:['ノギスの読み取りは一般に0.05 mm（0.02 mmの品もある）です。','ラチェットで測定力を一定にし、測る人による差を小さくします。正しい記述です。','許容差外れが分かったら、前回の校正以降にその測定器で判定した製品の妥当性を評価し、必要な処置をとります。','トレーサビリティは、校正が上位の標準を通じて国家標準までつながっていることをいいます。'],
  exp:'測定結果を信頼するには、測定器が正しいこと（校正）と、その正しさが国家標準までつながっていること（トレーサビリティ）が必要です。マイクロメータは0.01 mmの読み取りが一般的です。',
  plain:'ノギスやマイクロメータの使い方と、測定器の「正しさ」を保証するしくみについて、正しい説明を選ぶ問題です。',
  tatoe:'例えるなら、トレーサビリティは家の時計を電波時計に、電波時計を国の標準時に合わせていくつながりです。どこかで途切れると、自分の時計が正しいとは言い切れません。' },
 { id:'q-minsp-5', unit:'minsp', lv:3, polarity:'correct',
  stem:'抜取検査と工程能力について、正しいものはどれですか。',
  choices:['抜取検査で合格したロットには、不良品が1つも含まれていないことが保証される。','Cpは平均値のかたよりを考えた指標で、Cpkはかたよりを考えない指標である。','規格の中心と工程の平均が一致していれば、CpとCpkは等しくなる。','Cpkが0.8の工程は、一般に工程能力が十分あると判断される。'],
  answer:3,
  why:['抜取検査には、悪いロットを合格にしてしまう消費者危険があり、不良ゼロは保証されません。','逆です。Cpはかたよりを考えず、Cpkは平均のかたよりを考えた指標です。','平均が規格の中心にあれば、近いほうの規格までの距離が規格幅の半分になり、CpとCpkは等しくなります。正しい記述です。','一般に1.33以上で十分、1.00未満は不足とされ、0.8は不足です。'],
  exp:'Cp＝（上限－下限）÷6σ、Cpk＝平均から近いほうの規格までの距離÷3σです。平均がずれるほどCpkは小さくなり、常にCpk≦Cpとなります。',
  plain:'一部を抜き取って全体を判断する検査の限界と、工程の実力を表す数字（CpとCpk）の意味について、正しい説明を選ぶ問題です。',
  tatoe:'例えるなら、車庫入れで車幅が車庫より十分狭くても（Cpが高い）、片側に寄せて止めればこすりやすくなります（Cpkが下がる）。真ん中に止めれば、2つの評価は同じになります。' }
);

<h3>まず、これは何？</h3>
<p>カワサキのオートバイは、ある日いきなり生まれたものではありません。出発点は明治時代の<strong>造船所</strong>です。船、飛行機、鉄道車両と、時代ごとに大きな機械を作ってきた技術の流れの中に、オートバイがあります。社員として「うちの会社はどこから来たのか」を知っておくと、来客対応や雑談でも自信を持って話せます。</p>
<h3>はじまりは築地の造船所</h3>
<p>創業者は薩摩（いまの鹿児島県）出身の実業家<strong>川崎正蔵</strong>です。<strong>1878年</strong>、東京・築地に<strong>川崎築地造船所</strong>を開きました。その後、拠点を神戸に移し、<strong>1896年</strong>に<strong>株式会社川崎造船所</strong>（神戸）が設立されます。このときの<strong>初代社長は松方幸次郎</strong>で、川崎正蔵本人ではない点がよく問われるポイントです。</p>
<div class="nbox">📝 松方幸次郎は美術品の収集家としても有名で、その収集品「松方コレクション」は東京・上野の国立西洋美術館の基礎になりました。</div>
<h3>空へ、そして明石へ</h3>
<p>造船所は航空機の分野にも進出し、やがて航空機部門は<strong>川崎航空機工業</strong>として独立しました。戦時中の三式戦闘機<strong>「飛燕」</strong>は、日本では珍しい<strong>液冷エンジン</strong>を積んだ川崎の戦闘機として知られています。戦後は航空機で培ったエンジン技術を生かし、<strong>明石</strong>でオートバイ用エンジン、そしてオートバイそのものの生産へと進みました。1969年には川崎重工業・川崎航空機工業・川崎車輛の3社が合併し、現在の<strong>川崎重工業</strong>の形になります。</p>

<p>このうちモーターサイクル&amp;エンジン事業は、<strong>2021年10月</strong>に分社化され、<strong>カワサキモータース株式会社</strong>（本社：明石）として独立しました。川崎重工業の100%子会社で、グループの一員であることに変わりはありません。</p>

<div class="wbox">⚠️ リバーマークはすべての市販車に付いているわけではありません。「特別なモデルの証」と覚えましょう。</div>

<p><strong>マッハIII</strong>は、2ストローク3気筒の鋭い加速で「じゃじゃ馬」とも呼ばれました。続く<strong>Z1（正式名 900 Super Four）</strong>は、DOHC（カムシャフトを2本使う高性能な弁の駆動方式）の並列4気筒を積み、北米を中心に大ヒットします。開発中のコードネームは<strong>「ニューヨークステーキ」</strong>。主戦場の北米市場で「一番おいしいごちそう」を出す、という意気込みが込められていたと伝えられます。</p>

<div class="wbox">⚠️ 「Z1＝750cc」は誤りです。Z1は903cc、Z2が750cc級です。また、マッハは2ストローク、Zは4ストロークと、仕組みがまったく違います。</div>

<h3>まず、オートバイはいつ生まれた？</h3>
<p>「エンジンの力で走る二輪車」が生まれたのは<strong>19世紀後半</strong>です。ちょうど自転車が広まり始めたころで、「ペダルをこぐ代わりに、機械の力で走らせたい」と考えた人たちが、さまざまな動力を試しました。オートバイの歴史は、言わば<strong>自転車にエンジンを載せる挑戦</strong>から始まったのです。</p>

<h3>最初の試み：蒸気で走る二輪</h3>
<p>最初に試されたのは<strong>蒸気機関</strong>でした。1860年代ごろから、フランスやアメリカで自転車に小型の蒸気機関を載せた車両が作られています。しかし、お湯を沸かすボイラーと燃料（石炭など）を積まなければならず、重いうえに火の扱いも大変でした。そのため、実用的な乗り物としては広まりませんでした。</p>

<h3>ガソリンエンジンの登場：ライトワーゲン（1885年）</h3>
<p>流れを変えたのは、燃料を筒の中で燃やして動く<strong>内燃機関</strong>（ないねんきかん）です。ドイツのゴットリープ・ダイムラーとヴィルヘルム・マイバッハは、小型で軽いガソリンエンジンを開発し、<strong>1885年</strong>にそれを木製の車体に載せた二輪車<strong>ライトワーゲン</strong>（ドイツ語で「乗る車」の意味）を作りました。</p>
<ul>
<li>車体や車輪の多くが<strong>木製</strong>だった</li>
<li>左右に転倒を防ぐ<strong>補助輪</strong>が付いていた</li>
<li>販売用ではなく、<strong>エンジンの実験台</strong>という性格が強かった</li>
</ul>
<p>それでも「ガソリンエンジンで走る二輪車」の元祖として、オートバイ史の出発点に位置づけられています。</p>
<div class="nbox">📝 ほぼ同じ時期の1886年には、カール・ベンツが三輪の自動車を、ダイムラーも四輪の自動車を完成させています。オートバイと自動車は、ほぼ同時に生まれた「きょうだい」のような存在です。</div>

<h3>初の量産車：ヒルデブラント&ヴォルフミュラー（1894年）</h3>
<p><strong>1894年</strong>、ドイツのヒルデブラント&ヴォルフミュラーが、一般に販売することを目的にした二輪車を世に出しました。これが<strong>世界初の量産オートバイ</strong>とされています。また、ドイツ語で二輪車を意味する<strong>「モトラッド（Motorrad）」</strong>という名前で呼ばれた最初の車両としても知られています。ただし技術的にはまだ未熟で、会社は長続きしませんでした。</p>

<h3>20世紀初頭：アメリカの有名ブランド誕生</h3>
<p>1900年代に入ると、欧米で次々にオートバイが作られるようになります。初期の車両はペダルが残っていたり、ベルトで後輪を回したりと、自転車の名残が色濃いものでした。アメリカでは、今も名前が残る2つのブランドが誕生しました。</p>
<div class="tblwrap"><table><thead><tr><th>年</th><th>出来事</th></tr></thead><tbody>
<tr><td>1860年代ごろ</td><td>フランス・アメリカで蒸気二輪の試み</td></tr>
<tr><td>1885年</td><td>ダイムラーとマイバッハのライトワーゲン</td></tr>
<tr><td>1894年</td><td>ヒルデブラント&ヴォルフミュラー（初の量産車）</td></tr>
<tr><td>1901年</td><td>インディアン誕生（アメリカ）</td></tr>
<tr><td>1903年</td><td>ハーレーダビッドソン誕生（アメリカ・ミルウォーキー）</td></tr>
</tbody></table></div>
<p>インディアンとハーレーダビッドソンは長くライバル関係にありました。インディアンは途中で経営が途絶えた時期を経て、現在はブランドとして復活しています。ハーレーダビッドソンは、小さな小屋での製作から始まり、一度も途切れることなく続いてきたメーカーとして知られています。</p>

<div class="diagram">
 蒸気二輪  →  ライトワーゲン  →  量産車
 1860年代     1885年           1894年
 (重く不便)   (実験台)         (モトラッド)
     ↓
 1901 インディアン / 1903 ハーレー
</div>

<div class="pbox">オートバイは「自転車＋エンジン」から始まりました。重い蒸気機関では無理があり、軽いガソリンエンジンができて初めて実用的になりました。1885年が「元祖」、1894年が「初めて売り物として量産」と覚えましょう。</div>
<div class="tbox">例えるなら、新しい家電の誕生に似ています。ライトワーゲンは研究所でつくられた「試作機」、ヒルデブラント&ヴォルフミュラーは初めてお店に並んだ「製品第1号」です。試作機があっても、量産して売れる形にするまでには、もう一段の工夫が必要なのです。</div>
<div class="wbox">⚠️ 「世界初のオートバイは何か」は、定義によって答えが変わります。蒸気で走るものを含めるのか、ガソリンエンジンに限るのか、量産されたものに限るのか、で別の車両が挙がります。問題文の条件をよく読みましょう。</div>

<h3>覚えどころ</h3>
<ul>
<li>蒸気二輪は1860年代ごろ。重く不便で広まらなかった</li>
<li>1885年 ライトワーゲン（ダイムラー）＝ガソリンエンジン二輪の元祖。木製・補助輪付き</li>
<li>1894年 ヒルデブラント&ヴォルフミュラー＝初の量産車、「モトラッド」</li>
<li>1901年 インディアン、1903年 ハーレーダビッドソン（ともにアメリカ）</li>
</ul>

 { id:'hworld', field:'history', icon:'🌍', title:'世界のメーカー', sub:'ハーレー・BMW・ドゥカティ・トライアンフ・ベスパ・KTMの「らしさ」', gram:`
<h3>まず、メーカーの「らしさ」とは？</h3>
<p>オートバイのメーカーには、それぞれ長い歴史の中で育ってきた<strong>得意な形式や雰囲気</strong>があります。エンジンの形、音、デザイン、得意なレースなどがそのメーカーの「顔」になり、ファンはそこに惹かれます。ここでは、世界の代表的なメーカーの特徴をつかみましょう。</p>

<div class="tblwrap"><table><thead><tr><th>メーカー</th><th>国</th><th>らしさ（代表的な特徴）</th></tr></thead><tbody>

</tbody></table></div>

<h3>ハーレーダビッドソン：Vツインの鼓動</h3>
<p>1903年創業のアメリカのメーカーです。2つのシリンダーを<strong>V字</strong>に並べた<strong>45度Vツイン</strong>が伝統で、爆発の間隔が不等間隔になるため、「ドコドコ」という独特の鼓動感と排気音が生まれます。ゆったり座って長距離を走る<strong>クルーザー</strong>の代表格です。</p>

<h3>BMW：ボクサーエンジンとシャフトドライブ</h3>
<p>BMWの最初のオートバイは<strong>1923年のR32</strong>です。このときすでに、左右に向き合ってシリンダーが張り出す<strong>水平対向2気筒（ボクサーツイン）</strong>と、チェーンではなく回転軸で後輪を回す<strong>シャフトドライブ</strong>を採用していました。この組み合わせは今もBMWの象徴です。1980年に登場したR80G/Sは、オンロードもオフロードも走れる<strong>アドベンチャー</strong>というジャンルの先駆けとして知られます。</p>

<h3>ドゥカティ：デスモドロミック</h3>
<p>イタリア・ボローニャのメーカーです。普通のエンジンは、カムでバルブを押し開け、<strong>バネの力で閉じます</strong>。ドゥカティが得意とする<strong>デスモドロミック</strong>は、<strong>閉じる動きもカムと腕（ロッカーアーム）で機械的に行う</strong>仕組みです。高回転でもバルブがカムの動きに正確に従うのが利点です。90度に開いたVツインを車体に寝かせた<strong>L型ツイン</strong>や、パイプを組んだトレリスフレームも有名です。</p>

<h3>トライアンフ：英国車の伝統</h3>
<p>イギリスを代表するメーカーです。1959年に登場した<strong>ボンネビル</strong>は、アメリカ・ユタ州の速度記録の聖地「ボンネビル・ソルトフラッツ」にちなんだ名前です。旧会社は1980年代に経営破綻しましたが、新しい経営者のもとで再建され、1990年前後から新生トライアンフとして復活しました。現在は<strong>3気筒エンジン</strong>のモデルも看板です。</p>

<h3>ベスパ：スクーターの代名詞</h3>
<p>イタリアのピアジオ社が<strong>1946年</strong>に発売しました。ピアジオはもともと航空機も手がけた会社で、戦後の民需転換の中で生まれた製品です。「ベスパ」はイタリア語で<strong>スズメバチ</strong>の意味。足元が平らで、服が汚れにくい鉄板ボディのスクーターは、映画『ローマの休日』（1953年）に登場したことでも世界的に知られました。</p>

<h3>KTMほか</h3>
<p>オーストリアの<strong>KTM</strong>は、モトクロスやエンデューロなどの<strong>オフロード競技</strong>に強く、過酷な長距離ラリー「ダカールラリー」で長年にわたって勝ち続けたことで有名です。ほかにも、エンジンを縦向きに積んだVツインのモト・グッツィ（イタリア）、イギリス発祥で現在はインドを拠点とするロイヤルエンフィールドなど、個性的なメーカーがたくさんあります。</p>

<div class="pbox">メーカーにはそれぞれ「お家芸」があります。ハーレー＝Vツイン、BMW＝ボクサー、ドゥカティ＝デスモ、トライアンフ＝英国の伝統、ベスパ＝スクーター、KTM＝オフロード。まずはこの組み合わせを覚えれば、バイク好きとの会話がぐっと楽になります。</div>
<div class="tbox">例えるなら、老舗料理店の「看板メニュー」です。どの店もいろいろな料理を出しますが、「あの店といえばこれ」という一品があり、それを目当てにお客さんが来ます。エンジン形式は、メーカーにとっての看板メニューなのです。</div>
<div class="wbox">⚠️ ここで挙げたのは「代表的な傾向」です。BMWも並列4気筒やスクーターを作っていますし、ハーレーにも水冷エンジンのモデル、ドゥカティにもバネでバルブを閉じるエンジンを使うモデルがあります。「そのメーカーの全車種がそうだ」とは限りません。</div>

<h3>覚えどころ</h3>
<ul>
<li>ハーレー：45度Vツイン、鼓動感、クルーザー</li>
<li>BMW：R32（1923年）からボクサーツイン＋シャフトドライブ</li>
<li>ドゥカティ：デスモドロミック（バルブを閉じるのも機械式）</li>

 { id:'hjapan', field:'history', icon:'🗾', title:'日本のバイク史', sub:'浜松の乱立期から4大メーカー、CB750FOUR、80年代ブームまで', gram:`
<h3>まず、日本のバイク産業はどう始まった？</h3>
<p>戦前にも国産オートバイはありましたが、本格的に花開いたのは<strong>第二次世界大戦後</strong>です。戦後の日本では、移動手段や運搬手段への需要が大きく、自転車に小さなエンジンを付けた<strong>補助エンジン付き自転車</strong>が大流行しました。この時期、大小さまざまなメーカーが生まれ、1950年代には<strong>100社を超える</strong>とも言われるほどの<strong>乱立期</strong>を迎えます。</p>
<p>中でも<strong>静岡県浜松市とその周辺</strong>は、織機や楽器などの機械工業が盛んで技術者が多く、ホンダ・スズキ・ヤマハがこの地域から育ちました。その後、激しい競争の中で多くのメーカーが姿を消し、生き残ったのが現在の<strong>国内4メーカー</strong>です。</p>

<tr><td>カワサキ</td><td>兵庫県明石市</td><td>航空機などを手がけた重工業の技術を背景に二輪へ</td></tr>

<h3>ホンダとスーパーカブ</h3>
<p>本田宗一郎は、旧軍用の小型エンジンを自転車に取り付けて販売することから事業を始めました。<strong>1958年</strong>に発売した<strong>スーパーカブ</strong>は、クラッチレバー操作が要らない仕組みや、泥はねを防ぐ大きな樹脂製の前カバーを備え、「誰でも気軽に乗れる実用車」として大ヒットしました。燃費がよく丈夫なことから世界中で使われ、シリーズの累計生産は<strong>2017年に1億台</strong>に達しました。二輪車として歴史上もっとも多く作られたシリーズです。</p>

<h3>CB750FOURと「ナナハン」</h3>
<p>1968年の東京モーターショーで発表され、<strong>1969年</strong>に発売された<strong>ホンダCB750FOUR</strong>は、日本のバイク史の大きな転換点です。<strong>並列4気筒エンジン</strong>と<strong>油圧式フロントディスクブレーキ</strong>を備えた大型車を量産し、世界、特にアメリカで大成功を収めました。750ccのバイクを<strong>「ナナハン」</strong>と呼ぶ言葉が広まったのもこの車がきっかけです。ここから日本の大型バイクが世界をリードする時代が始まります（カワサキのZ1も1972年に登場しています）。</p>

<h3>750cc自主規制と免許制度</h3>
<p>CB750FOUR登場後、国内向けの最大排気量を<strong>750ccまで</strong>とする業界の<strong>自主規制</strong>が長く続きました。そのため、海外向けに作られた大排気量車を日本に持ち込む<strong>逆輸入車</strong>が人気を集めました。この自主規制は<strong>1990年前後に撤廃</strong>され、国内でも大排気量車が正規に販売されるようになります。</p>
<p>免許の面でも、1975年の制度改正で400cc以下に限る「中型限定」が設けられ、それを超えるバイクに乗るための「限定解除」は試験場での難関試験でした。1996年に<strong>大型二輪免許</strong>が新設され、教習所で取得できるようになると、大型バイクはぐっと身近になりました。</p>

<h3>80年代のバイクブームとレーサーレプリカ</h3>
<p>1980年代は空前のバイクブームでした。国内の年間販売台数は<strong>1980年代前半</strong>にピークを迎え、300万台を超えています。ホンダとヤマハの激しい販売競争は<strong>「HY戦争」</strong>と呼ばれました。</p>
<p>この時代の主役が、レース用マシンそっくりの外観と性能を持つ<strong>レーサーレプリカ</strong>です。ヤマハRZ250（1980年）が火付け役となり、ホンダNSR250R、ヤマハTZR250、スズキRG250Γ（ガンマ）など、特に<strong>250ccの2ストローク車</strong>が若者の間で人気を集めました。一方で事故の増加も社会問題となり、高校生に「免許を取らせない・バイクを買わせない・運転させない」とする<strong>「三ない運動」</strong>も広がりました。</p>

<div class="pbox">日本のバイク史は「たくさん生まれて、競争で4社に絞られ、世界一になった」物語です。スーパーカブで世界の足となり、CB750FOURで大型車の主役になり、80年代には国内で大ブームが起きました。</div>
<div class="tbox">例えるなら、商店街のラーメン屋の競争です。最初は小さな店がたくさん開きますが、味と工夫で勝ち残った数店が全国チェーンになり、やがて海外にも出店していきます。浜松はその「激戦区の商店街」でした。</div>
<div class="wbox">⚠️ 免許制度や規制の細部は改正されることがあります。現在の免許区分などは警察庁など公式情報で確認しましょう。</div>

<h3>覚えどころ</h3>
<ul>
<li>戦後の乱立期、ホンダ・スズキ・ヤマハは浜松周辺から</li>
<li>ホンダ1948年設立、スーパーカブ1958年、累計1億台（2017年）</li>
<li>ヤマハ発動機1955年、YA-1「赤トンボ」</li>
<li>CB750FOUR（1969年）＝並列4気筒＋ディスクブレーキ、「ナナハン」</li>
<li>750cc自主規制は1990年前後に撤廃、80年代はレーサーレプリカブーム</li>
</ul>

<h3>まず、なぜレースが大切なの？</h3>
<p>オートバイの技術は、<strong>レースで鍛えられて</strong>きました。限界ぎりぎりの速さと耐久性を競う中で、エンジン・ブレーキ・タイヤ・車体の技術が磨かれ、それが市販車に生かされます。また、レースでの勝利はメーカーの名声を世界に広めました。</p>

<h3>マン島TT：公道レースの伝説（1907年〜）</h3>
<p>イギリスとアイルランドの間にあるマン島で<strong>1907年</strong>に始まった<strong>マン島TT</strong>（ツーリスト・トロフィー）は、現存する中でも特に歴史の長いオートバイレースです。1911年からは、島の<strong>一般道を閉鎖して使う</strong>1周約60kmの山岳コースで行われています。石垣や民家のすぐ横を猛スピードで駆け抜ける、世界でもっとも過酷で危険なレースの一つです。安全面の議論から、1970年代に世界選手権のシリーズからは外れましたが、現在も独立した大会として続いています。</p>

<h3>本田宗一郎のTT出場宣言と1961年の快挙</h3>
<p>まだ日本のバイクが世界で無名だった<strong>1954年</strong>、本田宗一郎は社内外に向けて<strong>マン島TTへの出場を宣言</strong>しました。当時の日本車の性能は欧州車に遠く及ばず、無謀とも言える挑戦でした。ホンダは数年かけて技術を磨き、1959年に初出場。そして<strong>1961年</strong>、125ccクラスと250ccクラスの両方で<strong>上位を独占</strong>するという快挙を成し遂げ、日本の技術力を世界に示しました。</p>

<h3>世界グランプリからMotoGPへ</h3>
<p>国際モーターサイクリズム連盟（FIM）による<strong>ロードレース世界選手権（世界グランプリ、WGP）</strong>は<strong>1949年</strong>に始まりました。長く排気量別のクラスで争われ、最高峰の500ccクラスでは1970年代以降、軽くて高出力な<strong>2ストローク</strong>エンジンが主流になりました。</p>
<p><strong>2002年</strong>、最高峰クラスは<strong>MotoGP</strong>と名前を変え、<strong>4ストローク</strong>エンジンを中心とするルールに移行しました。以後、MotoGPは4ストロークの最新技術の競演の場になっています。下のクラスも、250ccクラスはMoto2に、125ccクラスはMoto3に置き換えられました。日本人ライダーも250ccクラスなどで世界チャンピオンを獲得しています。</p>

<div class="tblwrap"><table><thead><tr><th>レース</th><th>始まり</th><th>特徴</th></tr></thead><tbody>
<tr><td>マン島TT</td><td>1907年</td><td>公道を使う伝統の一戦</td></tr>
<tr><td>世界グランプリ</td><td>1949年</td><td>レース専用マシンによる世界選手権</td></tr>
<tr><td>MotoGP</td><td>2002年〜</td><td>最高峰クラス、4ストローク化</td></tr>
<tr><td>スーパーバイク世界選手権</td><td>1988年</td><td><strong>市販車ベース</strong>の世界選手権</td></tr>
<tr><td>鈴鹿8耐</td><td>1978年</td><td>真夏の8時間耐久、複数ライダーで交代</td></tr>
</tbody></table></div>

<h3>市販車ベースの戦い：スーパーバイクと鈴鹿8耐</h3>
<p>MotoGPのマシンが一般には買えない「レース専用車」なのに対し、<strong>1988年</strong>に始まった<strong>スーパーバイク世界選手権（WSBK）</strong>は、<strong>市販車を改造したマシン</strong>で争います。「日曜のレースで勝てば月曜にお店で売れる」と言われるように、販売に直結するレースです。</p>
<p>三重県の鈴鹿サーキットで<strong>1978年</strong>に始まった<strong>鈴鹿8時間耐久ロードレース（鈴鹿8耐）</strong>は、真夏に8時間走り続け、2〜3人のライダーが交代しながら周回数を競います。スタート時にライダーがマシンまで走って乗り込む<strong>ル・マン式スタート</strong>でも知られ、日本のメーカーにとって特に重要な一戦です。</p>

<h3>オフロードの競技</h3>
<ul>
<li><strong>モトクロス</strong>：起伏やジャンプのある未舗装コースで速さを競う。イギリスの「スクランブル」と呼ばれた競技が起源</li>
<li><strong>トライアル</strong>：岩や丸太などの障害を、足を地面につかずに越える技術を競う。足をつくと減点。速さより<strong>バランスと技術</strong></li>
<li><strong>ラリー</strong>：砂漠などを何日もかけて走破する。1970年代末に始まったダカールラリーが有名（現在はサウジアラビアで開催）</li>
</ul>

<div class="pbox">レースには大きく「レース専用車の頂点（MotoGP）」「市販車ベース（WSBK）」「耐久（8耐）」「公道の伝統（マン島TT）」「オフロード（モトクロス・トライアル）」があります。日本メーカーはマン島TTでの挑戦をきっかけに世界の頂点へ駆け上がりました。</div>
<div class="tbox">例えるなら、料理のコンテストです。MotoGPは一流シェフが特別な食材と道具で腕を競う「世界大会」、WSBKはスーパーで買える食材だけで競う「家庭料理コンテスト」、8耐は「8時間ぶっ通しで料理を出し続ける耐久戦」です。</div>
<div class="nbox">📝 トライアルの「足をつかない」は、自転車で信号待ちのとき足をつかずに止まる「スタンディング」の超上級版です。</div>

<h3>覚えどころ</h3>
<ul>
<li>マン島TT 1907年〜、公道コース</li>
<li>本田宗一郎のTT出場宣言1954年 → 1961年に125cc・250ccで上位独占</li>
<li>世界GP 1949年〜、2002年にMotoGPへ（4ストローク化）</li>
<li>WSBK 1988年〜（市販車ベース）、鈴鹿8耐 1978年〜（ル・マン式スタート）</li>
</ul>

 { id:'hculture', field:'history', icon:'🎸', title:'カルチャーと用語', sub:'カフェレーサー、チョッパー、ジャンル、ライダー用語、安全装備の進化', gram:`
<h3>まず、バイク文化とは？</h3>
<p>オートバイは単なる移動手段ではなく、<strong>ファッション・音楽・映画</strong>と結びついた文化を生んできました。改造のスタイルや、ライダー同士のあいさつ、車種の「ジャンル」の呼び方などを知ると、バイクの世界がぐっと身近になります。</p>

<h3>カフェレーサー：ロンドン生まれの改造スタイル</h3>
<p>1950〜60年代のイギリスでは、若者たちがバイクを速く走らせることに夢中になりました。ロンドンの<strong>エースカフェ</strong>などに集まった彼らは「ロッカーズ」と呼ばれ、カフェからカフェへと速さを競いました。そうした若者が好んだ改造スタイルが<strong>カフェレーサー</strong>です。</p>
<ul>
<li>低く構えたハンドル（セパレートハンドルなど）</li>
<li>後ろに下げたステップ</li>
<li>一人乗り用のシートとカウル（シングルシートカウル）</li>
</ul>
<p>レーサーのような前傾姿勢が特徴で、現在もこのスタイルをまねた市販車が各社から出ています。</p>

<h3>チョッパー：映画『イージー・ライダー』</h3>
<p><strong>チョッパー</strong>は、不要な部品を「切り落とす（chop）」ことから生まれたアメリカの改造スタイルです。前輪を大きく前に突き出した長いフロントフォークや、高く持ち上げたハンドルが特徴です。<strong>1969年</strong>のアメリカ映画<strong>『イージー・ライダー』</strong>に登場したチョッパーは、自由の象徴として世界中に強い印象を残しました。</p>

<h3>バイクのジャンル</h3>
<div class="tblwrap"><table><thead><tr><th>ジャンル</th><th>特徴</th></tr></thead><tbody>
<tr><td>ネイキッド</td><td>カウル（風よけの外装）がなく、エンジンがむき出し。扱いやすい万能型</td></tr>
<tr><td>スーパースポーツ（SS）</td><td>フルカウルで前傾姿勢。サーキット性能を追求</td></tr>
<tr><td>ツアラー</td><td>大きなカウルや荷物入れで長距離を快適に</td></tr>
<tr><td>アドベンチャー</td><td>舗装路も未舗装路も走れる大陸横断型</td></tr>
<tr><td>クルーザー</td><td>低いシートで足を前に出し、ゆったり流す。アメリカン</td></tr>
<tr><td>ネオクラシック</td><td>昔のデザインを現代の技術で再現</td></tr>
<tr><td>オフロード／スクーター</td><td>未舗装路用の軽量車／足元が平らで手軽な車</td></tr>
</tbody></table></div>

<h3>ライダー用語</h3>
<ul>
<li><strong>ヤエー</strong>：すれ違うライダー同士が手を挙げたりピースサインを出したりするあいさつ。語源には諸説あります。海外にも、手を下げて合図するなど似たあいさつの文化があります</li>
<li><strong>ソロツー／マスツー</strong>：一人でのツーリング／大人数でのツーリング</li>
<li><strong>立ちごけ</strong>：止まっているときや極低速でバランスを崩して倒すこと</li>
<li><strong>ニーグリップ</strong>：燃料タンクを両ひざで挟んで体を安定させること</li>
</ul>
<div class="wbox">⚠️ ヤエーは安全に余裕があるときだけ。カーブ中や交通量の多い場所で無理に手を離すのは危険です。返されなくても気にしないのがマナーです。</div>

<h3>安全装備の進化</h3>
<p>文化と並んで大切なのが安全技術の進化です。急ブレーキで車輪がロックする（回転が止まって滑る）のを防ぐ<strong>ABS</strong>は、<strong>1988年にBMWが量産二輪車として初めて</strong>採用しました（K100）。その後、ホンダのゴールドウイングが2006年に量産二輪車初のエアバッグを搭載し、近年は車体の傾きを検知して作動を調整する<strong>コーナリングABS</strong>や、後輪の空転を抑える<strong>トラクションコントロール</strong>も普及しています。日本では新型車へのABS（小排気量はCBSなども可）の装着義務化が2018年から段階的に進みました。</p>
<p>ライダーの装備も、ヘルメットの着用義務化（1980年代半ばまでに原付を含めて義務化）、胸部プロテクター、エアバッグベストなどへと進化しています。</p>
<div class="wbox">⚠️ 装着義務などの制度は対象車や時期に細かな条件があります。最新は国土交通省など公式情報で確認しましょう。</div>

<div class="pbox">バイク文化には、「改造スタイル（カフェレーサー・チョッパー）」「車種のジャンル」「ライダー同士の言葉（ヤエーなど）」「安全技術の歴史」の4つの柱があります。どれも、人々がバイクを楽しみ、守ってきた歴史の積み重ねです。</div>
<div class="tbox">例えるなら、洋服の世界です。カフェレーサーやチョッパーは特定の時代と街から生まれた「ファッションスタイル」、ネイキッドやツアラーは「スーツ・作業着・登山服」のような用途別の服の分類です。そしてABSは、転ばないように進化した「靴の滑り止め」のようなものです。</div>

<h3>覚えどころ</h3>
<ul>
<li>カフェレーサー：1950〜60年代ロンドン、エースカフェ、ロッカーズ</li>
<li>チョッパー：1969年の映画『イージー・ライダー』</li>

<li>ヤエー＝ライダー同士のあいさつ</li>
<li>二輪ABSの量産車初は1988年BMW</li>
</ul>

window.APEX_QIMG={"q-cbrake-1": {"c": "ラインに気泡ができると、握っても気泡が縮むだけで油圧が伝わらない。これがベーパーロック", "svg": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"20\" class=\"tt\">通常：ラインの中は液体だけ</text><rect x=\"20\" y=\"34\" width=\"90\" height=\"40\" class=\"bx\"/><text x=\"65\" y=\"59\" class=\"sm\" text-anchor=\"middle\">マスター</text><rect x=\"110\" y=\"47\" width=\"340\" height=\"14\" class=\"oilf\"/><line x1=\"110\" y1=\"47\" x2=\"450\" y2=\"47\" class=\"ln\"/><line x1=\"110\" y1=\"61\" x2=\"450\" y2=\"61\" class=\"ln\"/><rect x=\"450\" y=\"30\" width=\"70\" height=\"48\" class=\"pst\"/><text x=\"485\" y=\"92\" class=\"sm\" text-anchor=\"middle\">キャリパー</text><line x1=\"150\" y1=\"90\" x2=\"420\" y2=\"90\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"20\" y=\"112\" class=\"sm\">液体はほとんど縮まないので、レバーを握った力がそのままキャリパーへ伝わる</text><text x=\"20\" y=\"140\" class=\"tt ac\">ベーパーロック：フルードが沸騰して気泡ができた</text><rect x=\"20\" y=\"154\" width=\"90\" height=\"40\" class=\"bx\"/><text x=\"65\" y=\"179\" class=\"sm\" text-anchor=\"middle\">マスター</text><rect x=\"110\" y=\"167\" width=\"340\" height=\"14\" class=\"oilf\"/><line x1=\"110\" y1=\"167\" x2=\"450\" y2=\"167\" class=\"ln\"/><line x1=\"110\" y1=\"181\" x2=\"450\" y2=\"181\" class=\"ln\"/><rect x=\"450\" y=\"150\" width=\"70\" height=\"48\" class=\"pst\"/><text x=\"485\" y=\"212\" class=\"sm\" text-anchor=\"middle\">キャリパー</text><path d=\"M455 144 q8 -14 16 0 q8 -14 16 0 q8 -14 16 0 q8 -14 16 0z\" class=\"gfire\"/><circle cx=\"330\" cy=\"174\" r=\"4.5\" class=\"ln\"/><circle cx=\"360\" cy=\"171\" r=\"4.5\" class=\"ln\"/><circle cx=\"385\" cy=\"176\" r=\"4.5\" class=\"ln\"/><circle cx=\"405\" cy=\"172\" r=\"4.5\" class=\"ln\"/><circle cx=\"425\" cy=\"175\" r=\"4.5\" class=\"ln\"/><circle cx=\"440\" cy=\"171\" r=\"4.5\" class=\"ln\"/><text x=\"395\" y=\"142\" class=\"sm ac\" text-anchor=\"middle\">熱で沸騰 → 気泡</text><line x1=\"150\" y1=\"210\" x2=\"300\" y2=\"210\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"20\" y=\"232\" class=\"sm\">握っても気泡がつぶれる（縮む）だけで、押す力がパッドまで届かない。レバーがスカスカに</text><text x=\"20\" y=\"258\" class=\"sm dim\">下り坂でブレーキを使い続けるなど、キャリパーの熱がフルードに伝わると起こる</text></svg>"}, "q-cbrake-2": {"c": "ディスクはローターがむき出しで風が当たり放熱が良い。ドラムは密閉構造で熱がこもりやすい", "svg": "<svg viewBox=\"0 0 600 262\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"150\" y=\"20\" class=\"tt\" text-anchor=\"middle\">ディスクブレーキ</text><text x=\"450\" y=\"20\" class=\"tt\" text-anchor=\"middle\">ドラムブレーキ</text><circle cx=\"150\" cy=\"125\" r=\"78\" class=\"pst\"/><circle cx=\"150\" cy=\"125\" r=\"30\" class=\"bx\"/><circle cx=\"150\" cy=\"125\" r=\"6\" class=\"dot\"/><rect x=\"200\" y=\"50\" width=\"36\" height=\"56\" rx=\"4\" class=\"bx\"/><text x=\"242\" y=\"52\" class=\"sm\">キャリパー</text><text x=\"242\" y=\"68\" class=\"sm\">（両側から挟む）</text><line x1=\"20\" y1=\"90\" x2=\"60\" y2=\"90\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"20\" y1=\"130\" x2=\"60\" y2=\"130\" class=\"ln acs\" marker-end=\"url(#ah)\"/><line x1=\"20\" y1=\"170\" x2=\"60\" y2=\"170\" class=\"ln acs\" marker-end=\"url(#ah)\"/><text x=\"20\" y=\"228\" class=\"sm\">円板（ローター）がむき出しで</text><text x=\"20\" y=\"246\" class=\"sm ac\">走行風が当たる → 放熱が良い</text><circle cx=\"450\" cy=\"125\" r=\"82\" class=\"bx\"/><circle cx=\"450\" cy=\"125\" r=\"72\" class=\"ln\"/><path d=\"M392 99 A64 64 0 0 1 476 63\" class=\"ln thick\" fill=\"none\"/><path d=\"M508 151 A64 64 0 0 1 424 187\" class=\"ln thick\" fill=\"none\"/><circle cx=\"450\" cy=\"125\" r=\"6\" class=\"dot\"/><text x=\"450\" y=\"120\" class=\"sm\" text-anchor=\"middle\">シュー</text><text x=\"320\" y=\"228\" class=\"sm\">回るドラムの内側にシューを押し付ける。</text><text x=\"320\" y=\"246\" class=\"sm ac\">密閉構造 → 熱がこもりやすい</text></svg>"}, "q-cbrake-3": {"c": "握ると1次カップがリターンポートを越えて閉じ、油圧が立ち上がる。開いたままでは圧が逃げる", "svg": "<svg viewBox=\"0 0 600 294\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs><text x=\"20\" y=\"18\" class=\"tt\">放した状態：リターンポートが圧力室に開いている</text><rect x=\"40\" y=\"48\" width=\"380\" height=\"60\" class=\"bx\"/><rect x=\"40\" y=\"58\" width=\"288\" height=\"40\" class=\"oilf\"/><rect x=\"150\" y=\"24\" width=\"160\" height=\"18\" class=\"oilf\"/><rect x=\"150\" y=\"24\" width=\"160\" height=\"18\" class=\"ln\"/><line x1=\"182\" y1=\"42\" x2=\"182\" y2=\"58\" class=\"ln\"/><line x1=\"262\" y1=\"42\" x2=\"262\" y2=\"58\" class=\"ln\"/><rect x=\"196\" y=\"60\" width=\"140\" height=\"36\" rx=\"3\" class=\"pst\"/><rect x=\"188\" y=\"58\" width=\"8\" height=\"40\" class=\"ln thick\"/><rect x=\"328\" y=\"58\" width=\"8\" height=\"40\" class=\"ln thick\"/><rect x=\"336\" y=\"70\" width=\"90\" height=\"16\" class=\"pst\"/><text x=\"192\" y=\"114\" class=\"sm\" text-anchor=\"middle\">1次カップ</text><text x=\"332\" y=\"114\" class=\"sm\" text-anchor=\"middle\">2次カップ</text><text x=\"146\" y=\"38\" class=\"sm ac\" text-anchor=\"end\">リターンポート</text><text x=\"314\" y=\"38\" class=\"sm\">サプライポート</text><line x1=\"40\" y1=\"78\" x2=\"10\" y2=\"78\" class=\"ln thick\"/><text x=\"70\" y=\"84\" class=\"sm\" text-anchor=\"middle\">圧力室</text><text x=\"20\" y=\"148\" class=\"tt\">握った状態：1次カップがポートを越えて圧力室を密閉</text><rect x=\"40\" y=\"178\" width=\"380\" height=\"60\" class=\"bx\"/><rect x=\"40\" y=\"188\" width=\"254\" height=\"40\" class=\"oilf\"/><rect x=\"150\" y=\"154\" width=\"160\" height=\"18\" class=\"oilf\"/><rect x=\"150\" y=\"154\" width=\"160\" height=\"18\" class=\"ln\"/><line x1=\"182\" y1=\"172\" x2=\"182\" y2=\"188\" class=\"ln\"/><
