<title>APEX — バイク知識クイズ</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f9fa; --surface:#ffffff; --surface2:#f1f3f5; --border:#e2e5ea; --border-soft:#eef0f3;
  --text:#151a22; --text-dim:#56606e; --text-muted:#98a0ac;
  --hdr-bg:#151a22; --hdr-text:#eef1f5; --hdr-dim:#808896;
  /* Accent — ティール（APEX） */
  --accent:#0f766e; --accent-soft:#5fb3aa; --accent-bg:#ecf7f5;
  --green:#2f9e63; --green-bg:#eef8f1; --red:#cf4d47; --red-bg:#fbf2f1;
  --blue:#3d78b0; --blue-bg:#eef4fa; --amber:#c08a1e; --amber-bg:#fdf6e8;
  /* 分野色 */
  --f-engine:#c2561b;  --f-engine-bg:#fcf1ea;
  --f-chassis:#2f5d9e; --f-chassis-bg:#edf2fa;
  --f-maint:#7a4fa0;   --f-maint-bg:#f4effa;
  --f-mfg:#5b6b7c;     --f-mfg-bg:#eef1f5;
  --f-kawa:#4a8f12;    --f-kawa-bg:#f0f8e6;
  --f-history:#8a6a2a; --f-history-bg:#f8f3e8;
  --lime:#6cc417;
  --r:7px;
}
html{ background:var(--bg); }
body{ background:var(--bg); color:var(--text); font-family:'Noto Sans JP','DM Sans',system-ui,sans-serif; font-size:14px; line-height:1.75; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
button{ font-family:inherit; }

/* ══════════ HEADER ══════════ */
#hdr{ flex-shrink:0; background:linear-gradient(90deg,#4cc3ee 0%,#8fdaf5 45%,#d4f1fb 80%,#f2fbfe 100%); padding-top:env(safe-area-inset-top); position:relative;
  --hdr-text:#0d3b52; }
#hdr .hdr-sub-inline{ opacity:.75; }
#hdr .hdr-icon-btn{ border-color:rgba(13,59,82,.25); color:#0d3b52; background:rgba(255,255,255,.35); }
#hdr .hdr-icon-btn:hover{ background:rgba(255,255,255,.7); color:#0d3b52; }
#hdr .rank-pill{ border-color:rgba(13,59,82,.25); background:rgba(255,255,255,.45); }
#hdr::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:linear-gradient(90deg,var(--accent) 0 70%,var(--lime) 70% 100%); }
.hdr-main{ display:flex; align-items:center; justify-content:space-between; padding:16px 0 16px 24px; gap:12px; }
.hdr-title-block{ display:flex; flex-direction:column; gap:7px; min-width:0; cursor:pointer; }
.hdr-title{ font-family:'DM Sans',sans-serif; font-weight:200; font-size:24px; letter-spacing:.42em; color:var(--hdr-text); text-indent:.42em; line-height:1; }
.hdr-sub-inline{ font-family:'DM Sans',sans-serif; font-weight:300; font-size:10px; letter-spacing:.28em; color:var(--hdr-text); text-indent:.28em; line-height:1; opacity:.62; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hdr-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; padding-right:16px; }
.hdr-icon-btn{ background:none; border:1px solid rgba(238,240,246,.22); color:rgba(238,240,246,.75); height:32px; padding:0 12px; border-radius:5px; cursor:pointer; font-size:11px; display:flex; align-items:center; gap:5px; transition:all .15s; -webkit-tap-highlight-color:transparent; }
.hdr-icon-btn:hover{ background:rgba(238,240,246,.08); color:var(--hdr-text); }
.rank-pill{ font-size:11px; color:var(--hdr-text); border:1px solid rgba(238,240,246,.22); border-radius:20px; padding:4px 11px; white-space:nowrap; cursor:pointer; }
@media (max-width:640px){ .hdr-icon-btn .t{ display:none; } .hdr-main{ padding-left:16px; } .hdr-title{ font-size:20px; } .rank-pill{ display:none; } }

/* ══════════ LAYOUT ══════════ */
#app{ flex:1; display:flex; overflow:hidden; position:relative; }
#sb{ width:300px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.sb-scroll{ flex:1; overflow-y:auto; padding:6px 0 24px; }
.sb-nav{ padding:12px 12px 10px; border-bottom:1px solid var(--border); display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.navbtn{ display:flex; align-items:center; gap:7px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface2); color:var(--text-dim); font-size:12px; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent; transition:all .12s; }
.navbtn:hover{ border-color:var(--accent-soft); color:var(--accent); }
.navbtn.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
.grp-lbl{ padding:14px 20px 4px; font-size:10px; font-weight:700; letter-spacing:.12em; display:flex; align-items:center; gap:6px; }
.grp-lbl .gn{ margin-left:auto; color:var(--text-muted); font-weight:500; letter-spacing:.02em; }
.ubtn{ display:flex; align-items:center; width:100%; padding:6px 20px; gap:9px; background:none; border:none; cursor:pointer; color:var(--text-dim); font-size:12.5px; text-align:left; transition:background .1s; -webkit-tap-highlight-color:transparent; border-left:3px solid transparent; }
.ubtn:hover{ background:var(--surface2); color:var(--text); }
.ubtn.active{ background:var(--accent-bg); color:var(--accent); border-left-color:var(--accent); font-weight:500; }
.ubtn .uicon{ font-size:15px; width:20px; text-align:center; flex-shrink:0; }
.ubtn .utxt{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
.ubtn .ut-main{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ubtn .ut-sub{ font-size:10px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.umeter{ width:34px; flex-shrink:0; font-size:10px; color:var(--text-muted); text-align:right; font-family:'DM Sans',sans-serif; }
.umeter.good{ color:var(--green); font-weight:600; }

#main{ flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); min-width:0; }
#crumb{ display:none; flex-shrink:0; align-items:center; gap:10px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
#crumb .back{ color:var(--accent); font-size:13px; cursor:pointer; background:none; border:none; padding:4px 0; }
#crumb .ct{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#content{ flex:1; overflow-y:auto; padding:34px 48px 96px; -webkit-overflow-scrolling:touch; }
@media (max-width:640px){
  #sb{ width:100%; position:absolute; inset:0; z-index:10; border-right:none; }
  body.in-content #sb{ display:none; }
  body:not(.in-content) #main{ display:none; }
  #crumb{ display:flex; }
  #content{ padding:20px 16px 96px; }
}

/* ══════════ 共通部品 ══════════ */
h2.pg{ font-size:19px; font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pg-sub{ color:var(--text-muted); font-size:12.5px; margin-bottom:22px; }
.sec-h{ font-size:11px; font-weight:700; color:var(--accent); margin:28px 0 12px; letter-spacing:.1em; display:flex; align-items:center; gap:8px; }
.sec-h::before{ content:""; width:16px; height:2px; background:var(--accent); border-radius:2px; }
.wrap{ max-width:760px; }
.btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:var(--r); border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12.5px; cursor:pointer; transition:all .15s; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
.btn:hover{ border-color:var(--accent); color:var(--accent); }
.btn:disabled{ opacity:.4; cursor:default; }
.btn.p{ background:var(--hdr-bg); border-color:var(--hdr-bg); color:var(--hdr-text); font-weight:500; }
.btn.p:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.sm{ padding:6px 12px; font-size:11.5px; }
.btn.danger:hover{ border-color:var(--red); color:var(--red); }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.chip{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; letter-spacing:.03em; white-space:nowrap; }
.chip.engine{ background:var(--f-engine-bg); color:var(--f-engine); }
.chip.chassis{ background:var(--f-chassis-bg); color:var(--f-chassis); }
.chip.maint{ background:var(--f-maint-bg); color:var(--f-maint); }
.chip.mfg{ background:var(--f-mfg-bg); color:var(--f-mfg); }
.chip.kawa{ background:var(--f-kawa-bg); color:var(--f-kawa); }
.chip.history{ background:var(--f-history-bg); color:var(--f-history); }
.chip.gray{ background:var(--surface2); color:var(--text-muted); }
.chip.lv{ background:var(--surface2); color:var(--text-dim); font-family:'DM Sans',sans-serif; letter-spacing:.08em; }
.chip.imp{ background:var(--amber-bg); color:#8a6510; }
.empty{ background:var(--surface); border:1px dashed var(--border); border-radius:var(--r); padding:22px; color:var(--text-muted); font-size:13px; text-align:center; line-height:1.9; }
.seg{ display:inline-flex; border:1px solid var(--border); border-radius:var(--r); overflow:hidden; background:var(--surface); flex-wrap:wrap; }
.seg button{ border:none; background:none; padding:7px 13px; font-size:12px; color:var(--text-dim); cursor:pointer; border-right:1px solid var(--border); }
.seg button:last-child{ border-right:none; }
.seg button.on{ background:var(--accent); color:#fff; }

/* ══════════ HOME ══════════ */
.hero{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px 22px; margin-bottom:22px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media (max-width:640px){ .hero{ grid-template-columns:repeat(2,1fr); } }
.kpi .k-l{ font-size:10.5px; color:var(--text-muted); letter-spacing:.04em; }
.kpi .k-v{ font-family:'DM Sans',sans-serif; font-size:26px; font-weight:300; color:var(--text); line-height:1.25; }
.kpi .k-v small{ font-size:12px; color:var(--text-muted); margin-left:2px; }
.rankcard{ background:var(--hdr-bg); color:var(--hdr-text); border-radius:10px; padding:18px 22px; margin-bottom:14px; display:flex; gap:16px; align-items:center; }
.rankcard .rk-ic{ font-size:34px; line-height:1; }
.rankcard .rk-main{ flex:1; min-width:0; }
.rankcard .rk-l{ font-size:10.5px; letter-spacing:.14em; opacity:.6; font-family:'DM Sans',sans-serif; }
.rankcard .rk-n{ font-size:18px; font-weight:600; margin:2px 0 8px; }
.rankcard .rk-bar{ height:6px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; }
.rankcard .rk-fill{ height:100%; background:linear-gradient(90deg,var(--accent-soft),var(--lime)); border-radius:3px; }
.rankcard .rk-next{ font-size:11px; opacity:.65; margin-top:6px; }
.daily{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--lime); border-radius:var(--r); padding:14px 18px; margin-bottom:22px; cursor:pointer; }
.daily .dl{ font-size:10.5px; font-weight:700; color:var(--f-kawa); letter-spacing:.1em; }
.daily .dq{ font-size:14px; margin-top:4px; }
.mode-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.mode-card{ text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; cursor:pointer; transition:all .15s; -webkit-tap-highlight-color:transparent; font-size:14px; color:var(--text); display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; }
.mode-card:hover:not(:disabled){ border-color:var(--accent); box-shadow:0 3px 12px rgba(15,118,110,.08); transform:translateY(-1px); }
.mode-card:disabled{ opacity:.5; cursor:default; }
.mode-card.kw{ border-color:#cfe6b3; background:linear-gradient(180deg,#f6fbef,#fff); }
.mode-card.kw:hover:not(:disabled){ border-color:var(--f-kawa); }
.mode-ic{ font-size:22px; }
.mode-name{ font-size:14.5px; font-weight:600; color:var(--text); margin:6px 0 3px; }
.mode-desc{ font-size:11.5px; color:var(--text-muted); line-height:1.6; }
.fbars{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; }
.fbar{ display:grid; grid-template-columns:150px 1fr 74px; gap:10px; align-items:center; margin:6px 0; font-size:12.5px; }
@media (max-width:640px){ .fbar{ grid-template-columns:118px 1fr 66px; } }
.fbar .tr{ height:9px; background:var(--surface2); border-radius:5px; overflow:hidden; }
.fbar .fl{ height:100%; border-radius:5px; }
.fbar .v{ text-align:right; font-family:'DM Sans',sans-serif; color:var(--text-dim); font-size:12px; }

/* ══════════ 解説 ══════════ */
.tabs{ display:flex; gap:0; border-bottom:1px solid var(--border); margin:4px 0 24px; overflow-x:auto; }
.tab{ padding:11px 18px; font-size:13px; color:var(--text-muted); cursor:pointer; border:none; background:none; border-bottom:2px solid transparent; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
.tab.on{ color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }
.gram{ max-width:780px; }
.gram h3{ font-size:12px; font-weight:700; color:var(--accent); margin:30px 0 14px; letter-spacing:.1em; display:flex; align-items:center; gap:8px; }
.gram h3::before{ content:""; width:16px; height:2px; background:var(--accent); border-radius:2px; }
.gram h3:first-child{ margin-top:0; }
.gram p{ color:var(--text-dim); margin-bottom:12px; font-size:14px; line-height:1.9; }
.gram strong{ color:var(--text); }
.gram ul,.gram ol{ margin:0 0 14px; padding-left:20px; }
.gram li{ color:var(--text-dim); margin-bottom:6px; line-height:1.85; }
.gram table{ width:100%; border-collapse:collapse; margin:12px 0 20px; font-size:13px; background:var(--surface); border:1px solid var(--border); }
.gram th{ text-align:left; padding:9px 12px; background:var(--surface2); color:var(--text-dim); font-size:11px; font-weight:600; border-bottom:1px solid var(--border); }
.gram td{ padding:9px 12px; border-bottom:1px solid var(--border-soft); color:var(--text); vertical-align:top; }
.gram td:first-child{ color:var(--accent); font-weight:500; }
.tblwrap{ overflow-x:auto; }
.hbox{ background:var(--accent-bg); border-left:3px solid var(--accent); padding:13px 17px; border-radius:0 var(--r) var(--r) 0; margin:12px 0 20px; font-size:13.5px; line-height:1.95; color:var(--text); }
.pbox,.tbox{ border-radius:var(--r); padding:12px 16px; margin:14px 0 20px; font-size:13.5px; line-height:1.95; }
.pbox{ background:var(--amber-bg); border:1px solid #f0e2c0; color:#5e4a1c; }
.tbox{ background:var(--accent-bg); border:1px solid #cde7e3; color:var(--text); }
.pbox::before,.tbox::before{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.06em; margin-bottom:3px; }
.pbox::before{ content:"💡 わかりやすく言うと"; color:#8a6510; }
.tbox::before{ content:"🧩 例えるなら"; color:var(--accent); }
.term{ color:var(--accent); font-weight:600; }
.wbox{ background:var(--amber-bg); border:1px solid #f0e2c0; border-radius:var(--r); padding:12px 16px; margin:12px 0; font-size:12.5px; color:#8a6510; line-height:1.85; }
.nbox{ background:var(--blue-bg); border:1px solid #d6e4f0; border-radius:var(--r); padding:12px 16px; margin:12px 0; font-size:12.5px; color:var(--blue); line-height:1.85; }
.diagram{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; margin:12px 0 20px; font-family:ui-monospace,Menlo,'Noto Sans JP',monospace; font-size:12px; line-height:1.6; white-space:pre; overflow-x:auto; color:var(--text-dim); }

/* ══════════ 問題 ══════════ */
.qprog{ display:flex; align-items:center; gap:14px; margin-bottom:20px; max-width:760px; }
.qtrack{ flex:1; height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; }
.qfill{ height:100%; background:var(--accent); transition:width .3s; }
.qlbl{ font-size:11px; color:var(--text-muted); white-space:nowrap; font-family:'DM Sans',sans-serif; }
.qcard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px 24px; margin-bottom:14px; max-width:760px; }
@media (max-width:640px){ .qcard{ padding:18px 16px; } }
.qmeta{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.qmeta .src{ font-size:11px; color:var(--text-muted); font-family:'DM Sans','Noto Sans JP',sans-serif; }
.qq{ font-size:15px; font-weight:500; color:var(--text); line-height:1.85; margin-bottom:12px; }
.choices{ display:flex; flex-direction:column; gap:9px; margin-top:10px; }
.choice{ text-align:left; padding:12px 15px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); color:var(--text); font-size:14px; cursor:pointer; transition:all .12s; display:flex; align-items:flex-start; gap:11px; -webkit-tap-highlight-color:transparent; line-height:1.75; }
.choice:hover:not(:disabled){ border-color:var(--accent-soft); background:var(--accent-bg); }
.choice:disabled{ cursor:default; }
.choice .ck{ width:24px; height:24px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-muted); flex-shrink:0; font-family:'DM Sans',sans-serif; margin-top:1px; }
.choice.ok{ border-color:var(--green); background:var(--green-bg); } .choice.ok .ck{ background:var(--green); border-color:var(--green); color:#fff; }
.choice.ng{ border-color:var(--red); background:var(--red-bg); } .choice.ng .ck{ background:var(--red); border-color:var(--red); color:#fff; }
.choice.sel{ border-color:var(--accent); background:var(--accent-bg); } .choice.sel .ck{ background:var(--accent); border-color:var(--accent); color:#fff; }
.cwhy{ font-size:12.5px; color:var(--text-dim); margin:-3px 0 4px 36px; line-height:1.8; padding:2px 0 4px 12px; border-left:2px solid var(--border); }
.cwhy b.o{ color:var(--green); } .cwhy b.x{ color:var(--red); }
.fb{ border-radius:var(--r); padding:14px 18px; margin-top:14px; font-size:13.5px; line-height:1.85; max-width:760px; animation:fadein .2s ease; }
.fb.ok{ background:var(--green-bg); border:1px solid rgba(47,158,99,.3); }
.fb.ng{ background:var(--red-bg); border:1px solid rgba(207,77,71,.3); }
.fb .fb-h{ font-weight:700; margin-bottom:5px; }
.fb.ok .fb-h{ color:var(--green); } .fb.ng .fb-h{ color:var(--red); }
.fb .fb-body{ color:var(--text-dim); }
@keyframes fadein{ from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
.qnav{ display:flex; gap:10px; margin-top:16px; max-width:760px; align-items:center; flex-wrap:wrap; }
.qnav .spacer{ flex:1; }
.keepbtn{ border:1px solid var(--border); background:var(--surface); border-radius:var(--r); padding:7px 12px; font-size:12px; cursor:pointer; color:var(--text-dim); }
.keepbtn.on{ border-color:var(--amber); color:#8a6510; background:var(--amber-bg); }

/* ○× */
.ox-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px 24px; max-width:760px; }
.ox-t{ font-size:15.5px; line-height:1.9; font-weight:500; margin-bottom:14px; }
.ox-btns{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
.ox-b{ padding:16px; font-size:24px; font-weight:700; border:1px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; -webkit-tap-highlight-color:transparent; transition:all .12s; }
.ox-b.o{ color:var(--green); } .ox-b.x{ color:var(--red); }
.ox-b:hover:not(:disabled){ background:var(--surface2); }
.ox-b.hit{ outline:3px solid currentColor; }

/* ══════════ 検定モード ══════════ */
.exbar{ position:sticky; top:-34px; z-index:3; background:var(--bg); display:flex; align-items:center; gap:10px; padding:8px 0 12px; margin-top:-8px; flex-wrap:wrap; max-width:760px; }
@media (max-width:640px){ .exbar{ top:-20px; } }
.timer{ font-family:'DM Sans',ui-monospace,monospace; font-size:16px; font-weight:500; padding:5px 12px; border-radius:6px; background:var(--surface); color:var(--text); border:1px solid var(--border); letter-spacing:.05em; }
.timer.warn{ background:var(--red-bg); color:var(--red); border-color:var(--red); }
.grid50{ display:grid; grid-template-columns:repeat(10,1fr); gap:5px; max-width:760px; margin:6px 0 16px; }
.gcell{ aspect-ratio:1.4; border:1px solid var(--border); border-radius:5px; background:var(--surface); font-size:11px; font-family:'DM Sans',sans-serif; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative; padding:0; }
.gcell.ans{ background:var(--accent-bg); color:var(--accent); border-color:var(--accent-soft); font-weight:600; }
.gcell.cur{ outline:2px solid var(--accent); }
.gcell.flag::after{ content:""; position:absolute; top:2px; right:2px; width:6px; height:6px; border-radius:50%; background:var(--amber); }
.gcell.ok{ background:var(--green-bg); color:var(--green); border-color:rgba(47,158,99,.5); }
.gcell.ng{ background:var(--red-bg); color:var(--red); border-color:rgba(207,77,71,.5); }
.result-badge{ text-align:center; padding:24px 20px; border-radius:var(--r); margin-bottom:18px; max-width:760px; }
.result-badge.pass{ background:var(--green-bg); border:1px solid rgba(47,158,99,.4); }
.result-badge.fail{ background:var(--red-bg); border:1px solid rgba(207,77,71,.4); }
.rb-big{ font-size:34px; font-weight:700; font-family:'DM Sans','Noto Sans JP',sans-serif; }
.pass .rb-big{ color:var(--green); } .fail .rb-big{ color:var(--red); }
.rb-sub{ font-size:13px; color:var(--text-dim); margin-top:6px; }

/* ══════════ 一覧 ══════════ */
.list-item{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px 16px; margin-bottom:9px; }
.list-item .li-main{ flex:1; min-width:0; }
.list-item .li-t{ font-weight:600; font-size:14px; }
.list-item .li-s{ font-size:12px; color:var(--text-muted); margin-top:2px; }
.rev-item{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--r); padding:12px 15px; margin-bottom:9px; font-size:13px; max-width:760px; cursor:pointer; }
.rev-item.ok{ border-left-color:var(--green); } .rev-item.no{ border-left-color:var(--red); }
.rev-item .rq{ color:var(--text); margin:4px 0 2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.rev-item .rl{ color:var(--text-dim); font-size:12px; }
.rev-item .rl .yes{ color:var(--green); font-weight:600; } .rev-item .rl .bad{ color:var(--red); font-weight:600; }
table.hist{ width:100%; border-collapse:collapse; font-size:12.5px; background:var(--surface); border:1px solid var(--border); max-width:760px; }
table.hist th{ text-align:left; padding:8px 10px; background:var(--surface2); color:var(--text-dim); font-size:11px; }
table.hist td{ padding:8px 10px; border-top:1px solid var(--border-soft); }
.ranklist{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:6px 16px; }
.ranklist .rr{ display:flex; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:13px; color:var(--text-muted); }
.ranklist .rr:last-child{ border-bottom:none; }
.ranklist .rr.got{ color:var(--text); } .ranklist .rr.cur{ font-weight:700; color:var(--accent); }
.ranklist .rr .ri{ font-size:18px; width:26px; text-align:center; }
.ranklist .rr .rn{ flex:1; }

/* 用語集 */
.gsearch{ width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:var(--r); font-size:14px; background:var(--surface); outline:none; font-family:inherit; }
.gsearch:focus{ border-color:var(--accent); }
.gl-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
.gl-item{ text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:10px 14px; cursor:pointer; font-size:13.5px; color:var(--text); }
.gl-item:hover{ border-color:var(--accent); }
.gl-item .gd{ font-size:11.5px; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:2px; line-height:1.6; }

/* 取り込み */
textarea.imp{ width:100%; min-height:180px; border:1px solid var(--border); border-radius:var(--r); padding:12px 14px; font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.6; background:var(--surface); color:var(--text); resize:vertical; outline:none; }
textarea.imp:focus{ border-color:var(--accent); }
.imp-msg{ font-size:12.5px; margin-top:10px; white-space:pre-wrap; line-height:1.7; }
.imp-msg.err{ color:var(--red); } .imp-msg.ok{ color:var(--green); }
label.ck{ display:inline-flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; }

/* ══════════ MODAL / TOAST ══════════ */
#modal{ position:fixed; inset:0; background:rgba(15,18,28,.55); display:none; align-items:center; justify-content:center; z-index:200; padding:16px; }
#modal.show{ display:flex; animation:fadein .15s ease; }
.modal-box{ background:var(--surface); border-radius:14px; max-width:760px; width:100%; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(0,0,0,.32); overflow:hidden; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 18px; border-bottom:1px solid var(--border); }
.modal-title{ font-size:14px; font-weight:600; color:var(--accent); }
.modal-close{ width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:15px; cursor:pointer; flex-shrink:0; }
.modal-body{ padding:18px 20px 22px; overflow-y:auto; }
.modal-body .qcard{ border:none; padding:0; margin:0; }
/* わかりやすく言うと／例えるなら（折りたたみ） */
.plw{ margin:6px 0 10px; }
.plainbtn{ border:none; background:none; padding:2px 0; font-size:12px; color:var(--amber); cursor:pointer; font-weight:600; -webkit-tap-highlight-color:transparent; }
.plainbtn.open{ color:#8a6510; }
.plain{ display:none; background:var(--amber-bg); border:1px solid #f0e2c0; border-radius:var(--r); padding:10px 14px; margin-top:4px; font-size:13px; line-height:1.85; color:#5e4a1c; }
.plain.open{ display:block; animation:fadein .15s ease; }
.plw.tt{ margin:10px 0 0; }
.plainbtn.tt{ color:var(--accent); }
.plain.tt{ background:var(--accent-bg); border-color:#cde7e3; color:var(--text); }
/* 用語リンクとモーダル */
.gl{ color:inherit; text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--accent); text-decoration-thickness:1.5px; text-underline-offset:3px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.gl:hover{ color:var(--accent); background:var(--accent-bg); }
#glo{ position:fixed; inset:0; background:rgba(15,18,28,.35); display:none; align-items:center; justify-content:center; z-index:250; padding:18px; }
#glo.show{ display:flex; animation:fadein .15s ease; }
.glo-box{ background:var(--surface); border-radius:12px; max-width:460px; width:100%; box-shadow:0 18px 50px rgba(0,0,0,.28); overflow:hidden; max-height:88vh; overflow-y:auto; }
.glo-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
.glo-title{ font-size:15px; font-weight:700; color:var(--text); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.glo-b{ padding:14px 18px 18px; font-size:14px; line-height:1.9; color:var(--text-dim); }
.glo-b .pbox,.glo-b .tbox{ margin:10px 0 0; font-size:13px; }
.glo-rel{ margin-top:10px; font-size:12.5px; color:var(--text-muted); }
#toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--hdr-bg); color:var(--hdr-text); padding:11px 20px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s; z-index:300; box-shadow:0 6px 24px rgba(0,0,0,.18); max-width:90vw; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.err{ background:var(--red); }

/* ══════════ 図解・写真 ══════════ */
.figbox{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px 12px; margin:0 0 16px; max-width:780px; }
.figbox .ft{ font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.06em; margin-bottom:8px; }
.figbox .fsv{ overflow-x:auto; }
.figbox svg{ width:100%; height:auto; display:block; min-width:520px; }
.figbox svg text{ font-family:'Noto Sans JP',system-ui,sans-serif; fill:var(--text); }
.figbox svg .tt{ font-size:13px; font-weight:600; } .figbox svg .sm{ font-size:11.5px; } .figbox svg .big{ font-size:30px; font-weight:600; font-family:'DM Sans','Noto Sans JP',sans-serif; letter-spacing:.04em; }
.figbox svg .dim{ fill:var(--text-muted); } .figbox svg text.ac{ fill:var(--accent); }
.figbox svg .ln{ stroke:var(--text-dim); stroke-width:1.5; fill:none; } .figbox svg .thick{ stroke-width:3; } .figbox svg .dash{ stroke-dasharray:5 4; } .figbox svg .dim2{ stroke:var(--border); }
.figbox svg .acs{ stroke:var(--accent); } .figbox svg .ac2{ stroke:var(--accent); }
.figbox svg .bx{ fill:var(--surface2); stroke:var(--text-dim); stroke-width:1.2; }
.figbox svg .pst{ fill:#9aa5b4; stroke:#56606e; stroke-width:1.2; } .figbox svg .dot{ fill:var(--text); } .figbox svg .mk{ fill:var(--accent); }
.figbox svg .cup{ fill:#2b2f36; } .figbox svg .oilf{ fill:#f3dc8f; } .figbox svg .oilc{ stroke:#d9b648; }
.figbox svg .gmix{ fill:#cfe9e4; } .figbox svg .gcmp{ fill:#9fd3c9; } .figbox svg .gfire{ fill:#f6b27a; } .figbox svg .gex{ fill:#d5d8dd; }
.figbox svg .spk{ fill:none; stroke:#e8742a; stroke-width:2.5; }
.tl{ display:flex; flex-direction:column; }
.tl-r{ display:grid; grid-template-columns:92px 1fr; gap:12px; padding:7px 0; border-bottom:1px solid var(--border-soft); font-size:13px; line-height:1.7; }
.tl-r:last-child{ border-bottom:none; }
.tl-r b{ font-family:'DM Sans','Noto Sans JP',sans-serif; color:var(--accent); font-variant-numeric:tabular-nums; }
.phstrip{ display:flex; gap:10px; overflow-x:auto; margin:0 0 18px; padding-bottom:4px; max-width:780px; scroll-snap-type:x mandatory; }
.phstrip:empty{ display:none; }
.phstrip .ph{ flex:0 0 220px; scroll-snap-align:start; }
.ph{ margin:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
.ph.wait{ min-height:150px; background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2)); background-size:200% 100%; animation:shimmer 1.4s infinite; }
@keyframes shimmer{ to{ background-position:-200% 0; } }
@media (prefers-reduced-motion:reduce){ .ph.wait{ animation:none; } }
.ph img{ display:block; width:100%; height:150px; object-fit:cover; background:var(--surface2); }
.ph.one{ max-width:340px; margin-top:12px; } .ph.one img{ height:auto; max-height:240px; object-fit:contain; }
.ph figcaption{ font-size:11px; color:var(--text-muted); padding:6px 9px; line-height:1.5; }
.ph figcaption b{ color:var(--text); font-weight:600; font-size:11.5px; }
.ph figcaption a{ color:var(--text-muted); }

/* ══════════ スマホ（iPhone Air 420px など） ══════════ */
#tabbar{ display:none; }
.zoomhint{ display:none; }
button,.choice,.ox-b,.gl,.plainbtn{ touch-action:manipulation; }
@media (max-width:640px){
  body{ font-size:15px; }
  .hdr-main{ padding:8px 0 8px 16px; }
  .hdr-title{ font-size:18px; letter-spacing:.34em; }
  .hdr-sub-inline{ font-size:8.5px; letter-spacing:.2em; }
  .hdr-title-block{ gap:5px; }
  .hdr-actions{ padding-right:12px; gap:6px; }
  .hdr-icon-btn{ height:34px; min-width:38px; justify-content:center; }
  #crumb{ padding:8px 16px; } #crumb .ct{ font-size:14px; }
  #crumb.nob .back{ display:none; } #crumb.hide{ display:none; }
  #content{ padding:18px 16px calc(84px + env(safe-area-inset-bottom)); }
  .sb-scroll{ padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
  .sb-nav{ display:none; }
  .ubtn{ padding:10px 18px; font-size:14px; } .ubtn .ut-sub{ font-size:11px; }
  .grp-lbl{ padding:18px 18px 6px; font-size:11px; }
  h2.pg{ font-size:20px; }
  .qq{ font-size:16px; }
  .choice{ font-size:15px; padding:13px 14px; }
  .cwhy{ margin-left:10px; }
  .ox-t{ font-size:16.5px; }
  .ox-b{ padding:20px; }
  .gram p,.gram li{ font-size:15px; }
  .gram table{ font-size:13px; }
  .mode-grid{ grid-template-columns:1fr 1fr; gap:10px; }
  .mode-card{ padding:14px; } .mode-name{ font-size:14px; } .mode-desc{ font-size:11px; }
  .hero{ padding:16px; gap:12px; }
  .fbar{ grid-template-columns:1fr auto; row-gap:4px; margin:10px 0; }
  .fbar > span:first-child{ grid-column:1 / -1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gsearch{ font-size:16px; }
  textarea.imp{ font-size:16px; }
  .seg{ display:flex; flex-wrap:wrap; }
  .exbar{ gap:8px; } .exbar .qlbl{ flex-basis:100%; order:9; }
  .grid50{ grid-template-columns:repeat(6,1fr); }
  .gcell{ font-size:12px; }
  /* 図：画面幅に合わせて縮め、タップで拡大 */
  .figbox{ padding:12px 12px 10px; }
  .figbox svg{ min-width:0; }
  .figbox .fsv{ cursor:zoom-in; }
  .zoomhint{ display:block; font-size:11px; color:var(--text-muted); margin-top:6px; text-align:right; }
  .phstrip .ph{ flex-basis:72%; }
  .ph.one{ max-width:none; }
  .modal-box{ max-height:92dvh; border-radius:14px 14px 0 0; }
  #modal{ align-items:flex-end; padding:0; }
  #modal .modal-box{ max-width:100%; }
  .modal-body{ padding:16px 16px calc(22px + env(safe-area-inset-bottom)); }
  .glo-box{ max-width:100%; }
  /* 下のタブバー */
  #tabbar{ display:grid; grid-template-columns:repeat(5,1fr); position:fixed; left:0; right:0; bottom:0; z-index:120;
    background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--border);
    padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right)); }
  #tabbar button{ border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 0; font-size:10.5px; color:var(--text-muted); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #tabbar button .ti{ font-size:20px; line-height:1.1; filter:grayscale(1); opacity:.7; }
  #tabbar button.on{ color:var(--accent); font-weight:700; }
  #tabbar button.on .ti{ filter:none; opacity:1; }
  #toast{ bottom:calc(80px + env(safe-area-inset-bottom)); }
}
.zoomwrap{ overflow:auto; -webkit-overflow-scrolling:touch; }
.zoomwrap svg{ width:760px; max-width:none; height:auto; display:block; }
.zoomwrap img{ width:100%; height:auto; display:block; }
::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:#d5d8e1; border-radius:4px; }
</style>
</head>
<body>

<div id="hdr">
  <div class="hdr-main">
    <div class="hdr-title-block" onclick="go('home')">
      <div class="hdr-title">APEX</div>
      <div class="hdr-sub-inline">MOTORCYCLE KNOWLEDGE · バイク知識クイズ</div>
    </div>
    <div class="hdr-actions">
      <span class="rank-pill" id="rank-pill" onclick="go('stats')"></span>
      <button class="hdr-icon-btn" onclick="go('glossary')" title="用語集">📖<span class="t">用語集</span></button>
      <button class="hdr-icon-btn" onclick="go('settings')" title="設定・バックアップ">⚙︎<span class="t">設定</span></button>
    </div>
  </div>
</div>

<div id="app">
  <aside id="sb">
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-scroll" id="sb-list"></div>
  </aside>
  <main id="main">
    <div id="crumb"><button class="back" onclick="mobileBack()">‹ 単元一覧</button><span class="ct" id="crumb-t"></span></div>
    <div id="content"></div>
  </main>
</div>

<h3>まず、これは何？</h3>
<p>エンジンは、ガソリンと空気を混ぜた「混合気」を燃やし、その圧力でピストンを押し下げて回転力を取り出す装置です。ピストンの上下運動は、クランクシャフトという部品で回転運動に変わります。</p>

<tr><td>燃焼の回数</td><td>クランク2回転に1回</td><td>クランク1回転に1回</td></tr>

<div class="tbox">例えるなら、4ストロークは「吸う」と「吐く」をきちんと分けた深呼吸です。2ストロークは、息を吐きながら同時に吸い込む早業の呼吸のようなもので、回数は2倍こなせますが、吸った空気の一部がそのまま口から逃げてしまいます。</div>

</ul>

 { id:'elayout', field:'engine', icon:'🧩', title:'エンジン形式', sub:'単気筒・並列2気筒・並列4気筒・V型・水平対向、クランク位相（270°など）、振動と鼓動感', gram:`
<h3>まず、これは何？</h3>
<p>オートバイのエンジンは、シリンダー（気筒）の<strong>数</strong>と<strong>並べ方</strong>でいくつかの形式に分かれます。形式によって、車体の幅、重さ、振動、そしてエンジンの「味わい」が大きく変わります。</p>

<tr><td>270°</td><td>90°ずれて動く</td><td>270°・450°の不等間隔</td><td>90°V型2気筒と同じ点火間隔。鼓動感が出る</td></tr>
</tbody></table></div>
<p>一般的な並列4気筒（4ストローク）は180°ごとに等間隔で燃焼するため、とても滑らかに回ります。</p>
<h3>V型2気筒のバンク角</h3>
<p>V型の2つのシリンダーが開く角度を<strong>バンク角</strong>といいます。バンク角が90°のV型2気筒は、ピストンの上下動による基本的な揺れ（一次振動）をクランクのおもりで打ち消しやすく、振動の少ない組み合わせとして知られています。一方、バンク角を狭くするとエンジンを前後に短くでき、車体をコンパクトにまとめやすくなります。どの角度を選ぶかは、振動・大きさ・味わいのバランスで決まります。</p>
<div class="pbox">気筒の数と並べ方で、エンジンの「性格」が決まります。燃焼のタイミングが均等だと滑らかに、わざとずらすと「ドコドコ」とした鼓動感が生まれます。</div>

<div class="nbox">📝 不等間隔の燃焼は、後輪が路面をつかむ感覚（トラクション）がつかみやすいと言われます。並列4気筒でもあえて不等間隔にした「クロスプレーン」型のクランクがあり、ヤマハのYZF-R1などが採用しています。</div>

 { id:'eperf', field:'engine', icon:'📈', title:'排気量・トルク・馬力', sub:'ボア×ストローク、ショート/ロングストローク、圧縮比、トルクと出力の関係（kW=トルク×回転数/9549）、OHV/SOHC/DOHC', gram:`
<h3>まず、これは何？</h3>
<p>カタログに必ず載っている「排気量」「最大トルク」「最高出力」は、エンジンの大きさと実力を表す数字です。ここでは、それぞれが何を意味し、どうつながっているかを整理します。</p>
<h3>排気量とボア×ストローク</h3>
<p><strong>ボア</strong>はシリンダーの内径、<strong>ストローク</strong>はピストンが上下に動く距離です。ピストンが押しのける容積（行程容積）に気筒数を掛けたものが<strong>排気量</strong>です。</p>
<div class="diagram">排気量 = π/4 × ボア² × ストローク × 気筒数
例）ボア7.0cm、ストローク6.5cm、単気筒
  0.785 × 49 × 6.5 ≒ 250cc</div>
<div class="tblwrap"><table><thead><tr><th>タイプ</th><th>寸法の関係</th><th>傾向</th></tr></thead><tbody>
<tr><td>ショートストローク</td><td>ボア ＞ ストローク</td><td>ピストンの移動距離が短く、高回転・高出力向き</td></tr>
<tr><td>スクエア</td><td>ボア ＝ ストローク</td><td>中間的な性格</td></tr>
<tr><td>ロングストローク</td><td>ボア ＜ ストローク</td><td>低・中回転の力強さを出しやすい</td></tr>
</tbody></table></div>
<h3>圧縮比</h3>
<p><strong>圧縮比</strong>は、ピストンが一番下にあるときの容積を、一番上にあるときの容積（燃焼室）で割った値です。高いほど熱効率が上がりやすい一方、高すぎると混合気が勝手に燃え出す<strong>ノッキング</strong>（異常燃焼）が起きやすくなります。高圧縮のエンジンにハイオクガソリンが指定されるのはこのためです。</p>
<h3>トルクと出力（馬力）の関係</h3>
<p><strong>トルク</strong>はクランクシャフトを回す力の強さ（単位N·m）、<strong>出力</strong>は単位時間あたりにどれだけ仕事ができるか（単位kW、PS）です。両者は次の式で結びついています。</p>
<div class="diagram">出力[kW] = トルク[N·m] × 回転数[rpm] ÷ 9549
例）100N·m × 6000rpm ÷ 9549 ≒ 63kW
1PS ≒ 0.7355kW（63kW ≒ 85PS）</div>
<p>つまり、同じトルクでも高い回転数で出せれば出力は大きくなります。高回転まで回るエンジンほど最高出力を稼ぎやすいのはこのためです。</p>
<div class="pbox">トルクは「一回でどれだけ強く押せるか」、出力は「それを1秒間に何回やれるか」まで含めた総合力です。出力はトルクと回転数の掛け算で決まります。</div>
<div class="tbox">例えるなら、自転車のペダルです。ペダルを踏む力がトルク、ペダルを回す速さが回転数、その掛け算が出力です。力自慢がゆっくり漕いでも、普通の人が速く漕いでも、同じくらいの出力を出すことができます。</div>
<h3>動弁機構：OHV / SOHC / DOHC</h3>
<div class="tblwrap"><table><thead><tr><th>方式</th><th>カムシャフトの位置</th><th>特徴</th></tr></thead><tbody>
<tr><td>OHV</td><td>シリンダーの下側（クランク寄り）</td><td>プッシュロッド（棒）でバルブを押す。背が低くできるが高回転は苦手</td></tr>
<tr><td>SOHC</td><td>シリンダーヘッドに1本</td><td>構造がシンプルでコンパクト</td></tr>
<tr><td>DOHC</td><td>シリンダーヘッドに2本（吸気用・排気用）</td><td>バルブを正確に動かせ、高回転・高出力向き</td></tr>
</tbody></table></div>
<div class="nbox">📝 現在のスポーツ向けエンジンでは、1気筒あたり吸気2本・排気2本の「4バルブ」が一般的です。小さなバルブを複数使うことで、空気の通り道を広く取りつつ、バルブ1本を軽くして高回転に対応しやすくしています。</div>
<div class="wbox">⚠️ 最大トルクが出る回転数と、最高出力が出る回転数は別です。カタログでは「○○kW/△△rpm」「○○N·m/□□rpm」と、それぞれ回転数が併記されています。</div>
<h3>覚えどころ</h3>
<ul>
<li>排気量＝行程容積×気筒数。ボア＞ストロークがショートストローク</li>
<li>kW＝トルク×回転数÷9549</li>
<li>圧縮比を上げると効率アップ、上げすぎるとノッキング</li>
</ul>
` },
 { id:'efuel', field:'engine', icon:'⛽', title:'吸気・燃料・排気・冷却', sub:'キャブレターとFI、スロットルバイワイヤ、ターボとスーパーチャージャー、空冷/油冷/水冷、触媒・排ガス規制', gram:`
<h3>まず、これは何？</h3>
<p>エンジンが力を出すには、①空気を吸い、②ちょうどよい量の燃料を混ぜ、③燃やし、④排ガスをきれいにして出し、⑤たまった熱を逃がす、という流れが欠かせません。この単元では、その周りの装置をまとめて見ていきます。</p>
<h3>燃料の供給：キャブレターとFI</h3>
<div class="tblwrap"><table><thead><tr><th>方式</th><th>しくみ</th><th>特徴</th></tr></thead><tbody>
<tr><td>キャブレター</td><td>空気の流れで生じる負圧で燃料を吸い出し、霧状にする</td><td>構造が機械的でシンプル。気温や気圧の変化に合わせた細かい調整は苦手</td></tr>
<tr><td><strong>フューエルインジェクション</strong>（FI）</td><td>コンピューターが噴射量を計算し、インジェクターから燃料を噴射</td><td>状況に合わせて燃料を精密に調整でき、排ガス対策に有利。現在の主流</td></tr>
</tbody></table></div>
<p>ガソリンが完全に燃えるのにちょうどよい空気と燃料の重さの比を<strong>理論空燃比</strong>といい、約14.7:1です。</p>
<h3>スロットルバイワイヤ</h3>
<p>従来はアクセルグリップとスロットルバルブをワイヤーで直接つないでいました。<strong>スロットルバイワイヤ</strong>は、グリップの操作をセンサーで電気信号に変え、コンピューターがモーターでスロットルバルブを開閉する方式です。ライディングモードやトラクションコントロール、クルーズコントロールなどの電子制御と組み合わせやすくなります。</p>
<h3>過給：ターボとスーパーチャージャー</h3>
<p>空気を圧縮して多く押し込み、出力を高める装置を<strong>過給機</strong>といいます。</p>
<div class="tblwrap"><table><thead><tr><th>種類</th><th>何で回す？</th></tr></thead><tbody>
<tr><td>ターボチャージャー</td><td>排ガスの勢いでタービンを回す</td></tr>
<tr><td>スーパーチャージャー</td><td>エンジンの動力（クランク）で機械的に回す</td></tr>
</tbody></table></div>
<div class="nbox">📝 カワサキのNinja H2シリーズは、エンジンで駆動するスーパーチャージャーを搭載していることで知られています。</div>
<h3>冷却方式</h3>
<div class="tblwrap"><table><thead><tr><th>方式</th><th>しくみ</th></tr></thead><tbody>
<tr><td>空冷</td><td>シリンダー周りのフィン（ひれ）から走行風に熱を逃がす。シンプルで見た目も特徴的</td></tr>
<tr><td>油冷</td><td>エンジンオイルを冷却にも積極的に使い、オイルクーラーで冷やす</td></tr>
<tr><td>水冷</td><td>冷却水をエンジン内に巡らせ、ラジエーターで冷やす。温度を安定させやすく、高出力化に有利</td></tr>
</tbody></table></div>
<h3>排気と排ガス浄化</h3>
<p>排気管の途中には触媒が入っています。代表的な<strong>三元触媒</strong>は、一酸化炭素（CO）、炭化水素（HC）、窒素酸化物（NOx）の3つを、二酸化炭素・水・窒素に変えて浄化します。三元触媒がよく働くには空燃比を理論空燃比付近に保つ必要があり、O2センサーで排ガスを監視しながらFIで燃料を調整しています。</p>
<div class="pbox">エンジンは「空気と燃料をちょうどよく混ぜて燃やし、排ガスはきれいにして出し、熱はためこまない」ことが大切です。FIや触媒、冷却装置はそのための係です。</div>
<div class="tbox">例えるなら、人の体です。吸気は呼吸、燃料噴射は食事の量の調整、冷却は汗をかいて体温を下げること、触媒は吐く息をきれいにするマスクのような役割です。</div>
<div class="wbox">⚠️ 排ガス規制は段階的に強化されてきており、今後も変わる可能性があります。最新の規制内容は国土交通省などの公式情報で確認してください。</div>

<h3>まず、これは何？</h3>
<p>エンジンの回転力は、いくつかの部品を経由して後輪まで届きます。その途中で回転を「つなぐ・切る」「速さを変える」「後輪へ届ける」のが、クラッチ・ミッション（変速機）・駆動系の役目です。</p>
<div class="diagram">クランク ─(一次減速)→ クラッチ
  → ミッション(変速) ─(二次減速)→ 後輪
総減速比 = 一次減速比 × 変速比 × 二次減速比</div>
<h3>湿式多板クラッチ</h3>
<p>オートバイで一般的なのは<strong>湿式多板クラッチ</strong>です。摩擦材の付いた板（フリクションプレート）と金属の板（クラッチプレート）を交互に重ね、スプリングで押し付けて回転を伝えます。クラッチレバーを握ると押し付けがゆるみ、動力が切れます。「湿式」とはエンジンオイルに浸かった状態で作動するという意味です。</p>
<div class="wbox">⚠️ 湿式クラッチはエンジンオイルの中で働くため、摩擦を減らす添加剤が多いオイルを使うとクラッチが滑ることがあります。オイルはメーカー指定の規格（JASO MAなど）を守りましょう。</div>
<h3>リターン式ミッション</h3>
<p>多くのオートバイは、左足のシフトペダルで操作する<strong>リターン式</strong>です。ペダルは操作後に元の位置へ戻り、1回の操作で1段ずつ変わります。6速なら並び順は「1-N-2-3-4-5-6」で、1速はペダルを踏み下げ、2速以上へはかき上げて入れます。ニュートラル（N）は1速と2速の間にあります。</p>
<h3>スリッパークラッチとクイックシフター</h3>
<div class="tblwrap"><table><thead><tr><th>装置</th><th>はたらき</th></tr></thead><tbody>
<tr><td><strong>スリッパークラッチ</strong></td><td>急なシフトダウンで後輪からエンジンへ逆向きの大きな力（バックトルク）がかかったとき、クラッチを適度に滑らせて後輪の跳ね（ホッピング）やロックを抑える。レバーを軽くするアシスト機構と組み合わせたものも多い</td></tr>
<tr><td><strong>クイックシフター</strong></td><td>シフトペダルの動きを検知し、点火や燃料を一瞬だけカットして、クラッチ操作なしでシフトアップできるようにする。シフトダウンにも対応した双方向タイプもある</td></tr>
</tbody></table></div>
<h3>最終駆動：チェーン・ベルト・シャフト</h3>
<div class="tblwrap"><table><thead><tr><th>方式</th><th>長所</th><th>短所</th></tr></thead><tbody>
<tr><td>チェーン</td><td>軽く効率が良い。スプロケット交換で減速比を変えやすい</td><td>清掃・注油・たるみ調整が必要</td></tr>
<tr><td>ベルト</td><td>静かで注油不要</td><td>減速比の変更がしにくい</td></tr>
<tr><td>シャフト</td><td>汚れにくく手入れが少ない。長距離ツアラー向き</td><td>重く、部品が高価</td></tr>
</tbody></table></div>
<h3>一次減速と二次減速</h3>
<p>クランクからクラッチまでの歯車による減速が<strong>一次減速</strong>、ミッションの出力側から後輪までの減速が<strong>二次減速</strong>です。チェーン駆動では、二次減速比は「リヤスプロケットの歯数 ÷ フロントスプロケットの歯数」で、例えば前15丁・後45丁なら3.0です。</p>
<div class="pbox">エンジンは速く回りすぎるので、何段階かに分けて回転を落とし、そのぶん力を大きくして後輪に届けています。クラッチは「つなぐ・切る」、ミッションは「状況に合わせて落とし方を選ぶ」係です。</div>

<h3>覚えどころ</h3>

<li>湿式多板クラッチはオイルの中で作動。オイル選びに注意</li>
<li>リターン式は1-N-2-3-4-5-6</li>
<li>リヤスプロケットを大きくすると加速寄り、最高速は下がる方向</li>
</ul>

<h3>まず、ブレーキとは何？</h3>
<p>ブレーキは、走っているバイクの<strong>運動エネルギーを摩擦で熱に変えて</strong>速度を落とす装置です。現在のバイクの多くは、ライダーがレバーを握る力を<strong>油圧</strong>（液体の圧力）で車輪まで伝える「油圧式ディスクブレーキ」を使っています。</p>
<h3>ディスクとドラム</h3>
<div class="tblwrap"><table><thead><tr><th>方式</th><th>しくみ</th><th>特徴</th></tr></thead><tbody>
<tr><td>ディスク</td><td>車輪と一緒に回る円板（ディスクローター）を、パッドで両側から挟む</td><td>放熱が良く、熱がこもりにくい。水にぬれても回復が早い</td></tr>
<tr><td>ドラム</td><td>車輪と一緒に回る筒（ドラム）の内側に、シューを押し広げて当てる</td><td>密閉構造で汚れに強く、構造が簡単。熱がこもりやすい</td></tr>
</tbody></table></div>
<p>フロントはほぼディスク、小排気量車のリヤなどにドラムが残っています。ディスクローターには、熱による伸びを逃がすため外周の板と内側のハブを分けてピンでつないだ<strong>フローティングディスク</strong>もあります。</p>
<h3>キャリパーの種類</h3>
<ul>
<li><strong>対向ピストン</strong>：ディスクの両側にピストンがあり、両側から押す。キャリパー本体は固定。スポーツ車に多い</li>
<li><strong>片押し（ピンスライド式）</strong>：ピストンは片側だけ。押した反力で本体がピンに沿ってスライドし、反対側のパッドも当たる。このように本体が動く方式を<strong>フローティングキャリパー</strong>とも呼ぶ</li>
<li><strong>ラジアルマウント</strong>：キャリパーを取り付けるボルトが、車輪の半径方向（ラジアル方向）に向いた取り付け方。従来の横から留める方式（アキシャルマウント）より、ブレーキ時のたわみが小さい</li>
</ul>
<h3>マスターシリンダーと油圧（パスカルの原理）</h3>
<p>密閉した液体に加えた圧力は、どこにも同じ大きさで伝わります（<strong>パスカルの原理</strong>）。力＝圧力×面積なので、細いマスターシリンダーのピストンで生んだ圧力を、太いキャリパーピストンが受けると<strong>面積の比だけ力が大きく</strong>なります。そのかわり、キャリパーピストンの動く距離は小さくなります。</p>
<div class="diagram">レバー
 ↓ プッシュロッドで押す
[2次カップ]  外へのもれを防ぐ
[ピストン ]  ← サプライポート(大)
[1次カップ]  圧力をつくる
[ 圧力室  ]  ← リターンポート(小)
 ↓
ホース → キャリパー</div>
<ul>
<li><strong>リザーバー</strong>：フルードをためるタンク。ゴムのダイヤフラムで外気との接触を減らす。パッドが減るとキャリパーピストンが前に出た分だけ液面が下がる</li>
<li><strong>1次カップ（プライマリーカップ）</strong>：ピストン先端のゴムシール。圧力室の液を押して圧力を生む</li>
<li><strong>2次カップ（セカンダリーカップ）</strong>：ピストン後部のシール。フルードが外へもれるのを防ぐ</li>
<li><strong>リターンポート</strong>：レバーを放した状態で圧力室とリザーバーをつなぐ小さな穴。温度による液の膨張やパッド摩耗分を逃がし・補う。レバーを握ると1次カップがこの穴を通り過ぎてふさぎ、そこから圧力が立ち上がる</li>
<li><strong>サプライポート</strong>：1次カップの後ろ側へ液を補給する大きめの穴。レバーを素早く戻したときに圧力室へ液を回り込ませる</li>
</ul>
<p>呼び名は資料により異なります（リリーフポート、インレットポートなど）。</p>
<div class="wbox">⚠️ ピストンが戻り切らずリターンポートがふさがったままだと、圧力が抜けずに<strong>ブレーキの引きずり</strong>が起きます。原因として、レバー側の調整不良や、異物・異種の油の混入でカップが膨らむことなどが考えられます。グリコール系フルード用のゴム部品は鉱物油で膨潤するため、混入は厳禁です。</div>
<h3>ブレーキフルード</h3>
<div class="tblwrap"><table><thead><tr><th>規格</th><th>主成分</th><th>ドライ沸点（最低基準）</th></tr></thead><tbody>
<tr><td>DOT3</td><td>グリコール系</td><td>205℃以上</td></tr>
<tr><td>DOT4</td><td>グリコール系</td><td>230℃以上</td></tr>
<tr><td>DOT5.1</td><td>グリコール系</td><td>260℃以上</td></tr>
<tr><td>DOT5</td><td>シリコーン系</td><td>（グリコール系と混ぜてはいけない）</td></tr>
</tbody></table></div>
<p>グリコール系は<strong>吸湿性</strong>があり、水分を吸うほど沸点が下がります。フルードが沸騰して気泡ができると、気体は縮むのでレバーを握っても力が伝わらなくなります。これが<strong>ベーパーロック</strong>です。整備で入った空気を抜く作業を<strong>エア抜き</strong>と呼びます。フルードは塗装を傷めるので、こぼしたらすぐ拭き取ります。</p>
<h3>ABSとコーナリングABS</h3>
<p><strong>ABS</strong>は車輪速センサーでロックしそうな兆候を検知し、油圧を自動で弱めたり戻したりしてタイヤのロックを防ぎます。<strong>コーナリングABS</strong>は車体の傾き（バンク角）などを慣性計測装置（IMU）で把握し、傾いた状態に合わせて制御します。カワサキではKIBSという名称のシステムもあります。</p>
<div class="pbox">細い注射器を押すと、太い注射器のピストンが強い力で押し出されます。ブレーキは「小さな力・長いストローク」を「大きな力・短いストローク」に変換する油圧の仕掛けです。</div>
<div class="tbox">例えるなら、マスターシリンダーのリターンポートは、お風呂の「空気穴付きの栓」のようなものです。休んでいるときは穴が開いていて水位の変化を逃がし、使うときだけ栓がしっかり閉まって圧力を保ちます。</div>
<div class="nbox">📝 日本では125cc超の新車にABS、125cc以下にはABSまたは前後連動ブレーキ（CBS）の装着が段階的に義務化されています。最新の規定は公式情報で確認してください。</div>
` },
 { id:'csus', field:'chassis', icon:'🌀', title:'サスペンション', sub:'スプリングとダンパー・フォーク・減衰・ユニトラック', gram:`
<h3>まず、サスペンションとは何？</h3>
<p>サスペンションは、路面の凸凹を吸収してタイヤを地面に押し付け続けるための装置です。乗り心地のためだけでなく、<strong>タイヤの接地を保ってグリップを確保する</strong>ことが大きな役目です。</p>
<h3>スプリングとダンパーの役割分担</h3>
<div class="tblwrap"><table><thead><tr><th>部品</th><th>役割</th><th>ないとどうなる</th></tr></thead><tbody>
<tr><td>スプリング（ばね）</td><td>車体の重さを支え、衝撃を一時的にためる</td><td>車体を支えられない</td></tr>
<tr><td>ダンパー（減衰器）</td><td>オイルが細い穴（オリフィス）を通る抵抗で、動きの速さを抑える</td><td>ばねが何度も伸び縮みして揺れが止まらない</td></tr>
</tbody></table></div>
<p>ダンパーは動きのエネルギーを<strong>熱に変えて</strong>揺れを収めます。縮むときの抵抗を<strong>圧側（あっそく）減衰</strong>、伸びるときの抵抗を<strong>伸側（のびそく）減衰</strong>といいます。</p>
<h3>プリロードとは</h3>
<p><strong>プリロード</strong>は、取り付けた時点でスプリングをあらかじめ縮めておく量のことです。プリロードを増やすと、同じ荷重での沈み込み（サグ）が減り、車高が保たれます。ただし<strong>ばね自体の硬さ（ばね定数）は変わりません</strong>。</p>
<div class="wbox">⚠️ 「プリロードを掛けるとばねが硬くなる」は、よくある誤解です。変わるのは沈み込み始める位置（初期の姿勢）で、1mm縮めるのに必要な力は同じです。</div>
<h3>正立フォークと倒立フォーク</h3>
<div class="diagram"> 正立        倒立
 ┃細(上)     █太(上)
 ┃           █
 █太(下)     ┃細(下)
 ○車軸       ○車軸</div>
<ul>
<li><strong>正立フォーク</strong>：細いインナーチューブが上、太いアウターチューブ（ボトムケース）が下。構造が簡単でコストを抑えやすい</li>
<li><strong>倒立フォーク</strong>：太いアウターチューブが上でステムに固定され、細いインナーチューブが下で車軸につく。太い部分で支えるので<strong>剛性が高く</strong>、車軸側が軽くなるので<strong>バネ下重量</strong>も減らしやすい。下側のインナーチューブは飛び石などで傷がつかないよう注意が必要</li>
</ul>
<h3>リンク式リヤサスとユニトラック</h3>
<p>リヤは、左右2本のショックを持つ<strong>ツインショック</strong>と、1本の<strong>モノショック</strong>があります。モノショックをリンク機構（てこ）を介して取り付けると、ストロークが進むほど硬くなる<strong>プログレッシブ</strong>な特性を作れます。小さな段差はしなやかに、大きな衝撃では踏ん張る、という両立がしやすくなります。カワサキのリンク式リヤサスペンションは<strong>ユニトラック</strong>と呼ばれ、1980年前後にモトクロッサーから採用が始まり、現在は多くのロードモデルにも使われています。</p>
<h3>バネ下重量</h3>
<p>スプリングより路面側にある部品（ホイール、タイヤ、ブレーキ、フォークの下側など）の重さを<strong>バネ下重量</strong>と呼びます。バネ下が軽いほど、車輪が凸凹に素早く追従し、接地が安定します。</p>
<div class="pbox">スプリングは「受け止める係」、ダンパーは「揺れを止める係」です。両方がそろってはじめて、タイヤが地面から離れにくくなります。</div>
<div class="tbox">例えるなら、トランポリンだけだと何度も跳ね続けますが、水の中で跳ねると動きがすぐ収まります。スプリングがトランポリン、ダンパーが水の抵抗の役です。</div>
<h3>覚えどころ</h3>
<ul>
<li>スプリング＝支える・ためる、ダンパー＝揺れを収める</li>
<li>プリロードは初期姿勢を変える。ばねの硬さは変わらない</li>
<li>倒立フォークは剛性とバネ下重量で有利</li>
</ul>
<div class="nbox">📝 バネ下重量を減らすと効果が大きいのは、凸凹のたびに上下に振られるのが車輪側だからです。鍛造ホイールなどの軽量化が話題になるのはこのためです。</div>
` },
 { id:'cframe', field:'chassis', icon:'🏗️', title:'フレームと車体寸法', sub:'フレーム形式・キャスター角とトレール・ホイールベース・重心', gram:`
<h3>まず、フレームとは何？</h3>
<p>フレームは、エンジン、サスペンション、ステアリング（ハンドルの回転軸）、ライダーを一つにつなぐ<strong>骨格</strong>です。ねじれやたわみの特性（剛性）は、操縦性に直接影響します。</p>
<h3>主なフレーム形式</h3>
<div class="tblwrap"><table><thead><tr><th>形式</th><th>形</th><th>特徴</th></tr></thead><tbody>
<tr><td>ダブルクレードル</td><td>エンジンの下を2本のパイプがゆりかごのように支える</td><td>古くからある丈夫な形。クラシックなモデルに多い</td></tr>
<tr><td>ダイヤモンド</td><td>エンジン下のパイプを省き、エンジン自体を骨格の一部（強度メンバー）にする</td><td>軽く作りやすい</td></tr>
<tr><td>ツインスパー</td><td>ステアリングヘッドとスイングアーム軸を、エンジンの左右を通る太い2本の梁でつなぐ</td><td>アルミ製が多く、スポーツ車の代表的形式</td></tr>
<tr><td>トレリス</td><td>細い鋼管を三角形に組んだ格子状</td><td>軽くて剛性が高い。見た目の特徴にもなる</td></tr>
<tr><td>モノコック</td><td>板で箱状の殻を作り、殻全体で力を受ける</td><td>中を収納などに使える</td></tr>
</tbody></table></div>
<p>カワサキでは、Ninja H2が鋼管トレリスフレーム、ZX-12Rがアルミモノコックフレームを採用した例として知られています。</p>
<h3>キャスター角とトレール</h3>
<div class="diagram">   \  ← ステアリング軸
    \   (垂直からの傾き
     \   ＝キャスター角)
   (  \  )
   ( ○ \ )  ○=車軸
    ---●-\---- 地面
       |<->|
      トレール
●=接地点  \が地面と交わる点が前</div>
<ul>
<li><strong>キャスター角</strong>：ステアリング軸が垂直からどれだけ後ろに傾いているかの角度。大きいほど直進安定性が高く、小さいほどハンドリングが軽快</li>
<li><strong>トレール</strong>：ステアリング軸の延長線が地面と交わる点と、タイヤの接地点との前後距離。接地点が軸の延長より<strong>後ろ</strong>にあるので、タイヤは引っぱられるように進行方向へまっすぐ戻ろうとする</li>
</ul>
<p>一般に、スーパースポーツはキャスター角が小さめ、クルーザーは大きめです。</p>
<h3>ホイールベースと重心</h3>
<p><strong>ホイールベース</strong>は前後の車軸の間の距離です。長いと直進安定性が増し、短いと向きを変えやすくなります。<strong>重心</strong>は車体の重さの中心で、高さと前後位置が運動性に影響します。重心が低いと停車時などに安定しやすく、高すぎず適切な位置にあると切り返しが軽く感じられることもあります。重心の最適値は、車種の目的で変わります。</p>
<div class="pbox">キャスター角とトレールは「ハンドルがまっすぐに戻ろうとする力」の強さを決める寸法です。大きければどっしり、小さければクイックになります。</div>
<div class="tbox">例えるなら、スーパーのショッピングカートの前輪です。車輪の接地点が回転軸より後ろにあるので、押すと自然に進行方向へ向きがそろいます。これがトレールの効果です。</div>
<h3>覚えどころ</h3>
<ul>
<li>フレームは骨格。エンジンの抱え方（下から支える／エンジンを骨格にする／左右の梁でつなぐ）で形式が分かれる</li>
<li>キャスター角・トレールが大きい → どっしり直進。小さい → クイックに曲がる</li>
<li>ホイールベースが長い → 直進安定。短い → 小回りが利く</li>
<li>これらの寸法は互いに影響し合うため、一つの数字だけで乗り味は決まらない</li>
</ul>
<div class="wbox">⚠️ 「剛性は高いほど良い」とは限りません。適度なしなりがあることで、深く傾けたときの路面の凸凹をいなす効果もあり、各メーカーはバランスを調整しています。</div>
` },
 { id:'ctire', field:'chassis', icon:'⭕', title:'タイヤとホイール', sub:'サイズ表記・ラジアルとバイアス・空気圧・製造年週', gram:`
<h3>まず、タイヤの役割とは？</h3>
<p>タイヤは、バイクと路面が触れている唯一の部品です。加速・減速・旋回の力は、すべて手のひらほどの<strong>接地面</strong>を通して伝わります。</p>
<h3>サイズ表記の読み方（例：120/70ZR17 M/C 58W）</h3>
<div class="tblwrap"><table><thead><tr><th>表記</th><th>意味</th></tr></thead><tbody>
<tr><td>120</td><td>タイヤの幅（mm）</td></tr>
<tr><td>70</td><td>偏平率（％）。断面の高さが幅の70％＝約84mm</td></tr>
<tr><td>ZR</td><td>Zは速度記号の区分（240km/h超に対応）、Rはラジアル構造</td></tr>
<tr><td>17</td><td>適合するリム径（インチ）</td></tr>
<tr><td>M/C</td><td>モーターサイクル用</td></tr>
<tr><td>58W</td><td>58はロードインデックス（負荷能力の指数）、Wは速度記号（270km/hまで）</td></tr>
</tbody></table></div>
<p>バイアスタイヤでは「120/70-17」のように<strong>ハイフン</strong>で表されます（ベルト付きバイアスは「B」）。</p>
<h3>ラジアルとバイアス</h3>
<ul>
<li><strong>ラジアル</strong>：内部のコード（繊維）が回転方向に対して直角（放射状）に入り、外周をベルトで締める。高速での変形が少なく、スポーツ車の主流</li>
<li><strong>バイアス</strong>：コードを斜めに交差させて重ねる。しなやかで、重い荷重や低〜中速での扱いやすさに向く</li>
</ul>
<h3>チューブレスとホイール</h3>
<p><strong>チューブレス</strong>はチューブを使わず、タイヤとリムの密着で空気を保持します。釘などが刺さっても空気が急に抜けにくいのが利点です。</p>
<div class="tblwrap"><table><thead><tr><th>ホイール</th><th>特徴</th></tr></thead><tbody>
<tr><td>スポーク</td><td>細い針金状のスポークでリムを支える。しなやかで衝撃に強く、オフロード車やクラシック車に多い。一般にチューブタイヤを使うが、チューブレス対応の構造もある</td></tr>
<tr><td>キャスト</td><td>アルミなどを鋳造して一体成形。剛性が高く、チューブレスに適する。ロードモデルの主流</td></tr>
</tbody></table></div>
<h3>空気圧は「冷間」で点検</h3>
<p>走るとタイヤが温まり、中の空気が膨張して圧力が上がります。指定空気圧は<strong>冷えた状態（冷間）</strong>の値なので、走行直後に測って指定値まで抜くと、冷えたときに不足してしまいます。指定値は車体のラベルや取扱説明書で確認します。</p>
<h3>製造年週の4桁表記</h3>
<p>タイヤの側面には製造時期を示す4桁の数字があります。前2桁が<strong>週</strong>、後2桁が<strong>年</strong>です。例えば「2325」なら2025年の第23週製造です。ゴムは使わなくても経年で硬くなるため、溝だけでなく製造時期やひび割れも確認します。</p>
<div class="pbox">サイズ表記は「幅/高さの割合・構造・リム径」の順に並んだ住所のようなものです。読み方さえ覚えれば、どんなタイヤか一目でわかります。</div>
<div class="tbox">例えるなら、空気圧の点検は体温計で熱を測るのと同じで、運動直後に測っても本来の値はわかりません。落ち着いた状態で測るのが基本です。</div>
<h3>覚えどころ</h3>
<ul>
<li>120/70ZR17：幅120mm・偏平率70％・ラジアル・17インチ</li>
<li>「R」はラジアル、ハイフンはバイアス</li>
<li>空気圧は冷間で、ゲージを使って点検する</li>
<li>製造時期の4桁は「週・週・年・年」の順</li>
<li>溝・空気圧・ひび割れ・製造時期をセットで確認する</li>
</ul>
<div class="wbox">⚠️ タイヤ交換時は、車両指定のサイズ・速度記号・ロードインデックス以上のものを選ぶのが原則です。迷ったら取扱説明書や販売店で確認してください。</div>
` },
 { id:'cride', field:'chassis', icon:'🏍️', title:'曲がる・止まる物理', sub:'逆操舵・ジャイロ効果・荷重移動・ブレーキ配分・セルフステア', gram:`
<h3>まず、バイクはどうやって曲がる？</h3>
<p>バイクは車体を<strong>傾ける（リーンする）</strong>ことで曲がります。傾いた車体には重力が内側に倒そうとする力として働き、曲がることで生まれる遠心力がそれと釣り合って、傾いたまま安定して旋回できます。速度が高いほど、また曲がる半径が小さいほど、大きく傾ける必要があります。</p>
<h3>逆操舵（カウンターステア）</h3>
<p>ある程度の速度で走っているとき、右に曲がりたいなら、まず<strong>右のハンドルを一瞬前に押す</strong>（＝ハンドルをわずかに左へ切る）と、タイヤが車体の下から左へ逃げ、車体は右へ傾きます。傾いたあとは自然に右へ旋回していきます。多くのライダーは意識せずにこの操作をしています。</p>
<div class="diagram">右に曲がりたい
 ① 右グリップを前へ押す
    → 前輪が一瞬 左を向く
 ② 車体が右へ傾く
 ③ 前輪が右を向き右旋回</div>
<h3>セルフステア</h3>
<p>車体が傾くと、キャスター角とトレールの働きで、前輪が<strong>自然に傾いた側へ向く</strong>現象をセルフステアといいます。ライダーがハンドルを強く握って押さえ込むと、この働きを妨げてしまいます。</p>
<h3>ジャイロ効果</h3>
<p>回転する物体は、回転軸の向きを保とうとします（ジャイロ効果）。車輪の回転によるこの効果は、走行中の安定に寄与する要素の一つです。ただし、二輪車の安定は<strong>ジャイロ効果だけで説明できるものではなく</strong>、トレールなどの車体寸法や重量配分も大きく関わります。</p>
<h3>荷重移動とブレーキ配分</h3>
<p>ブレーキをかけると、慣性で重心が前へ移ろうとし、<strong>前輪に荷重が移ります</strong>（フロントフォークが沈むのはこのため）。前輪は押し付けられてグリップが増え、後輪は軽くなってロックしやすくなります。</p>
<div class="tblwrap"><table><thead><tr><th>場面</th><th>前輪</th><th>後輪</th></tr></thead><tbody>
<tr><td>強いブレーキ</td><td>荷重が増える→制動力の主役</td><td>荷重が減る→ロックしやすい</td></tr>
<tr><td>加速</td><td>荷重が減る</td><td>荷重が増える</td></tr>
</tbody></table></div>
<p>このため、乾いた路面での強いブレーキでは前輪側が制動力の大部分を受け持ちます。とはいえ前後をバランス良く使うのが基本で、滑りやすい路面では急な操作を避けます。</p>
<div class="pbox">バイクは「ハンドルで曲がる」のではなく「傾けて曲がる」乗り物です。傾けるきっかけが逆操舵、傾いたあと前輪を自然に向けてくれるのがセルフステアです。</div>
<div class="tbox">例えるなら、手のひらにほうきを立てて運ぶときと似ています。ほうきを右に倒したいとき、手を一瞬左へ動かすと、ほうきは右へ傾きます。バイクの逆操舵も、支点（タイヤ）を反対側へずらして車体を傾けています。</div>
<h3>覚えどころ</h3>
<ul>
<li>曲がるきっかけは逆操舵、その後の向き変えはセルフステアが助ける</li>
<li>ハンドルは力まずに持つと、バイク本来の働きを妨げない</li>
<li>ブレーキで荷重は前へ、加速で荷重は後ろへ移る</li>
<li>強いブレーキの主役は前輪。ただし前後をバランス良く使う</li>
</ul>
<div class="nbox">📝 空気抵抗などを無視した理想的な旋回では、必要な傾き（垂直からの角度θ）は tanθ＝v²÷(g×r) で表されます。速度vが2倍になると、同じ半径rでは右辺が4倍になり、より深い傾きが必要になります。</div>
<div class="wbox">⚠️ 傾いた状態で前輪ブレーキを強くかけると、車体が起き上がろうとして外側へふくらむことがあります。コーナー手前で減速を終えるのが基本です。</div>
` }
);

  choices:['キャスター角が大きいほど、ハンドリングは軽快になり直進安定性は下がる。','キャスター角とは、ステアリング軸が垂直からどれだけ傾いているかの角度である。','トレールは、前輪の接地点がステアリング軸の延長より前にあることで生じる。','クルーザーは、スーパースポーツよりキャスター角を小さくするのが一般的である。'],
  answer:2,
  why:['逆です。キャスター角が大きいほど直進安定性が高く、ハンドリングは穏やかになります。','正解です。ステアリング軸の垂直からの傾き角をキャスター角といいます。','接地点は軸の延長より後ろにあります。だから前輪は引っぱられるように直進へ戻ります。','一般にクルーザーはキャスター角が大きめ、スーパースポーツは小さめです。'],
  exp:'キャスター角は、ステアリング軸の垂直からの傾きです。大きいほどどっしりと直進安定性が高く、小さいほどクイックな動きになります。トレールは、接地点が軸の延長より後ろにあることで生じる距離です。',
  plain:'ハンドルの回転軸の傾きと、それが乗り味にどう影響するかを正しく説明した文を選ぶ問題です。',
  tatoe:'例えるなら、事務用イスのキャスターです。軸の後ろに車輪がついているので、引っぱると自然に向きがそろいます。軸の傾きが大きいほど、向きを変えるには力がいるけれどまっすぐ進みやすくなります。' },
 { id:'q-cframe-4', unit:'cframe', lv:2, polarity:'wrong',
  stem:'フレーム形式と車体寸法について、誤っているものはどれか。',
  choices:['ダイヤモンドフレームは、エンジン自体を骨格の一部として使う。','トレリスフレームは、細い鋼管を三角形に組んだ格子状のフレームである。','ホイールベースが長いほど、一般に直進安定性は高くなる。','ホイールベースが短いほど、一般に向きを変えにくくなる。'],
  answer:4,
  why:['正しい記述です。エンジン下のパイプを省き、エンジンを強度メンバーにします。','正しい記述です。三角形の組み合わせで軽さと剛性を両立します。','正しい記述です。前後輪の距離が長いと、直進でどっしりします。','誤りです。ホイールベースが短いほど、一般に向きを変えやすくなります。'],
  exp:'ホイールベースは前後の車軸間距離で、長いと直進安定性が高く、短いと小回りが利き向きを変えやすくなります。フレーム形式は、エンジンをどう抱えるか、どの素材・形で剛性を出すかの違いです。',
  plain:'フレームの形や前後の車輪の距離について、間違った説明を探す問題です。',
  tatoe:'例えるなら、長いスキー板は直滑降で安定しますが曲がりにくく、短いスキー板はくるくる回りやすい代わりにふらつきやすくなります。ホイールベースも同じ関係です。' },
 { id:'q-cframe-5', unit:'cframe', lv:3,
  stem:'ほかの条件を変えずにキャスター角を小さく（ステアリング軸を立てる方向に）したとき、トレールとハンドリングの変化として最も適切なものはどれか。',
  choices:['トレールは大きくなり、ハンドリングは重く穏やかになる。','トレールは小さくなり、ハンドリングは軽快になるが直進安定性は下がる。','トレールは変わらず、直進安定性だけが上がる。','トレールは小さくなり、直進安定性が上がる。'],
  answer:2,
  why:['キャスター角を小さくするとトレールは小さくなり、ハンドリングは軽くなる方向です。','正解です。軸が立つと地面との交点が接地点に近づき、トレールが減って軽快な特性になります。','軸の傾きが変われば、地面との交点も動くのでトレールも変わります。','トレールが小さくなると、直進に戻ろうとする力は弱まり、直進安定性は下がる方向です。'],
  exp:'ステアリング軸を立てると、軸の延長が地面と交わる点が後ろに下がり、接地点との距離（トレール）が短くなります。その結果、直進に戻ろうとする力が弱まり、ハンドリングは軽快になる一方、直進安定性は下がる傾向になります。スーパースポーツがキャスター角を小さめにするのはこのためです。',
  plain:'ハンドルの軸をより垂直に近づけると、トレールと乗り味がどう変わるかを考える問題です。',
  tatoe:'例えるなら、ショッピングカートの前輪の「軸と車輪のずれ」を小さくしたようなものです。ずれが小さいほど向きは変えやすくなりますが、まっすぐそろおうとする力は弱くなり、ふらつきやすくなります。' },

 { id:'q-ctire-1', unit:'ctire', lv:1,
  stem:'タイヤのサイズ表記「120/70ZR17」の「17」が表すものはどれか。',

 { id:'q-ctire-3', unit:'ctire', lv:2, polarity:'correct',
  stem:'タイヤの空気圧点検について、正しいものはどれか。',

 { id:'q-ctire-4', unit:'ctire', lv:2, polarity:'wrong',
  stem:'ラジアルタイヤ、バイアスタイヤ、チューブレスについて、誤っているものはどれか。',
  choices:['ラジアルタイヤは、内部のコードが回転方向に対して直角方向に入り、外周をベルトで締めている。','バイアスタイヤは、サイズ表記で「120/70-17」のようにハイフンで表されることがある。','チューブレスタイヤは、タイヤとリムの密着で空気を保持する。','スポークホイールは構造上、チューブレスタイヤを一切使うことができない。'],
  answer:4,
  why:['正しい記述です。ラジアル構造は高速での変形が少なく、スポーツ車の主流です。','正しい記述です。ラジアルは「R」、バイアスはハイフンで表します。','正しい記述です。釘などが刺さっても急に空気が抜けにくいのが利点です。','誤りです。スポークホイールは一般にチューブタイヤですが、チューブレスに対応した構造のものもあります。'],
  exp:'ラジアルとバイアスは内部のコードの向きの違いで、サイズ表記でも区別できます。スポークホイールはスポークの穴から空気が漏れるため一般にチューブを使いますが、穴を密閉した構造などでチューブレスに対応したものもあります。',
  plain:'タイヤの内部構造とホイールの組み合わせについて、間違った説明を探す問題です。',
  tatoe:'例えるなら、ふつうのビニール袋に穴が開いていたら水を入れるには内袋が必要ですが、穴をふさぐ加工をすれば内袋なしでも水をためられます。スポークホイールとチューブの関係も同じです。' },
 { id:'q-ctire-5', unit:'ctire', lv:3,
  stem:'タイヤ表記「120/70ZR17 M/C 58W」について、タイヤ断面の高さとして最も近いものはどれか。',
  choices:['約58mm','約70mm','約84mm','約120mm'],

 // ===== cride =====
 { id:'q-cride-1', unit:'cride', lv:1,
  stem:'ある程度の速度で走行中、右へ曲がるために右のハンドルを一瞬前へ押して車体を右へ傾けるきっかけを作る操作を何というか。',
  choices:['逆操舵（カウンターステア）','セルフステア','ウイリー','エンジンブレーキ'],
  answer:1,
  why:['正解です。曲がりたい方向と逆にハンドルをわずかに切ることで、車体が曲がりたい方向へ傾きます。','セルフステアは、車体が傾いたときに前輪が自然に傾いた側へ向く現象で、ライダーの操作ではありません。','ウイリーは前輪を浮かせる走り方です。','エンジンブレーキは、アクセルを戻したときのエンジン抵抗による減速です。'],
  exp:'右へ曲がりたいとき、右グリップを前へ押すと前輪が一瞬左を向き、タイヤが車体の下から左へ逃げるので車体が右へ傾きます。多くのライダーは無意識にこの操作を行っています。',
  plain:'曲がりたい方向とは逆にハンドルをちょっと切って、車体を傾けるきっかけを作る操作の名前を聞いています。',
  tatoe:'例えるなら、手のひらに立てたほうきを右に倒したいとき、手を一瞬左へ動かすのと同じです。支点を反対側へずらすことで、上の部分が狙った方向へ傾きます。' },
 { id:'q-cride-2', unit:'cride', lv:1, polarity:'correct',
  stem:'ブレーキをかけたときの荷重移動について、正しいものはどれか。',
  choices:['ブレーキをかけると、荷重は後輪側へ移る。','ブレーキをかけると、前輪に荷重が移り、後輪は軽くなる。','ブレーキをかけても、前後輪の荷重は変わらない。','ブレーキ時に後輪が重くなるので、後輪はロックしにくくなる。'],
  answer:2,
  why:['減速時は慣性で重心が前へ移ろうとするため、荷重は前輪側へ移ります。','正解です。前輪は押し付けられてグリップが増え、後輪は軽くなります。','減速すると荷重移動が起こり、前後の荷重配分は変わります。','ブレーキ時は後輪が軽くなるので、むしろロックしやすくなります。'],
  exp:'減速すると慣性で重心が前へ移ろうとし、前輪に荷重がかかります。フロントフォークが沈むのはこのためです。前輪はグリップが増えて制動力の主役となり、後輪は軽くなってロックしやすくなります。',
  plain:'ブレーキをかけた瞬間に、バイクの重さが前と後ろのどちらにかかるかを聞いています。',
  tatoe:'例えるなら、電車が急ブレーキをかけると、立っている人の体が前へ持っていかれます。バイクも同じで、重さが前輪へ寄っていきます。' },
 { id:'q-cride-3', unit:'cride', lv:2, polarity:'wrong',
  stem:'二輪車の旋回と安定について、誤っているものはどれか。',
  choices:['バイクは車体を傾けることで曲がる。','同じ半径のカーブなら、速度が高いほど大きく傾ける必要がある。','車体が傾くと、キャスター角とトレールの働きで前輪が自然に傾いた側へ向こうとする。','二輪車の走行中の安定は、車輪のジャイロ効果だけで説明できる。'],
  answer:4,
  why:['正しい記述です。傾けることで重力と遠心力が釣り合い、旋回できます。','正しい記述です。速度が高いほど遠心力が大きくなり、釣り合うには深い傾きが必要です。','正しい記述です。この現象をセルフステアといいます。','誤りです。ジャイロ効果は要素の一つですが、トレールなどの車体寸法や重量配分も大きく関わります。'],
  exp:'バイクは傾けて曲がり、速度が高いほど、半径が小さいほど深い傾きが必要です。走行中の安定にはジャイロ効果も寄与しますが、それだけで説明できるものではなく、トレールなどの車体寸法による前輪の自動的な向き変え（セルフステア）なども重要です。',
  plain:'バイクがどうやって曲がり、なぜ倒れずに走れるのかについて、間違った説明を探す問題です。',
  tatoe:'例えるなら、コマが倒れないのは回転のおかげですが、自転車が倒れないのは回転だけでなく、ハンドルが自然に倒れる側へ切れて立て直すからでもあります。理由は一つではありません。' },
 { id:'q-cride-4', unit:'cride', lv:2,
  stem:'走行中に車体が傾いたとき、ライダーが操作しなくても前輪が自然に傾いた側へ向く現象を何というか。',
  choices:['ジャイロ効果','セルフステア','ノーズダイブ','スリップアングル'],

  why:['ジャイロ効果は回転体が軸の向きを保とうとする性質で、この現象の名前ではありません。','正解です。キャスター角とトレールなどの車体寸法によって起こります。','ノーズダイブはブレーキ時にフロントが沈み込む現象です。','スリップアングルは、タイヤの向きと実際の進行方向とのずれの角度です。'],
  exp:'車体が傾くと、キャスター角とトレールの働きで前輪が傾いた側へ自然に切れます。これをセルフステアといい、ハンドルを強く握って押さえ込むとこの働きを妨げてしまいます。',
  plain:'バイクを傾けたときに、ハンドルが勝手に曲がる方向へ切れていく現象の名前を聞いています。',
  tatoe:'例えるなら、自転車を押して歩くとき、車体を少し右へ傾けるとハンドルが勝手に右へ切れます。あれがセルフステアです。' },
 { id:'q-cride-5', unit:'cride', lv:3, polarity:'correct',
  stem:'乾いた舗装路で強いブレーキをかける場面について、考え方として最も適切なものはどれか。',
  choices:['荷重が前輪に移るので、前輪ブレーキが制動力の大部分を受け持つ。','後輪に荷重が移るので、後輪ブレーキを主に使うのが効果的である。','前輪ブレーキは転倒の原因になるので、強いブレーキでは使わないのが基本である。','荷重移動は起こらないので、前後のブレーキを常に同じ強さで使えばよい。'],
  answer:1,
  why:['正解です。前輪に荷重が移ってグリップが増えるため、前輪が制動力の主役になります。','減速時は荷重が前輪に移り、後輪は軽くなるので、後輪だけでは強い制動ができません。','前輪ブレーキは制動力の主役です。急激な操作は避けつつ、しっかり使うのが基本です。','減速時には荷重移動が起こるため、前後同じ強さが最適とは限りません。'],
  exp:'強いブレーキでは荷重が前輪に移り、前輪のグリップが大きく増えます。そのため乾いた路面では前輪が制動力の大部分を受け持ちます。ただし前後をバランス良く使うのが基本で、滑りやすい路面や車体を傾けているときは急な操作を避けます。',
  plain:'強くブレーキをかけるとき、前と後ろのどちらのブレーキが主役になるか、その理由とあわせて考える問題です。',
  tatoe:'例えるなら、坂道で台車を止めるとき、荷物が寄っている側の車輪を押さえるほうが効きます。ブレーキ時のバイクは重さが前へ寄るので、前輪が止める力の主役になります。' }
);

<h3>まず、これは何？</h3>
<p>オートバイの「電装」とは、電気で動く部品のまとまりのことです。エンジンを始動させるセルモーター、混合気に火をつける点火装置、ヘッドライトやウインカーなどの灯火類、そして燃料噴射を制御するECUまで、ほとんどが<strong>12V（ボルト）の直流電気</strong>で動いています。電気を「ためる」バッテリー、「つくる」発電機、「使う」各部品という3つの役割で考えると整理しやすくなります。</p>
<div class="diagram">[発電機(ACG)] --交流--> [レギュレート
                         レクチファイア]
                             |直流 約14V前後
                             v
       [バッテリー 12V] <--> [点火・灯火・ECU]</div>
<h3>バッテリー：電気をためる</h3>
<p>主流は<strong>鉛バッテリー</strong>で、液補充が不要なMF（メンテナンスフリー）タイプが一般的です。近年は軽量な<strong>リチウムイオンバッテリー</strong>も使われます。リチウム系は専用（または対応）の充電器が必要で、鉛用の充電器をそのまま使うと故障の原因になることがあります。鉛バッテリーは放置すると自然放電し、上がったまま放置すると劣化が進みます。</p>
<h3>発電機とレギュレートレクチファイア：電気をつくる</h3>
<p>エンジンの回転で回る磁石（ローター）と、その内側・外側に固定されたコイル（<strong>ステーター</strong>）で発電します。これをACG（交流発電機）と呼びます。発電されるのは<strong>交流</strong>で、回転数によって電圧も変わります。そこで<strong>レギュレートレクチファイア</strong>が「交流→直流に整える（整流）」「電圧を一定に保つ（レギュレート）」の2役をこなし、バッテリーを充電します。</p>
<h3>点火：火花を飛ばす</h3>
<div class="tblwrap"><table><thead><tr><th>方式</th><th>しくみ</th></tr></thead><tbody>
<tr><td>CDI</td><td>コンデンサーにためた電気を一気に放電し、点火コイルで高電圧にする</td></tr>
<tr><td>フルトランジスタ</td><td>コイルに流した電流をトランジスタで遮断し、その瞬間に高電圧を発生させる</td></tr>
</tbody></table></div>
<p>点火プラグには<strong>熱価</strong>（熱の逃がしやすさ）があります。NGKのプラグは<strong>番号が大きいほど高熱価＝熱を逃がしやすい「冷え型」</strong>です。プラグ先端は汚れを焼き切る温度（約450℃以上）を保ちつつ、過熱しすぎない（約950℃未満）範囲で使うのが理想とされ、車種指定の熱価を選ぶのが基本です。</p>
<div class="wbox">⚠️ 「番号が大きい＝よく燃える・熱い」と逆に覚えがちです。NGKは番号が大きいほど冷え型。メーカーによって表記の考え方が異なる場合もあるので、交換時は指定品番を確認しましょう。</div>
<h3>ヒューズ・LED・ECU</h3>
<ul>
<li><strong>ヒューズ</strong>：過大な電流が流れたときに切れて配線を守る部品。交換は必ず<strong>同じ容量（A）</strong>で。すぐまた切れるなら、どこかでショートしている可能性があります。</li>
<li><strong>LED灯火</strong>：消費電力が小さく長寿命。ただし電球式のウインカーをLEDに替えると、流れる電流が少ないためリレーが「球切れ」と判断し、点滅が速くなる<strong>ハイフラッシュ</strong>が起きることがあります（対応リレーなどで対策）。</li>
<li><strong>ECU</strong>：各種センサーの情報から燃料噴射量や点火時期を計算するコンピューター。現代のFI（燃料噴射）車の頭脳です。</li>
</ul>
<div class="pbox">バッテリーは「電気の貯金箱」、発電機は「給料」、レギュレートレクチファイアは「給料を使いやすい形に両替して、使いすぎも貯めすぎも防ぐ経理係」です。</div>
<div class="tbox">例えるなら、点火プラグの熱価は「服の厚さ」です。冷え型（高熱価）は薄着で熱を逃がしやすく、高回転を多用するような熱くなる走りに向きます。焼け型（低熱価）は厚着で、温まりにくい使い方に向きます。季節（使い方）に合わない服を着ると、寒すぎ（くすぶり）や暑すぎ（過熱）になります。</div>
<h3>覚えどころ</h3>
<ul><li>発電は交流、使うのは直流。橋渡し役がレギュレートレクチファイア</li><li>NGKは番号が大きいほど冷え型</li><li>ヒューズは同容量で交換、繰り返し切れたら原因調査</li></ul>
` },
 { id:'xoil', field:'maint', icon:'🛢️', title:'オイルと消耗品', sub:'粘度・JASO規格・冷却水・シールチェーン', gram:`
<h3>まず、これは何？</h3>
<p>オートバイは走るほど少しずつ「減るもの」「劣化するもの」を抱えています。代表がエンジンオイル、冷却水、ブレーキパッド、タイヤ、点火プラグ、そしてチェーンです。これらを<strong>消耗品</strong>として計画的に点検・交換することが、性能と安全を保つ基本です。</p>
<h3>エンジンオイルの粘度表示</h3>
<p>「10W-40」のような表示はSAE（米国自動車技術者協会）の粘度分類です。</p>
<div class="tblwrap"><table><thead><tr><th>部分</th><th>意味</th></tr></thead><tbody>
<tr><td>10W</td><td>低温側の性能。Wは<strong>Winter（冬）</strong>。数字が小さいほど寒いときでも硬くなりにくい</td></tr>
<tr><td>40</td><td>高温側（運転中の油温の目安100℃付近）の粘度。数字が大きいほど高温でも粘りを保つ</td></tr>
</tbody></table></div>
<p>つまり「冷えているときはサラッと回り、熱くなっても油膜を保つ」ことを2つの数字で表しています。</p>
<h3>JASO規格と湿式クラッチ</h3>
<p>多くのオートバイは、エンジンオイルの中でクラッチ板が動く<strong>湿式クラッチ</strong>を採用しています。オイルが「滑りすぎる」とクラッチが滑り、力が伝わりません。そこで日本の<strong>JASO規格（JASO T903）</strong>が二輪4ストローク用オイルの摩擦特性を区分しています。</p>
<ul>
<li><strong>MA（MA1・MA2）</strong>：摩擦特性が高めで、湿式クラッチに適する。MA2はMA1より高摩擦側の区分</li>
<li><strong>MB</strong>：摩擦特性が低め。湿式クラッチをオイルで潤滑しない構造のスクーターなどに使われる</li>
</ul>
<div class="wbox">⚠️ 四輪用の省燃費オイルには摩擦を減らす添加剤が多く含まれるものがあり、湿式クラッチ車に使うと滑りの原因になることがあります。車種が指定する規格・粘度を守りましょう。</div>
<h3>交換時期の考え方</h3>
<p>オイルは走行距離だけでなく<strong>時間</strong>でも劣化します（酸化・水分混入）。取扱説明書の「◯km または ◯か月の早いほう」という指定が基本で、短距離走行の繰り返しや渋滞が多いなどの厳しい条件では早めの交換が推奨されます。オイルフィルターの交換時期も車種の指定に従います。</p>
<h3>冷却水（LLC）</h3>
<p>水冷エンジンの冷却水には<strong>LLC（ロングライフクーラント）</strong>を使います。凍結を防ぎ、内部のサビや腐食を抑える役割があります。エンジンが熱いときにラジエーターキャップを開けるのは、高温の液が噴き出して危険なので厳禁です。</p>
<h3>シールチェーンとその他の消耗品</h3>
<p><strong>シールチェーン</strong>は、ピンとブッシュの間にグリスを封じ込め、ゴムのリングでふたをしたチェーンです。リングの断面形状で<strong>Oリング</strong>、抵抗を減らした<strong>Xリング</strong>、メーカー独自形状の<strong>Zリング</strong>などがあります。リングを傷める溶剤やスチーム洗浄は避け、対応したクリーナーとルブを使います。</p>
<ul>
<li><strong>ブレーキパッド</strong>：残量の目安となる溝や限度線を点検</li>
<li><strong>タイヤ</strong>：溝の深さ（<strong>スリップサイン</strong>）、ひび割れ、空気圧。ゴムは使わなくても経年で硬くなる</li>
<li><strong>点火プラグ</strong>：電極の摩耗・汚れで火花が弱くなる</li>
</ul>
<div class="pbox">オイルは「エンジンの血液」で、粘度表示はその「サラサラ度」を寒いとき・熱いときの2つで示したものです。そして湿式クラッチ車には「滑りすぎない血液」が必要です。</div>
<div class="tbox">例えるなら、湿式クラッチ車に摩擦の少ないオイルを入れるのは、雑巾がけの床にワックスを塗るようなものです。床はツルツルになりますが、靴底（クラッチ板）がグリップしなくなり、踏ん張りがききません。</div>
<h3>覚えどころ</h3>
<ul><li>10W-40：Wは冬、前が低温側・後ろが高温側</li><li>湿式クラッチ車はJASO MA系</li><li>交換は「距離または期間の早いほう」</li></ul>
` },
 { id:'xmaint', field:'maint', icon:'🔩', title:'点検と整備', sub:'日常点検・チェーン調整・トルク管理', gram:`
<h3>まず、これは何？</h3>
<p>点検と整備は「壊れてから直す」ではなく「壊れる前に気づく」ための活動です。乗る前に自分で行う<strong>日常点検</strong>と、規定の手順・数値で行う整備作業に分かれます。品質管理の考え方とも相性がよく、「基準を決めて、測って、記録する」が基本になります。</p>
<h3>日常点検の語呂「ネンオシャチエブクトウバシメ」</h3>
<div class="tblwrap"><table><thead><tr><th>語呂</th><th>項目</th><th>見るところの例</th></tr></thead><tbody>
<tr><td>ネン</td><td>燃料</td><td>量は足りるか、漏れはないか</td></tr>
<tr><td>オ</td><td>オイル</td><td>量（点検窓・レベルゲージ）、漏れ</td></tr>
<tr><td>シャ</td><td>車輪（タイヤ）</td><td>空気圧、溝、傷、異物</td></tr>
<tr><td>チ</td><td>チェーン</td><td>たるみ、注油状態</td></tr>
<tr><td>エ</td><td>エンジン</td><td>始動性、異音、アイドリング</td></tr>
<tr><td>ブ</td><td>ブレーキ</td><td>レバー・ペダルの遊びと効き、液量</td></tr>
<tr><td>ク</td><td>クラッチ</td><td>レバーの遊び、切れ具合</td></tr>
<tr><td>トウ</td><td>灯火</td><td>ライト・ウインカー・ブレーキランプ</td></tr>
<tr><td>バ</td><td>バッテリー</td><td>始動の力強さ、端子のゆるみ</td></tr>
<tr><td>シメ</td><td>締め付け</td><td>ボルト・ナットのゆるみ、脱落</td></tr>
</tbody></table></div>
<h3>チェーンのたるみ</h3>
<p>チェーンは張りすぎても緩すぎてもいけません。張りすぎはサスペンションが動いたときに無理な力がかかり、緩すぎは外れやスプロケットの摩耗につながります。<strong>規定値は車種ごとに異なり</strong>、測る位置やスタンドの状態も取扱説明書で決められています。チェーンは伸び方が均一でないことがあるため、車輪を回して<strong>一番張っている位置</strong>で測るのが基本です。</p>
<h3>トルク管理と対角締め</h3>
<p>ボルトを締める強さ（<strong>締め付けトルク</strong>、単位N·m）は部位ごとに規定されています。弱すぎればゆるみ、強すぎればネジ山の破損やボルトの伸びを招きます。<strong>トルクレンチ</strong>で規定値に合わせるのが確実です。ブレーキディスクやカバー類のように複数のボルトで固定する部品は、<strong>対角の順に、数回に分けて</strong>少しずつ締め、部品が片寄って固定されるのを防ぎます。</p>
<h3>ネジロック剤</h3>
<p>振動でゆるむのを防ぐため、ネジ部に塗る接着剤です。空気を遮断されると固まる<strong>嫌気性</strong>のものが一般的で、強度は製品ごとに異なります。高強度品は外すときに加熱が必要な場合もあるため、<strong>指定のある箇所に、指定の種類を</strong>使うのが原則です。</p>
<h3>品質の視点</h3>
<p>締め忘れ・締めすぎなどの<strong>ヒューマンエラー</strong>は、注意力だけでは防ぎきれません。規定トルクで締めた後にボルトと部品にまたがって線を引く<strong>合いマーク</strong>は、「締めた証拠」と「後からのゆるみ検出」を同時に実現する工夫です。チェックシートによる記録、ダブルチェックなどもエラーを減らす仕組みです。</p>
<div class="pbox">日常点検は「出かける前の身だしなみチェック」、トルク管理は「決まった強さで締める約束ごと」、合いマークは「ちゃんと締めました」という目に見えるサインです。</div>
<div class="tbox">例えるなら、対角締めは鍋のふたをクランプで留めるときや、タイヤ交換で車のホイールナットを締めるときと同じです。1か所だけ先にきつく締めると、ふたが斜めに押し付けられてすき間ができます。向かい合わせに少しずつ締めると、均一に密着します。</div>
<div class="wbox">⚠️ トルクの数値や点検項目の細部は車種ごとに違います。必ずその車種のサービスマニュアル・取扱説明書の値に従いましょう。</div>
<h3>覚えどころ</h3>
<ul><li>ネンオシャチエブクトウバシメ</li><li>チェーンは一番張った位置で、車種の規定値に</li><li>複数ボルトは対角・段階締め、締めたら合いマーク</li></ul>
` },
 { id:'xlaw', field:'maint', icon:'📜', title:'免許と区分・法規', sub:'原付・二輪免許・車検・二段階右折', gram:`
<h3>まず、これは何？</h3>
<p>日本のオートバイは、<strong>運転できる免許</strong>（道路交通法）と、<strong>車両としての区分</strong>（道路運送車両法：車検の有無など）という、2つの物差しで分類されます。同じ「125cc」でも、どちらの法律で見るかによって呼び名が変わるので、混同しないことが大切です。</p>
<h3>免許の区分</h3>
<div class="tblwrap"><table><thead><tr><th>免許</th><th>運転できる二輪</th></tr></thead><tbody>
<tr><td>原付免許</td><td>原付一種（50cc以下、新基準原付を含む）</td></tr>
<tr><td>小型限定普通二輪</td><td>125cc以下</td></tr>
<tr><td>普通二輪</td><td>400cc以下</td></tr>
<tr><td>大型二輪</td><td>排気量の上限なし</td></tr>
</tbody></table></div>
<p>普通自動車免許でも原付一種は運転できますが、<strong>125ccクラス（原付二種）は運転できません</strong>。二輪免許にはAT限定もあります。</p>
<h3>新基準原付（2025年4月〜）</h3>
<p>排ガス規制の強化で50ccエンジンの存続が難しくなったことを受け、2025年4月から、<strong>総排気量125cc以下で、最高出力を4.0kW以下に制御した二輪車</strong>が「新基準原付」として原付一種の扱いになりました。原付免許（や普通自動車免許）で運転でき、30km/hの速度制限や二段階右折などのルールも原付一種と同じです。ふつうの125cc車（原付二種）がそのまま原付免許で乗れるわけではない点に注意しましょう。</p>
<h3>車両の区分と車検</h3>
<div class="tblwrap"><table><thead><tr><th>区分</th><th>排気量</th><th>車検</th></tr></thead><tbody>
<tr><td>原動機付自転車</td><td>125cc以下</td><td>なし</td></tr>
<tr><td>軽二輪</td><td>126〜250cc</td><td>なし</td></tr>
<tr><td>小型二輪</td><td>250cc超</td><td>あり</td></tr>
</tbody></table></div>
<p>車検がない区分でも、<strong>自賠責保険への加入は必須</strong>です。また、高速道路は125cc以下では走行できず、軽二輪以上が通行できます。</p>
<h3>原付一種のルール</h3>
<ul>
<li>法定最高速度は<strong>30km/h</strong></li>
<li><strong>二段階右折</strong>：信号のある交差点で、進行方向の車線が3車線以上ある場合などは、いったん直進して向きを変え、信号に従って進む。標識で方法が指定されている場合はそれに従う</li>
<li>二人乗りはできない</li>
</ul>
<div class="nbox">📝 原付二種以上の二輪で二人乗りをするには、一般道では二輪免許を取得して1年以上、高速道路では20歳以上かつ二輪免許を取得して3年以上が必要です（車両側も乗車定員2名であることが前提）。</div>
<h3>ヘルメット</h3>
<p>原付を含むすべての二輪で、乗車用ヘルメットの着用が義務です。乗車用ヘルメットは国の安全基準を満たしたことを示す<strong>PSCマーク</strong>がないと販売できません。製品によっては「125cc以下用」など適用排気量が限定されているものもあるので、表示を確認して選びます。</p>
<div class="pbox">免許は「誰が乗れるか」、車両区分は「その車にどんな手続きが必要か」を決める別々のルールです。新基準原付は「排気量は125ccでも、パワーを原付並みに抑えたので原付扱い」という仕組みです。</div>
<div class="tbox">例えるなら、免許区分はプールの「泳げるコースの許可証」、車両区分は「プールの施設点検の頻度」のようなものです。泳ぐ人の資格と、施設側の点検ルールは、別の担当者が別の帳簿で管理しています。</div>
<div class="wbox">⚠️ 法規・制度は改正されることがあります。ここでの内容は2026年時点の概要です。最新は警察庁・国土交通省などの公式情報で確認してください。</div>

   why:['自然放電は起こるので正しい記述です。','リチウム系は専用または対応の充電器が必要で、鉛用をそのまま使うと故障の原因になることがあるため誤りです。','オートバイの電装は12V直流が主流なので正しい記述です。','放電したままの放置は劣化を早めるので正しい記述です。'],
   exp:'バッテリーは種類によって充電の条件が異なります。リチウムイオンバッテリーは対応した充電器を使うことが重要です。鉛バッテリーは自然放電するため、長期保管時は補充電が有効です。',
   plain:'バッテリーの扱い方について、間違った思い込みを見つける問題です。',
   tatoe:'例えるなら、スマートフォンの充電器を別の規格の機器に無理やり使うようなものです。差し込めても、相手が求める充電の仕方と違えば傷めてしまいます。' },
 { id:'q-xelec-4', unit:'xelec', lv:2,
   stem:'電球式のウインカーをLEDに交換したところ、点滅が異常に速くなりました。最も考えられる原因はどれですか。',
   choices:['LEDは消費電流が小さく、リレーが球切れと判断している','LEDは電圧が高すぎてヒューズが切れかけている','発電機の発電量が増えすぎている','点火プラグの熱価が合っていない'],
   answer:1,
   why:['電流が少ないとリレーが球切れ時と同じ状態と判断し、ハイフラッシュが起きます。これが正解です。','LEDだから電圧が高くなるわけではなく、ヒューズの問題でもありません。','LED化で発電量が増えることはありません。','点火プラグは点火系の部品で、ウインカーの点滅とは無関係です。'],
   exp:'一般的なウインカーリレーは、球が切れて電流が減ると点滅を速くして知らせます。LEDは消費電流が小さいため同じ状態と判断され、ハイフラッシュになります。LED対応リレーなどで対策します。',
   plain:'省エネなLEDに替えたことで、点滅を制御する部品が勘違いしている理由を考える問題です。',
   tatoe:'例えるなら、来場者数で「混雑していない＝休館日かも」と判断する受付係です。省エネで静かに過ごす客（LED）ばかりだと、営業中なのに異常と勘違いしてしまいます。' },
 { id:'q-xelec-5', unit:'xelec', lv:3, polarity:'correct',
   stem:'ヒューズと電装トラブルへの対応について、正しいものはどれですか。',
   choices:['ヒューズが切れたら、再び切れないように容量の大きいヒューズに替えるのがよい。','ヒューズの役割は、電圧を一定に保つことである。','交換したヒューズがすぐにまた切れる場合は、配線のショートなど原因を調べる必要がある。','ヒューズが切れても、配線を直結すれば安全に走行を続けられる。'],
   answer:3,
   why:['容量を上げると配線を守れなくなり、焼損や火災のおそれがあるため誤りです。','電圧を保つのはレギュレートレクチファイアの役割で、ヒューズは過大電流から回路を守ります。','繰り返し切れるのは過大電流の原因が残っている証拠なので、原因調査が必要という記述は正しいです。','直結は保護をなくす行為で、焼損や火災の危険があるため誤りです。'],
   exp:'ヒューズは回路の「身代わり」として切れ、配線や部品を守ります。交換は同じ容量で行い、すぐまた切れる場合は根本原因を探します。これは品質管理の「再発防止」の考え方と同じです。',
   plain:'ヒューズが切れたとき、どう対応するのが筋が通っているかを問う問題です。',
   tatoe:'例えるなら、ヒューズは家のブレーカーです。何度も落ちるからといって容量の大きいブレーカーに替えるのではなく、どの家電が電気を使いすぎているかを探すのが正しい対応です。' },

 { id:'q-xoil-1', unit:'xoil', lv:1,
   stem:'エンジンオイルの粘度表示「10W-40」の「W」は何を表していますか。',
   choices:['Weight（重さ）','Water（水）','Wide（幅広い）','Winter（冬）'],
   answer:4,
   why:['重さを表すという説明は誤りです。','水の含有量を表すものではありません。','幅広い用途という意味ではありません。','Wは冬（低温）を表し、10Wは低温側の性能を示すので正解です。'],
   exp:'10W-40は、低温側の性能が10W、高温側の粘度が40という意味です。Wの前の数字が小さいほど低温でも硬くなりにくく、後ろの数字が大きいほど高温でも粘りを保ちます。',
   plain:'オイルの表示に入っている英字1文字が、何の頭文字かを問う問題です。',
   tatoe:'例えるなら、冬用・夏用の両方の性能を1着で表示しているスポーツウェアのタグです。前半が寒い日の着心地、後半が暑い日の性能を示しています。' },
 { id:'q-xoil-2', unit:'xoil', lv:1,
   stem:'エンジンオイルで湿式クラッチも潤滑する一般的なオートバイに適したJASO規格はどれですか。',
   choices:['JASO MB','JASO MA（MA1・MA2）','四輪用の省燃費規格','規格は関係なく、どれでもよい'],
   answer:2,
   why:['MBは摩擦特性が低めの区分で、湿式クラッチをオイルで潤滑しないスクーターなど向けです。','MA系は摩擦特性が高めで湿式クラッチに適するため正解です。','四輪用の省燃費オイルは摩擦低減剤によりクラッチ滑りの原因になることがあります。','クラッチの滑りに関わるため、規格は重要です。'],
   exp:'JASO T903は二輪4ストローク用オイルの摩擦特性を区分しています。湿式クラッチ車はMA系を選び、MBはクラッチをオイルで潤滑しない構造の車種向けです。',
   plain:'クラッチがオイルに浸かっているバイクには、どの種類のオイルが合うかを問う問題です。',
   tatoe:'例えるなら、体育館の床に合ったシューズを選ぶようなものです。床でしっかり踏ん張りたい（クラッチを滑らせたくない）なら、グリップの効く靴底が必要です。' },
 { id:'q-xoil-3', unit:'xoil', lv:2, polarity:'wrong',
   stem:'エンジンオイルや冷却水の管理について、誤っているものはどれですか。',
   choices:['エンジンオイルは走行距離が少なくても、時間の経過で劣化する。','オイル交換は、取扱説明書の「距離または期間の早いほう」を目安にするのが基本である。','冷却水（LLC）には、凍結防止のほかサビや腐食を抑える役割がある。','エンジンが熱いうちにラジエーターキャップを開けて、冷却水の量を確認するのがよい。'],
   answer:4,
   why:['酸化や水分の混入で時間とともに劣化するので正しい記述です。','距離と期間の早いほうで交換するのが基本なので正しい記述です。','LLCは凍結防止と防錆の両方の役割を持つので正しい記述です。','熱いときにキャップを開けると高温の液が噴き出して危険なので誤りです。'],
   exp:'オイルは距離と時間の両面で劣化するため、取扱説明書の指定に従って交換します。冷却水の点検はエンジンが冷えた状態で、リザーバータンクの目盛りなどで行います。',
   plain:'オイルや冷却水の扱いで、やってはいけないこと・間違った考えを見つける問題です。',
   tatoe:'例えるなら、圧力鍋を加熱直後に開けるようなものです。中は見た目以上に高温・高圧で、ふたを開けた瞬間に中身が噴き出します。' },
 { id:'q-xoil-4', unit:'xoil', lv:2,
   stem:'シールチェーンのOリング（Xリングなど）の主な役割はどれですか。',
   choices:['チェーンの外側に付いた泥を弾き飛ばす','チェーンの伸びを自動で調整する','ピンとブッシュの間にグリスを封じ込め、異物の侵入を防ぐ','走行中の騒音を消すための緩衝材として働く'],
   answer:3,
   why:['外側の汚れを弾くための部品ではありません。','たるみの調整は人がアジャスターで行う作業です。','リングでグリスを内部に閉じ込め、砂や水の侵入を防ぐのが主な役割なので正解です。','騒音対策が主目的ではありません。'],
   exp:'シールチェーンは内部にグリスを封入し、ゴム製のリングでふたをしています。これにより内部の摩耗が抑えられ寿命が延びます。リングを傷める溶剤やスチームを避けることが大切です。',
   plain:'チェーンの中にある小さなゴムの輪が、何のために付いているのかを問う問題です。',
   tatoe:'例えるなら、保存容器のふたのパッキンです。中の油（グリス）が漏れず、外の水やほこりも入らないように、すき間をふさいでいます。' },
 { id:'q-xoil-5', unit:'xoil', lv:3, polarity:'correct',
   stem:'消耗品の点検について、正しいものはどれですか。',
   choices:['タイヤのゴムは、走行距離が少なければ年数が経っても劣化しない。','タイヤのスリップサインが現れたら、溝が限度まで減っているので交換が必要である。','ブレーキパッドは、効きが悪くなるまで点検する必要はない。','点火プラグは、電極が摩耗しても火花の強さは変わらない。'],
   answer:2,
   why:['ゴムは使わなくても経年で硬化・ひび割れするため誤りです。','スリップサインは溝の使用限度を示す目印なので、交換が必要という記述は正しいです。','効きが落ちてからでは危険で、残量の溝や限度線を定期的に点検する必要があるため誤りです。','電極の摩耗や汚れで火花が弱くなり、始動性や燃焼に影響するため誤りです。'],
   exp:'消耗品は「見た目でわかる限度の目印」を活用して計画的に交換します。タイヤは溝だけでなく経年劣化や空気圧も、パッドは残量の目印を確認します。',
   plain:'タイヤ・パッド・プラグのうち、交換の判断として正しいものを選ぶ問題です。',
   tatoe:'例えるなら、スリップサインはランニングシューズの靴底が擦り減って中の色の違う層が見えてきた状態です。そこまで来たら、グリップが落ちている合図です。' },

 { id:'q-xmaint-1', unit:'xmaint', lv:1,
   stem:'日常点検の語呂「ネンオシャチエブクトウバシメ」の「シャ」が表す点検項目はどれですか。',
   choices:['シャフト（駆動軸）','車輪（タイヤ）','車体番号','シャッター（灯火カバー）'],
   answer:2,
   why:['駆動軸を表すものではありません。','シャは車輪で、空気圧・溝・傷などを点検します。正解です。','車体番号の確認は日常点検の項目ではありません。','灯火は「トウ」で表されます。'],
   exp:'語呂は燃料・オイル・車輪・チェーン・エンジン・ブレーキ・クラッチ・灯火・バッテリー・締め付けの頭を並べたものです。「シャ」は車輪（タイヤ）を指します。',
   plain:'点検項目を覚えるための語呂合わせで、「シャ」が何の略かを問う問題です。',
   tatoe:'例えるなら、出かける前の「火の元・戸締まり・財布・スマホ」の確認を語呂で覚えるのと同じです。頭文字をつなげると、抜けなく思い出せます。' },
 { id:'q-xmaint-2', unit:'xmaint', lv:1,
   stem:'ブレーキディスクのように複数のボルトで固定する部品を締めるとき、適切な方法はどれですか。',
   choices:['1本ずつ規定トルクまで締め、隣のボルトへ順に進む','対角の順に、数回に分けて少しずつ締めていく','最初の1本だけ強めに締め、残りは軽く締める','手の感覚で十分なので、締める順番は気にしない'],
   answer:2,
   why:['1本ずつ本締めすると部品が片寄って固定されるおそれがあります。','対角の順に段階的に締めることで、均一に密着させられるので正解です。','締め付けにばらつきが出て、ゆるみや変形の原因になります。','順番と規定トルクの両方が重要です。'],
   exp:'対角締めは、部品を均等な力で座面に密着させるための基本です。最終的には規定トルクで締め、可能なら合いマークを付けて締め付け済みを明示します。',
   plain:'何本ものボルトで留める部品を、ゆがませずに固定する締め方を問う問題です。',
   tatoe:'例えるなら、テーブルクロスを机に敷くときに、四隅を向かい合わせに少しずつ引っ張って整えるのと同じです。一辺だけ引くとしわが寄ります。' },
 { id:'q-xmaint-3', unit:'xmaint', lv:2, polarity:'correct',
   stem:'チェーンのたるみ調整について、正しいものはどれですか。',
   choices:['チェーンのたるみの規定値は、全車種で共通である。','チェーンは張れば張るほど走行性能が上がるので、できるだけきつく張るのがよい。','たるみは車輪を回して、チェーンが一番張っている位置で測るのが基本である。','たるみの測定は、どの状態で測っても結果は同じなので条件は気にしなくてよい。'],
   answer:3,
   why:['規定値は車種ごとに異なるため誤りです。','張りすぎはサスペンションの動きで過大な力がかかり、部品を傷めるため誤りです。','チェーンの伸びは均一でないことがあるため、一番張った位置で測るという記述は正しいです。','スタンドの状態や測定位置は取扱説明書で決められており、条件で結果が変わるため誤りです。'],
   exp:'チェーンは張りすぎも緩すぎも不具合の原因です。車種ごとの規定値と測定条件に従い、最も張っている位置で測定・調整します。',
   plain:'チェーンのたるみを、どう測り、どう合わせるのが正しいかを問う問題です。',
   tatoe:'例えるなら、自転車のチェーンや洗濯ロープと同じで、ピンと張りすぎると支えている部分に無理がかかり、緩すぎると外れてしまいます。「ちょうどよい」の基準が決まっているのです。' },
 { id:'q-xmaint-4', unit:'xmaint', lv:2, polarity:'wrong',
   stem:'締め付けトルクとネジロック剤について、誤っているものはどれですか。',
   choices:['締め付けトルクは部位ごとに規定されている。','ボルトは強く締めるほど安全なので、規定トルクより強めに締めるのがよい。','ネジロック剤は、振動によるゆるみを防ぐために使われる。','ネジロック剤には強度の違う製品があり、高強度品は外すときに加熱が必要な場合がある。'],
   answer:2,
   why:['トルクは部位ごとにサービスマニュアルで規定されているので正しい記述です。','締めすぎはネジ山の破損やボルトの伸び・破断を招くため誤りです。','ゆるみ止めが目的なので正しい記述です。','強度によっては取り外しに加熱が必要なので正しい記述です。'],
   exp:'ボルトは「適正な力」で締めることで本来の固定力を発揮します。締めすぎも締め不足も不具合の原因です。ネジロック剤も、指定箇所に指定の種類を使うのが原則です。',
   plain:'ボルトの締め方やゆるみ止めについて、間違った思い込みを見つける問題です。',
   tatoe:'例えるなら、ペットボトルのふたを力いっぱい締めすぎると、ねじ山がつぶれてかえって閉まらなくなるのと同じです。「強いほど良い」ではありません。' },
 { id:'q-xmaint-5', unit:'xmaint', lv:3,
   stem:'規定トルクで締めたボルトと部品にまたがって線を引く「合いマーク」の目的として、最も適切なものはどれですか。',
   choices:['締め付けた事実を見える化し、後からのゆるみも目で検出できるようにする','ボルトのサビを防ぐ','部品の製造ロットを識別する','ボルトの締め付けトルクを高める'],
   answer:1,
   why:['締め付け済みの証拠になり、線がずれればゆるみに気づけるので正解です。','線を引いても防錆効果はありません。','ロット識別は別の表示で行うもので、合いマークの目的ではありません。','線を引いてもトルクは変わりません。'],
   exp:'合いマークは、締め忘れというヒューマンエラーを見える化し、ゆるみの早期発見にも役立つ仕組みです。注意力に頼らず、仕組みでエラーを防ぐ品質管理の考え方の一例です。',
   plain:'ボルトに引く線が、作業や点検のどんな役に立つのかを問う問題です。',
   tatoe:'例えるなら、薬のシートに飲んだ日付を書き込むようなものです。「飲んだかな？」と迷わずに済み、記録がずれていれば異常にすぐ気づけます。' },

 { id:'q-xlaw-1', unit:'xlaw', lv:1,
   stem:'原付一種（原動機付自転車）の法定最高速度はどれですか。',
   choices:['20km/h','40km/h','30km/h','60km/h'],
   answer:3,
   why:['20km/hではありません。','40km/hではありません。','原付一種の法定最高速度は30km/hなので正解です。','60km/hは一般道での自動車などの法定最高速度です。'],
   exp:'原付一種は法定最高速度が30km/hで、新基準原付も同じ扱いです。標識でそれより低い速度が指定されている場合はそれに従います。',
   plain:'50cc以下などの原付一種が、一般道で出してよい最高速度を問う問題です。',
   tatoe:'例えるなら、プールの「ゆっくりコース」です。泳げる人でも、そのコースにいる間は決められたペースを守る必要があります。' },
 { id:'q-xlaw-2', unit:'xlaw', lv:1,
   stem:'2025年4月から原付免許で運転できるようになった「新基準原付」の条件として正しいものはどれですか。',
   choices:['総排気量125cc以下で、最高出力4.0kW以下に制御されたもの','総排気量125cc以下であれば出力の制限はない','総排気量250cc以下で、最高速度30km/h以下のもの','総排気量90cc以下で、電動のものに限る'],
   answer:1,
   why:['排気量と最高出力の両方の条件を満たすことが必要なので正解です。','出力制限がない125cc車は原付二種で、原付免許では運転できません。','250ccは対象外です。','90ccや電動に限るという条件ではありません。'],
   exp:'新基準原付は、総排気量125cc以下かつ最高出力4.0kW以下に制御した二輪車を原付一種として扱う制度です。速度制限30km/hや二段階右折など原付一種のルールが適用されます。',
   plain:'新しく原付扱いになったバイクが、どんな条件を満たしたものかを問う問題です。',

 { id:'q-xlaw-3', unit:'xlaw', lv:2, polarity:'correct',
   stem:'車両区分と車検について、正しいものはどれですか。',
   choices:['排気量126〜250ccの軽二輪には車検がある。','排気量250ccを超える小型二輪には車検がある。','車検のない区分のオートバイは、自賠責保険に加入しなくてよい。','原付二種（125cc以下）は、高速道路を走行できる。'],
